<h1>2026年A股首单！燧原科技科创板IPO获受理</h1>
<p>来源：上海证券报·中国证券网 记者：柴刘斌 2026-01-22 19:02</p>
<p>原文链接：<a href="https://www.cnstock.com/commonDetail/623454">https://www.cnstock.com/commonDetail/623454</a></p>
<hr>
<article>
<p>1月22日，据上交所官网信息，燧原科技科创板IPO申请已获受理，这也是2026年A股首单IPO新受理。</p>
<p>据招股书，燧原科技此次IPO拟募集资金60亿元，用于第五代和第六代AI芯片系列产品的研发及产业化项目，以及先进人工智能软硬件协同创新项目。</p>
