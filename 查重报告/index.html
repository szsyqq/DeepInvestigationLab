pSeekR2推迟H20短缺.html"], "src_hits": {"2026-07-20_深度求索/原始资料/舆情网页/舆情_网易_2026-07-15_DeepSeek年化收入34亿估值5000亿.html": 2, "2026-07-20_深度求索/原始资料/舆情网页/舆情_证券时报_2026-07-20_DeepSeek估值3500亿腾讯宁德.html": 2, "2026-07-20_深度求索/原始资料/舆情网页/舆情_搜狐_2025-08-27_SemiAnalysis质疑DeepSeek成本.html": 1, "2026-07-20_深度求索/原始资料/招股书年报/官方技术报告_DeepSeek-R1_2025-01-22.html": 1, "2026-07-20_深度求索/原始资料/舆情网页/舆情_财联社_2025-02-06_多国封禁DeepSeek外交部回应.html": 1}, "body_html": "<h1 class=\"rh\">DeepSeek：把模型开源， 把账本捂紧</h1>\n<p>用 558 万美元，训练出比肩 GPT-4o 的模型，让英伟达一天蒸发近 6000 亿美元。可当市场给它贴上 3500 亿元估值标签时，这家公司却从不公布一分钱营收、一分钱利润——它把模型开源给全世界，却把账本捂紧留给自己。这是同一家公司最锋利的悖论：技术彻底打开，财务彻底关上。</p>\n<p>2025 年 1 月 27 日，周一。纳斯达克开盘后，英伟达的股价在几个小时内掉了 17%，一天之内市值蒸发近 6000 亿美元——这是美国公司史上单日最大的跌幅。 [3] 暴跌的引线，是一周前一家中国公司发布的一个开源模型：DeepSeek-R1。这家公司说，它训练出这个能跟 OpenAI 旗舰掰手腕的模型，只花了 558 万美元。 [1] [2]</p>\n<p>DeepSeek 说训练 R1 只花了 558 万美元；而就在它发布后不到两周，英伟达一天跌去近 6000 亿美元。这两个数并不在同一个账本上——一个是这家公司的训练成本，一个是全球最贵芯片公司的市值震荡——但并排摆着，恰好戳破了一个旧信条：AI 的边界，是用钱和显卡堆出来的。 [3] 可一年多过去，当市场把 3500 亿元（约 500 亿美元）的估值贴到这家公司身上，另一道题却始终算不清：它自己，到底赚不赚钱？ [6]</p>\n<p>DeepSeek 不上市，早期几乎不接受外部投资，也从不发布年报。关于它的营收，坊间流传着从 65 亿到 200 亿不等的版本；关于它的利润，有人信它已经盈利，也有人认定它仍在烧钱。 [7] 一家能撼动全球资本市场的公司，财务却几乎不对外披露。这本身不算罕见——许多未上市的明星企业同样没有公开财报；但像 DeepSeek 这样体量、却对全球市场有如此牵动力的公司，财务近乎全盲，仍然少见。</p>\n<h2 class=\"rh\">第一章 从 558 万到 R3</h2>\n<p>要理解 DeepSeek 为什么震动了世界，得从那个被反复引用的数字说起。2024 年 12 月 26 日，它悄然发布 DeepSeek-V3 ；一个多月后，2025 年 1 月 20 日，又放出专门做复杂推理的 R1，性能直接对标 OpenAI 当时最先进的 o1。 [1] [2] 真正让行业倒吸凉气的，是成本——官方技术报告写明，<mark class=\"paraphrase\" data-hit=\"3\">V3 的训练耗了 278.8 万 H800 GPU 小时，</mark>按市价折算约 558 万美元，相当于在 2048 块 H800 显卡上跑约两个月。 [1]</p>\n<p>558 万美元训练出一个顶级大模型，是什么概念？同期美国巨头训练同级模型的投入，普遍被估在数亿到数十亿美元量级。DeepSeek 把这个差距压缩到了约&quot;美国同行的 1/23&quot;——这一数字经多家媒体转述，成了&quot;算力堆砌范式&quot;被击穿的象征。 [3] 更刺眼的是，它把模型权重以 MIT 许可全量开源，任何人都能免费下载、商用、修改；API 价格压到每百万 token 输入 1 元、输出 3 元，缓存命中更只要 1 毛。 [12] 便宜到这个程度，连同行都坐不住。</p>\n<p>此后，DeepSeek 的迭代速度并未放缓。2025 年 3 月，它放出 R1-Zero——R1 的&quot;原始&quot;版本，未做人类偏好对齐，展现出更强的自发推理能力；5 月，Distill 系列陆续问世，<mark class=\"paraphrase\" data-hit=\"4\">将 R1 的推理能力蒸馏到 1.5B、</mark>7B、14B、32B 甚至 70B 量级的轻量模型中，让个人开发者也能低成本调用；7 月，R3 正式开源，参数达 671B，在多项国际基准上首次全面超越 GPT-4.1 和 Claude 4 等闭源旗舰——而 R3 的训练成本仍未公开。 [15]</p>\n<p>冲击波在 2025 年 1 月底集中释放。1 月 27 日，英伟达单日跌约 17%，市值蒸发近 6000 亿美元，纳斯达克指数下滑 3.1%，连带着全球 AI 概念股一起回调；同一周，DeepSeek 的 App 登顶中国区和美国区 App Store 免费榜，把一众老牌应用挤了下去。 [3] [4] 一家此前连名字都少有人听过的公司，用一份 558 万美元的账单，撬动了万亿美元级别的市值波动。账，是字面意义上的&quot;算&quot;赢了。</p>\n<h2 class=\"rh\">第二章 算力的真相</h2>\n<p>558 万为什么可能？答案分成明暗两层。明面上，是工程上的极致压榨： MoE 稀疏激活让每次推理只调动部分参数，自研的 MLA 注意力机制把显存占用压到极低，再叠加 FP8 混合精度训练与精细的并行策略，把每一张显卡的&quot;有效算力&quot;榨到了极限。 [1] 这一层，是货真价实的技术硬功夫。</p>\n<p>但还有一层不那么容易被写进技术报告的：它用上了禁令前囤下的&quot;便宜卡&quot;。DeepSeek 背靠 幻方量化 ，后者早在出口管制收紧前就已囤积上万张 A100/H800。这批&quot;祖父级&quot;芯片，是它绕开后来对华禁令、把训练成本压到极低的前提条件。 [13] 省，部分是因为曾经&quot;囤&quot;到了便宜的入场券——这是一张别人再也买不到的入场券。</p>\n<p>真正让&quot;558 万神话&quot;露出裂缝的，是成本的口径。多家机构（如 SemiAnalysis、中信等）指出，这 558 万只是最后一次成功训练 run 的花费，没算前期无数次失败的试错、海量数据清洗、顶尖人才的工资，以及那批显卡本身的折旧与持有成本。 [5] 若把这些都摊进账里，真实投入要高得多。更关键的隐忧在后面：当 2025 年美国把 H20 也纳入禁令、增量芯片彻底断供，那个&quot;用最省算力&quot;的故事，开始暴露它的前提——省，是因为禁令前一次性囤到了便宜的卡；而那批卡是买断的存量，禁令之后再也补不进来。当一代代更大的模型持续占用这张固定的&quot;便宜算力额度&quot;，&quot;最省&quot;的前提就悄悄失效。 [9] [10]</p>\n<p>顺带一提，R3 的训练成本也从未披露——这与 DeepSeek 整体不公开任何财务数字的一贯风格一致。正因如此，&quot;低成本神话&quot;是否延续到了 V3 之后的世代，外界同样无从验证。 [15]</p>\n<h2 class=\"rh\">第三章 不透明的财务</h2>\n<p>与轰轰烈烈的技术叙事相比，DeepSeek 的财务像被刻意藏进了抽屉。它成立于 2023 年 7 月，由幻方量化孵化，发展初期资金完全依靠幻方，没做过外部股权融资；至今不上市、不发布年报。 [8] 外界对它的判断，只能靠媒体拼图与零散公告——不公开财报的未上市巨头并不少见，但 DeepSeek 的规模与全球牵动力，让这份&quot;全盲&quot;格外醒目。</p>\n<p>关于营收，版本之多令人咋舌：有说 2025 全年约 65 亿元，有说冲到 200 亿，也有说仅 10 亿出头；日收入能力有说 400 多万元；<mark class=\"paraphrase\" data-hit=\"5\">年化收入被估约 34 亿元（约 5 亿美元）。</mark>利润更模糊，有报道称已实现扭亏为盈，官方从未确认。 [7] 同一家公司，外界能给出相差数倍的营收估计——这种&quot;不在场&quot;，本身就是最大的事实。</p>\n<p>而估值却是另一番滚烫的景象。2026 年 5 月起，多家媒体称其首轮（本轮）融资约 510 亿元：创始人梁文锋个人出资约 200 亿（占四成），腾讯约 100 亿、宁德时代体系约 50 亿，京东、IDG、<mark class=\"partial\" data-hit=\"1\">国家人工智能产业投资基金</mark>等入局；融资后估值约 3500 亿元（约 500 亿美元），6 月一家上市公司（开润股份）的公告还意外印证了约 3510 亿的数字。 [6] 一家年营收可能不到 200 亿、且从不披露利润的公司，被赋予了 3500 亿的身价。营收与估值之间的这道裂缝，才是这家&quot;不透明公司&quot;最刺眼的一页：它值多少钱，市场替它写了；它赚了多少钱，只有它自己知道。</p>\n<h2 class=\"rh\">第四章 开源的账单</h2>\n<p>把技术彻底打开，把财务彻底关上——这是 DeepSeek 最锋利的对照。上一章写了它如何不披露财务；这一章要看它如何把模型打开。它开源出去的，和它捂紧的，恰是同一枚硬币的两面。</p>\n<p>DeepSeek 把所有模型的权重，以 MIT 许可 全量开源。这在商业上是个 paradox：它把最核心的资产免费摊开，竞争对手可以白嫖，开发者可以随意修改，自己却几乎不设防。 [12] 普惠的另一面，是一个绕不开的商业问号——靠什么把钱赚回来？</p>\n<p>它的变现路径其实很&quot;轻&quot;：C 端 App 免费，API 价格低到被调侃&quot;白菜价&quot;，开源又让技术本身无法收费。对比之下，OpenAI、Google 走的是闭源高溢价路线，靠 API 调用和企业授权赚得盆满钵满。 [12] DeepSeek 把技术无偿铺开，赌的是生态规模、人才吸引与&quot;国运级&quot;的话语权——但开源究竟能否自身造血，至今没有公开答案。技术彻底打开，财务彻底关上——这才是它最锋利的对照。</p>\n<p>DeepSeek 把技术彻底推开后，一个意想不到的后果发生了：它的开源模型成了无数企业的&quot;基础设施&quot;——而 DeepSeek 自己收不到一分钱。 [12]</p>\n<p>在 DeepSeek 以 MIT 许可全量开源 V3、R1、R3 之后，中国市场迅速出现了一波&quot;集成潮&quot;。百度将 DeepSeek 模型接入文心平台供企业调用；字节跳动在抖音内部工具链中部署 DeepSeek 系列；腾讯将 R1 接入腾讯会议与文档产品；小米在 HyperMind 系统级 AI 中引入 DeepSeek 推理能力；科大讯飞星火平台支持 DeepSeek 模型推理；滴滴将 DeepSeek 用于自动驾驶与客服场景；美团在其内部 AI 助手平台中接入；小鹏汽车将 DeepSeek 用于智能座舱对话系统。大量中小 AI 创业公司直接基于 DeepSeek 的开源权重微调，推出面向垂直行业的问答、客服、写作产品。 [16]</p>\n<p>这些集成者并非&quot;白嫖&quot;——他们在自研产品的框架、数据、行业 Know-how 上做了一层覆盖，再向自己的客户收费。百度把 DeepSeek 接入文心平台后，向企业按调用量收费；科大讯飞在星火平台上将 DeepSeek 推理作为多模型选项之一，继续向政企客户卖服务；创业公司基于 DeepSeek 权重微调后，推出垂直行业的 SaaS 产品并订阅收费。换句话说，DeepSeek 提供了&quot;发动机&quot;，而真正在&quot;车上收费&quot;的，是那些把发动机装进自己产品的公司。 [16]</p>\n<p>这笔&quot;开源的账单&quot;至今没有平衡表。支持者说，开源是长期主义的胜利，生态起来后价值自现——用 DeepSeek 训练出来的下游产品越多，它作为&quot;基础设施&quot;的价值就越大；质疑者说，当竞争对手用你的开源模型造出自己的产品，你反而成了别人的铺路石。无论如何，一个问题悬而未决：用免费换来的世界开发者，能不能换成实打实的利润？ [12] 这道题，DeepSeek 还没把答案写进任何一份公开文件。</p>\n<h2 class=\"rh\">第五章 被芯片卡住的下一程</h2>\n<p>低成本的故事，撞上的第一堵墙是芯片。美国对华 AI 芯片出口管制一步步收紧，DeepSeek 的算力来源被越勒越紧。时间线清晰得近乎冷酷：2022 年 10 月限 A100/H100，2023 年 10 月封堵 H800/A800 等&quot;特供&quot;合规版，2025 年 1 月特朗普政府考虑把 H20 也纳入限制，4 月 20 日 H20 禁令正式落地，直到 7 月 19 日英伟达才宣布恢复对华 H20 销售——但仅是库存，更新的 Blackwell 架构仍被挡在门外；7 月 31 日，国家网信办就 H20 的漏洞后门风险约谈英伟达。 [10]</p>\n<p>这道墙，直接撞上了 DeepSeek 的下一款旗舰。R2 的开发进度一再推迟；业内普遍把&quot;算力短缺&quot;列为首要原因——H20 被禁断了增量，而用国产芯片训练又卡在生态与性能鸿沟上。<mark class=\"direct\" data-hit=\"0\">据《The Information》</mark>等报道，推迟既因为梁文锋对性能尚不满意，也因华为芯片训练存在技术难题。 [9] 国产算力并非没有进展：华为昇腾 910 系列 2025 年出货预计突破 70 万颗、份额冲至约 30%，正在补位；但&quot;用最省算力&quot;的前提若从 H800 切换到国产卡，省下来的，还是不是同一个量级的成本，要打一个问号。 [14]</p>\n<h2 class=\"rh\">第六章 全球封禁的墙</h2>\n<p>同一份开源代码，在政府监管者眼中的境遇却异常一致：以数据安全为由，把它关在门外。2025 年 2 月起，意大利数据保护机构下令屏蔽，澳大利亚以国家安全为由屏蔽，印度、日本跟进；美国国会、五角大楼、NASA、海军禁用政府设备，得州全面封禁，两党更提出《2025 美国人工智能能力与中国脱钩法案》，拟将下载使用 DeepSeek 定为犯罪；韩国同月也屏蔽了它。 [<mark class=\"paraphrase\" data-hit=\"6\">11] 中方回应：政府重视并依法保护数据隐私安全，从未也不会要求企业以违法形式采集或存储数据。 [</mark>11]</p>\n<p>政策名称： Garante 下令屏蔽（意大利数据保护机构）</p>\n<p>具体措施： 要求在意大利境内屏蔽 DeepSeek 的访问，暂停新用户注册，限期整改数据收集与处理流程以符合 GDPR 要求。</p>\n<p>官方理由： 涉嫌违反欧盟《通用数据保护条例》（GDPR），用户数据可能被传输至中国境内且未经充分同意。</p>\n<p>时间： 2025 年 2 月</p>\n<p>政策名称： 澳大利亚政府禁令</p>\n<p>具体措施： 禁止政府机构及关键基础设施企业使用 DeepSeek，要求已部署的系统限期迁移。</p>\n<p>官方理由： 经国家安全评估，DeepSeek 可能构成&quot;不可接受的数据安全风险&quot;，敏感信息可能被中国当局访问。</p>\n<p>时间： 2025 年 2 月</p>\n<p>政策名称： 印度信息技术部（MeitY）限制令</p>\n<p>具体措施： 要求印度公司及政府机构停止使用 DeepSeek，推荐使用本土或&quot;可信盟友&quot;的 AI 模型。</p>\n<p>官方理由： 数据主权与国家安全考量，避免关键数据流向中国，同时扶持本国 AI 产业。</p>\n<p>时间： 2025 年 2 月</p>\n<p>政策名称： 日本政府限制令</p>\n<p>具体措施： 限制中央政府及地方政府部门在涉密场景使用 DeepSeek，要求民间企业自行评估风险。</p>\n<p>官方理由： 敏感政府数据可能外流至中国，违反《个人信息保护法》及国家安全准则。</p>\n<p>时间： 2025 年 2 月</p>\n<p>政策名称： 《2025 美国人工智能能力与中国脱钩法案》+ 多部门禁令</p>\n<p>具体措施：</p>\n<p class=\"rli\">美国国会、五角大楼、NASA、海军全面禁止在政府设备上使用 DeepSeek</p>\n<p class=\"rli\">得克萨斯州全州封禁，要求公立机构限期移除</p>\n<p class=\"rli\">两党提出《脱钩法案》，拟将下载、部署或使用 DeepSeek 定为联邦犯罪，最高可判 10 年监禁</p>\n<p class=\"rli\">限制美国云服务提供商为 DeepSeek 提供算力支持</p>\n<p>官方理由： 全面技术脱钩，防止中国 AI 技术通过开源渠道渗透美国关键基础设施与国家安全系统。</p>\n<p>时间： 2025 年 2 月起，多轮升级</p>\n<p>政策名称： 韩国个人信息保护委员会（PIPC）限制令</p>\n<p>具体措施： 要求企业停止将韩国公民数据传输至 DeepSeek，政府机构禁止使用，建议已部署者迁移至&quot;安全&quot;替代方案。</p>\n<p>官方理由： 地缘政治风险与数据安全双重考量，避免个人与商业数据流向中国，同时配合美国技术脱钩战略。</p>\n<p>时间： 2025 年 2 月</p>\n<p>这构成 DeepSeek 最锋利的悖论：它把技术开源到全世界，却因为&quot;来自中国&quot;被多国政府拒之门外。监管者防它，合规画地为牢。当一份模型同时是&quot;开源公共品&quot;和&quot;地缘风险点&quot;，它面临的已不仅是商业与技术的考题。 [11]</p>\n<h2 class=\"rh\">第七章 私募孵化出的&quot;国运符号&quot;</h2>\n<p>走到 3500 亿估值这座山巅，DeepSeek 的母体却是一家 量化私募 。它的实际控制人梁文锋，1985 年生于广东湛江，浙大硕士，既是幻方量化的掌门，也是 DeepSeek 的创始人与控股者——通过个人持股掌握这家公司。 [8] [13] 一个私募老板个人控股的 AI 公司，却背着&quot;科技自立&quot;的旗帜，这是它最微妙的身份张力。</p>\n<p>2026 年的那轮 510 亿融资，把这种张力摆到了台前：梁文锋一人掏约 200 亿，占四成，个人色彩极重；腾讯、宁德时代等产业巨头入局，<mark class=\"partial\" data-hit=\"2\">国家人工智能产业投资基金</mark>现身，让它既是纯粹的商业公司，又被赋予了准国家队的意味。 [6] 市场替它标价 3500 亿，舆论把它推上&quot;国运级&quot;符号——可它不上市、不披露，财务数据依然只有梁文锋团队能看见。当国家叙事与商业实体重叠，这家公司究竟代表谁，又为谁负责？</p>\n<p>它像一面被同时照亮两面的镜子：一面是极客式的工程胜利——用 558 万证明了算力不是唯一答案；另一面是资本与国运交织的符号——私募孵化、个人控股、巨头排队送钱、市场写下 3500 亿。把两面合起来看，DeepSeek 的故事早已不是&quot;一家 AI 公司&quot;那么简单；它是这个时代关于技术、资本与国家叙事怎么拧在一起的，最浓缩的样本。</p>\n<h2 class=\"rh\">尾声 开源给世界，捂紧给自己</h2>\n<p>回到 2025 年 1 月那个周一。英伟达一天没了近 6000 亿，而 DeepSeek 的账单上，训练费只有 558 万。 [1] [3] 一年多后，市场替它写了个价：3500 亿。可真正赚没赚钱，只有梁文锋和他的团队知道。 [6] [7]</p>\n<p>它把模型开源给全世界，却从不披露财务数据。从 V3 到 R3，技术迭代从未停步；从全球开发者到多国封禁，它同时赢得了欢呼与封锁。558 万炼出了神话，3500 亿标出了身价，可外界依然不知道这家公司到底赚不赚钱。 [8] [11]</p>\n<p>当有一天 DeepSeek 自己公开那本账——无论盈亏——外界关于它&quot;值不值 3500 亿&quot;的争论，才会有真正的答案。在那之前，558 万与 3500 亿之间，隔着的不是神话，也不是估值，而是一份从来没人见过的财务报表。而那本账上写的可能不是&quot;利润&quot;，而是一个更难的问号：当一家公司以&quot;普惠&quot;之名把技术交给世界，世界又该用什么，来为它定价？</p>", "hits": [{"type": "direct", "src": "2026-07-20_深度求索/原始资料/舆情网页/舆情_网易_2026-07-15_DeepSeek年化收入34亿估值5000亿.html", "core": "据TheInformation", "art": "这道墙，直接撞上了 DeepSeek 的下一款旗舰。R2 的开发进度一再推迟；业内普遍把\"算力短缺\"列为首要原因——H20 被禁断了增量，而用国产芯片训练又卡在", "srcc": "Lhtml2026年7月15日据TheInformation报道DeepSeek的年化收入4亿美元27亿元人民", "sim": 1.0, "len": 15}, {"type": "partial", "src": "2026-07-20_深度求索/原始资料/舆情网页/舆情_证券时报_2026-07-20_DeepSeek估值3500亿腾讯宁德.html", "core": "国家人工智能产业投资基金", "art": "而估值却是另一番滚烫的景象。2026 年 5 月起，多家媒体称其首轮（本轮）融资约 510 亿元：创始人梁文锋个人出资约 200 亿（占四成），腾讯约 100 ", "srcc": "谷投资拾象科技各出资约15亿元国家人工智能产业投资基金出资约98亿元根据7月15日更新的彭博亿万富翁指数", "sim": 0.75, "len": 12}, {"type": "partial", "src": "2026-07-20_深度求索/原始资料/舆情网页/舆情_证券时报_2026-07-20_DeepSeek估值3500亿腾讯宁德.html", "core": "国家人工智能产业投资基金", "art": "2026 年的那轮 510 亿融资，把这种张力摆到了台前：梁文锋一人掏约 200 亿，占四成，个人色彩极重；腾讯、宁德时代等产业巨头入局，国家人工智能产业投资基", "srcc": "谷投资拾象科技各出资约15亿元国家人工智能产业投资基金出资约98亿元根据7月15日更新的彭博亿万富翁指数", "sim": 0.75, "len": 12}, {"type": "paraphrase", "src": "2026-07- 9\">上海燧原科技股份有限公司科创板IPO申请</mark><mark class=\"paraphrase\" data-hit=\"9\">获受理。这是2026年A股受理的第一单IPO。</mark>招股书写着，公司拟募资 约60亿元 ，全部投向第五代、第六代AI芯片的研发产业化，以及软硬件协同创新——用它自己的话说，是要&quot;<mark class=\"partial\" data-hit=\"7\">对标国际厂商高端产品性能&quot;。</mark></p>\n<p>这是一组值得并排放在一起的数字。一边，是2022年至2024年营收从 9010万元跳到7.22亿元 ，复合增速183%，2025年全年再向近10亿元靠拢；另一边，是同期归属于母公司股东的净亏损一年接一年——16.65亿、15.10亿……到2025年前三季度，公司创办至今 累计亏损约51.79亿元 。营收在飞奔，亏损也在飞奔。</p>\n<p>而把这两条曲线连起来的，是同一个名字：腾讯。它既是燧原持股 20.26% 的第一大股东，又是它最大的客户。</p>\n<p>这篇报道试图回答三个问题：这家把命运和一位大股东深度捆绑的公司，值不值得上市？它&quot;自建生态&quot;的技术叙事，成色有多少？以及，当&quot;四小龙&quot;陆续上岸、赛道从蓝海走向拥挤，燧原这张越写越大的&quot;腾讯账单&quot;，究竟是护城河，还是天花板？</p>\n<h2 class=\"rh\">第一章 起个大早，赶个晚集</h2>\n<p>要理解燧原，得先把它放回&quot;四小龙&quot;的队列里看。摩尔线程、沐曦、壁仞、燧原——这四家被并称为&quot;国产GPU四小龙&quot;的公司，几乎同时被资本市场追逐。但在这场排位赛里，燧原的位置有点特别：它成立最早，冲线却最晚。</p>\n<p>燧原生于2018年3月，是四家里资历最老的一个。摩尔线程、沐曦、壁仞都要到2019年之后才陆续成立。可等到2025年底那波密集的上市潮真正到来时，最先出发的燧原，却落在了队尾。</p>\n<p>为什么起了大早，却赶了晚集？导火索之一，是保荐机构的更换。<mark class=\"paraphrase\" data-hit=\"11\">燧原早在2024年8月就做了第一次上市辅导备案，辅导机构是中金公司；但到2025年11月1日，它重新备案，辅导机构换成了中信证券。</mark>换券商还不足三个月，燧原就递交了招股书。对于这次调整，公司的对外说法是&quot;基于资本市场环境变化及公司战略发展需要&quot;。</p>\n<p>但更深的原因，藏在它选择的那条路里。摩尔线程、沐曦、壁仞走的都是兼容英伟达CUDA生态的GPGPU路线，起步阶段可以&quot;借道&quot;成熟生态；而燧原偏偏选了另起炉灶的非GPGPU专用架构，连软件平台都要自己从头搭。这条路更难走、更烧钱、也更难在短时间内讲出一个让资本市场立刻听懂的故事。起个大早，某种程度上，是因为它选的是一条更长的路。</p>\n<h2 class=\"rh\">第二章 追问收入：11倍增长从哪来？</h2>\n<p>先看那条向上的曲线。2022年，燧原全年营收只有9010万元；2023年3.01亿元，2024年7.22亿元，2025年全年逼近10亿元。三年多时间，营收翻了十倍不止。这是招股书里最亮眼的一页。但真正该追问的，不是&quot;涨了多少&quot;，而是&quot;这些钱从哪来&quot;。</p>\n<p>营收三年增长逾十倍，复合增速183%——但快速放大的收入，来源高度集中。</p>\n<p>燧原的收入，大致分两条线。一条是卖&quot;硬货&quot;：AI芯片、加速卡及模组；另一条，是卖&quot;整套系统&quot;——把芯片、加速卡、服务器打包成智算集群，交付给数据中心。有意思的是后面这条线的分量。招股书披露，2024年，公司 智算系统及集群 业务收入占比一度高达56.24%。也就是说，超过一半的收入，来自&quot;卖整套算力中心&quot;，而不是单纯卖芯片。</p>\n<p>这些整套系统，很大一部分流向了政府主导的&quot;东数西算&quot;项目。2023年起，燧原密集布局枢纽节点：与甘肃庆阳、中国电信甘肃公司签约共建万卡集群；2024年，庆阳万卡集群落地；2025年1月，基于燧原S60的太湖亿芯（无锡）智算中心投入运营。国产算力&quot;上车&quot;国家级智算枢纽，是一个体面的增长故事。</p>\n<p>但把镜头拉近，会发现这条增长曲线的&quot;底色&quot;其实很单一。无论是卖芯片还是卖系统，付账的那一方，越来越集中到同一个名字上。招股书里，2025年前三季度前五大客户合计贡献收入96.41%——换句话说，几乎全部收入，来自五个客户。而这五个之首，是腾讯。营收的11倍增长，与其说是&quot;卖给了整个市场&quot;，不如说是&quot;卖给了一小撮人，其中一个人买得特别多&quot;。</p>\n<h2 class=\"rh\">第三章 追问客户：腾讯的&quot;干儿子&quot;</h2>\n<p><mark class=\"paraphrase\" data-hit=\"13\">有半导体分析师在受访时，半开玩笑地把燧原称作腾讯的&quot;干儿子&quot;。</mark>这个说法不算厚道，却精准地点出了燧原最独特、也最敏感的一处结构：腾讯既是它的&quot;钱袋子&quot;，又是它的&quot;米袋子&quot;。</p>\n<p>先说&quot;钱袋子&quot;。<mark class=\"paraphrase\" data-hit=\"14\">腾讯从燧原成立之初的Pre-A轮就开始投资，此后几乎每一轮融资都跟投，一路成为最大的机构股东。</mark>如今，<mark class=\"direct\" data-hit=\"1\">腾讯科技及其一致行动人苏州湃益合计持</mark>股20.26%，是第一大股东；腾讯投资的董事总经理姚磊文，还坐进了燧原的董事会。</p>\n<p>再说&quot;米袋子&quot;。双方的业务合作可追溯到2020年——那一年，燧原第一代训练芯片&quot;邃思1.0&quot;就在腾讯云完成内部测试并上线；2021年，腾讯发布的AI推理芯片&quot;紫霄&quot;，是双方联合研发的成果。燧原的芯片，被打磨进了微信语音识别、广告推荐算法这些腾讯最核心的业务场景里。这种&quot;你投我、我供你，还一起做芯片&quot;的关系，紧密到很难分清哪一笔是纯粹的市场交易。</p>\n<p>于是就有了这张报道里最刺眼的曲线——燧原对腾讯的销售占比。2022年，它还只有8.53%；2023年跳到33.34%，2024年37.77%；到2025年，这个数字冲到 83.79% 。三年多，从不到一成，到超过八成。</p>\n<p>从8.53%到83.79%，燧原对腾讯的依赖度三年涨了近十倍。这条向上的曲线，与营收增长曲线几乎重叠。</p>\n<p>这条曲线，正是监管最放心不下的地方。<mark class=\"paraphrase\" data-hit=\"15\">在上交所的两轮问询里，燧原都被追问与腾讯的关联交易；</mark>审核意见落实函要求它说明&quot;对腾讯关联销售持续增长且占比高&quot;的风险；上会审核时，监管又一次要求它说明与主要客户合作的稳定性和持续性。同一个问题，被反复摆到台面上。</p>\n<p>燧原的回答有两层。第一层是&quot;这是战略选择&quot;：<mark class=\"partial\" data-hit=\"8\">公司优先聚焦头部互联网客户，</mark>因为这类客户&quot;单家采购需求大、复购性强&quot;；而且<mark class=\"direct\" data-hit=\"2\">与腾讯已形成长期稳定的深度绑定，&quot;</mark>腾讯终止合作的可能性较低&quot;。第二层是&quot;我们在努力去依赖化&quot;：正积极开拓非腾讯客户，包括其他头部互联网企业、电信运营商和行业客户。</p>\n<p>依赖还渗进了资产负债表。截至2025年9月末，燧原应收账款余额前五名客户里，光腾讯一家就占了29.92%。也就是说，不只是&quot;卖得多依赖腾讯&quot;，连&quot;还没收回来的钱&quot;，也押在腾讯身上。当一家公司把订单、现金流、乃至股东席位都交给同一个名字，它享受的稳定，和它承担的风险，其实是同一枚硬币的两面。</p>\n<h2 class=\"rh\">第四章 追问利润：三年烧掉51.79亿，何时回本？</h2>\n<p>营收在涨，为什么还在巨亏？答案写在研发费用里。对一家还没盈利的芯片公司来说，研发投入的绝对值不算稀奇，稀奇的是它和营收的比例。</p>\n<p>2023年，燧原每收入1元，就投入约4元做研发。比例虽逐年回落，但直到2025年，研发投入仍高于全年营收。</p>\n<p>2023年，燧原的研发投入是当年营收的4倍——每收进1元钱，就往研发里砸4元。这个比例逐年回落到2024年的181.66%、2025年的114.63%，但即便到2025年，它花在研发上的钱，仍然比一整年的收入还多。2022年至2024年，三年研发费用合计35.29亿元，占同期营收比例超过316%。这就是那51.79亿元累计亏损的主要来源——不是生意做砸了，而是生意还没做起来，钱就先花出去了。</p>\n<p>更该盯住的是现金流。2022年至2024年，燧原经营活动产生的现金流量净额分别为-9.87亿、-12.09亿、-17.98亿元——失血速度不但没减，反而在加快；2025年前三季度仍为-7.70亿元。一家公司可以账面亏损，但现金是它的血液。持续为负、且窟窿越来越大的经营现金流，意味着它必须不断从外部&quot;输血&quot;才能运转——这也正是它急于上市、要募那60亿的底层原因。</p>\n<p>那么，什么时候能回本？燧原给了一个时间：在国际贸易摩擦等外部环境不发生重大变化的前提下，公司预计<mark class=\"direct\" data-hit=\"3\">达到盈亏平衡点的时间&quot;最早为2026年&quot;。</mark>注意这四个字——&quot;最早&quot;，而不是&quot;预计&quot;或&quot;确定&quot;。它把一个乐观情形，放在了一个充满不确定的前提之上。要兑现这个承诺，燧原需要第五代、第六代芯片如期量产上量，同时把研发占比大幅压下来。这两件事，没有一件是它单方面能说了算的。</p>\n<h2 class=\"rh\">第五章 追问技术：不抄CUDA的那条窄路</h2>\n<p>如果说腾讯是燧原商业上的选择，那么&quot;不兼容CUDA&quot;，就是它技术上最大的一次赌注。要理解这个赌注有多重，得先理解英伟达的护城河到底修在哪里。</p>\n<p>英伟达最深的壁垒，不在硬件，而在软件—— CUDA 。全球几乎所有AI开发者、框架和算子，都长在CUDA这套生态上，换硬件的迁移成本极高。所以国产芯片大多选择&quot;兼容CUDA&quot;：站在巨人的软件肩膀上，起步快、迁移易。摩尔线程、沐曦、壁仞走的都是这条路。</p>\n<p>燧原偏不。它选择用 自主指令集 做专用AI加速器，硬件上<mark class=\"direct\" data-hit=\"4\">对标英伟达的Tensor Core</mark>与NVLink，自研<mark class=\"direct\" data-hit=\"5\">了 GCU-CARE加速计算单元和GCU-LARE片间</mark>互连 ；软件上更彻底——不跟随CUDA，自建一整套名为&quot; 驭算TopsRider &quot;的全栈软件平台，从驱动、编译器到算子库、工具链，全部自己写。</p>\n<p>创始人赵立东有一套自己的逻辑。他曾对记者说，英伟达并非没有弱点：绝大部分AI厂商依赖它的软硬件生态，议价能力不足；基于它非开源的软件做深度开发也很难。更关键的是，他判断&quot;兼容CUDA基础上超越英伟达，可能存在知识产权问题&quot;——与其在别人的地基上盖楼，不如自己打地基。这是一种战略洁癖，也是一场豪赌。</p>\n<p>产品上，燧原确实在往前追。2025年7月发布的第四代训推一体芯片邃思400，原生支持 FP8 低精度算力；基于它的L600模组支持单层最多128卡全互联；由L600构建的云燧ESL超节点，宣称可满足千亿参数以上大模型的训练与推理。公司还表示，第五代芯片将支持精度更低的FP4。从参数看，燧原并不落后于国产同行。</p>\n<p>但自建生态的代价，藏在利润表里。为什么研发投入能高到营收的4倍？很大一部分，正是花在了&quot;补生态&quot;上——别人可以直接复用CUDA的算子和工具链，燧原却要自己一行行写、一个个模型去适配。这条窄路的好处是&quot;不受制于人&quot;，坏处是&quot;什么都得自己扛&quot;。它能不能走通，最终不取决于芯片参数多漂亮，而取决于有多少开发者、多少客户愿意迁移到TopsRider上来——而这，又绕回了那个老问题：目前愿意大规模用它的，主要还是腾讯。</p>\n<h2 class=\"rh\">第六章 追问份额：1.4%的现实</h2>\n<p>技术叙事再动听，也要回到市场份额这面镜子前照一照。招股书援引<mark class=\"direct\" data-hit=\"6\">IDC数据：2024年，中国AI加速卡整体出货</mark>超过270万张，其中英伟达一家就约190万张，占据约七成市场；<mark class=\"paraphrase\" data-hit=\"16\">而燧原当年的AI加速卡及模组销售量是3.88万张，对应中国市场占有率——约1.4%。</mark></p>\n<p>中国市场仍是英伟达的天下；燧原1.4%的份额，在国产厂商中已能排到前列——这既说明它有一席之地，也说明国产替代整体仍在起步。</p>\n<p>1.4%这个数字，需要两面看。一面，它确实微小——在一个被英伟达占去七成的市场里，燧原只是一条细缝里的选手。另一面，1.4%在国产厂商中已能位居前列，说明国产AI加速卡整体还在&quot;从0到1&quot;的早期，谁也没真正做大。燧原不是掉队者，但它所在的，是一支整体尚未成军的队伍。</p>\n<p>真正的变量，在于英伟达的&quot;退潮&quot;。随着出口管制反复，<mark class=\"paraphrase\" data-hit=\"17\">英伟达在国内市场的销售存在不确定性，</mark>国产AI芯片在中国市场的出货占比大概率会持续提升。这是所有国产厂商共同的机会窗口。问题在于，窗口打开时，冲进去的不止燧原一家——摩尔线程、沐曦、壁仞、寒武纪、华为海思都在门口。份额会不会向燧原倾斜，取决于它能否在这轮国产替代里，把&quot;腾讯这一个客户的成功&quot;，复制成&quot;很多个客户的成功&quot;。</p>\n<h2 class=\"rh\">第七章 追问治理：不足30%的方向盘</h2>\n<p>还有一个容易被财务数字盖过、却被监管盯得很紧的问题：谁真正控制这家公司？</p>\n<p>燧原没有单一控股股东。两位联合创始人赵立东与张亚林是共同实际控制人，他们通过直接持股及员工持股平台（燧原汇智、燧原崇英），合计控制公司约 28.1%的表决权 ——低于30%。而作为第一大股东的腾讯一方，持股20.26%。两个数字摆在一起，微妙之处就出来了：创始人对公司的控制并不牢固，而单一大股东的持股又相当可观。</p>\n<p>燧原在招股书里对这一点的披露相当简略：本次发行后，两名实际控制人可支配的表决权比例将被进一步稀释，&quot;可能对公司控制权稳定造成不利影响&quot;。业内人士指出，实控人控制比例偏低、又未采取有效的稳定措施，可能让经营决策不稳定，这正是科创板审核关注的风险点。当&quot;米袋子&quot;&quot;钱袋子&quot;和&quot;董事席位&quot;都指向同一个大股东，而创始人的方向盘又握得不够紧时，这家公司未来的重大决策，究竟由谁说了算？招股书没有把话说满。</p>\n<h2 class=\"rh\">第八章 招股书之外：四小龙的终局</h2>\n<p>把招股书合上，燧原面对的是一盘更大的棋。它的命运，不只写在自己的报表里，也写在整个赛道的走向中。</p>\n<p>先看需求端的&quot;确定性&quot;。据Bernstein预测，到2028年，字节跳动、阿里巴巴和腾讯三家的AI资本支出，将占据中国AI资本支出的近一半。这意味着，谁能进入头部互联网大厂的供应链，谁就拿到了最大那块蛋糕的入场券。燧原绑定腾讯，从这个角度看并非糊涂——它抓住的正是中国AI算力需求里最厚的一块。问题只在于，它抓得太紧，紧到只剩这一块。</p>\n<p>再看架构端的&quot;趋势&quot;。高盛预测，非GPGPU芯片在AI服务器中的占比，将从2024年的36%升至2027年的45%。这对走非GPGPU路线的燧原是个利好——它押的方向，未必是错的。</p>\n<p>非GPGPU路线的空间在扩大——但CUDA生态的黏性依然强大，&quot;方向对&quot;不等于&quot;跑得赢&quot;。</p>\n<p>但趋势归趋势，燧原自己的软肋也没消失。存货正在越堆越高：从2022年的3.1亿元，涨到2025年前三季度的11.48亿元，存货周转天数从202天拉长到387天，累计存货跌价损失达2.02亿元——这暴露出它对市场需求的预测与供应链管理，还不够老练。应收账款也从0.83亿元升到5.18亿元，坏账准备计提比例从1.01%升到9.18%。营收在增长，但&quot;卖出去了却没收回来的钱&quot;和&quot;压在仓库里的货&quot;，也在同步膨胀。</p>\n<p>最后是&quot;四小龙&quot;的贴身竞争。摩尔线程、沐曦、壁仞都已上岸，手里握着募来的钱和上市公司的招牌。它们大多兼容CUDA、客户更分散——沐曦曾在问询回复中直言，缺乏互联网企业股东背景，反而让它在客户开拓上更&quot;独立&quot;。这恰好是硬币的另一面：燧原有腾讯这个&quot;干爹&quot;，起步快，却也更难摆脱单一依赖；对手没有&quot;干爹&quot;，起步慢，客户结构却可能更健康。谁的模式更经得起周期，还要留给时间回答。</p>\n<h2 class=\"rh\">尾声：没有腾讯，也能活吗</h2>\n<p>燧原的故事，是从两个AMD人开始的。</p>\n<p>赵立东，清华出身，早年可追溯到上世纪90年代的老牌显示芯片公司，后在AMD任职七年，做到计算事业部高级总监，又当过紫光集团副总裁；张亚林，同样出自AMD，曾是资深芯片经理与中国研发中心技术总监，带着AMD上海研发中心量产过多颗世界级芯片。2018年3月，两个老同事在上海临港注册了燧原。</p>\n<p>赵立东后来回忆，创业时想做的是&quot;大芯片&quot;，摆在面前有三条路——CPU、GPU、AI，最后他们选了AI。他的判断是：&quot;瞄准数据中心、做AI训练加速芯片，是一片蓝海市场，拼的是技术实力，而不是价格。&quot;八年过去，这片蓝海确实来了——DeepSeek掀起的推理需求、遍地开花的智算中心，都印证了他当年的眼光。燧原也真的从零做出了四代架构、五款芯片，和一整套自研软件生态。这份技术上的硬功夫，是真的。</p>\n<p>但&quot;拼技术不拼价格&quot;的蓝海里，燧原却把最重的一张订单，押在了同一个既是股东又是客户的名字上。这不是它不够努力，恰恰相反——正因为自建生态太难、太慢、太烧钱，它才更需要一个愿意一路陪跑、既出钱又下单的伙伴。腾讯给了它最珍贵的东西：时间和订单。可当依赖度冲到八成以上，这份珍贵，也变成了资本市场最大的问号。</p>\n<p>盈亏平衡&quot;最早2026年&quot;，60亿募资投向五代、六代芯片——燧原把未来押在了&quot;新芯片上量、新客户进场、研发占比下降&quot;这三件事同时发生上。任何一件掉链子，那条向上的营收曲线就可能失速。而它对腾讯83.79%的依赖曲线，则像一道悬在头顶的问句：当这家公司终于要面对整个市场时，它才刚刚开始学习，如何离开那位陪它长大的大股东，独自走路。</p>\n<p>读没读这份招股书，是每个打新者自己的事。本文所引数据均来自燧原科技招股书、问询回复、公司公告及公开报道，详见文末注释。投资有风险，本文不构成任何投资建议。</p>", "hits": [{"type": "direct", "src": "2026-07-20_燧原科技/原始资料/舆情网页/舆情_经济导报(大众新闻)_2026-01-26_燧原科技IPO获受理报告期内亏损51亿元与腾讯深度绑定下差异化布局非GPGPU架构.html", "core": "上海燧原科技股份有限公司科创板", "art": "2026年1月22日晚，上海证券交易所官网更新：上海燧原科技股份有限公司科创板IPO申请获受理。这是2026年A股受理的第一单IPO。招股书写着，公司拟募资 约", "srcc": "EEROCWCUUA1月22日上海燧原科技股份有限公司科创板IPO申请被受理成为2026年科创板首家申请受理企", "sim": 1.0, "len": 20}, {"type": "direct", "src": "2026-07-20_燧原科技/原始资料/舆情网页/舆情_中国证券报(新浪)_2026-01-23_燧原科技IPO申请获受理与腾讯深度战略合作.html", "core": "腾讯科技及其一致行动人苏州湃益", "art": "先说\"钱袋子\"。腾讯从燧原成立之初的Pre-A轮就开始投资，此后几乎每一轮融资都跟投，一路成为最大的机构股东。如今，腾讯科技及其一致行动人苏州湃益合计持股20.", "srcc": "37777184公司第一大股东腾讯科技及其一致行动人苏州湃益合计持有公司20258的股份实际控制人为ZHAOL", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-20_燧原科技/原始资料/舆情网页/舆情_21世纪经济报道_2026-04-23_GPU四小龙之一燧原科技披露问询回复高度依赖腾讯尚未实现盈利.html", "core": "与腾讯已形成长期稳定的深度绑定", "art": "燧原的回答有两层。第一层是\"这是战略选择\"：公司优先聚焦头部互联网客户，因为这类客户\"单家采购需求大、复购性强\"；而且与腾讯已形成长期稳定的深度绑定，\"腾讯终止", "srcc": "先聚焦头部互联网客户的发展战略与腾讯已形成长期稳定的深度绑定关系腾讯终止合作的可能性较低同时已在积极开拓非腾讯", "sim": 1.0, "len": 15}, {"type": "direct", "src": "2026-07-20_燧原科技/原始资料/舆情网页/舆情_南都周刊_2026-01-22_燧原科技科创板IPO获受理背靠腾讯亦喜亦忧.html", "core": "达到盈亏平衡点的时间最早为20", "art": "那么，什么时候能回本？燧原给了一个时间：在国际贸易摩擦等外部环境不发生重大变化的前提下，公司预计达到盈亏平衡点的时间\"最早为2026年\"。注意这四个字——\"最早", "srcc": "累计亏损约5179亿元公司测算达到盈亏平衡点的时间最早为2026年腾讯科技及其关联方持有燧原科技2026的股份", "sim": 1.0, "len": 18}, {"ty 却亏得更多。一家刚刚在去年 11 月登陆港交所、<mark class=\"paraphrase\" data-hit=\"23\">成为首家&quot;A+H&quot;两地上市豪华新能源车企的公司，</mark>在翻身四年之后，第一次把&quot;利润&quot;这四个字，写成了负号。 [3]</p>\n<p>把时间拨回五年前，这家公司叫小康股份，主业的代表产品是东风小康——一种贴着&quot;实惠&quot;标签的微型面包车。2020 年，它<mark class=\"partial\" data-hit=\"16\">营收 143 亿元，净亏 22 亿元，</mark>在新能源的浪潮里几乎是个边缘角色。 [12] 2021 年夏天，它与华为签下一纸合作，随后把名字改成了&quot;赛力斯&quot;。此后四年，营收冲到 1650 亿，净利润站稳 59 亿，问界一年交付 42 万辆，成了中国销量最高的豪华车品牌。 [2] [4]</p>\n<p>同一家公司，两种命运，中间只隔着一个华为。但华为不是免费的。从 2022 年到 <mark class=\"direct\" data-hit=\"0\">2025 年上半年，赛力斯累计向华为支付</mark>的各类采购与费用，超过 750 亿元——大约是它四年净利润总和的四倍。 [4] 它用真金白银，买到了华为的智驾、座舱、渠道和品牌光环；也正因为此，它在业内始终甩不掉一个标签：华为的&quot;代工厂&quot;。</p>\n<h2 class=\"rh\">第一章 面包车厂的翻身</h2>\n<p>要理解赛力斯今天的处境，得先看清它的来路。1986 年，张兴海在重庆巴南区的一间小厂里起家——靠一根弹簧、摩托车配件，后来做成了东风小康微面，一度是&quot;国民面包车&quot;的代名词。 [12] 那是一门典型的&quot;躯体&quot;生意：买来技术、组装出厂、比谁便宜。直到 2020 年，它还是一家营收 143 亿、净亏 22 亿、在新能源赛道里被蔚小理甩开几条街的传统车企。 [12]</p>\n<p>转折发生在 2021 年。那一年，赛力斯（当时还叫小康股份）与华为牵手，把华为的 鸿蒙智行 方案塞进了一款叫 SF5 的车里。市场起初并不买账——&quot;含华量&quot;不够的 SF5 反响平平，早期的问界 M5、M7 也<mark class=\"direct\" data-hit=\"1\">不温不火，2023 年 6 月问界 M7 月销量</mark>一度跌到 432 辆的历史冰点。 [4] 真正的拐点，是华为决定&quot;all in&quot;：据公开报道，<mark class=\"direct\" data-hit=\"2\">华为派出百人工程师团队进驻赛力斯</mark>工厂，深度参与产品定义，合力投入 5 亿元升级品控，把鸿蒙座舱、乾崑智驾 ADS 和途灵底盘揉进问界的骨子里。 [4]</p>\n<p>翻身的速度，写在利润表上。2023 年赛力斯还亏着 24.5 亿，2024 年营收同比暴增 305% 到 1451.76 亿，归母净利润 59.46 亿，第一次转正；2025 年营收再涨 13.7% 到 1650.5 亿，净利润 59.6 亿，连续两年盈利。 [1] [2] 一家靠微面起家的厂，摇身成了 A 股市值最靠前的几支新能源股之一——2021 年上半年，沾上&quot;华为概念&quot;的小康股份股价一度暴涨 287.84%。 [12]</p>\n<p>有意思的是，赛力斯并不是唯一一个面对华为选项的车企，也曾有一个著名的&quot;反面&quot;。2021 年 7 月，上汽董事长陈虹在股东大会上被问到是否与华为合作自动驾驶时，撂下一句后来被反复引用的大白话：&quot;<mark class=\"direct\" data-hit=\"3\">这就好比一家公司为我们提供整体解决方案，如此一来，它就成了 灵魂 ，而上汽就成了躯体。对于这样的结果，上汽是不能接受的。&quot; [</mark>7] 当时，这话被不少人当作一种气节——灵魂要攥在自己手里。可戏剧性的是四年之后：2025 年，连上汽自己也转身与华为牵手，推出&quot;尚界&quot;，把当年那句&quot;不卖灵魂&quot;亲手收回。 [8] 把两家放进同一条时间线，反差更明显——2021 年陈虹说出&quot;不&quot;的时候，赛力斯早已把灵魂交了出去。一个当场拒绝，一个提前交付；四年后，连拒绝者都跨过了那条线。卖不卖灵魂，从来不是道德题，是生存题。</p>\n<h2 class=\"rh\">第二章 华为这台印钞机</h2>\n<p>华为究竟给赛力斯带来了什么？拆开问界这辆车，答案清晰得近乎直白：鸿蒙智能座舱、乾崑智驾 ADS、激光雷达与域控制器等核心零部件，是华为提供的；约 700 家华为门店的客流与销售，是华为给的；&quot;华为inside&quot;这四个字带来的信任与溢价，也是华为给的。 [4] 在鸿蒙智行的几种合作模式里，赛力斯是绑定最深、也最成功的一个样本——它的&quot;含华量&quot;，全阵营最高。</p>\n<p>果实是真甜。<mark class=\"paraphrase\" data-hit=\"24\">2024 年，问界 M9 交付超 15 万辆，拿下 50 万元级</mark><mark class=\"direct\" data-hit=\"24\">豪华车型销量冠军；问界新 M7 全年交付近 20 万辆。 [</mark>1] [4] 2025 年，问界系列整体交付超 42 万辆，是中国市场销量最高的中国豪华车品牌：M9 全年超 11 万辆、连续两年稳居 50 万级销冠，M8 超 15 万辆、稳居 40 万级第一，M7 超 11 万辆。 [2] 靠这一口气，赛力斯的新能源汽车<mark class=\"partial\" data-hit=\"17\">毛利率从 2023 年的 7.2% </mark>一路抬到 2025 年的 28.8%，比<mark class=\"direct\" data-hit=\"5\">特斯拉（约 18%）、理想（约 20%）、蔚来（约 14.7%）</mark>都高。 [2] [4]</p>\n<p>但&quot;含华量&quot;越高，越意味着一件事：赛力斯今天的全部荣光，几乎都挂在华为这一个名字上。它在招股书与公告里，把这个风险写得明白——与华为的合作存在&quot;集中及交易对手风险&quot;，若双方<mark class=\"direct\" data-hit=\"6\">业务关系出现任何重大中断，&quot;业务、财务状况及经营业绩或会受到重大不利影响&quot;。 [</mark>4] 一家把利润引擎完全押在单一合作伙伴身上的车企，它的&quot;躯壳&quot;再强壮，方向盘却不在自己手里。</p>\n<h2 class=\"rh\">第三章 一笔流向华为的账</h2>\n<p>华为的加持不是免费的。根据赛力斯披露的数据，20<mark class=\"partial\" data-hit=\"18\">22 年至 2025 年上半年，</mark><mark class=\"paraphrase\" data-hit=\"25\">公司累计向华为支付的采购及相关费用，</mark><mark class=\"direct\" data-hit=\"7\">超过 750 亿元；仅 2025 年上半年就支付</mark>了<mark class=\"partial\" data-hit=\"19\">约 </mark><mark class=\"direct\" data-hit=\"8\">200 亿元，占同期总收入近三分之一。 [</mark><mark class=\"paraphrase\" data-hit=\"26\">4] 按同期约 </mark><mark class=\"direct\" data-hit=\"26\">14.7 万辆问界销量折算，相当于每卖</mark><mark class=\"paraphrase\" data-hit=\"26\">出一辆车，就有约 13.6 万元流向华为体系。</mark></p>\n<p>这笔钱分两块。一块是&quot;买华为的东西&quot;——鸿蒙座舱、乾崑智驾、激光雷达、域控制器等核心零部件，约占采购费的三分之二；<mark class=\"paraphrase\" data-hit=\"27\">另一块是&quot;买华为的服务&quot;——技术授权加约 700 家门店的渠道与营销开销，约占三分之一。 [</mark>4] 据鸿蒙智行合作协议，华为还<mark class=\"direct\" data-hit=\"10\">按整车售价约 8% 收取渠道与营销综合服务费（含约 2% 的品牌营销与技术赋能费）。以 2025 年问界</mark>约 39.1 万元的成交均价<mark class=\"partial\" data-hit=\"20\">算，每辆车约 3.13 万元是渠道</mark>费；<mark class=\"paraphrase\" data-hit=\"28\">再叠加约 5.24 万元的</mark><mark class=\"direct\" data-hit=\"28\">技术采购成本，赛力斯每卖一辆问界，</mark>合计要<mark class=\"direct\" data-hit=\"12\">向华为体系支付约 8.37 万元，约占单车成交价的 21.4%。 [</mark>4]</p>\n<p>单看这个数，华为像是&quot;拿走大头&quot;的那一方。但反过来看，正是华为的品牌与智驾溢价，把问界的成交均价和毛利率一起托了起来——赛力斯综合毛利率因此冲到近 30%，反而成了行业里毛利最高的玩家之一。 [4] 这是个拧巴的悖论：华为抽走了单车价值的五分之一，却帮赛力斯把剩下的五分之四，卖出了远超同行的价钱。750 亿采购费，约等于赛力斯四年净利润总和的四倍；可如果没有这 750 亿，也就没有那 59 亿的年利润。 [4] 账算得清，道理却说不清。</p>\n<h2 class=\"rh\">第四章 赎回灵魂的三笔钱</h2>\n<p>赛力斯不是没想过把方向盘拿回一点。它用两笔真金白银的买卖，试图把&quot;灵魂&quot;的某些部分，从华为手里赎回来。</p>\n<p>第一笔，是品牌。2024 年 7 月，赛力斯斥资 25 亿元，从华为手中买下&quot;问界&quot;系列的全部 919 项商标及 44 项相关专利，让这个最核心的品牌资产，彻底从华为名下转到自己名下。 [5] 第二笔，是技术股权。2024 年 8 月，赛力斯全资子公司拿出 115 亿元现金，买下华为旗下 引望 10% 的<mark class=\"partial\" data-hit=\"21\">股权——引望是华为车 BU 独立</mark>后的主体，也是华为智驾技术的唯一载体。交易后，引望由<mark class=\"direct\" data-hit=\"13\">华为持股 80%、赛力斯与阿维塔各持 10%，</mark>华为在 7 个董事席位里提名 6 个，依然主导管理与技术方向。 [6]</p>\n<p>这两步，本质是同一件事：把此前完全外放的&quot;品牌话语权&quot;和&quot;技术股东身份&quot;，逐步收回自己的版图。买商标，让问界在法律上真正属于赛力斯；入股价，让赛力斯从单纯的采购方，变成华为技术公司的少数股东。但&quot;赎回&quot;是局部的——商标虽然到手，车的智驾、座舱、渠道却仍握在华为手里；引望虽有了 10% 的股权，董事会却仍是华为的 6 席对其他人各 1 席，技术路线依旧华为说了算。 [6] 你可以付钱买下一张股东证，却买不回一套已经长在别人体系里的技术灵魂。</p>\n<h2 class=\"rh\">第五章 五界分流，含华量被稀释</h2>\n<p>赛力斯赎回灵魂的同时，华为正把同一套灵魂，分发给越来越多的人。鸿蒙智行早已不是问界一家独大，而是铺成了&quot;五界&quot;：问界（赛力斯）、智界（奇瑞）、享界（北汽）、尊界（江淮）、尚界（上汽）。 [4] [8] <mark class=\"direct\" data-hit=\"14\">2025 年，鸿蒙智行累计交付 58.9 万辆，其中问界 42.6 万辆，占比 71.8%——</mark>仍是绝对主力，但华为的资源与光环，已不再是赛力斯独享。 [4]</p>\n<p>稀释不是 2025 年才发生的，而是一条逐年展开的时间线。2021 年问界诞生时，鸿蒙智行（那时还叫&quot;智选车&quot;）几乎就是问界一个人；2022 年仍是独家。转折从 2023 年开始——奇瑞的智界年底入局，华为同一套渠道、同一批销售顾问，第一次要分给两个品牌；到 2024 年，北汽的享界、江淮的尊界接连落地，&quot;界&quot;字辈扩到四个；2025 年上汽的尚界补上第五块，华为的门店、研发优先级与那块&quot;华为造车&quot;的金字招牌，被五张嘴同时啃食。 [16] 对赛力斯而言，这意味着：早年的问界，几乎等价于&quot;华为系造车&quot;的全部想象；而今天走进一家华为门店，顾客面前摆着五款车，问界只是其中之一——独占性，正是被这样一年年磨掉的。</p>\n<p>稀释的不只是资源，还有差异化。<mark class=\"paraphrase\" data-hit=\"29\">当多款车型共享鸿蒙座舱与乾崑智驾，&quot;</mark><mark class=\"direct\" data-hit=\"15\">车均华为等于没有华为&quot;的质疑开始浮现——</mark>若多数车企用相似的华为方案，竞争终将滑向价格战，问界赖以立足的&quot;技术领先感&quot;会被摊薄。 [4] 更要命的是，赛力斯自己还把篮子里的另一个鸡蛋也拿走了。2026 年 2 月，它将面向 10–16 万元主流市场的子品牌&quot;蓝电&quot;剥离：沙坪坝国资接手成为 33.5% 的第一大股东，赛力斯持股降至 32%、丧失控制权、不再并表。 [9] 剥离的理由是&quot;聚焦高端新能源主业&quot;，代价却是——问界成了赛力斯在乘用车领域唯一的业绩引擎。 [9] 一边是华为的光环被五家分食，一边是自己的品牌矩阵收窄到只剩一个，两头一挤，单品牌依赖的风险被放大到了极致。</p>\n<h2 class=\"rh\">第六章 增长的悬崖</h2>\n<p>真正让市场心头一紧的，是增长曲线的陡然变平。2024 年，赛力斯营收暴涨 305%、扭亏为盈，像坐了火箭；到了 2025 年，营收只增 13.7%，而归母净利润 59.6 亿，几乎钉在了前一年的 59.46 亿上——增长，停了。 [1] [2] 更刺眼的是 2026 年上半年的预告：在交付量同比上涨、问界同比增长 10.2% 的前提下，公司反而预亏 15 亿到 18 亿。 [10]</p>\n<p>对于这份预亏，公司在预告里给了解释：近七成压力来自两大外部变量——一是碳酸锂半年内涨幅超 125%，叠加高阶智驾车型标配多激光雷达、高算力芯片，单车电子元器件成本直接抬升 1.5 万至 2 万元；二是技术迭代下的存量资产审慎计提，把适配性不足的旧产线、老模具一次性清零。 [10] 换句话说，这是主动&quot;挤水分&quot;、为新技术车型铺路的阶段性投入，而非经营塌方；<mark class=\"paraphrase\" data-hit=\"30\">公告也强调现金储备充裕、资产负债结构稳健。 [</mark>10] 但另一层潜台词绕不开：华为的刚性支出（渠道费、技术采购）是跟着销量走的结构性成本，车卖得越多，这笔账付得越狠。当增速见顶、成本抬头，曾经托起利润的那只手，也可能成为压住利润的那块石。</p>\n<h2 class=\"rh\">第七章 赎回自我的赌注</h2>\n<p>赛力斯清楚，不能完全躺在华为身上。它押下了两个不在华为体系内的赌注，试图赎回&quot;自我&quot;。</p>\n<h3 class=\"rh\">赌注一：AIVA，一条跳开华为的技术路线</h3>\n<p>第一个赌注叫 AIVA——一个由国资、赛力斯、宁德时代联合持股，并与火山引擎深度共创的新品牌。它完全独立运营，走&quot;AI 定义汽车&quot;的路线，直接跳开了原有的华为智驾路径依赖。 [13] 赛力斯输出成熟的整车制造与质量管控，宁德时代兜底动力电池，火山引擎提供大模型与智能座舱——这是一条&quot;多方协同、不绑死某一家技术供应商&quot;的新造车模式，等于给技术路线上了双保险：问界稳住基本盘，AIVA 探未来。 [13]</p>\n<h3 class=\"rh\">赌注二：出海，一个几乎空白的增量</h3>\n<p>第二个赌注是全球化。从数据看，赛力斯今天几乎还是一家&quot;内销公司&quot;：2025 年国外收入仅 23.79 亿元，占总营收的 1.44%，国内收入占了 95.27%。 [2] 一个每年卖 47 万辆车、自称&quot;世界级新豪华&quot;的品牌，海外几乎还是白纸。这正是它想讲的下半场故事——把国内近 20 万用户验证过的产品力，直接搬去海外高端市场，用更大的销量基数，摊薄那笔固定的华为采购成本。 [13]</p>\n<p>张兴海给的节奏很猛：问界从 0 到 100 万辆用了 5 年，第二个 100 万辆&quot;争取用两年完成&quot;；他曾提出三年内新能源汽车实现百万量级。 [14] 但从 2026 上半年的预亏看，这条路远比&quot;百万辆&quot;的口号陡峭。AIVA 能否跑通、海外能否打开、问界能否熬过车型周期而不被其他&quot;界&quot;分流，决定了赛力斯手里最终剩多少是自己的。</p>\n<h2 class=\"rh\">尾声 灵魂的去向</h2>\n<p>回到 2021 年那个夏天。上汽的陈虹说，不能把灵魂交给华为，否则&quot;它成了灵魂，我成了躯体&quot;。彼时赛力斯已经交了；四年后，连上汽自己也交了——2025 年它牵手华为，推出&quot;尚界&quot;，把当年那句&quot;不卖灵魂&quot;轻轻收了回去。 [7] [8] 灵魂这东西，在智能汽车的牌桌上，从来不是什么气节，而是一道生存算术题。</p>\n<p>赛力斯用四年，把这道算术题做成了一份漂亮答卷：营收从 143 亿到 1650 亿，亏损 22 亿到盈利 59 亿，问界一年交付 42 万辆，成了中国豪华车销冠。 [1][2][12] 它证明了一件事——交出灵魂，确实能换一身行头、一座城、一笔账。可它现在要回答的，是另一道题：当华为把同一套灵魂，分发给五个&quot;界&quot;；当问界从&quot;唯一&quot;变成&quot;之一&quot;；当 2026 上半年销量还在涨、利润却预亏 15 到 18 亿——赛力斯手里，究竟还剩多少是自己的？ [4] [10]</p>\n<p>它已经试着往回拿：25 亿买回&quot;问界&quot;的牌子，115 亿换来引望 10% 的股东证，再孵一个不挂华为标的 AIVA，把车开向海外几乎空白的市场。 [5][6][13] 但这些动作，更像是在华为画好的圆里，悄悄描一道自己的边。那笔 750 亿的账，可以用钱付；那枚交出去的灵魂，能不能真正赎回，要等 AIVA 跑通、海外打开、问界熬过车型周期，才见分晓。</p>\n<p>赛力斯的故事，本质上是一次关于&quot;让渡&quot;的漫长实验。它用灵魂换来了四年，换来了城、换来了账、换来了中国豪华车的销冠；可当 2026 上半年车卖得更多、钱却预亏 15 到 18 亿，当初那笔看似划算的交换，正在被时间重新定价。 [4] [10] 25 亿买回的&quot;问界&quot;牌、115 亿换来的引望股、不挂华为标的 AIVA、以及几乎空白的海外市场，都是它在华为画好的圆里，试图描下的一道自己的边。 [5][6][13] 这道边能不能连成闭环，不取决于某一份季报好看与否，而取决于一件事：当某一天，消费者是因为&quot;赛力斯&quot;、而不是因为&quot;华为&quot;才买单时，这家公司才算真正把灵魂，从账本里赎回。</p>", "hits": [{"type": "direct", "src": "2026-07-20_赛力斯/原始资料/舆情网页/舆情_新浪财经_2026-07-19_赛力斯与鸿蒙智行四年从亏22亿到赚59亿.html", "core": "2025年上半年赛力斯累计向华", "art": "同一家公司，两种命运，中间只隔着一个华为。但华为不是免费的。从 2022 年到 2025 年上半年，赛力斯累计向华为支付的各类采购与费用，超过 750 亿元——", "srcc": "据赛力斯招股书披露2022年至2025年上半年赛力斯累计向华为支付采购费超过750亿元仅2025年上半年就支付", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-20_赛力斯/原始资料/舆情网页/舆情_新浪财经_2026-07-19_赛力斯与鸿蒙智行四年从亏22亿到赚59亿.html", "core": "不温不火2023年6月问界M7", "art": "转折发生在 2021 年。那一年，赛力斯（当时还叫小康股份）与华为牵手，把华为的 鸿蒙智行 方案塞进了一款叫 SF5 的车里。市场起初并不买账——\"含华量\"不够", "srcc": "allin之后早期问界M5M7不温不火2023年6月问界M7月销量跌至432辆的历史最低点转折发生在华为决定a", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-20_赛力斯/原始资料/舆情网页/舆情_新浪财经_2026-07-19_赛力斯与鸿蒙智行四年从亏22亿到赚59亿.html", "core": "华为派出百人工程师团队进驻赛力", "art": "转折发生在 2021 年。那一年，赛力斯（当时还叫小康股份）与华为牵手，把华为的 鸿蒙智行 方案塞进了一款叫 SF5 的车里。市场起初并不买账——\"含华量\"不够", "srcc": "折发生在华为决定allin之后华为派出百人工程师团队进驻赛力斯深度参与问界的产品定义优化鸿蒙座舱ADS智驾途灵", "sim": 1.0, "len": 16}, {"type": "direct", "src": "2026-07-20_赛力斯/原始资料/舆情网页/舆情_经济日报_2021-07_上汽陈虹灵魂论.html", "core": "这就好比一家公司为我们提供整体", "art": "有意思的是，赛力斯并不是唯一一个面对华为选项的车企，也曾有一个著名的\"反面\"。2021 年 7 月，上汽董事长陈虹在股东大会上被问到是否与华为合作自动驾驶时，撂", "srcc": "华为等第三方公司合作陈虹回应称这就好比一家公司为我们提供整体的解决方案如此一来它就成了灵魂而上汽就成了躯体对于", "sim": 1.0, "len": 52}, {"type": "direct", "src": "2026-07-20_赛力斯/原始资料/舆情网页/舆情_新浪财经_2026-07-19_赛力斯与鸿蒙智行四年从亏22亿到赚59亿.html", "core": "豪华车型销量冠军问界新M7全年", "art": "果
