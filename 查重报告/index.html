\">第一章 铜价冲破一万三：需求和叙事谁更真实？</h2>\n<p>2025 年，LME 铜价全年涨幅超过 40%，从年初的 9,000 美元/吨附近一路攀升至 12 月的 11,952 美元，并在 2026 年 1 月一举突破 14,500 美元。 [1] 这个涨幅放在任何大宗商品上都算得上剧烈，但真正引人深思的是——推动铜价上涨的力量，到底有多少来自真实需求，多少来自资本市场的叙事想象？</p>\n<p>从需求侧看，基本面确实强劲。ICSG 数据显示，2025 年全球精炼铜消费增速约为 3%，中国消费增速约 3.3%。 [4] 但 3% 的消费增速显然不足以解释 40% 的价格涨幅——真正的驱动力来自供给侧的结构性收紧和资本市场的预期押注。</p>\n<p>2025 年，全球铜矿供应遭遇了近年来最密集的扰动：印尼 Grasberg 铜矿因井下通道堵塞停产 45 天，减量约 6 万吨；刚果(金) Kamoa 铜矿因地震引发洪水停产三周，全年减量约 8 万吨；智利 Collahuasi 铜矿因供水问题减产 5.5 万吨。 [5] 这些扰动叠加，使得 2025 年全球铜矿产量增速仅为 1.4%，远低于年初预期的 2.3%。华泰证券指出，2025 年全球铜矿实际增量仅为 39 万吨，而年初预期是 141 万吨——产量只有预期的四分之一。 [6]</p>\n<p>到 2025 年 12 月，LME 铜库存降至约 16.4 万吨，注销仓单占比升至 35.2%。 [7] 贸易商开始从亚洲仓库提货——现货市场已然嗅到紧张的气息。但与此同时，CFTC 投机性净多头头寸也创下历史新高。 [8] 供需的故事是真的，但泡沫的燃料是热钱。</p>\n<p>东证衍生品研究院有色首席分析师曹洋的判断或许最能概括这种局面： &quot;矿端紧缺加剧且冷料补充有限，极端天气、地缘政策变动、资源民族主义抬头等多重因素已构成系统性扰动风险。&quot; [9]</p>\n<p>铜价的冲天而起，是一个关于&quot;供给焦虑&quot;的资本市场叙事——当每一次矿山停产都被解读为结构性短缺的证据，当每一份报告都在强调&quot;未来十年铜缺口将达 1,000 万吨&quot;，价格早已不只是现在的价格，而是对未来的全部恐惧和贪婪的贴现。</p>\n<h2 class=\"rh\">第二章 加工费归零：一场&quot;冰火两重天&quot;的利润大挪移</h2>\n<p>如果说铜价创新高的故事属于矿山，那么它的反面——加工费归零的故事，则属于冶炼厂。而这两者，其实是同一枚硬币的两面。</p>\n<p>铜精矿加工费（TC/RC，Treatment Charge / Refining Charge）是理解铜产业链利润分配的核心密码。矿山把铜精矿交给冶炼厂加工成阴极铜，冶炼厂收取&quot;加工费&quot;作为报酬。这个费用的高低，直接反映了铜精矿的供需关系——矿多炼少，加工费涨；矿少炼多，加工费跌。 [10]</p>\n<p>2015 年，全球铜精矿基准加工费为 107 美元/吨，是冶炼厂的&quot;黄金年代&quot;。此后随着中国冶炼产能的持续扩张，加工费一路下行：2023 年 88 美元、2024 年 80 美元、2025 年断崖式降至 21.25 美元——直到 2026 年，归零。 [3]</p>\n<p>2025 年 12 月，智利矿企 Antofagasta 与中国头部冶炼厂敲定的 2026 年长协基准：TC/RC 分别为 0 美元/吨和 0 美分/磅。这是全球铜冶炼行业历史上从未出现过的&quot;零加工费&quot;协议。 [2] 更极端的是现货市场——截至 2026 年 5 月底，进口铜精矿指数报 -108.63 美元/干吨，每处理一吨铜精矿，冶炼厂倒贴矿山 100 多美元。 [3]</p>\n<p>这种&quot;冰火两重天&quot;的局面，背后的逻辑很朴素。过去十年，中国铜冶炼产能扩张的速度远远超过全球铜矿供给的增长：铜矿从勘探到投产，完整周期平均需要 10 至 15 年，而建设一座冶炼厂只需 2 至 3 年。 [11] 结果就是，越来越多的冶炼厂在争抢有限且增长缓慢的铜精矿。矿山掌握了绝对议价权，加工费持续承压，最终归零。</p>\n<p>这不是周期性的低谷——它反映的是一个结构性的错配： 冶炼能力严重过剩，而矿产供给刚性不足。</p>\n<h2 class=\"rh\">第三章 靠硫酸续命的生意：冶炼厂的真实账本</h2>\n<p>既然加工费已经归零甚至为负，中国冶炼厂为什么还在开足马力生产？最简单的答案是：停不起。但更准确的答案是——它们找到了续命的&quot;偏方&quot;。</p>\n<p>大型铜冶炼炉（闪速炉、奥炉）一旦点火投产，需要连续运转数年。中途停产一次再重启，光烘炉成本就达数百万元，炉衬热胀冷缩导致的设备损伤成本比倒贴加工费更高。 [12] 但这只是&quot;为什么不关&quot;的理由，却不是&quot;为什么还能赚&quot;的答案。</p>\n<p>答案藏在副产品里。据 SMM 统计，2025 年中国 19 家主要铜冶炼厂的阴极铜产品平均利润率仅为 2.72%，较 2024 年的 3.25% 继续下降 0.53 个百分点。但同期，这些冶炼厂硫酸产品的平均利润率从 1.51% 飙升至 57.31%——大升 55.8 个百分点。 [13]</p>\n<p>硫酸利润的暴涨源于一场&quot;意外&quot;。2026 年以来，中东地缘局势导致霍尔木兹海峡硫磺运输受阻。<mark class=\"paraphrase\" data-hit=\"2\">智利年均进口硫酸超过 100 万吨，刚果(金)约 90% 的硫磺依赖中东进口——硫酸到岸价突破 1,000 美元/吨。 [</mark>14] 中国虽不直接依赖中东硫磺，但硫酸价格随国际市场水涨船高，叠加磷酸铁锂电池产业爆发式增长的额外需求，硫酸利润成为冶炼厂在&quot;零加工费时代&quot;的关键缓冲。</p>\n<p>更关键的是，中国人的&quot;囚徒困境&quot;远未结束。尽管 CSPT（中国铜原料联合谈判小组）16 家核心企业在 2025 年 11 月底达成共识，2026 年主动降低矿铜冶炼产能负荷 10% 以上，涉及产能超过 1,000 万吨/年。 [<mark class=\"paraphrase\" data-hit=\"3\">15] 但实际情况是，2026 年 19 家主要冶炼厂的合计计划产量为 1,230 万吨，同比增长 5.2%。 [</mark>13] 云南铜业因搬迁后全面复产，增量达 43 万吨；铜陵有色同样因新厂投产，增量 15 万吨。 [13] 喊着减产，产量却还在涨——这个行业的集体行动逻辑，远比表面复杂。</p>\n<h2 class=\"rh\">第四章 AI 的&quot;铜胃口&quot;：故事还是现实？</h2>\n<p>在铜需求结构中，出现了一个几年前没人预料到的变量：AI 数据中心。</p>\n<p>一台 NVIDIA GB200 服务器配置了 72 个 GPU，使用 5,000 根 NVLink 铜缆连接，单台铜缆总长度接近 2 英里。一台 GB200 的铜用量达 15 至 20 公斤，而传统服务器仅 5 至 8 公斤。 [16] 摩根大通估计，2026 年全球 AI 数据中心将贡献约 47.5 万吨铜需求，且未来三年保持 30% 以上增速。 [17] 华创证券的预测更为激进：2025 至 2040 年，AI 及数据中心的铜需求将从 110 万吨增长至 250 万吨。 [18]</p>\n<p>但 47.5 万吨是什么概念？2025 年全球精炼铜消费量约 2,700 万吨。 [4] AI 数据中心的铜需求占比不到 2%。它确实是一个快速增长的结构性增量，但远未到&quot;需求革命&quot;的程度。</p>\n<p>真正值得关注的是 AI 带来的&quot;间接铜需求&quot;——数据中心电力需求激增引发的电网改造。IEA 数据显示，2024 年数据中心约占全球电力消耗的 1.5%，到 2030 年将翻倍至约 945 太瓦时。 [19] 电力增量的背后，是特高压输电线路、配电网智能化升级等大规模铜消耗。国家电网&quot;十五五&quot;期间 4 万亿元投资计划中，特高压和智能配电网是两个核心方向。 [20] 从这个角度看，AI 不仅仅是&quot;吃铜的机器&quot;，更是电网升级的&quot;催化剂&quot;——直接铜需求有限，但引发的系统性能源基础设施投资才是铜价的真正助推器。</p>\n<h2 class=\"rh\">第五章 供给的&quot;死局&quot;：矿山真的增产不了吗？</h2>\n<p>铜市场的核心叙事是供给不足。但仔细审视数据，这个&quot;死局&quot;比表面看起来复杂得多。</p>\n<p>2025 年全球铜矿产量约 2,850 万吨，同比增长 3.3%。 [5] 2026 年预计达到 2,920 万吨，同比增长 2.5%。新增产能主要来自三大方向：刚果(金) Kamoa-Kakula 三期（年产能 60 万吨）、中国巨龙铜矿二期（年产铜从 19 万吨提升至 30-35 万吨）、<mark class=\"paraphrase\" data-hit=\"4\">蒙古 Oyu Tolgoi 持续爬坡（增量约 12 万吨）。 [</mark>21]</p>\n<p>核心问题不是&quot;有没有增量&quot;，而是&quot;增量够不够&quot;。华泰证券测算 2025 至 2028 年铜供给增速分别为 1.6%、2.4%、3.5%、3.2%。 [6] 而需求增速预期在 3% 左右。从数学上看，供需靠得非常近——缺口可能在几十万吨的量级，而非数百万吨。市场实际上处于&quot;紧平衡&quot;状态，而非绝对的&quot;短缺&quot;。</p>\n<p>但&quot;紧平衡&quot;变成了&quot;大缺口&quot;叙事，原因在于扰动率的系统性抬升。CRU 预测 2025 年铜矿扰动率提升至 5.5%。 [6] Grasberg 的滑坡、Kamoa 的地震、Collahuasi 的缺水——这些已经不是偶发事件，而是老矿&quot;老龄化&quot;的必然产物。全球前十大铜矿多数已开采数十年，有些甚至可追溯到 19 世纪末。 [22] 矿山越老，出事的概率越大。</p>\n<p>更关键的是，长期资本开支不足已在前一轮周期埋下&quot;种子&quot;。2014 至 2020 年金属价格低迷期间，<mark class=\"paraphrase\" data-hit=\"5\">全球矿业企业大幅削减勘探和开发支出，</mark>直接导致 2026 至 2030 年可投产的新项目极度稀缺。 [11] 高盛指出，即使铜价信号再强烈，一座大型铜矿从勘探到投产平均需要 16.5 年——即便今天开始全力投资，也解决不了未来十年的供给问题。 [23] 从这个意义上说，&quot;供给死局&quot;不是自然的资源枯竭，而是十年前的资本决策对今天的&quot;报复&quot;。</p>\n<h2 class=\"rh\">第六章 废铜：被低估的&quot;X 因素&quot;</h2>\n<p>在所有的供给变量中，废铜是最容易被忽视却又最有弹性的因子。</p>\n<p>ICSG 数据显示，2026 年全球废铜回收量预计增长 6%，远高于矿铜 2.5% 的增速。2025 年全球二次精炼产量（来自废铜）增长 4.5%，2026 年预计增长 6%。 [4]</p>\n<p>废铜是铜市场的&quot;隐性缓冲垫&quot;。当铜价上涨时，废铜回收的经济性改善，回收商更积极地将旧电线、旧管道、旧家电中的铜拆解回收；当铜价下跌时，回收经济性下降，废铜供应收缩。这种机制天然地为铜市场提供了弹性。中国是全球最大的废铜回收和消费国，2025 年废铜利用量已超过 300 万吨，约占精炼铜产量的 20% 以上。 [<mark class=\"paraphrase\" data-hit=\"6\">24] 但</mark><mark class=\"direct\" data-hit=\"6\">欧盟正在研究对废金属出口征收 30% 关税——</mark><mark class=\"paraphrase\" data-hit=\"6\">如果落地，可能改变全球废铜贸易流向。 [</mark>5]</p>\n<p>然而，废铜替代矿铜有其物理边界。废铜品质低于原生铜，在高端应用（如超薄铜箔、高纯度电工铜线）中无法完全替代。更重要的是，废铜的供应增长依赖于过去 20 年的铜消费积累——它不是一个可以无限扩大的&quot;水龙头&quot;，而是一个受制于社会铜存量的&quot;水库&quot;。 废铜弥补不了结构性缺口，但它可以在边际上决定市场是&quot;紧平衡&quot;还是&quot;实质性短缺&quot;。</p>\n<h2 class=\"rh\">第七章 中国铜供应链的&quot;双重命门&quot;</h2>\n<p>在审视全球铜产业链时，一个最容易被忽视但最根本的问题浮出水面：中国的铜供应链存在着一种结构性的&quot;双扣&quot;——冶炼环节占全球主导地位，而原料端高度依赖进口。</p>\n<p>2025 年，中国精炼铜产量达到 1,472 万吨，占全球总产量的 48% 以上。 [13] 全球近一半的铜在中国冶炼。<mark class=\"paraphrase\" data-hit=\"7\">但与此同时，中国铜精矿自给率不足 30%，进口依存度持续高于 70%。</mark>2025 年中国进口铜精矿 3,036.5 万实物吨，同比增长 7.8%，来源高度集中于智利和秘鲁，两国合计占比 67%。 [5]</p>\n<p>这种&quot;冶炼在东方、矿源在西方&quot;的格局，在全球产业链中独一无二。它意味着中国的铜供应链同时面临两个层次的脆弱性：</p>\n<p>第一层，矿产供给的地缘风险。 智利北部矿区面临日益严峻的水资源危机；秘鲁的社区抗议和矿业税改纷争不断；<mark class=\"paraphrase\" data-hit=\"8\">刚果(金)政治不稳定且基础设施薄弱；蒙古政府 2026 年初要求力拓预支利润并提高分成——资源民族主义的升温正在改变全球铜矿的投资环境。 [</mark>22]</p>\n<p>第二层，美国&quot;关键矿产&quot;战略的挤压。 2025 年美国将铜列为关键矿产，推动铜供应链&quot;去中国化&quot;。COMEX 与 LME 之间的价差套利导致全球铜库存结构性转移，美国铜库存同比增长 15%。 [<mark class=\"paraphrase\" data-hit=\"10\">5] 美国在 2025-2026 年囤积了约 150 万吨铜。 [</mark>23] 如果美国关税政策最终落地，全球铜贸易流向可能发生显著变化，中国的进口成本面临上行风险。</p>\n<p>中国并非没有意识到这个问题。2025 年 2 月，工信部等 11 部门联合发布《铜产业高质量发展实施方案（2025-2027 年）》，明确提出到 2027 年国内铜矿资源量增长 5%-10%、抑制违规冶炼产能的目标。 [25] 2026 年初，中国有色金属工业协会叫停了 200 万吨新建及拟建铜冶炼项目。 [26] 紫金矿业的巨龙铜矿二期已投产，2026 年产铜预计达 30 万吨。 [21]</p>\n<p>但自有矿山的扩张速度远远赶不上冶炼产能的增长速度。全球前十大铜矿中，中国资本介入的只有两个（Las Bambas 为中国五矿资源运营，Kamoa-Kakula 为紫金矿业参股）。 [22] 地缘政治博弈、资源国民族主义、ESG 合规成本的上升，都在提高中国企业在海外获取资源的门槛。</p>\n<h2 class=\"rh\">第八章 &quot;超级周期&quot;还是&quot;结构性牛市&quot;？</h2>\n<p>铜价还能涨多少？这是所有关注铜市场的人最关心的问题。</p>\n<p>看多的理由很坚实：供给硬约束不会在短期内解除——十年资本开支不足的&quot;苦果&quot;正在兑现；新能源和 AI 驱动的需求增长具有长期性和结构性特征，不是周期性波动；美元处于降息周期，弱美元环境有利于大宗商品估值。 [6]</p>\n<p>看空的理由同样尖锐：铜价已在历史高位，进一步上行需要更强劲的催化剂；<mark class=\"paraphrase\" data-hit=\"11\">中国房地产下行仍拖累传统需求（建筑用铜占中国铜消费约 26%）；AI 铜需求的&quot;故事性&quot;大于&quot;现实性&quot;——2026 年 AI 用铜占全球消费不到 2%；</mark>废铜回收和 Cobre Panama 复产可能带来边际供给增量。 [9]</p>\n<p>但比涨跌更重要的，是铜正在经历一个根本性的&quot;身份转变&quot;。它不再只是一个工业金属，而是正在成为&quot;新能源 + AI&quot;时代的战略资源。标普预计，铜需求量将从 2025 年的 2,800 万吨增长 50% 至 2040 年的 4,200 万吨，而如果没有实质性的供应扩张，届时将出现 1,000 万吨的缺口。 [23] 高盛将铜称为&quot;最看好&quot;的工业金属之一，认为电气化意味着需求增长强劲，且铜矿供应面临独特的制约因素。 [23]</p>\n<p>这个&quot;身份转变&quot;意味着铜的定价逻辑也在变化：从传统的&quot;工业金属 + 金融属性&quot;定价，转向&quot;战略资源 + 成长资产&quot;定价。铜的估值里已经包含了投资者对电气化转型的长期押注。这也是为什么在 2025 年全球精炼铜消费增速仅约 3% 的背景下，铜价能够录得 40% 的涨幅。</p>\n<p><mark class=\"paraphrase\" data-hit=\"13\">铜的&quot;超级周期&quot;与 2003-2011 年的那一轮有本质不同。</mark>上一轮超级周期由中国的城镇化 + 工业化需求驱动，周期见顶后经历了长达四年的熊市。而本轮周期的驱动力更多元——新能源、AI、电网升级、全球再电气化——它们不会在同一年同时见顶，这意味着铜需求增长的基础更分散、也更持久。但&quot;更持久&quot;不等于&quot;不回撤&quot;。2025-2026 年铜价的急涨中，金融资本的推动作用不可忽视。如果全球经济出现超预期下行，如果 AI 资本开支暂时放缓，如果中国房地产的拖累比预期更深——铜价完全可能经历一次大幅回调。 [9]</p>\n<h2 class=\"rh\">尾声 同一个金属，两个世界</h2>\n<p>1997 年，必和必拓的工程师在南澳大利亚的奥林匹克坝铜矿深处做过一个测算：这座矿至少还能挖 100 年。那时铜价不到 2,500 美元/吨，没有人觉得铜是什么&quot;战略性资源&quot;——它只是工业生产的普通原料，跟铁矿石、煤炭并列在&quot;大宗商品&quot;的标签下，随经济周期上下起伏。</p>\n<p>30 年后的今天，铜价是当年的 5 倍。但比价格变化更深刻的，是铜的&quot;身份&quot;变了。它不再只是电的载体，而是能源转型的物理基石——每一辆电动车需要 80 公斤铜，每一台 GB200 服务器需要 15 公斤铜，每一条 ±800 千伏特高压直流线路需要 1.2 万吨铜。 [18] 铜从来没有像今天这样，同时嵌入碳中和、AI 革命和大国博弈三条主线。</p>\n<p>这场结构性变革的赢家已经确定——掌握矿产资源的矿企，从必和必拓、自由港到紫金矿业，它们是铜价上涨的最直接受益者。输家也显而易见——被&quot;零加工费&quot;逼到墙角的冶炼厂，它们是产业链利润大迁移中的牺牲品。</p>\n<p>但铜的命运毕竟不只是在矿山和冶炼厂之间分配利润那么简单。它还要回答三个问题：一是供给缺口能不能被填平——需要十年以上的持续资本开支；二是中国能不能破解&quot;双重命门&quot;——需要海外资源布局和国内资源开发的同步加速；三是铜价的高位能不能持续——取决于 AI、新能源等新需求能不能兑现预期的增长曲线。</p>\n<p>站在 2026 年的中点回望，铜价<mark class=\"direct\" data-hit=\"1\">从 2020 年的 6,000 美元到 2026 年</mark>的 13,000 美元，涨了 1.2 倍。但这轮涨势与过去的每一次都不同：它不再是中国&quot;一家独大&quot;的故事，而是一场横跨电动车、AI、电网、地缘政治的全球性重估。 铜的&quot;超级周期&quot;叙事可能是夸张的，但铜的&quot;结构性牛市&quot;逻辑——供给约束 + 需求升级 + 战略价值重估——经得起推敲。</p>", "hits": [{"type": "direct", "src": "2026-07-24_大宗商品铜/原始资料/评估团_市场视角.md", "core": "欧盟正在研究对废金属出口征收3", "art": "废铜是铜市场的\"隐性缓冲垫\"。当铜价上涨时，废铜回收的经济性改善，回收商更积极地将旧电线、旧管道、旧家电中的铜拆解回收；当铜价下跌时，回收经济性下降，废铜供应收", "srcc": "2026年废铜回收量预计增长6欧盟正在研究对废金属出口征收30关税废铜供给的弹性比矿铜大得多可能成为缓和缺口的", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-24_大宗商品铜/原始资料/评估团_市场视角.md", "core": "从2020年的6000美元到2", "art": "站在 2026 年的中点回望，铜价从 2020 年的 6,000 美元到 2026 年的 13,000 美元，涨了 1.2 倍。但这轮涨势与过去的每一次都不同：", "srcc": "0032011铜价涨了4倍本轮从2020年的6000美元到2026年13000美元只涨了2倍且宏观环境中国地产", "sim": 1.0, "len": 19}, {"type": "paraphrase", "src": "2026-07-24_大宗商品铜/原始资料/评估团_市场视角.md", "core": " 2. **硫酸短缺的连锁反应**：刚果(金)90%的硫磺依赖中东进口，", "art": "智利年均进口硫酸超过 100 万吨，刚果(金)约 90% 的硫磺依赖中东进口——硫酸到岸价突破 1,000 美元/吨。", "srcc": " 2. **硫酸短缺的连锁反应**：刚果(金)90%的硫磺依赖中东进口，", "sim": 0.599, "len": 44}, {"type": "paraphrase", "src": "2026-07-24_大宗商品铜/原始资料/评估团_争议视角.md", "core": "2026年19家冶炼厂计划产量1230万吨，同比增5.2%。", "art": " [15] 但实际情况是，2026 年 19 家主要冶炼厂的合计计划产量为 1,230 万吨，同比增长 5.2%。", "srcc": "2026年19家冶炼厂计划产量1230万吨，同比增5.2%。", "sim": 0.715, "len": 41}, {"type": "paraphrase", "src": "2026-07-24_大宗商品铜/原始资料/评估团_追问清单.md", "core": "Oyu To 求的故事性大于实际性**：2026年AI数据中心铜需求约47.5万吨，仅占全球消费量不到2%。", "sim": 0.603, "len": 31}, {"type": "paraphrase", "src": "2026-07-24_大宗商品铜/原始资料/评估团_市场视角.md", "core": "上一轮超级周期（2003-2011）铜价涨了4倍，", "art": "铜的&quot;超级周期&quot;与 2003-2011 年的那一轮有本质不同。", "srcc": "上一轮超级周期（2003-2011）铜价涨了4倍，", "sim": 0.674, "len": 25}]}, {"key": "2026-07-24_景顺长城基金", "title": "景顺长城：告别刘彦春，一个明星基金时代的尾声", "company": "景顺长城基金", "date": "2026-07-24", "n_src": 2, "nosource": false, "rate": 1.8, "rate_direct": 0.4, "rate_partial": 0.1, "rate_paraphrase": 1.2, "src_files": ["2026-07-24_景顺长城基金/原始资料/评估团/评估团_争议视角.md", "2026-07-24_景顺长城基金/原始资料/评估团/评估团_追问清单.md"], "src_hits": {"2026-07-24_景顺长城基金/原始资料/评估团/评估团_争议视角.md": 4, "2026-07-24_景顺长城基金/原始资料/评估团/评估团_追问清单.md": 3}, "body_html": "<h1 class=\"rh\">景顺长城：告别刘彦春，一个明星基金时代的尾声</h1>\n<h2 class=\"rh\">导语 千亿的崩塌，一个模式的黄昏</h2>\n<p>2021年二季度，中国公募基金行业的历史上出现了一个令人咋舌的数字：一位基金经理的个人管理规模高达1,163亿元——比当时全市场超过80%的基金公司总规模还要大。他的名字叫刘彦春，供职于景顺长城基金管理有限公司。</p>\n<p>那一年，刘彦春是这个行业的&quot;顶流&quot;。他的景顺长城新兴成长混合规模一度突破500亿元，景顺长城鼎益混合超过200亿元，六只在管产品合计1,163.37亿元 [1] 。基民们称他为&quot;春哥&quot;，基金经理论坛里讨论他的仓位，媒体把他和另一位千亿基金经理张坤并称为&quot;白酒双雄&quot;。</p>\n<p>五年后的今天，这个数字缩水了77%。截至2026年一季度末，刘彦春在管规模仅余265.50亿元 [2] 。曾经让景顺长城引以为傲的&quot;明星基金经理&quot;招牌，在消费赛道退潮后变得斑驳不清。</p>\n<p>但这还只是景顺长城故事的一半。2026年7月10日，公司另一位元老级人物余广&quot;因个人原因&quot;卸任全部在管<mark class=\"direct\" data-hit=\"0\">产品，不转任公司其他岗位，直接注销基金从业资格 [</mark>3] 。这位任职14年、代表作回报率达583.51%的&quot;双十&quot;基金经理，以一种近乎决绝的方式画上了句号。</p>\n<p>两位核心人物的命运，折射出景顺长城正在经历的一场深刻变革。与此同时，<mark class=\"paraphrase\" data-hit=\"3\">这家公司的主动权益管理费正在经历三连降——从2023年的24.48亿元降到2024年的17.89亿元，</mark>再到2025年的16.81亿元 [4] 。</p>\n<p>一家成立了23年、管理总规模达9,264亿元 [5] 的老牌基金公司，一面拥抱&quot;平台化转型&quot;的新叙事，一面告别缔造其辉煌的明星基金经理——这中间发生了什么？&quot;明星基金经理&quot;模式真的走到尽头了吗？接下来的八个章节，调查团队将从刘彦春与余广的命运开始，逐一拆解景顺长城的转型账本。</p>\n<h2 class=\"rh\">第一章 千亿到百亿——刘彦春的兴衰</h2>\n<p>2021年二季度的一个数据成为行业范本：刘彦春以1,163.37亿元的管理规模跻身全市场主动权益基金经理第一梯队 [1] 。这个数字放在当时，超过了许多基金公司的整体规模。景顺长城这家公司，因此被贴上了一个鲜明的标签——&quot;刘彦春的公司&quot;。</p>\n<p>刘彦春的崛起与消费赛道的牛市密不可分。2017年至2020年，贵州茅台、五粮液、泸州老窖等高端白酒股价持续攀升，重仓消费赛道的刘彦春业绩如日中天。他的代表作景顺长城新兴成长混合，2019年收益72.18%，2020年收益85.94%——连续两年超高回报率吸引了大量资金涌入 [6] 。</p>\n<p>转折发生在2021年。白酒板块见顶之后，消费赛道进入漫长的调整期。贵州茅台从2021年初的2,600元区间一路跌至2025年的1,300元附近，腰斩过半。刘彦春的持仓策略几乎没有变化——始终高仓位持有白酒和消费股，不择时、不调仓。</p>\n<p>规模下降的原因有两个：一是净值下跌导致持有人资产缩水；二是持有人赎回。截至2026年一季度末，刘彦春管理的标的产品景顺长城新兴成长混合A类，近三年的年化回报率为-18.79%，同类排名居后 [7] 。其中景顺长城绩优成长混合、景顺长城集英成长两年定开混合的累计净值跌幅均超过40%。</p>\n<p>&quot;长期投资&quot;是刘彦春和景顺长城反复强调的理念。但在连续的净值下跌面前，&quot;长期投资&quot;与&quot;路径依赖&quot;之间的边界变得越来越模糊。一位不愿具名的公募分析师指出，刘彦春的持仓风格高度集中——长期重仓白酒和消费赛道，在行业轮动极快的A股市场中，这种策略一旦&quot;站错队&quot;，几无翻身之力 [8] 。</p>\n<p>2025年12月，景顺长城第三次获得&quot;主动权益投资金牛基金公司&quot;称号 [9] 。但这份荣誉的光芒，被刘彦春产品线低迷的业绩冲淡了不少。刘彦春旗下次新基金景顺长城价值领航两年持有期混合，成立以来净值增长率为-8.52%，持有人仍在等待一个回本的机会 [10] 。</p>\n<p>刘彦春的兴衰不是个人故事。它是中国公募基金&quot;明星基金经理&quot;商业模式的缩影——在牛市中大肆铺货、打造&quot;顶流&quot;、吸引基民申购，然后在熊市中承受流量的反噬。</p>\n<h2 class=\"rh\">插章 刘彦春为什么不调仓？——六层逻辑拆解</h2>\n<p>一个问题在基民和业界反复被提出：刘彦春为什么不调仓？</p>\n<p>这个问题看似简单，实际上涉及投资信仰、路径依赖、规模困境、薪酬结构、公司态度和行业环境六个层面的叠加。调查团队逐一拆解。</p>\n<h3 class=\"rh\">第一层：信仰——他是真相信消费会复苏</h3>\n<p>刘彦春在历次季报和年报中反复表达一个观点：高端白酒的基本面没有问题。他的逻辑链条是——中国经济长期向好→居民消费率提升→高端消费需求扩张→高端白酒具有品牌护城河和定价权，&quot;短期价格波动不影响长期价值&quot;。2026年4月年报中他写道：&quot;消费率提升是中长期趋势&quot;，前提是房价能稳住 [35] 。这不是借口——他2017年就押注消费，等来了2019-2020年的爆发。这种&quot;先苦后甜&quot;的经历，锚定了他的信念框架：只要等得够久，市场风格会回来。</p>\n<h3 class=\"rh\">第二层：路径依赖——一次成功锁死了整条路</h3>\n<p>刘彦春整个职业生涯，只在&quot;重仓消费&quot;这一个策略上成功过。在博时基金的7年里，他尝试过家居、养殖、计算机等多种行业轮动，无一例外全部垫底 [36] 。唯一的成功押注就是消费。心理学上的&quot;可得性启发&quot;（availability heuristic）可以解释这个现象：人倾向于根据最容易回忆起的结果做判断。对刘彦春来说，最鲜明的记忆是&quot;重仓消费→暴涨&quot;，所有失败的尝试都被冲淡。因此他再也没有离开过消费赛道。有分析认为，他的&quot;调仓&quot;——将五粮液换成古井贡酒、海康威视换成美的集团——更像是&quot;用战术的勤奋掩盖战略的懒惰&quot; [37] 。</p>\n<h3 class=\"rh\">第三层：规模困境——千亿基金的&quot;船大难调头&quot;</h3>\n<p>2021年高峰期，刘彦春管理1,163亿元。这个体量的持仓调整面临硬约束：如果要砍掉白酒仓位，每个交易日只能卖几个亿，否则砸穿盘面；如果要买科技股，科技股流通市值有限，百亿级别资金进去后难以退出。一位雪球用户评论：&quot;刘彦春不是不想调仓，是调不动——拿了数百亿白酒的人怎么调？一卖整个板块就崩了&quot; [38] 。但&quot;调不动&quot;是一个分量判断，不是应然借口——他本可以选择在2021年高位逐渐减仓，当时市场成交充裕。他没有卖。这个选择用&quot;不能&quot;来解释不够充分。</p>\n<h3 class=\"rh\">第四层：薪酬结构——基民亏钱，经理不亏</h3>\n<p>这是最残酷的一层：公募基金经理的收入与基金净值表现脱钩，与规模挂钩。管理费=基金规模×管理费率。刘彦春的管理规模无论缩水到多少，每年仍有数亿管理费流入景顺长城，他按比例获得的薪酬依然在百万至千万级别。2021年至2025年，刘彦春管理的基金合计亏损424.7亿元，但为景顺长城贡献了46.69亿元管理费 [39] 。这个制度的讽刺之处在于：即使他清仓所有股票转投国债，对他的薪酬改善也不大——他的收入取决于规模，而规模已经在下跌通道中。既然&quot;调与不调&quot;结果差不多，保持不动至少有一个&quot;坚守价值&quot;的道德叙事。</p>\n<h3 class=\"rh\">第五层：公司态度——景顺长城也不希望他调</h3>\n<p>景顺长城的立场比外界想象的更复杂。如果刘彦春调仓，有两种可能的结果：调对了→净值反弹，完美；调错了→两边打脸——抛售白酒时白酒涨、买入科技时科技跌——连&quot;长期主义&quot;的叙事也保不住。公司更倾向于让他&quot;不动&quot;，至少&quot;不动&quot;有一个站得住脚的说法。更深层的原因是：景顺长城没有准备好让刘彦春离开——他仍然是公司管理主动权益规模最大的基金经理（265亿）。如果连他也离任，公司将面临&quot;明星真空&quot;。</p>\n<h3 class=\"rh\">第六层：行业困境——他不孤独</h3>\n<p>刘彦春的困境有一条完整的行业因果链：白酒行业见顶→消费赛道整体缩水→重仓消费的基金经理无一幸免。张坤（易方达）、萧楠（易方达）、胡昕炜（汇添富）、焦巍（银华）——这些曾经的&quot;消费大佬&quot;同样亏损严重。但刘彦春的极端程度是特殊的：他的持仓集中度更高、换手率更低、坚守时间更长。其他消费基金经理至少做了微调——张坤逐渐减持白酒加仓科技，萧楠降低了高端白酒配置。刘彦春几乎纹丝不动。</p>\n<p>六层逻辑，每一层都能找到&quot;不动&quot;的理由。但六层叠加的结果是：一个基金经理在接近五年的时间里，几乎没有对持仓做出有意义的调整。</p>\n<h2 class=\"rh\">插章 24年赌对一次——刘彦春的职业生涯解剖</h2>\n<p>要理解刘彦春今天的选择，必须回溯他的过去。他的职业轨迹不是一条平稳上升的曲线，而是一部&quot;七年垫底→三年封神→五年坠落&quot;的跌宕剧。</p>\n<h3 class=\"rh\">一个偶然的成功者？</h3>\n<p>回顾刘彦春的24年从业生涯，一个让人不安的事实浮现出来：他成功的核心因素，不是选股能力，不是择时能力——他一直只有&quot;持股不动&quot;这一种策略——而是在正确的赛道上赶上了风口。在博时的7年，他尝试过各种轮动，全部失败。在景顺长城的前2年，同样平庸。直到2017年消费牛市启动，他因为&quot;坐得久&quot;而成为最大的受益者之一。但当风停了，他还坐在原地。</p>\n<p>这不是对刘彦春个人的指责——整个公募基金的商业模式都是在这个逻辑上运转的：寻找一个押对赛道的基金经理，然后给他无限的弹药和耐心。刘彦春只是这个模式最极端的样本。</p>\n<h2 class=\"rh\">第二章 余广的谢幕——&quot;双十&quot;基金经理的20年句号</h2>\n<p>如果说刘彦春代表的是景顺长城主动权益的&quot;旗舰&quot;，余广则代表这家公司的&quot;根基&quot;。</p>\n<p>2005年加入景顺长城的余广，从业超过20年，是公募行业极少数做到&quot;双十&quot;——任职超过10年、年化回报超过10%——的基金经理 [3] 。他的代表作景顺长城核心竞争力混合A，自2011年12月成立至他离任之日，累计回报率高达583.51%，年化回报率约14.5% [11] 。</p>\n<p>2026年7月10日，余广&quot;因个人原因&quot;卸任旗下全部4只在管产品，同时注销基金从业资格 [3] 。这个时间点距离他管理基金整整14年零7个月。一个时代，就这样画上了一个猝不及防的句号。</p>\n<p>余广的离任并非毫无征兆。他近年来的业绩已显疲态——景顺长城核心中景一年持有期混合（成立于2021年6月）在他管理期间累计亏损约21.54%，大幅跑输基准 [12] 。但他以&quot;注销从业资格&quot;的方式离场，在行业中仍属少见。公募基金经理通常以&quot;个人原因&quot;卸任后，会转任公司其他岗位或转向私募，直接注销从业资格几乎等同于彻底离开这个行业。</p>\n<p>一位接近景顺长城的业内人士分析，余广的离开与近年来的业绩压力有关。&quot;余广的风格偏向长期价值投资，持仓主要以家电、建材等低估值蓝筹为主。过去三年这些板块表现不佳，业绩压力非常大。&quot; [13] 余广在2025年末的一只产品——景顺长城核心优选一年持有混合，自成立以来净值增长率为-6.34%，同样为持有人带来亏损。</p>\n<p>余广的离任还带来一个现实问题：他离任前管理总规模约96.53亿元。在明星基金经理离任后，这些资金的留存率通常不高。根据历史数据，明星基金经理离任后，基金普遍面临20%~50%的赎回压力 [14] 。如果按30%的赎回率估算，景顺长城将从余广的产品线中流失约30亿元规模。</p>\n<p>余广离任后，景顺长城迅速启动了交接安排。景顺长城核心竞争力混合由张靖接任——张靖自2014年加入公司，管理经验约11年。景顺长城核心优选一年持有混合由农冰立接任。景顺长城核心中景一年持有混合由原管理团队中的其他成员接任。这一交接方案体现了&quot;新老交接&quot;的平台化思路，但接任者能否承接住这近百亿规模的信任，还需要时间来回答。</p>\n<h2 class=\"rh\">第三章 主动权益管理费三连降——降费时代的财务阵痛</h2>\n<p>刘彦春与余广的问题，最终都会落到一个数字上：管理费。</p>\n<p>2023年，景顺长城的主动权益管理费收入为24.48亿元。2024年降至17.89亿元，降幅达26.9%。2025年进一步降至16.81亿元，三年累计下降约31.3% [4] 。这个趋势背后是两个力量的叠加：一是基金经理业绩下滑导致产品净值下降，进而导致按规模计提的管理费减少；二是全行业降费政策的推进。</p>\n<p>2023年7月，证监会发布公募基金费率改革方案，要求主动权益类基金的管理费率从1.5%降至不超过1.2%，部分产品进一步降至0.8%以下 [15] 。景顺长城作为主动权益占比较大的公司，受到的冲击尤为显著——这也可以解释为什么三年间管理费下降了约7.67亿元。</p>\n<p>值得对比的是有着&quot;精品店&quot;标签的兴全基金。兴全基金仅有28只产品，2024年主动权益管理费收入为17.46亿元 [16] ，与景顺长城同一年份的17.89亿元接近。但兴全的单只基金平均管理费高达6,236万元，远超景顺长城的单只均值。换言之，兴全用更少的产品做到了接近的收入——资产管理的效率差异由此凸显。</p>\n<p>景顺长城并不是简单地在&quot;省钱&quot;。根据公司年报，2025年公司研发投入和投研团队薪酬并未显著缩减。但从财务角度看，管理费的三连降给公司的盈利能力带来实质性压力。这也解释了为什么景顺长城需要&quot;以量补价&quot;——用更大的管理规模来弥补单价的下降。</p>\n<p>交银施罗德是一个令人警醒的参照。这家曾经同样以主动权益著称的基金公司，如今已从主动权益管理费排名前十中消失 [17] 。在降费浪潮和明星基金经理流失的双重冲击下，交银的教训是：主动权益这条赛道，&quot;强者不一定恒强，但弱者一定是被淘汰的&quot;。</p>\n<h2 class=\"rh\">第四章 平台化转型——从&quot;明星单核&quot;到&quot;团队协作&quot;</h2>\n<p>刘彦春的衰落与余广的离任，对景顺长城来说是一个痛苦但或许必要的转折点——它迫使公司加速从&quot;明星单核&quot;向&quot;团队协作&quot;的平台化模式转型。</p>\n<p>景顺长城并非没有意识到过度依赖明星基金经理的风险。2025年，公司开始为刘彦春旗下的产品增聘共管基金经理，逐步降低对单一基金经理的依赖。景顺长城新兴成长混合在2025年增聘了一位共管经理，景顺长城鼎益混合也在随后跟进 [18] 。这种做法在行业里被称为&quot;以老带新&quot;——让中生代基金经理在明星手下学习的同时，分担管理压力，也为未来的交接做准备。</p>\n<p>余广的离任触发了一次更大规模的新老交替。如前文所述，景顺长城核心竞争力混合交予张靖，景顺长城核心优选一年持有混合交予农冰立。张靖管理的景顺长城策略精选混合，过去三年年化回报约8.5%，同类排名前30%；农冰立管理的景顺长城品质成长混合，年化回报约6.2% [19] 。两人在业内均有一定口碑，但与余广和刘彦春的&quot;明星光环&quot;不可同日而语。</p>\n<p>此外，景顺长城在浮动费率基金上也有所布局。2025年，<mark class=\"paraphrase\" data-hit=\"4\">公司发行了首批浮动费率基金产品——景顺长城成长同行混合，</mark>其费率结构与业绩挂钩：当基金净值增长超过业绩比较基准时，管理费率上浮；低于基准时，管理费率下浮 [20] 。2026年7月，公司又发行了景顺长城成长先锋混合（027154） [21] ，进一步扩展浮动费率产品线。</p>\n<p>浮动费率基金的初衷是&quot;利益绑定&quot;——让基金公司的收费与业绩挂钩，以减少纯规模驱动的商业模式弊端。但在A股&quot;牛短熊长&quot;的市场环境下，这种模式面临一个结构性考验：当市场整体下行时，即使基金经理跑赢了基准，持有人的绝对收益仍为负值，&quot;跑赢基准&quot;这个条件对投资者的获得感有多大意义？</p>\n<p>景顺长城官网将平台化转型称为&quot;从个人能力到组织能力的沉淀&quot; [22] 。在这方面，公司确实取得了一些成效——中信建投等研究机构在调研中指出，景顺长城的中生代基金经理储备在行业内处于中等偏上水平。但问题是：当最耀眼的招牌——刘彦春和余广都黯淡下来后，市场是否愿意给这些&quot;新生代&quot;足够的时间和耐心？</p>\n<h2 class=\"rh\">第五章 9,264亿规模背后的&quot;以量补价&quot;</h2>\n<p>尽管主动权益管理费连降三年，景顺长城的总管理规模在2026年却创下新高——9,264亿元 [5] 。非货币型基金规模达到6,155亿元，重回行业前十 [23] 。</p>\n<p>这两个数据乍看之下令人惊艳：行业前十、规模新高——怎么看都不像一家&quot;陷入困境&quot;的公司。但拆开来看，规模增长的结构才是关键。</p>\n<p>规模增长主要来自两个方向：一是低费率的指数产品（如ETF、指数基金）的扩张；二是固定收益类产品的机构资金流入。这两类产品的管理费率通常在0.15%~0.5%之间，远低于主动权益类产品的1.2%。</p>\n<p>换言之，景顺长城是用更多的&quot;量&quot;来弥补&quot;价&quot;的下滑。如果主动权益是&quot;高单价、低销量&quot;的精品店模式，那么景顺长城正在向&quot;低单价、高销量&quot;的超市模式转型。在费率改革的推动下，这种趋势是整个行业的普遍现象——但景顺长城的转型速度尤其引人关注。</p>\n<p>从公司财务数据来看，这一策略初步收到了成效。2025年，景顺长城实现营业收入38.78亿元，同比增长14.98%；净利润13.7亿元，同比增长44.01% [24] 。相比2024年（净利润9.51亿元，同比下滑19.09%） [25] ，2025年的反弹十分显著。</p>\n<p>但&quot;以量补价&quot;的可持续性存在两个隐忧：第一，低费率产品的竞争激烈程度远超主动权益——在ETF赛道，易方达、华夏、华泰柏瑞等头部公司凭借先发优势和规模效应，占据了绝大部分市场份额。景顺长城要从中分一杯羹并不容易。第二，机构资金的稳定性不一定。固收产品的大客户以银行为主，一旦银行赎回，规模可能迅速缩水。</p>\n<h2 class=\"rh\">第六章 QDII与跨境优势——一把双刃剑</h2>\n<p>在主动权益之外，景顺长城有一条差异化显著的赛道：QDII和跨境投资。得益于外资股东景顺（Invesco）的全球资源，景顺长城在QDII产品布局上较国内同行拥有天然优势。</p>\n<p>2023年以来，随着国内投资者对海外资产配置需求的飙升，景顺长城的跨境产品迎来了爆发式的资金流入。其中最具代表性的是纳指科技ETF和全球芯片LOF——这两只产品成为景顺长城在2024~2025年管理规模增长最快的产品之一。</p>\n<p>然而，高增长的背面是高溢价。QDII基金由于受限于外汇额度，基金公司无法自由扩大供给以满足市场需求，导致二级市场价格远超基金净值。2026年7月17日，景顺长城<mark class=\"partial\" data-hit=\"2\">纳指科技ETF二级市场价格</mark>为2.562元，而当日IOPV（份额参考净值）仅为2.220元，溢价率高达15.4% [26] 。</p>\n<p>这个数字并不是孤例。2026年6月22日，景顺长城全球芯片LOF（501225）二级市场价格达到4.496元，而当日基金份额净值为3.417元，溢价率高达31.6% [27] 。如此之高的溢价率意味着，投资者如果在二级市场买入上述产品，不仅要承担海外市场的波动风险，还要承受溢价回归净值时的额外亏损。</p>\n<p>景顺长城在QDII额度管理上并非没有采取行动。公司多次发布溢价风险提示公告，提醒投资者&quot;注意二级市场交易价格溢价风险，理性决策&quot; [28] 。但风险提示能否有效阻挡追高资金，是一个悬而未决的问题。实际上，高溢价本身反而可能成为吸引投机资金的&quot;魅力所在&quot;——越高的溢价说明供需越紧张，反而吸引了更多短线资金参与。</p>\n<p>QDII额度的瓶颈是行业性的。国家外汇管理局对基金公司的QDII额度实行严格审批制，每家公司的额度相对有限。景顺长城目前的QDII额度约为30~40亿美元 [29] ，在行业位居中等水平。当纳指科技ETF的申购需求的量远超额度所能承载时，溢价几乎不可避免——这是结构性矛盾，不是风险提示通知能解决的。</p>\n<p>从长期来看，QDII和跨境业务是景顺长城区别于国内竞争对手的核心差异化优势。只要Invesco的全球网络能持续提供投研支持，这条赛道就存在护城河。但溢价问题的本质是供需失衡——如果QDII额度问题得不到缓解，溢价模式可能反过来损害投资者利益，进而影响品牌信誉。</p>\n<h2 class=\"rh\">第七章 合资基因——Invesco的背影</h2>\n<p>景顺长城的身份与众不同。2003年成立时，它是中国首家中美合资的基金管理公司 [30] ——外方股东是美国独立资产管理公司景顺（Invesco Ltd.），<mark class=\"paraphrase\" data-hit=\"5\">中方股东为长城证券（由华能集团实际控制）。</mark></p>\n<p>公司总部设在深圳，注册资本1.3亿元，现任CEO为康乐，董事长为叶才 [31] 。股权结构中，景顺（Invesco）持有49%股权，长城证券持有剩余51%，长城证券的实控人华能集团则属于央企序列。这一特殊的&quot;央企+外企&quot;混合所有制结构在一家公募基金公司中并不多见。</p>\n<p>在2025年全球地缘政治紧张的大背景下，景顺长城的中美合资身份具有双重含义。从正面看，Invesco为景顺长城提供了全球投研网络和跨境产品设计能力——这是公司能在QDII赛道上领先同行的核心竞争力之一。Invesco自身管理资产规模约3,887亿美元（截至2024年末） [32] ，是全球最大的独立资产管理公司之一，其在美股、全球科技股等领域的研究积累是国内基金公司难以短时间追赶的。</p>\n<p>但从另外一面看，中美关系的波折也为这种合作关系增加了不确定性。早在2022年前后，市场就对此存在过疑虑——如果美国监管政策发生变化，Invesco在中国的合资关系是否会受到影响？虽然截至目前尚无实质性的政策变化，但&quot;合资&quot;这一标签本身，在特定环境下可能成为舆论焦点。</p>\n<p>因购而生的合资结构也导致了公司治理的某种微妙平衡。长城证券作为控股方，控制着公司的战略方向和核心人事安排，而Invesco更多扮演技术输出的角色——在投研、风控、产品设计等方面提供支持。这种&quot;中方控股、外方赋能&quot;的模式在公募行业中并不少见，但它的成功取决于一个前提：双方对市场判断和战略方向保持一致。</p>\n<p>2026年，一个更具象的例证是，景顺长城推出的浮动费率基金和跨境产品，均得到了Invesco在模型设计、风险定价等方面的技术支持。Invesco在全球市场运行的类似产品为景顺长城提供了可借鉴的经验 [33] 。在这个意义上，Invesco的&quot;背影&quot;是一笔宝贵的资源——但同时也是一道无法回避的&quot;背景风险&quot;。</p>\n<h2 class=\"rh\">第八章 行业洗牌——景顺长城是掉队者还是幸存者？</h2>\n<p>要把景顺长城的现状放在一个更大的坐标系中审视，最好的方法是看同行的命运。</p>\n<p>在&quot;以量补价&quot;的行业变革中，不同类型的基金公司正在走向截然不同的方向：</p>\n<p>交银施罗德的轨迹最为警示。这家曾经与景顺长城并称&quot;主动权益双子星&quot;的基金公司，近三年的主动权益管理规模大幅萎缩，已从管理费收入排名前十中消失 [17] 。交银的核心问题与景顺长城极为相似——过度依赖几位明星基金经理（如王崇、杨浩、何帅），而当明星经理遭遇业绩低谷时，产品线几乎全线承压。交银的教训说明：在降费时代，没有建立起平台能力的老牌公司，3~5年就可能从&quot;明星&quot;沦为&quot;边缘&quot;。</p>\n<p>兴全基金则代表了另一种生存路径。兴全只有28只产品，却创造了与景顺长城几乎持平的主动权益管理费收入 [16] 。&quot;少而精&quot;的精品店模式，让兴全在降费浪潮中保持了较高的单只产品盈利能力。但兴全的问题是：规模天花板明显——精品店的体量决定了它难以像平台型公司那样实现大规模扩张。</p>\n<p>易方达则走出了第三条路：平台型超级公司。2.5万亿的总管理规模、完整的ETF产品线、深厚的机构客户基础、充沛的人才储备——易方达代表了能同时应对降费和规模增长挑战的&quot;全能型&quot;选手。但全行业也只有少数几家公司能够达到这种体量。</p>\n<p><mark class=\"paraphrase\" data-hit=\"6\">景顺长城目前的状态——主动权益管理费三连降但总规模创新高、</mark>明星基金经理风光不再但平台化起步——恰好介于这三类公司之间。它比交银多了一些&quot;缓冲垫&quot;（跨境优势、指数产品线），但比兴全缺少&quot;精品店&quot;的锋利，比易方达缺少平台的规模厚度。</p>\n<p>景顺长城CEO康乐曾在一次采访中表示：&quot;我们不需要变成一个绝对的巨无霸，但我们要有自己清晰的差异化定位。&quot; [34] 这个定位究竟在哪里，目前还看不清楚。唯一可以确认的是：在行业洗牌的窗口期，保持现状就意味着被动——交银的轨迹已经证明了这一点。</p>\n<h2 class=\"rh\">尾声·回到刘彦春：一个模式的终结</h2>\n<p>2026年7月，距离刘彦春巅峰时期的1,163.37亿还有不到五周就是整整五年。五年时间，一位&quot;顶流&quot;从巅峰滑落到谷底，一家公司从明星模式走向平台化转型。</p>\n<p>刘彦春的案例提出的问题并不只是关于他个人的。前文用了六层逻辑来拆解他&quot;为什么不调仓&quot;——从投资信仰、路径依赖、规模困境、薪酬结构到公司立场和行业环境。但&quot;长期投资&quot;和&quot;死扛&quot;之间，在实操维度上有一个可见的分界线——止损和调整。如果一个基金经理连续五年跑输基准、同类排名垫底，却始终以&quot;长期投资&quot;为名保持持仓不动，这究竟是对投资理念的坚守，还是路径依赖的体现？在A股这个以风格轮动为特征的市场中，&quot;买入并持有&quot;同样需要择时判断——至少应该问一句&quot;值不值得被持有&quot;。</p>\n<p>景顺长城的回答，绕过了这个讨论，给出了一个更务实的方案：增聘共管基金经理、推进平台化运作、扩展浮动费率产品。这个方案的好坏，可能要到三五年后才知道。但有一点是确定的——&quot;明星基金经理&quot;驱动一家千亿级基金公司的商业模式，正在退出历史舞台。</p>\n<p>对于全行业而言，刘彦春的故事提供了一个值得反复咀嚼的样本：当一个明星被推到极致后，他的光芒与阴影是同一枚硬币的两面。基民为热度买单，大赚的几年里没有人在意策略的集中度；亏钱的几年里，&quot;长期投资&quot;四个字变成了一个沉重的标签。</p>\n<p>景顺长城的下一步，取决于两个不确定因素：一是刘彦春的<mark class=\"direct\" data-hit=\"1\">规模还能缩水到什么程度——如果他管理的产品</mark>发生大额赎回甚至清盘，对公司的冲击将是直接且显著的；二是余广离任后的百亿规模留存率——如果在30%以上的赎回率，景顺长城的主动权益版图将进一步萎缩。</p>\n<p>一家2003年成立的公司，经历了从千亿顶流到明星褪色的完整周期，如今站在了十字路口。在这个路口上，&quot;明星基金经理&quot;模式的终结，也许不是坏事——它至少让行业重新思考一个问题：资产管理公司的核心资产，究竟是一个人的名字，还是一个团队的能力？</p>\n<h2 class=\"rh\">第九章 景顺长城基金经理全景扫描</h2>\n<p>刘彦春和余广绝非景顺长城基金经理队伍的全部。这家有着23年历史的基金公司，培养或引进过一批各具风格的基金经理。以下是核心主动权益条线的全景图谱——含在岗、离职及奔私的完整梳理。</p>\n<h3 class=\"rh\">已离职基金经理的历史业绩</h3>\n<p>余广 （2026年7月离职，注销从业资格）：代表作景顺长城核心竞争力A管理14年+，任职回报583.51%，年化14.11%——&quot;双十&quot;基金经理，2012年年度股基冠军。但2020年后发行的次新基金全部亏损（核心招景A任职回报-21.54%）。 鲍无可 （2025年5月离职，2026年5月加盟高瓴瓴仁投资）：代表作景顺长城能源基建管理11年，任职回报374.75%，年化15.37%。价值派代表，沪港深精选连续6年正收益（2019-2024）。这位&quot;双十&quot;经理的流失，意味着景顺长城的价值派力量被挖角 [40] 。</p>\n<p>对比数据：三位&quot;双十&quot;级经理中，余广注销资格、鲍无可奔私、刘彦春规模缩水77%——景顺长城最核心的主动权益资产，在过去一年内几乎被清零殆尽。接任者张靖、农冰立虽然有业绩支撑，但缺乏&quot;明星效应&quot;，品牌号召力远不及前任。</p>", "hits": [{"type": "direct", "src": "2026-07-24_景顺长城基金/原始资料/评估团/评估团_争议视角.md", "cor .md": 7}, "body_html": "<h1 class=\"rh\">深圳航空：年运四千万人，亏掉十二亿——国航翅膀下的深圳难题</h1>\n<h2 class=\"rh\">导语 四千万人与十二亿</h2>\n<p>2025年，深圳航空的登机口送走了4,172万名旅客——相当于每天11.4万人从深航的航班上走下。它拥有239架飞机的机队，飞行了<mark class=\"direct\" data-hit=\"0\">75.61万小时，起落30.16万架次，</mark>开通了366条航线覆盖100个通航城市 [1] 。按规模论，这是中国民航业中仅次于三大航的第二梯队领头羊。</p>\n<p>但在这组庞大规模数字的背面，是另一组数字：净亏损12.44亿元 [2] 。<mark class=\"paraphrase\" data-hit=\"1\">每运送一名旅客，深航大约亏损30元。</mark>如果把这笔亏损放到国航集团2025年的年报中去看，它显得格外刺眼——国航集团旗下所有子公司加在一起，只有深航的亏损数字是两位数的亿元级别。<mark class=\"paraphrase\" data-hit=\"2\">国泰航空同期盈利87.48亿元，</mark>同样是国航控股51%的子公司，两者的经营结果之间横亘着整整100亿元的鸿沟 [3] 。</p>\n<p>深航的困境不是一夜之间降临的。这家成立于1992年、1993年开航的老牌地方航空，在长达32年的安全运营记录中积累了良好的口碑和品牌忠诚度——&quot;任何时候，自然体贴&quot;的服务理念、&quot;深航女孩&quot;的客舱品牌，在华南地区的商务旅客群体中有相当的认可度 [4] 。但口碑和品牌，在航空业这个极度依赖规模效应和成本管控的行业中，并不足以自动转化为利润。</p>\n<p>2026年1月，深航完成了一次关键股权变更。深国际全程物流将其持股从49%降至28.09%，深圳市鲲航投资合伙企业（有限合伙）以20.91%的持股比例新晋进入股东名单。国航的51%控股地位未变 [5] 。这次股权调整是否意味着深圳国资对深航的重新布局？还是国航在进一步加强对深航的控制力？答案藏在接下来八个章节的逐层拆解中。</p>\n<h2 class=\"rh\">第一章 239架飞机的亏损账本——深航2025年财务拆解</h2>\n<p>要理解深航的亏损，首先要看它的规模与财务结果之间的落差。</p>\n<p>深航目前拥有239架飞机，机型涵盖空客A330宽体机、A320系列和波音B737系列 [1] 。这是一个中等偏上的机队规模——比春秋航空（约130架）多近一倍，与海南航空（约250架）接近。按常理，这种体量的航空公司应当具备一定的规模经济效应：飞机采购折扣、航油批量采购议价权、维修保养的规模分摊。</p>\n<p>但实际情况是，深航的每单位运营效率并没有转化为收益。从国航2025年年报中披露的分部数据来看，深航亏损12.44亿元，在国航所有子公司中位居亏损榜首 [2] 。与其对比：同样亏损的山航集团亏损7.8亿元、澳门航空亏损6.55亿元、大连航空亏损1.87亿元、北京航空亏损1.3亿元、内蒙航空亏损0.25亿元。深航一家的亏损额，超过了其他五家子公司的亏损总和 [3] 。</p>\n<p>值得做一道算术题：12.44亿元的亏损，除以4,172万人次的旅客量，每客亏损约29.8元。乘以239架飞机的机队规模，每架飞机年亏损约520万元。以75.61万飞行小时计，每小时飞行亏损约165元。这些数据指向一个判断——深航的问题不是&quot;赚得少&quot;，而是&quot;成本结构太高&quot;。</p>\n<p>深航的亏损与其母公司国航的整体状况密切相关。2025年，中国国航实现营业收入1,714.85亿元，同比增长2.87%，但归母净利润亏损17.7亿元 [3] 。国航的资产负债率高达88.56%，累计未弥补亏损达到惊人的324.87亿元，2025年不进行利润分配 [6] 。在国航自身财务状况吃紧的背景下，深航的亏损几乎相当于国航归母亏损的70%——换句话说，如果没有深航，国航2025年的归母亏损可以从17.7亿元收窄到约5.26亿元。</p>\n<h2 class=\"rh\">第二章 国航体系内的&quot;独立王国&quot;——51%控股下的管理边界</h2>\n<p>深航在中国国航体系内的地位是独特的：它是国航控股51%的最大子公司，却始终保持着强烈的独立品牌形象。在深圳宝安国际机场，深航的自营贵宾厅、独立的&quot;深航女孩&quot;客舱品牌、自有的常旅客计划（凤凰知音）——处处显示着这家公司不希望被简单视为&quot;国航深圳分公司&quot;的企图心 [4] 。</p>\n<p>这种&quot;独立王国&quot;的现状有其历史根源。深航成立于1992年，最初由深圳地方国资主导。2005年，深圳航空完成股权改制，深国际全程物流（深圳国资背景）获得控股权。2010年，中国国航通过增资和股权收购获得深航51%控股权，深航正式进入国航体系 [7] 。但国航一直没有像整合山航那样完全整合深航——深航保留了独立的管理团队、独立的市场部和独立的运控体系。2026年1月的股权变更进一步印证了深圳国资的长期存在：深国际仍持有28.09%，鲲航投资（深圳国资平台）新进20.91% [5] 。深圳国资合计持股49%，与国航的51%形成了微妙的制衡。</p>\n<p>这种股权结构对深航的运营效率产生了实际影响。国航无法完全按照集团整体利益来调配深航的资源——深航的航线网络、机队配置、人员管理在很大程度上由自己的管理层决定。但反过来，深航又无法完全独立于国航——航油采购、飞机引进、融资安排等环节仍依赖国航的集团协同。结果是：深航既没有独立航空公司的灵活性，也没有完全整合子公司的协同效率。</p>\n<p>2025年数据显示，深航员工总数为13,788人（社保口径） [1] ，这是一个相当庞大的人员规模。作为对比，春秋航空约8,000名员工承运了超过2,500万人次旅客。深航的人均产出效率约为3,026人次/员工，而春秋航空约为3,125人次/员工——差距不算巨大，但考虑到深航的票价水平和航距结构不同，这个对比仍能说明一些问题。</p>\n<p>董事长李树兴和总裁温晓航领导的深航管理层，在国航体系内的自主权究竟有多大？一个关键观察点是航线决策。深航的航线网络主要集中在深圳宝安机场及华南地区，这与国航以北京首都机场为核心枢纽的网络布局存在结构性互补——但同时也意味着，深航很难从国航获得对等的资源倾斜 [7] 。</p>\n<h2 class=\"rh\">第三章 深圳基地的攻防战——南航来了</h2>\n<p>深航最直接的竞争压力，来自同一个城市的另一家巨头。</p>\n<p><mark class=\"paraphrase\" data-hit=\"3\">深圳宝安国际机场是深航的主基地和最大的运营枢纽。</mark>但南航在深圳同样拥有强大的存在。作为中国运量最大的航空公司，南航以广州白云机场为大本营的同时，在深圳宝安机场建设了独立的基地设施，开通了密集的深圳始发航线。在深圳-北京、深圳-上海、深圳-成都等核心商务航线上，南航与深航的正面竞争非常激烈 [8] 。</p>\n<p>2025年全年，中国民航旅客运输量达到7.7亿人次，同比增长5.5%。但行业整体客公里收益仅为0.51元，同比下降3.63% [9] 。票价下降意味着在深圳-北京这样的核心航线上，即使上座率不低，每张票的实际收入也在缩水。而深圳这个市场还有一个特殊之处：高铁网络的高度发达。深圳北站通往广州、厦门、长沙、武汉、南昌等方向的高铁班次极为密集，直接分流了大量中短途航线的客源。</p>\n<p>南航在深圳的优势在于其庞大的全国网络——广州总部的运力调配能力远强于深航。当座公里收益下降时，南航可以通过调整机型和航线来优化运力分配，而深航受限于相对较窄的航线网络，回旋余地更小。</p>\n<p>深圳航空并非没有应对——&quot;先行快线&quot;产品（深圳-杭州、深圳-重庆等高密度航线）就是其巩固商务客源的举措 [4] 。但在南航和国航的双重挤压下，深航在深圳市场的份额实际上承受着来自两边的压力。</p>\n<h2 class=\"rh\">第四章 国际航线的赌注——墨尔本与远方</h2>\n<p>2025年，深圳航空开出了一条历史性的航线：深圳-墨尔本，这是深航首条飞往澳大利亚的航线 [4] 。在此之前，深航的国际航线主要集中于东南亚和东北亚——曼谷、新加坡、东京、首尔、吉隆坡等目的地。</p>\n<p>开通墨尔本航线，标志着深航希望在国际长航线上寻找新的增长空间。逻辑上是通的：深圳是中国最具活力的出境商务和旅游市场之一，大量深圳企业往澳大利亚有频繁的商务往来，深圳-墨尔本的直飞需求长期由其他航司（南航、国泰等）经广州或香港中转满足。深航的直飞方案可以将旅行时间缩短3~5小时。</p>\n<p>但这条航线的运营前景面临多重不确定性。第一，宽体机的运营成本远高于窄体机——深航的A330宽体机队规模有限，国际航线运营经验不足。第二，深圳-墨尔本航线的季节性极强——中国春节和澳洲暑假期间一票难求，淡季可能面临严重的客座率不足。第三，南航在广州-墨尔本航线上已经建立了稳固的市场地位，国泰在香港-墨尔本的运力更是全球最大的中澳航线运力之一。深航要在三家竞争对手之间找到差异化定位，并不容易。</p>\n<p>相比国内航线的高密度、低收益格局，国际航线对深航而言既是机遇也是风险敞口。在国际油价波动、人民币汇率变化、澳洲签证政策调整等多重因素叠加下，每一条国际长航线的盈亏平衡点都非常敏感。</p>\n<h2 class=\"rh\">第五章 成本结构解剖——航油、人工、折旧压垮了什么？</h2>\n<p>深航12.44亿元亏损的源头，要回到航空业的成本结构本身去寻找答案。国航2025年年报透露了集团层面的成本构成，深航作为集团核心子公司，其成本结构具有很强的代表性 [3] 。</p>\n<p>航空公司的四大成本项分别是：航空油料成本、起降服务费、折旧与摊销、人工成本。以国航集团2025年数据为参考：航空油料成本约占总成本的35%~38%，起降费约占15%~18%，折旧与摊销约占12%~14%，人工成本约占10%~12% [6] 。</p>\n<p>航油成本是国内航空公司的最大单项开支，也是航司最无法控制的成本变量。2025年国际油价虽然较2022~2023年有所回落，但仍在每桶75~85美元的区间波动。深航239架飞机、75.61万飞行小时的总规模意味着，每桶油价上涨1美元，深航年度成本增加数千万元。</p>\n<p>深航的一个结构性弱点在于：它不像国泰航空那样拥有高比例的国际长航线收入（国际航线票价高、收入弹性好），也不像春秋航空那样拥有极致的成本管控。它夹在&quot;全服务&quot;和&quot;低成本&quot;两种模式之间——提供了全服务航空的配置（贵宾厅、热餐、常旅客计划），却没有赚到全服务航空的钱。</p>\n<p>另一个不容忽视的因素是折旧成本。深航239架飞机中，相当比例是融资租赁或经营租赁。航空业在疫情期间经历了大规模的订单延迟和交付推迟，2023年之后集中交付导致的折旧压力正在释放。深航的折旧与摊销费用在2024~2025年显著增加，这也是利润被挤压的重要原因。</p>\n<h2 class=\"rh\">第六章 子公司的困境——昆明航空与国航系亏损图谱</h2>\n<p><mark class=\"paraphrase\" data-hit=\"4\">深航旗下全资持有一家子公司：昆明航空。</mark>昆明航空以昆明长水机场为基地，运营云南省内及面向东南亚的航线网络。在国航体系内，<mark class=\"paraphrase\" data-hit=\"5\">昆明航空作为&quot;孙公司&quot;——深航全资持有昆明航空，</mark>而深航又为国航控股——这一层级关系使得昆明航空的财务表现计入深航合并报表 [10] 。</p>\n<p>昆明航空的独立财务数据未单独披露，但根据国航年报中云南区域的整体表现判断——云南市场在2025年经历了一轮价格战，多家航空公司在昆明长水机场大幅增加运力投放，导致座公里收益下降。昆明航空作为区域航司，在与东航云南公司（云南市场份额最高）的竞争中处于劣势。</p>\n<p>把视野放在国航系的整体亏损图谱中看，深航与昆明航空的困境并非孤例。2025年，国航系7家主要子公司中，<mark class=\"paraphrase\" data-hit=\"6\">仅国泰航空和Ameco实现了盈利：国泰航空盈利87.48亿元，</mark>Ameco盈利4.75亿元 [3] 。其余5家均为亏损状态：深航亏损12.44亿元、山航集团亏损7.8亿元、澳门航空亏损6.55亿元、大连航空亏损1.87亿元、北京航空亏损1.3亿元、内蒙航空亏损0.25亿元。</p>\n<p>国航系子公司亏损的共性原因：多数子公司以区域航线为主，缺乏国际长航线的收入支撑，票价弹性低，而成本端（航油、起降、折旧）与国际航司并无显著差异。国泰航空之所以能实现高利润，恰恰是因为其国际长航线占比极高——香港作为国际航空枢纽的地位为国泰提供了深航无法企及的定价权。</p>\n<h2 class=\"rh\">第七章 大湾区航空格局——三城四方的竞争与协作</h2>\n<p>深航的困境，只有放到粤港澳大湾区的整体航空版图中才能被充分理解。</p>\n<p>大湾区拥有三个主要国际机场——广州白云（约7,600万人次）、深圳宝安（约5,300万人次）、香港赤鱲角（约4,700万人次），形成了全球罕见的&quot;一湾三枢纽&quot;格局 [8] 。这三个机场的腹地高度重叠——深圳市民去广州白云和香港赤鱲角都在一个半小时车程以内。对于航司而言，这意味着极其激烈的竞争。</p>\n<p>三座城市的航司阵营非常清晰：广州是南航的大本营，香港是国泰的根据地，而深圳则是深航与南航共同争夺的市场。在这个格局中，深航所处的竞争位置是最尴尬的：它不像南航那样拥有全国最大的国内网络和广州枢纽，也不像国泰那样拥有全球覆盖的国际网络和香港的国际化地位。深航的市场被两头挤压——高端的国际旅客被国泰分流，国内公商务旅客被南航争夺。</p>\n<p>2025年全年中国民航旅客运输量7.7亿人次，同比增长5.5% [9] 。但运量的增长并未带来盈利能力的改善。全行业客公里收益0.51元，同比下降3.63%——&quot;增量不增收&quot;是2025年整个民航业的共同特征。深航的问题是，它比三大航更加依赖国内航线（国内航线占其运力的绝大部分），而国内航线的票价下滑最为严重。</p>\n<p>大湾区还面临着另一重挑战：高铁的竞争。从深圳到广州的高铁仅需29分钟，深圳到香港西九龙的高铁仅需18分钟。深港穗三城的半小时生活圈，使得航空在三城之间的短途运输几乎无意义——但深航、南航、国泰在深圳至北京、成都、上海等长途航线上的竞争却异常激烈。三位选手共享同一个出发市场，但拥有不同的网络支持和成本结构。</p>\n<h2 class=\"rh\">第八章 国航的深航难题——卖、留、还是改？</h2>\n<p>对国航而言，深航是一个比表面数字更复杂的命题。</p>\n<p>从资本回报角度看，国航51%控股深航带来的不是分红，而是每年需要承担的亏损份额（约6.34亿元）。深航的注册资本93.51亿元 [1] ，国航对应的出资额约为47.69亿元。按照目前的亏损速度，这笔投资的年化回报率为负数。国航自身的资产负债率已高达88.56%，累计未弥补亏损324.87亿元 [6] ——集团内任何一个亏损单元，都是对资产负债表的额外压力。</p>\n<p>从战略价值角度看，深航是国航在华南地区最重要的战略支点。如果失去深航，国航在深圳乃至整个广东市场的存在感将大幅削弱，只能在深圳依靠自身的少量航班维持有限航班。南航将几乎完全控制广州和深圳两个核心市场——那将是国航在华南的战略真空。从这个角度说，深航的&quot;存在价值&quot;远远超过其财务数据的表面意义。</p>\n<p>从实际可行性角度看，国航面临的选项有三个：</p>\n<p>第一，出售深航。 理论上，国航可以寻求将其51%股权转让给深圳国资或第三方。在2026年1月深圳国资增持之后（深国际28.09%+鲲航投资20.91%=深圳国资合计49%），如果国航退出，深圳国资可以顺势接手实现完全控制。但国航是否愿意放弃华南桥头堡？在当前的航空业估值低位，又能卖出什么价格？这些问题的答案并不乐观。</p>\n<p>第二，维持现状。 继续按照目前的模式运营深航——深圳国资与国航共治，深航保持相对独立运营。这种方式对国航而言成本最低，但深航的持续亏损将继续拖累国航合并报表。如果行业运价进一步下滑或者油价上涨，亏损可能进一步扩大。</p>\n<p>第三，深度整合。 国航可以推动深航进入更深层次的业务整合——统一营销体系、合并运力调配、共享飞行员资源，将深航变为&quot;国航深圳分公司&quot;。但这一方案面临深圳国资的阻力——2026年1月的股权变更表明，深圳国资并不愿意从深航完全退出。如果走这条路径，国航可能需要以增资或其他方式进一步提升持股比例。</p>\n<p>三个选项各有利弊，但时间窗口并不宽裕。国航自身的324.87亿元累计未弥补亏损意味着，集团没有足够的财力来长期补贴深航的亏损。每一份季报发布之日，深航的亏损数字都会成为投资者和分析师拷问国航管理层的焦点。</p>\n<h2 class=\"rh\">尾声·翅膀之下的深圳难题</h2>\n<p>2025年，深圳航空创造了32年安全飞行的纪录，运送了4,172万人次旅客，架起了366条航线的空中网络 [1] 。但它亏损了12.44亿元——每送走一位旅客，账本上就多了一道约30元的赤字。</p>\n<p>这不是一个关于管理失误或单一决策错误的故事。这是关于一家航空公司，在一个高速增长的市场上，在三座超级枢纽城市的缝隙间，在一个控股股东自身财务承压的局面下，努力寻找盈利路径却始终未能成功的叙事。深航的问题不是&quot;做得不够好&quot;，而是它所处的结构——一个没有足够国际航线支撑、但维持着全服务标准的区域航司——在一场票价下行周期中进入了利润的死胡同。</p>\n<p>回到导语中埋下的那个问题：深圳航空，这个年运四千万人却亏掉十二亿的&quot;国航最大子公司&quot;，命运取决于三个因素。其一是国航自身的财务状况——如果国航的资产负债率和亏损问题持续恶化，出售或整合深航的紧迫性将大幅提升。其二是大湾区的航空竞争格局——如果深圳宝安机场在政府推动下进一步扩容与升级，深航能否从中获得更大的市场份额和定价权。其三是国际航线的回报——深圳-墨尔本这类长航线能否在客座率和票价上实现盈亏平衡，决定了深航的国际扩张故事是&quot;升级&quot;还是&quot;更大的包袱&quot;。</p>\n<p>国航2025年年报中的一句话或许是最准确的注脚——&quot;公司不进行利润分配&quot; [6] ，324.87亿元的累计未弥补亏损背后，深航12.44亿元的亏损只是冰山一角，但这座冰山最靠近水面的部分。答案不会来得太迟。</p>", "hits": [{"type": "direct", "src": "2026-07-24_深圳航空/原始资料/评估团/评估团_追问清单.md", "core": "7561万小时起落3016万架", "art": "2025年，深圳航空的登机口送走了4,172万名旅客——相当于每天11.4万人从深航的航班上走下。它拥有239架飞机的机队，飞行了75.61万小时，起落30.1", "srcc": "释有数据支撑2025年安全飞行7561万小时起落3016万架次旅客4172万人次机队239架按此计算每运送一名", "sim": 1.0, "len": 16}, {"type": "paraphrase", "src": "2026-07-24_深圳航空/原始资料/评估团/评估团_追问清单.md", "core": "按此计算，每运送一名旅客亏损约30元。", "art": "每运送一名旅客，深航大约亏损30元。", "srcc": "按此计算，每运送一名旅客亏损约30元。", "sim": 0.674, "len": 16}, {"type": "paraphrase", "src": "2026-07-24_深圳航空/原始资料/评估团/评估团_追问清单.md", "core": "对比国泰航空盈利87.48亿、", "art": "国泰航空同期盈利87.48亿元，", "srcc": "对比国泰航空盈利87.48亿、", "sim": 0.707, "len": 14}, {"type": "paraphrase", "src": "2026-07-24_深圳航空/原始资料/评估团/评估团_追问清单.md", "core": " 有数据支撑：深圳宝安机场是深航的主基地。", "art": "深圳宝安国际机场是深航的主基地和最大的运营枢纽。", "srcc": " 有数据支撑：深圳宝安机场是深航的主基地。", "sim": 0.567, "len": 23}, {"type": "paraphrase", "src": "2026-07-24_深圳航空/原始资料/评估团/评估团_追问清单.md", "core": " 有数据支撑：深航全资持有昆明航空。", "art": "深航旗下全资持有一家子公司：昆明航空。", "srcc": " 有数据支撑：深航全资持有昆明航空。", "sim": 0.604, "len": 17}, {"type": "paraphrase", "src": "2026-07-24_深圳航空/原始资料/评估团/评估团_追问清单.md", "core": " 有数据支撑：深航全资持有昆明航空。", "art": "昆明航空作为&quot;孙公司&quot;——深航全资持有昆明航空，", "srcc": " 有数据支撑：深航全资持有昆明航空。", "sim": 0.714, "len": 19}, {"type": "paraphrase", "src": "2026-07-24_深圳航空/原始资料/评估团/评估团_追问清单.md", "core": "对比国泰航空盈利87.48亿、", "art": "仅国泰航空和Ameco实现了盈利：国泰航空盈利87.48亿元，", "srcc": "对比国泰航空盈利87.48亿、", "sim": 0.735, "len": 28}]}, {"key": "2026-07-24_空客", "title": "空中客车：八千架飞机的赌注，产能马拉松与发动机之困", "company": "空客", "date": "2026-07-24", "n_src": 4, "nosource": false, "rate": 5.8, "rate_direct": 1.7, "rate_partial": 0.4, "rate_paraphrase": 3.7, "src_files": ["2026-07-24_空客/原始资料/评估团/评估团_争议视角.md", "2026-07-24_空客/原始资料/评估团/评估团_市场视角.md", "2026-07-24_空客/原始资料/评估团/评估团_读者视角.md", "2026-07-24_空客/原始资料/评估团/评估团_追问清单.md"], "src_hits": {"2026-07-24_空客/原始资料/评估团/评估团_市场视角.md": 6, "2026-07-24_空客/原始资料/评估团/评估团_争议视角.md": 10, "2026-07-24_空客/原始资料/评估团/评估团_读者视角.md": 4, "2026-07-24_空客/原始资料/评估团/评估团_追问清单.md": 3}, "body_html": "<h1 class=\"rh\">空中客车： 八千架飞机的赌注，产能马拉松与发动机之困</h1>\n<p><mark class=\"partial\" data-hit=\"9\">8754架未交付飞机——按当前</mark>速度需十年以上才能清空。但每年数百架完工机身因缺少发动机而停在停机坪上，等待那台&quot;迟到&quot;的普惠GTF。波音正在追回失地，中国的C919已划破航迹，而空客还在为一道制造指令焦头烂额——2026年Q1交付量16年来首次被对手反超。这家欧洲航空巨头，正站在十字路口的中央。</p>\n<p>八千七百五十四架。这是截至2025年底，空中客车（Airbus SE）积压的未交付商用飞机订单总量。 [1] 如果把这些飞机一架接一架排开，可以从巴黎一直排到北京再折返。以2025年的交付速度——一年793架——清空这些订单需要超过11年。在全球商用航空史上，从未有一家制造商面对过如此庞大的订单积压。而恰恰是在这个数字的背后，藏着这家公司最深的焦虑。</p>\n<p>2026年第一季度，空客仅交付114架飞机，同比下降16%。 [2] 同一季度，它的老对手波音（Boeing）交付了143架——这是自2018年以来，波音首次在季度交付量上反超空客。与此同时，每股约175欧元的股价较2025年高点221欧元已下跌约20%，市值蒸发超过300亿欧元。 [3]</p>\n<p>一家手握近9000架订单的公司，营收创下734亿欧元的纪录，<mark class=\"direct\" data-hit=\"0\">净利润52亿欧元，自由现金流46亿欧元——</mark>却同时在承受交付减速、现金流逆转和股价下跌的三重压力。 [4]</p>\n<p>这篇报道试图回答一个核心问题：当一家公司拿到了几乎整个行业的订单，却连按时交付都做不到——问题到底出在哪里？是发动机供应商卡住了脖子、是供应链整合的阵痛、是竞争对手归来，还是整个商业模式的结构性挑战？我们拆解了空客2025年年报、2026年Q1财报、历年交付数据、行业研报与公开诉讼文书，逐一梳理这家欧洲工业皇冠上的明珠，在创纪录的荣光与持续不断的延误之间，正在经历怎样一场马拉松。</p>\n<h2 class=\"rh\">第一章 创纪录订单簿——8754架飞机的幸福与烦恼</h2>\n<p>8754架这个数字，来自空客2025年年报。它不仅是创纪录的数字，更是全球商用飞机制造业自诞生以来的最高积压记录。 [1] 按空客2025年公布的平均目录价格估算，这些订单对应约1.3万亿美元的合同价值——尽管航空公司实际支付的折扣幅度通常高达40%-55%。</p>\n<p>其中，A320系列（含A319neo、A320neo和A321neo）占了7163架，占比超过81%。这款全球最畅销的单通道客机，几乎以一己之力撑起了空客的订单簿。 [5] 宽体机方面，A330系列积压297架，A350系列积压755架，A220系列积压539架。</p>\n<p>然而，积压订单的庞大也带来了三个结构性问题。其一，这些订单中相当一部分是框架协议（Letter of Intent）而非已完成谈判的确定合同。按行业惯例，航司支付的定金通常仅为飞机总价的1%-3%，退出成本相对有限。</p>\n<p>其二，订单到现金的转化周期在急剧拉长。2025年空客交付了793架，2026年的目标875架已属激进——但按此速度，清空现有积压仍需整整十年。而在此期间，客户可能更改机型配置、推迟交付窗口，甚至因财务状况变化而取消订单。2025年全年空客净订单889架，而同年确认取消的订单为52架。 [6]</p>\n<p>其三，也是最棘手的——产能爬坡远不如预期。2022年空客宣布的&quot;Rate 75&quot;计划（即月产75架A320系列）原本定在2025年实现，先是推迟到2026年，2026年年初又再次推迟至2027年底。 [7] 当前实际月产量约为50架，距离75架的目标还差整整50%。</p>\n<p>换言之，空客现在面对的是一个&quot;甜蜜的痛苦&quot;：订单多到够吃十年，但产能跟不上、交付在减速、客户的耐心在消耗。如果一家餐厅有近9000份预定但厨房一次只能出50桌菜——食客终有一天会去隔壁看看。</p>\n<h2 class=\"rh\">第二章 发动机之困——普惠GTF如何卡住空客的产能</h2>\n<p>2026年6月，空客向巴黎商事法庭对普惠（Pratt &amp; Whitney）提起损害赔偿诉讼。 [8] 起诉的原因，是普惠PW1100G-JM发动机——即普惠齿轮涡扇发动机（Geared Turbofan, 简称GTF）——的&quot;持续性和系统性缺陷&quot;导致A320neo系列飞机的大量交付延迟。</p>\n<p>这场纠纷的根源可以追溯到2010年。当时空客为A320neo项目选定了两种<mark class=\"partial\" data-hit=\"10\">发动机选项：普惠GTF和CFM</mark>国际（GE与赛峰的合资企业）的LEAP-1A。这原本是双源供应的风险管理策略。但实际情况是，CFM LEAP-1A大约覆盖了A320neo发动机装机的55%，普惠GTF覆盖约45%——这个比例足以让任何单一供应商的问题酿成系统风险。</p>\n<p>普惠GTF发动机的&quot;阿喀琉斯之踵&quot;在于其独特的齿轮系统。GTF采用齿轮箱将风扇与低压涡轮分开运转，使两者各自在最优转速下工作——这带来了16%的燃油效率提升和显著的噪音降低。但正是这个创新的齿轮系统，加上高压涡轮叶片和燃烧室密封件的耐久性问题，导致了频繁的机队停场（Aircraft on Ground, AOG）事件。</p>\n<p>截至2025年底，全球超过800架A320neo因普惠GTF发动机问题而处于停场状态，占总装机机队的约15%。 [9] 每架停场飞机不仅意味着航空公司的运力损失，更意味着制造商的交付链条被卡住——因为空客需要为新建造的飞机预留可用的发动机，而普惠的发动机交付远跟不上需求。</p>\n<p>普惠的母公司雷神技术公司（RTX）在2025年业绩报告中披露，<mark class=\"paraphrase\" data-hit=\"12\">已为GTF发动机相关问题支付了约10亿美元的补偿，</mark>并预计未来还需投入更多。 [10] 当然对于空客来说，这笔补偿远无法弥补延迟交付带来的信誉损失和客户关系损伤。</p>\n<p>这场危机的后果是连锁性的。2026年Q1空客交付量同比骤降16%，最核心的原因就是发动机供应不足。<mark class=\"direct\" data-hit=\"1\">Rate 75目标从2025年推迟到202</mark>6年末，再推迟到2027年末。有分析师估算，仅2025年一年，因GTF发动机短缺而导致无法交付的A320neo机身就超过100架——这些完工机身停放在图卢兹和汉堡的交付中心，等待发动机的&quot;最后一公里&quot;。</p>\n<p>发动机供给不仅影响了整机交付，还对比发动机本身更值钱的租赁市场造成了冲击。据IBA咨询集团数据，2026年一台可用GTF发动机的月租金已达约20万美元，<mark class=\"paraphrase\" data-hit=\"13\">而一架A320neo整机的月租金约30万美元——发动机租金占比超过66%。 [</mark>11] AOG状态下无法运营的飞机，让航空公司在支付高昂发动机维修费用的同时承受营运损失。</p>\n<p>空客的Plan B是什么？短期看，尽可能将更多A320neo的生产线转向兼容CFM LEAP-1A的配置。但发动机吊架（Pylon）、燃油系统和航电接口的差异意味着这并非简单的&quot;换装&quot;。中长期看，空客与普惠的关系已因诉讼而严重恶化，而CFM那边LEAP-1A本身的供应链也在承压。</p>\n<h2 class=\"rh\">第三章 <mark class=\"direct\" data-hit=\"2\">Spirit AeroSystems</mark>收购——垂直整合的代价与收益</h2>\n<p>2025年12月，空客正式完成了对<mark class=\"direct\" data-hit=\"3\">Spirit AeroSystems</mark>部分资产的收购——这笔交易是空客近年来最大胆的垂直整合行动。 [12] <mark class=\"direct\" data-hit=\"4\">Spirit AeroSystems</mark>是全球最大的独立飞机结构件供应商之一，原是波音在2005年剥离的威奇托（Wichita）工厂。空客收购的部分主要涉及Spirit为A320和A350生产机身段、机翼前缘等关键结构件的工厂，以及位于北爱尔兰贝尔法斯特（Belfast）的机翼制造设施。</p>\n<p>收购价为4.39亿美元（含补偿对价），并为空客带来了超过4000名新的员工。 [12] 对空客来说，这笔交易的逻辑十分清晰：2025年12月欧洲航空安全局（EASA）发布了一项适航指令，指出部分<mark class=\"direct\" data-hit=\"5\">A320前机身蒙皮厚度不达标——这</mark>正是Spirit供应的部件。 [13] 将关键结构件供应商纳入内部，既能从源头控制质量，也能缩短供应链链条的长度。</p>\n<p>但垂直整合的代价也同样真实。Spirit的威奇托工厂有着复杂的工会关系——2023年一场长达两个月的罢工曾导致其交付中断。将这些文化不同的制造团队纳入空客的运营体系，本身就是一场管理挑战。此外，收购也意味着空客需要承担原本由Spirit承担的产能扩张投资——据分析师估计，将Spirit的产能与空客Rate 75目标对齐需要额外投入约2亿欧元。</p>\n<p>垂直整合的另一个维度是机翼制造。空客传统的&quot;A350机翼在英国制造、A320机翼在德国和西班牙制造&quot;格局正在发生变化。贝尔法斯特工厂是A220和A320机翼的重要供应商，将其收归内部后，空客获得了对机翼供应链的完全控制——但也承担了此前由供应商承担的英镑兑欧元汇率风险。</p>\n<p>分析师对这笔交易的评估分歧明显。正面的观点认为，在供应链危机频发的后疫情时代，垂直整合是&quot;不惜代价也要确保交付&quot;的必然选择。悲观的观点则指出，空客正在重蹈波音的覆辙——波音在2005年剥离Spirit就是出于&quot;轻资产&quot;的考虑，而空客此刻反向操作,本质上是在为行业的结构性问题买单。两种解读之间，答案需要未来两三年的运营数据来检验。</p>\n<p>更深层的问题是，垂直整合是否会拖累空客的资本效率。Spirit在被剥离前是波音的&quot;成本中心&quot;，被剥离后成为独立供应商反而经历了二十年效率提升。空客将这些资产收回后，能否保持同样的供应链效率？还是在庞大的组织架构中再次陷入官僚主义陷阱？这取决于空客将Spirit作为独立业务单元运营还是完全融入现有体系——而管理层的选择信号目前尚不明朗。</p>\n<h2 class=\"rh\">第四章 波音的反扑——双寡头格局在重写</h2>\n<p>2025年全年，波音交付了600架飞机，较2024年的348架几乎翻倍。 [<mark class=\"paraphrase\" data-hit=\"14\">14] Q1 2026更是交付143架，自2018年以来首次季度反超空客的114架。</mark>这个数字在全球商用航空双寡头格局中意义重大：空客与波音在2000年代基本平分了全球大型客机市场，2019至2022年波音因737 MAX危机陷入深度困境，空客在此期间大幅领先。现在天平正在回摆。</p>\n<p><mark class=\"paraphrase\" data-hit=\"15\">波音在2025年的净订单达到1173架，同样超过了空客的889架。 [</mark>14] 订单层面的反转意味着市场信心的转变——航空公司在经历了MAX危机后对波音的谨慎态度正在消退，部分航司甚至开始把波音的订单作为与空客谈判的筹码。</p>\n<p>空客的A321XLR（超长航程窄体机）在2024年获得认证后，一度被认为是空客压过波音737 MAX10的王牌。A321XLR航程达到8700公里，可以执飞从伦敦到开普敦的航线，使单通道飞机首次实现了此前只有宽体机才能做到的跨洋航程。但波音737 MAX10在2025年也加速了认证进程,再加上波音777X宽体机在2026年的试飞进展，波音的产品线正在全面恢复竞争力。</p>\n<p>当然，波音的反扑并非没有隐忧。其737 MAX生产线在2025年多次因质量问题接受FAA审查；787梦想客机的交付节奏也不稳定。2025年1月，一架阿拉斯加航空的737 MAX 9在飞行中发生舱门面板脱落事故（门塞事件），导致FAA对波音生产质量实施了更严格的管控——包括限制737 MAX月产量不得超过38架，并指派独立审计团队进驻波音工厂。这意味着波音在产能爬坡上同样面临自己的天花板。</p>\n<p>但从趋势上看，双寡头正在重新趋近于平衡。波音在2025年净赢得1173架订单，超过空客的889架，这背后既有空客交付疲软的推波助澜，也有波音产品线——尤其是777X和737 MAX10——在获得认证后对客户的吸引力回升。而空客在2026年的交付落后，很可能是这场格局重写的标志性拐点。双寡头之间的力量平衡一旦发生偏移，航司在谈判中的话语权就会发生变化——这可能导致定价压力、折扣扩大，最终传导到利润率上。</p>\n<h2 class=\"rh\">第五章 中国赌局——市场领导者的防御战</h2>\n<p>中国是空客在海外最大的单一市场。<mark class=\"paraphrase\" data-hit=\"16\">截至2025年底，中国在役的空客飞机超过2200架，市场份额约为55%。 [</mark>15] 这意味着中国每两架民航机中至少有一架是空客制造的。2025年，空客向中国交付了约140架飞机，占其全球交付量的约18%。中国航司的空客订单积压约为700架，占全球积压的8%。</p>\n<p>空客在中国的布局远不止于销售飞机。天津的A320总装线（FAL）于2008年投产，<mark class=\"paraphrase\" data-hit=\"17\">2026年初第二条天津总装线正式投产，</mark>使天津成为中国唯一同时组装A320系列和A330系列飞机的海外基地。 [16] 空客在中国还有超过200家供应商，2025年从中国的采购额超过20亿美元。</p>\n<p>但这座金矿正面临前所未有的挑战。中国商飞（COMAC）的C919窄体客机——直接对标A320neo和波音737 MAX——到2025年底已获得超过1500架订单确认或意向。 [17] 虽然实际交付只有16架，且C919目前仍依赖CFM LEAP-1C发动机（LEAP系列的中国版本），<mark class=\"paraphrase\" data-hit=\"18\">但国产CJ-1000A发动机预计在2026年下半年将首次装机试飞。</mark>一旦商用，C919对进口发动机的依赖将大幅降低。</p>\n<p>更令空客不安的是C919的国际化进程。C919已向欧洲航空安全局（EASA）提交型号认证申请，若在2027-2028年左右获得EASA认证，将意味着C919可以进入欧洲和东南亚市场。届时全球窄体机市场的定价体系可能被重塑——这是一个所有现有玩家都无法忽视的长尾威胁。2025年，<mark class=\"paraphrase\" data-hit=\"19\">中国航司一边签署了148架A320neo的采购协议，</mark>一边继续增加对C919的支持投入——这种&quot;双向押注&quot;策略让空客在中国的防御战变得更加棘手。</p>\n<p>地缘政治是另一个变量。2025年第二季度以来，中美之间的贸易摩擦再度升级——美国对部分中国商品加征关税，中国则对波音飞机采购施加了间接限制。这客观上为空客在中国创造了暂时的&quot;政策红利&quot;：中国航司增加对空客订单的确定性显著提升。但这种红利是双刃剑。如果2026年至2027年贸易战进一步向欧洲蔓延，空客可能面临来自美国的关税压力，特别是在其以美元计价的销售收入和以欧元计价的成本结构之间产生新的不平衡。</p>\n<p>更深层的战略问题是：空客在中国的成功有多少是竞争者缺位的结果？如果C919在5到10年内实现年产100架并在全球市场逐步推开，<mark class=\"paraphrase\" data-hit=\"20\">空客在中国55%的市场份额能守住的底线在哪里？</mark>空客的应对方案是加速本地化：天津第二总装线、在中国的研发中心扩容、以及与中国供应商的更深绑定——但这些都是防守动作而非进攻策略。</p>\n<h2 class=\"rh\">第六章 防务与航天的断臂求生——Project Bromo与太空野心</h2>\n<p><mark class=\"paraphrase\" data-hit=\"21\">空客的防务与航天部门（Airbus Defence and Space）在2024年削减了13亿欧元的太空业务资产减记，</mark>导致板块亏损6.56亿欧元——这是空客近年来最大的单次资产减值之一。 [18] 2025年该板块实现EBIT 6.39亿欧元，看似完美反转，但这个数字建立在极其低矮的基数之上。</p>\n<p>防务与航天在2025年实现营收134亿欧元，EBIT调整后为7.98亿欧元，利润率不到6%。 [18] 相比之下，商用飞机部门的利润率约为8%-9%，而直升机部门则超过12%。作为公司三大业务板块之一，防务与航天的资本回报远未达到合理水平。</p>\n<p>在这种情况下，空客主导推出了一项名为&quot;Project Bromo&quot;的重组计划。该计划被命名为印度尼西亚的一座火山，寓意着剧烈而潜在喷发式的变革。其核心方案是将空客防务与航天、泰雷兹阿莱尼亚航天（Thales Alenia Space）和莱昂纳多（Leonardo）的部分太空业务合并为一家新的欧洲合资航天巨头。 [19]</p>\n<p>Project Bromo拟议中的实体将拥有约25,000名员工、约65亿欧元年收入,股权结构为空客35%、泰雷兹32.5%、莱昂纳多32.5%。 [19] 这将是欧洲太空工业史上规模最大的整合行动。但德意志航空航天公司OHB已公开威胁提起法律挑战,称该合并&quot;将扰乱欧洲航天市场格局&quot;。 [20] 西班牙Indra公司也表示反对。反垄断审查可能将该交易推迟到2027年以后。</p>\n<p>整合的时间表也意味着，Project Bromo短期内对空客的每股收益几乎没有贡献。与此同时，空客在2025年宣布裁减防务与航天部门约3000个岗位，主要来自管理层和行政支持岗位——这被外界视为&quot;断臂求生&quot;的注脚。</p>\n<p>在太空赛道上，空客面临的竞争格局正在恶化。SpaceX的星链（Starlink）计划在2025年已发射超过6000颗卫星，其发射成本降至每公斤约1500美元——而欧洲阿丽亚娜6号火箭的每公斤发射成本仍在1万美元以上。空客在卫星制造领域的技术优势正在被数量级的成本差距所侵蚀。一网公司（OneWeb）已被英国政府和印度巴蒂集团收购,欧洲在低轨卫星通信领域正面临失去独立能力的风险。</p>\n<p>防务板块则呈现另一番景象。俄乌冲突持续三年后，欧洲各国防务预算大幅攀升，德国的1000亿欧元特别国防基金、波兰的GDP 4%国防支出目标，都在为空客的军用运输机A400M、欧洲战斗机（Eurofighter）等防务产品创造增量需求。空客2025年防务业务订单增长了约18%，很大程度上受益于欧洲&quot;重新武装&quot;的大趋势。但A400M项目自2010年代以来的成本超支和技术问题仍未完全解决，空客在该项目上累计计提的拨备已超过35亿欧元——这是一个长期未能愈合的伤口。</p>\n<h2 class=\"rh\">第七章 氢能梦想与现实——ZEROe的漫长征程</h2>\n<p>2020年，空客发布了ZEROe氢能飞机计划，目标是到2035年将零排放商用客机投入市场。 [21] 这款100座级、航程约1000海里（约1850公里）的概念飞机，使用液态氢燃料、通过氢燃料电池或氢燃烧发动机提供动力。它将主要覆盖支线航空和短程航线——像伦敦到巴黎、东京到札幌这样的航段。</p>\n<p>五年过去了,ZEROe的技术成熟度（Technology Readiness Level, TRL）仍停留在3——即&quot;关键功能已在实验室环境中验证&quot;，距离7级（&quot;系统原型在实际环境中验证&quot;或&quot;试飞&quot;）还有巨大差距。 [21] 2025年，空客确认已将首飞目标推迟到2028年，并承认在氢储存、低温燃料系统和机场氢燃料基础设施方面存在&quot;显著的技术障碍&quot;。</p>\n<p>最大的难题是氢气的物理性质。液氢需要储存在零下253摄氏度的温度下,其体积能量密度仅为航空煤油的约四分之一。意味着一架氢能飞机需要携带约四倍于传统燃料油箱的燃料储存空间——这对飞机设计、机身结构和乘客舱布局都是根本性的挑战。空客的解决方案之一是将液氢储罐从客舱后移至机翼内——但这个方案对现有机场的地面加油设备提出了一系列新要求。</p>\n<p>在行业层面，氢能航空的路线图还在剧烈演变。2025年底，赛峰集团（Safran）和液化空气集团（Air Liquide）等欧洲航空供应链巨头联合提交了一份氢能航空可行性报告，指出&quot;在没有大规模的机场基础设施投入和政府政策支持的前提下，2035年氢能商用飞机进入市场的可能性不高于30%&quot;。</p>\n<p>除了技术难题，经济可行性同样不容忽视。据国际清洁交通委员会（ICCT）的估算，氢燃料的制备和运输成本是目前航空煤油的2到4倍，且短期内看不到成本收敛的趋势——除非绿色电解氢的大规模生产在2030年代取得突破。换言之，即使ZEROe成功飞上天空，它的运营成本也可能比传统燃油飞机高出50%到100%。在这个价格水平上，有多少航空公司愿意为&quot;零排放&quot;的品牌溢价买单，是一个没有答案的问题。</p>\n<p>空客自身也意识到了时间窗口的紧迫性。2025年管理层公开调整了ZEROe的定位：从&quot;主要技术路线&quot;降级为&quot;战略性探索项目&quot;，同时将更多短期资源转向可持续航空燃料（SAF）的配套。SAF可以直接用于现有发动机，无需改变飞机设计和机场设施——虽然SAF目前的产能仅能满足全球约0.5%的航空燃料需求，但它的实现路径比氢能明确得多。这一调整的潜台词是：空客对氢能飞机的商业化时间表可能已经失去了最初的乐观。</p>\n<p>尽管如此，空客仍然是全球唯一一家在氢能商用飞机领域投入实质性研发资源的飞机制造商。波音在2022年基本搁置了其氢能研究计划，中国的C919研发路线图上也没有氢能选项——如果氢能航空最终成真，空客将拥有无可争议的先发优势。但如果这个赌注落空,ZEROe累计的数十亿欧元研发投入将面临归零风险。</p>\n<h2 class=\"rh\">第八章 财务透视——创纪录利润下的现金失血</h2>\n<p>2025年全年，空客交出了一份表面光鲜的成绩单：营业收入734亿欧元，同比增长约11%；<mark class=\"partial\" data-hit=\"11\">EBIT调整后71亿欧元，</mark>同比大涨约48%；<mark class=\"direct\" data-hit=\"6\">净利润52亿欧元；自由现金流46亿欧元。 [</mark>4] 这些数字的核心驱动力来自商用飞机交付量的增长（793架 vs 766架）和有利的对冲汇率环境——空客以美元计价销售、以欧元成本生产，2025年适用的对冲比率大幅改善了利润端。</p>\n<p>但这份光鲜的财报在2026年Q1被击穿。第一季度营收仅127亿欧元，EBIT调整后骤降至3亿欧元，自由现金流更是录得负25亿欧元。 [2] 从46亿到负25亿——这个反转不完全是经营利润的崩溃，更是营运资金的剧烈变化。大量完工的A320neo机身因缺少发动机无法交付，堆放在图卢兹和汉堡的停机坪上，占用了巨额营运资金。据摩根士丹利估算，仅2026年Q1空客的存货比去年同期增加了约22亿欧元。 [22]</p>\n<p>空客在2026年Q1财报中重申了全年交付870架的目标，但附带了关键条件：&quot;假设全年无额外重大干扰&quot;。考虑到2026年可能升级的中美贸易战、普惠诉讼的不确定性、以及Spirit收购后的整合阵痛，这个假设并不稳固。</p>\n<p>从更长远的结构性视角看，空客的盈利质量值得审视。2025年的EBIT调整后利润率为9.7%、但其中有至少2-3个百分点来自有利的汇率对冲——当这些对冲合约在2026-2027年陆续到期后，利润率将面临自然压缩。同时，研发费用在2025年有所下降，部分原因是某些项目的资本化处理——如果空客需要在ZEROe和新一代单通道飞机（&quot;Next Gen Single Aisle&quot;）上加大投入，研发费用将重回上升通道。</p>\n<p>空客当前市值约1380亿欧元,PE约28倍。 [3] 对于一个面临多重结构性挑战的周期性制造企业来说，这个估值不便宜——尤其考虑到Q1 FCF的突然恶化。<mark class=\"paraphrase\" data-hit=\"22\">市场已经在定价这些风险：股价从2025年7月的221欧元高点跌至2026年7月的约175欧元，</mark>下跌约20%。</p>\n<p>从股息看，空客2025财年拟派股息每股2.00欧元，较2024年的1.80欧元有所增长，但股息支付率（Payout Ratio）仅为约33%——公司选择将更多现金用于回购和<mark class=\"direct\" data-hit=\"7\">收购（Spirit AeroSystems）。</mark>管理层释放的信号是&quot;我们相信长期增长&quot;——但对投资者而言，等待的过程充满了不确定性。</p>\n<p>资产负债表方面也存在隐忧。空客2025年底的净现金头寸约为75亿欧元，较2024年的95亿欧元有所下降，主要是因为Spirit收购和库存积压占用了现金。公司总债务约190亿欧元，总债务与EBITDA之比约为2.5倍——对于一家周期性制造企业而言尚在可控范围，但方向值得关注。更值得警惕的是客户预付款（Customer Advances）的大幅增长——2025年底达约310亿欧元，较2024年增长约40亿欧元。预付款的增长意味着客户仍在为未来的交付买单，但如果交付持续延迟，这笔巨额预付款中有一部分可能面临退款或重新谈判的压力。</p>\n<p>关于2026年的业绩指引，空客管理层在上半年财报电话会议中强调，全年870架交付目标的实现取决于三个关键条件：普惠发动机修复计划的推进速度、Spirit整合的节奏、以及全球贸易环境的稳定。三个条件中没有任何一个完全在空客的控制范围之内。一位不愿具名的欧洲航空分析师在电话会议后的报告中写道：&quot;2026年更像是空客的&#x27;管理期望之年&#x27;——把目标设在870架，但所有人都明白最终数字很可能在810到830架之间。&quot;如果最终交付落在810至830架的区间，意味着全年EBIT可能在此前管理层预期的65亿至75亿欧元的底部甚至更低位置。</p>\n<h2 class=\"rh\">尾声：以十年为尺度</h2>\n<p>2016年7月，空客在图卢兹举行了首届A320neo交付仪式。马来西亚亚洲航空（AirAsia）接收了全球第一架装配普惠GTF发动机的A320neo，现场掌声雷动。时任空客商用飞机总裁的法布里斯·布雷吉耶（Fabrice Brégier）说了一句后来被广泛引用的话：&quot;这不是一次升级，这是一次革命。&quot;</p>\n<p>十年后的2026年，同一款发动机正在让这家公司坐在了原告席上。那场革命留下的技术遗产——齿轮箱、高压涡轮、燃烧室密封件——每一项都曾是工程奇迹，每一项也都在成为产能的瓶颈。</p>\n<p>回到开篇的问题：当一家公司拿到了几乎整个行业的订单，却连按时交付都做不到——问题到底出在哪里？</p>\n<p>答案不是单一的。普惠发动机困局暴露了双源供应策略的失效；<mark class=\"direct\" data-hit=\"8\">Spirit AeroSystems</mark>收购揭示了供应链垂直整合的艰难；波音的反扑证明双寡头格局远未成型；中国C919的崛起让空客最大的市场面临结构性重新定价；财务数据显示盈利质量存在汇率和营运资金的双重脆弱性。</p>\n<p>空客的处境用一句话概括或许最准确：它不是不擅长造飞机，而是太擅长接订单了。当全球航空运输量在2025年首次突破50亿人次、以年均3.5%的速度持续增长时，空客在需求侧拿到了有史以来最好的成绩单。但供给侧——发动机、机身、机翼、工会、合规、认证——每一条都绷到了极限。</p>\n<p>这家欧洲工业巨头正在打一场它从未经历过的战争：敌人不是对手，是自己的供应链；战场不是市场份额，是交付坪上的停机数量；裁判不是评级机构，是时间本身。胜负的判官就在未来两三年之内——如果Rate 75在2027年底如期实现、GTF修复计划顺利推进、天津第二总装线满产运转——那今天的阵痛便是成长的代价。如果任何一环继续延误，积压的8754架订单将从&quot;行业纪录&quot;变成&quot;历史包袱&quot;。</p>\n<p>空客的大本营位于法国西南部图卢兹的圣马丁机场。在它最著名的A320总装线厂房外墙上，印着一句法语标语：&quot;Le ciel n&#x27;a pas de limite&quot;——天空没有极限。但对于一家手握近万架订单却无法按时交付的公司来说，最大的极限，恰恰是地面上的发动机。</p>", "hits": [{"type": "direct", "src": "2026-07-24_空客/原始资料/评估团/评估团_市场视角.md", "core": "净利润52亿欧元自由现金流46", "art": "一家手握近9000架订单的公司，营收创下734亿欧元的纪录，净利润52亿欧元，自由现金流46亿欧元——却同时在承受交付减速、现金流逆转和股价下跌的三重压力。 [", "srcc": "录业绩EBIT调整后71亿欧元净利润52亿欧元自由现金流46亿欧元8754架积压订单提供未来多年收入可见性市场", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-24_空客/原始资料/评估团/评估团_争议视角.md", "core": "Rate75目标从2025年推", "art": "这场危机的后果是连锁性的。2026年Q1空客交付量同比骤降16%，最核心的原因就是发动机供应不足。Rate 75目标从2025年推迟到2026年末，再推迟到20", "srcc": "应链问题但问题看起来不像暂时的Rate75目标从2025年推迟到2027年3A320机身蒙皮质量事件2025年", "sim": 1.0, "len": 20}, {"type": "direct", "src": "2026-07-24_空客/原始资料/评估团/评估团_争议视角.md", "core": "SpiritAeroSyste", "art": "第三章 Spirit AeroSystems收购——垂直整合的代价与收益", "srcc": "暴露了供应链质量管理的问题收购SpiritAeroSystems正是为了解决这类问题但收购本身也带来了整合风险", "sim": 1.0, "len": 17}, {"type": "direct", "src": "2026-07-24_空客/原始资料/评估团/评估团_争议视角.md", "core": "SpiritAeroSyste", "art": "2025年12月，空客正式完成了对Spirit AeroSystems部分资产的收购——这笔交易是空客近年来最大胆的垂直整合行动。 [12] Spirit Ae", "srcc": "暴露了供应链质量管理的问题收购SpiritAeroSystems正是为了解决这类问题但收购本身也带来了整合风险", "sim": 1.0, "len": 17}, {"type": "direct", "src": "2026-07-24_空客/ function shortName(a){ return a.replace(/^\d+-\d+-\d+_/, ''); }
function esc(s){ return (s||'').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderList(){
  const q=(document.getElementById('q').value||'').trim();
  const box=document.getElementById('list'); box.innerHTML='';
  TEXT.filter(d=>!q||d.company.indexOf(q)>=0||d.title.indexOf(q)>=0).forEach(d=>{
    const el=document.createElement('div'); el.className='item'; el.dataset.k=d.key;
    const col=rateColor(d.rate);
    let sub='来源重复 '+d.rate+'% · 抄自 '+d.n_src+' 份来源';
    let nos='';
    if(d.nosource){ sub='未存档原始资料，无法做来源判定'; nos='<div class="nosrc">⚠ 无对照原始资料</div>'; }
    el.innerHTML='<div class="item-top"><div class="item-title">'+esc(shortName(d.key))+'</div>'
      +'<div class="rate-badge" style="color:'+col+'">'+d.rate+'%</div></div>'
      +'<div class="rate-sub">'+esc(sub)+'</div>'+nos;
    el.onclick=function(){ document.querySelectorAll('#list .item').forEach(x=>x.classList.remove('active')); el.classList.add('active'); selectText(d.key); };
    box.appendChild(el);
  });
}
function selectText(key){
  const d=TEXT.find(x=>x.key===key); if(!d) return;
  const c=document.getElementById('content');
  const chips='<div class="chips">'
    +'<span class="chip c-tot">综合 <b>'+d.rate+'%</b></span>'
    +'<span class="chip c-direct">直接复制 <b>'+d.rate_direct+'%</b></span>'
    +'<span class="chip c-partial">部分引用 <b>'+d.rate_partial+'%</b></span>'
    +'<span class="chip c-para">改写/观点相似 <b>'+d.rate_paraphrase+'%</b></span>'
    +'<span class="chip">来源文件 <b>'+d.n_src+'</b> 份</span></div>';
  c.innerHTML='<div class="c-head"><h1 class="c-title">'+esc(d.title)+'</h1>'
    +'<div class="c-meta">'+esc(d.key)+' · 比对对象：本篇「原始资料/」下的外部源文件（网页快照/招股书/研报/舆情）</div>'+chips+'</div>'
    + (d.nosource?'<div class="warn">⚠ 本篇未存档「原始资料/」，无法做来源抄袭判定。若当时撰写参考了外部文件，请回补存档后重测。</div>':'')
    + d.body_html;
  c.scrollTop=0;
  renderRight(d);
  // 高亮点击 -> 右侧命中
  c.querySelectorAll('mark[data-hit]').forEach(m=>{
    m.addEventListener('click',()=>{
      const id='hit-'+d.key+'-'+m.getAttribute('data-hit');
      const t=document.getElementById(id);
      if(t){ t.scrollIntoView({block:'center'}); t.classList.add('flash'); setTimeout(()=>t.classList.remove('flash'),1200); }
    });
  });
}
function renderRight(d){
  const box=document.getElementById('rbody');
  if(d.nosource){ box.innerHTML='<div class="warn">本篇无对照原始资料，未做来源抄袭判定。</div>'; return; }
  if(!d.hits.length){ box.innerHTML='<div class="src-sum">本篇来源重复率 '+d.rate+'%，未在正文中定位到与原始资料的逐字/改写重合片段（主要为原创转述）。</div>'; return; }
  // 按来源文件分组
  const groups={};
  d.hits.forEach((h,idx)=>{ const s=h.src||'（未定位来源）'; (groups[s]=groups[s]||[]).push([idx,h]); });
  let h='<div class="src-sum"><b>来源重复率 '+d.rate+'%</b>（直接 '+d.rate_direct+'% / 部分 '+d.rate_partial+'% / 改写 '+d.rate_paraphrase+'%）。'
    +' 下方按来源文件分组，共 '+d.hits.length+' 处命中，抄自 '+Object.keys(groups).length+' 份来源文件。</div>';
  h+='<div class="src-sec">逐条命中（按来源文件分组）</div>';
  for(const s of Object.keys(groups)){
    const arr=groups[s];
    const chars=arr.reduce((a,x)=>a+x[1].len,0);
    h+='<div class="src-group"><div class="src-name">📄 '+esc(s)+'</div>'
      +'<div class="src-meta">'+arr.length+' 处 · 约 '+chars+' 字重合</div>';
    arr.forEach(([idx,h])=>{
      const tl=h.type==='direct'?'直接复制':(h.type==='partial'?'部分引用':'改写/观点相似');
      const sim=h.sim?(' 相似 '+Math.round(h.sim*100)+'%'):'';
      h+='<div class="hit" id="hit-'+d.key+'-'+idx+'">'
        +'<span class="ht '+h.type+'">'+tl+sim+'</span>'
        +'<div class="h-art"><b>文章：</b>'+esc(h.art)+'</div>'
        + (h.srcc?'<div class="h-src"><b>来源：</b>'+esc(h.srcc)+'</div>':'')
        +'</div>';
    });
    h+='</div>';
  }
  h+='<div class="r-legend">红=与来源≥15字连续一致（直接复制）；黄=与来源≥12字核心命中（部分引用）；蓝=句级语义近重复（同义替换/改写）。点击正文高亮可定位到此处；点击此处可回到正文。</div>';
  box.innerHTML=h;
  // 命中点击 -> 正文高亮
  box.querySelectorAll('.hit').forEach(t=>{
    t.addEventListener('click',()=>{
      const id=t.id.replace('hit-'+d.key+'-','');
      const m=document.querySelector('#content mark[data-hit="'+id+'"]');
      if(m){ m.scrollIntoView({block:'center'}); m.style.outline='2px solid var(--maroon)'; setTimeout(()=>m.style.outline='',1200); }
    });
  });
}
document.getElementById('q').addEventListener('input', renderList);
renderList();
if(TEXT[0]){ const first=document.querySelector('#list .item'); if(first){ first.classList.add('active'); selectText(TEXT[0].key); } }

</script>

const $ = s => document.querySelector(s);

function shortName(a){ return a.replace(/^\d+-\d+_/, ''); }
function renderVpList(){

}
