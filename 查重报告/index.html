始资料/研报数据/研报_乘联会_2024年12月大型SUV.md", "2026-07-21_宝马/原始资料/研报数据/研报_宝马_供应链宁德亿纬.md", "2026-07-21_宝马/原始资料/舆情网页/舆情_Automobilwoche_新世代软件延迟.md", "2026-07-21_宝马/原始资料/舆情网页/舆情_Reuters_利润预警刹停.md", "2026-07-21_宝马/原始资料/舆情网页/舆情_Reuters_齐普策批评欧盟关税.md", "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_CES2025_Panoramic_iDrive.md", "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_利润预警召回.md", "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_德布勒森iX3投产.md", "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_收购华晨25股权.md", "2026-07-21_宝马/原始资料/监管/监管_欧盟委员会_对华电动汽车反补贴关税终裁.md"], "src_hits": {"2026-07-21_宝马/原始资料/舆情网页/舆情_Reuters_利润预警刹停.md": 1, "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_利润预警召回.md": 2, "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_CES2025_Panoramic_iDrive.md": 2, "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_收购华晨25股权.md": 1}, "body_html": "<h1 class=\"rh\">宝马：百年驾驶乐趣，与它踩不稳的电门</h1>\n<p>一家造了百年汽车的公司，2025 年营收超过 1,400 亿欧元——却在中国被本土品牌蚕食份额、电动车毛利率为负、新世代平台千亿投入未见回报、一道制动系统召回就让全年利润预警。当&quot;驾驶乐趣&quot;这个百年承诺撞上电动化与软件化的新赛道，它踩电门的那只脚，还不太稳。</p>\n<h2 class=\"rh\">01 一条制动系统，让百年宝马发了利润预警</h2>\n<p>2024 年 9 月，宝马集团紧急发布了一则利润预警。消息一出，股价当日跌逾 7%，市值蒸发数十亿欧元。</p>\n<p>事端起于一道看似不起眼的零部件——德国<mark class=\"direct\" data-hit=\"0\">大陆集团（Continental）</mark>供应的整合式制动系统（IB2）。该系统存在潜在故障，极端情况下可能导致制动助力失效。宝马不得不暂停约 150 万辆车的交付，涉及从 1 系到 X7 的几乎所有主力车型 [1] 。</p>\n<p>一条制动系统，何以扯动全球最赚钱的豪华车品牌的全年利润？</p>\n<p>三季度交付停摆造成的直接损失尚在其次，真正致命的是信心的连锁反应——经销商库存积压、终端折扣放大、经年累月建立的可靠性口碑出现裂纹 [2] 。<mark class=\"paraphrase\" data-hit=\"4\">宝马被迫将 </mark><mark class=\"direct\" data-hit=\"4\">2024 年汽车业务 EBIT 利润率</mark><mark class=\"paraphrase\" data-hit=\"4\">预期从 8–10% 下调至 6–7%，</mark>全年净利润从 2023 年的 122 亿欧元骤降至约 77 亿欧元 [3] 。</p>\n<p>对于一家年销超过 245 万辆、营收超过 1,400 亿欧元的全球巨头，这个数字本身不算灾难——但&quot;预警&quot;这两个字，比数字本身更刺眼。</p>\n<h2 class=\"rh\">02 1,400 亿欧元的营收，与消失的利润</h2>\n<p>利润预警并非孤例。把时间轴拉长，宝马的盈利能力在 2020 年之后经历了一个清晰的&quot;抛物线&quot;。</p>\n<p>2023 年，宝马集团营收达到创纪录的 1,555 亿欧元，净利润 122 亿欧元，净利率接近 8% [4] 。但在华晨宝马股权并表（2022 年宝马将华晨宝马持股从 50% 增至 75%）的一次性收益消退后，2024 年的数字开始走样——营收下降至约 1,423 亿欧元，净利润骤缩至 77 亿欧元，跌幅超过 37% [3] 。</p>\n<p>2025 年，宝马的营收出现小幅回升，预计在 1,470 亿欧元左右，但净利润依然承压，新世代平台的研发折旧与价格战压缩了利润空间 [5] 。</p>\n<p>利润压缩的根源并不复杂。电动化转型需要巨量研发投入——宝马的研发费用从 2020 年的 50 亿欧元攀升至 2024 年的约 65 亿欧元 [6] 。与此同时，电动车项目本身的毛利率远低于燃油车，部分车型甚至在亏本卖。</p>\n<p>在中国市场，宝马 i3 的终端成交价一度低至 20 万元人民币出头——不到官方指导价的六折 [7] 。一辆以&quot;驾驶乐趣&quot;为卖点的豪华品牌，在中国被迫以近乎&quot;打折甩卖&quot;的方式卖电动车，这对百年品牌而言，比利润预警更刺痛。</p>\n<h2 class=\"rh\">03 中国，它最大的市场和最硬的骨头</h2>\n<p>2024 年，宝马在中国交付了约 71.5 万辆汽车（含 MINI），同比下降约 13.5% [8] 。这是宝马自 2003 年进入中国以来最严重的市场份额下滑之一。</p>\n<p>中国是宝马全球最大的单一市场，贡献了约三分之一的总销量和可观比例的利润——尤其是华晨宝马合资公司的利润份额。2022 年，<mark class=\"paraphrase\" data-hit=\"5\">宝马以 279 亿元人民币收购华晨宝马 25% 股权，</mark>将持股比例提升至 75%，从此中国利润的&quot;大头&quot;直接并表 [9] 。</p>\n<p>但同步发生了什么？中国本土品牌的新能源汽车，正在以惊人的速度侵蚀豪华车市场。</p>\n<p>蔚来 ET7/ET5 直接对标宝马 5 系和 3 系，理想 L7/L8/L9 切入宝马 X5 的细分市场，华为合作的问界 M9 在 50 万元以上 SUV 市场月销过万——而宝马 X5（国产版）2024 年月均销量大约 7,000 辆 [10] 。2025 年，比亚迪的仰望 U8、蔚来的旗舰 ET9 继续向上挤压，价格战从 20 万一路打到 50 万。</p>\n<p>宝马的应对是降价——i3 终端的 20 万级、iX3 的 30 万级折扣，短期内保住了销量数字，但毛利率承受巨大压力。</p>\n<p>更深层的隐忧在于：中国消费者对&quot;豪华&quot;的定义正在改变。过去，宝马的蓝天白云标就是身份象征；今天，越来越多的中国消费者认为一辆问界 M9 或蔚来 ET7 比同价位的宝马&quot;更智能&quot;&quot;更豪华&quot;&quot;更有面子&quot; [11] 。当&quot;驾驶乐趣&quot;不再是唯一标准，宝马的核心竞争力在中国市场被重新定义。</p>\n<h2 class=\"rh\">04 新世代，一次千亿欧元的赌注</h2>\n<p>宝马的答案叫&quot;新世代&quot;（Neue Klasse）。</p>\n<p>这不是一个营销概念，而是一个几乎&quot;梭哈&quot;式的产品战略——从 2025 年起，宝马将逐步用全新的 Neue Klasse 平台替换所有现有电动车平台，覆盖从紧凑型到大型豪华车的全产品线。首款车型——全新 iX3（SUV）——于 2025 年底在匈牙利德布勒森工厂投产 [12] 。</p>\n<p>Neue Klasse 的技术亮点不少：800V 高压架构、第六代电驱系统、30% 更快的充电速度、20% 以上的续航提升、全新&quot;全景视域&quot;（<mark class=\"direct\" data-hit=\"2\">Panoramic iDrive）</mark>交互系统、以及一个名为&quot;Heart of Joy&quot;（喜悦之心）的集成式电控单元——它把驱动、制动、转向、能量回收全部整合在一片芯片上 [13] 。</p>\n<p>但代价同样巨大。宝马在德布勒森工厂投入超过 20 亿欧元，慕尼黑总部的 Neue Klasse 测试中心投入约 8 亿欧元，加上全球产线改造与新平台研发，整体投入预计超过 100 亿欧元 [14] 。</p>\n<p>这个时间表意味着什么？到 2027 年，Neue Klasse 才会覆盖 3 系和 5 系——宝马的最核心销量来源。在这之前，宝马的电动车依然靠旧平台（CLAR 平台的油改电）与对手竞争。而中国的蔚来、理想、问界，早在 2023–2024 年就已经完成了&quot;纯电平台 + 智能座舱 + 高阶辅助驾驶&quot;的三件套标配。</p>\n<p>千亿欧元赌的是 2028 年之后的战场。但战场不会等到 2028 年。</p>\n<h2 class=\"rh\">05 终极驾驶机器的软件短板</h2>\n<p>如果硬件是宝马的看家本领，软件就是它的阿喀琉斯之踵。</p>\n<p>2023 年，宝马推出 iDrive 9 操作系统，但仅适用于基于 MHC（多控制器）平台的车型；而基于 MGU（媒体图形单元）的车型只能用 iDrive 8.5。两种&quot;互不兼容&quot;的操作系统同时存在，让车主和经销商都感到困惑 [15] 。</p>\n<p>更深层的问题在于组织架构。传统车企的组织溶解是按&quot;硬件&quot;划分的——底盘、发动机、变速箱、车身。在软件定义汽车的时代，这种组织无法支撑跨功能域的软件迭代。宝马的&quot;新世代&quot;软件架构多次传出延期， <mark class=\"direct\" data-hit=\"3\">Panoramic iDrive </mark>的量产版本比原计划迟了半年才亮相 [16] 。</p>\n<p>&quot;Heart of Joy&quot;电控单元是宝马在软件领域的一次重要押注——它把原本分散在 5–6 个独立控制器中的功能集中到一个芯片。但&quot;集中&quot;恰恰是汽车行业最难的软件工程问题之一：把端到端延迟控制在毫秒级、保证功能安全等级、同时还要支持 OTA 远程升级 [17] 。</p>\n<p>与特斯拉、蔚来这些&quot;软件原生&quot;的对手相比，宝马的 OTA 更新频率和功能迭代速度差距明显。特斯拉一年推送数十次 OTA，蔚来一年约 10 次大版本更新，而宝马的 iDrive 大版本更新周期大约 2–3 年 [18] 。</p>\n<p>当&quot;驾驶乐趣&quot;的体验越来越多地取决于算力、算法、OTA 频率，而非发动机的轰鸣声，一家造了 100 年发动机的公司，需要重新学习什么是&quot;快乐&quot;。</p>\n<h2 class=\"rh\">06 关税、供应链、与一道跨不过的坎</h2>\n<p>2024 年 10 月，欧盟对中国产电动汽车加征最高 38% 的反补贴关税。宝马的 iX3（在华晨宝马沈阳工厂生产，整车出口欧洲）首当其冲 [19] 。</p>\n<p>讽刺的是，宝马是欧盟关税政策的&quot;受害者&quot;——它在中国生产、出口欧洲，却因为自己是中国制造的股东而挨了欧洲的关税。CEO 齐普策（Oliver Zipse）多次公开批评欧盟关税，称其为&quot;破坏全球贸易的倒退&quot; [20] 。</p>\n<p>关税只是一个缩影。宝马的供应链在地缘政治博弈中越来越被动：中国是它最大的市场和最大的生产基地（沈阳工厂年产超过 60 万辆），欧洲是它的&quot;老家&quot;，美国是利润来源之一——三个区域之间的贸易摩擦，宝马没有&quot;赢家&quot;选项。</p>\n<p>NEUE KLASSE 的电池来自中国的宁德时代和亿纬锂能，部分电驱系统来自中国供应商。即使平台是在欧洲研发、在匈牙利生产，供应链的&quot;中国依赖度&quot;并未降低 [21] 。</p>\n<p>三条供应链、三个不同的关税体系、三个正在升级的贸易摩擦——宝马不是唯一夹在中间的传统车企，但它的&quot;中国+欧洲+A&quot;三重依赖度，让它在地缘政治棋盘上几乎没有安全落子。</p>\n<h2 class=\"rh\">07 尾声：踩不稳的电门，与下一个百年</h2>\n<p>2016 年，宝马在慕尼黑奥林匹克大厅庆祝百年诞辰。CEO 哈拉尔德·克鲁格（Harald Krüger）在舞台上说：&quot;下一个 100 年，从今天开始。&quot;</p>\n<p>十年过去，2026 年夏天的宝马，正站在一个比十年前更陡峭的弯道上。Neue Klasse 的 iX3 已经开始交付，但它的销售占比还不到 3%；软件团队在拼命追赶 OTA 能力；中国市场的价格战丝毫不见缓和；关税的阴影笼罩着横跨欧亚大陆的供应链。</p>\n<p>宝马仍然是全球最赚钱的豪华车品牌之一——2025 年超过 1,400 亿欧元的营收和数十亿欧元的利润，仍然是大多数汽车公司望尘莫及的数字。但问题的核心不在于&quot;有没有利润&quot;，而在于&quot;利润从哪来、还能持续多久&quot;。</p>\n<p>当电动车的毛利率为负、当中国市场的增速被本土品牌接管、当软件迭代的速度被对标特斯拉——&quot;驾驶乐趣&quot;这个百年承诺，正在被重新定义。</p>\n<p>宝马的百年，建立在&quot;开得好&quot;三个字上。下一个百年，它需要学会&quot;开得智能&quot;——而这脚电门，它目前还踩不太稳。</p>", "hits": [{"type": "direct", "src": "2026-07-21_宝马/原始资料/舆情网页/舆情_Reuters_利润预警刹停.md", "core": "大陆集团Continental", "art": "事端起于一道看似不起眼的零部件——德国大陆集团（Continental）供应的整合式制动系统（IB2）。该系统存在潜在故障，极端情况下可能导致制动助力失效。宝马", "srcc": "关键中国市场中国需求疲弱以及由大陆集团Continental提供的制动系统出现问题令该股跌至近两年来低点宝马与", "sim": 1.0, "len": 15}, {"type": "direct", "src": "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_利润预警召回.md", "core": "2024年汽车业务EBIT利润", "art": "三季度交付停摆造成的直接损失尚在其次，真正致命的是信心的连锁反应——经销商库存积压、终端折扣放大、经年累月建立的可靠性口碑出现裂纹 [2] 。宝马被迫将 202", "srcc": "计较上一年略有下降此前略有增加2024年汽车业务EBIT利润率指引降至67此前810已动用资本回报率RoCE降", "sim": 1.0, "len": 16}, {"type": "direct", "src": "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_CES2025_Panoramic_iDrive.md", "core": "PanoramiciDrive", "art": "Neue Klasse 的技术亮点不少：800V 高压架构、第六代电驱系统、30% 更快的充电速度、20% 以上的续航提升、全新\"全景视域\"（Panoramic", "srcc": "260725原标题NewBMWPanoramiciDriverevolutionisesvehicleoper", "sim": 1.0, "len": 15}, {"type": "direct", "src": "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_CES2025_Panoramic_iDrive.md", "core": "PanoramiciDrive", "art": "更深层的问题在于组织架构。传统车企的组织溶解是按\"硬件\"划分的——底盘、发动机、变速箱、车身。在软件定义汽车的时代，这种组织无法支撑跨功能域的软件迭代。宝马的\"", "srcc": "260725原标题NewBMWPanoramiciDriverevolutionisesvehicleoper", "sim": 1.0, "len": 15}, {"type": "paraphrase", "src": "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_利润预警召回.md", "core": " - 2024年汽车业务 EBIT 利润率指引降至 6%–7%（此前 8%–10", "art": "宝马被迫将 2024 年汽车业务 EBIT 利润率预期从 8–10% 下调至 6–7%，", "srcc": " - 2024年汽车业务 EBIT 利润率指引降至 6%–7%（此前 8%–10%）。", "sim": 0.675, "len": 32}, {"type": "paraphrase", "src": "2026-07-21_宝马/原始资料/舆情网页/舆情_宝马_收购华晨25股权.md", "core": "-- 类型: 舆情 --> # 宝马集团2022年2月公告：收购华晨宝马25%股", "art": "宝马以 279 亿元人民币收购华晨宝马 25% 股权，", "srcc": "-- 类型: 舆情 --&gt; # 宝马集团2022年2月公告：收购华晨宝马25%股权，", "sim": 0.59, "len": 21}]}, {"key": "2026-07-21_智谱", "title": "智谱：学霸下海，与一门它还在学的生意", "company": "智谱", "date": "2026-07-21", "n_src": 1, "nosource": false, "rate": 0.3, "rate_direct": 0.0, "rate_partial": 0.0, "rate_paraphrase": 0.3, "src_files": ["2026-07-21_智谱/原始资料/数据溯源说明.md"], "src_hits": {"2026-07-21_智谱/原始资料/数据溯源说明.md": 1}, "body_html": "<h1 class=\"rh\">智谱：学霸下海，与一门它还在学的生意</h1>\n<p>一家从清华实验室跑出来的AI公司，2025年营收7.24亿元、却亏掉47.18亿元；当它带着&quot;全球大模型第一股&quot;的标签登陆港股，学者与商人两种身份，第一次被放在同一份财报里称量。学霸造出了能对标OpenAI的模型，却还没学会写一份赚钱的财报。</p>\n<p>2026年1月8日，港交所敲钟。北京智谱华章科技股份有限公司以&quot;02513&quot;为代码挂牌，发行价116.2港元，首日收盘涨13.17%、市值约579亿港元，被市场称为&quot;全球大模型第一股&quot;。 [2] 同一份招股书里还写着另一组数字：2024年收入3.12亿元，年内亏损29.58亿元；2025年全年收入7.24亿元，亏损扩大到47.18亿元。 [1] [3]</p>\n<p>一边是营收三年翻了十倍，一边是亏损同步放大到十几倍。一家从清华大学计算机系知识工程实验室（KEG）走出来的公司，正站在它最陌生的考场上——怎么把&quot;做出最强模型&quot;的能力，翻译成&quot;做成一门赚钱的生意&quot;。</p>\n<p>智谱的故事，是一个典型的中国式张力：学术声望拉满、估值高企，但商业化这道关，它还没真正迈过去。这道题，要从清华园里那间实验室讲起。</p>\n<h2 class=\"rh\">第一章 清华的学霸：从实验室走到资本战场</h2>\n<p>2019年6月，北京清华园。清华大学计算机系知识工程实验室（KEG）一项技术成果转化，把孵化自内部的科技情报平台 AMiner 单独拆分——一家名为&quot;智谱&quot;的公司正式成立。 [1]</p>\n<p>核心团队几乎全是清华人：CEO张鹏毕业于清华计算机系，董事长刘德兵曾任清华数据科学研究院科技大数据研究中心副主任，总裁王绍兰为清华创新领军博士，首席科学家唐杰是清华计算机系教授、AMiner的建立者。 [1] [4] 这是一家从第一天起就贴着&quot;学院派&quot;标签的公司——学术根基深厚，天花板也写在这张名片上。</p>\n<h3 class=\"rh\">知识工程实验室出走</h3>\n<p>KEG实验室在清华内部已有近二十年的知识图谱与自然语言处理积累。AMiner作为一个学术情报平台，最早只是服务科研群体的工具；但当2019年国内AI创业潮涌起，清华决定把它从实验室&quot;放出来&quot;独立运营。 [1]</p>\n<p>这不是一个简单的&quot;教授创业&quot;故事。智谱从一开始就配备了完整的企业化架构：张鹏负责产品与执行，刘德兵主抓战略与融资，唐杰留在学术端做首席科学家——三人分工，像极了硅谷&quot;教授+CEO+投资人&quot;的经典模型。 [4]</p>\n<p>这种结构的好处是明显的：学术上的顶级声誉，让智谱在早期融资中几乎没费力气——A轮投后估值6.65亿元，资方名单里已经出现红杉、高瓴、君联等头部机构。 [4]</p>\n<h3 class=\"rh\">&quot;对标OpenAI&quot;的GLM路线</h3>\n<p>从成立第一天起，智谱就喊出了&quot;对标OpenAI&quot;的口号。但在技术路线上，它选了一条与GPT不同的路：不是纯自回归的Next Token Prediction，而是基于&quot;自回归填空&quot;范式的 GLM 架构。 [4]</p>\n<p>这条路的战略意义，在一开始并不明显。GLM架构的优势在于更高效的中文理解和生成能力（填空范式天然适合中文语义），但也意味着不能直接复用GPT的开源生态——智谱必须独立搭建一套模型体系。这套体系后来适配了40余款国产芯片，成了国内通用性最高的模型体系之一。 [2]</p>\n<p>到今天回头看，GLM路线让智谱站上了一个独特的位置：它是国内唯一从框架到基座模型、从开源到云端MaaS全栈自研的独立创企。但同时，它也付出了&quot;不与生态兼容&quot;的成本——每一次模型升级，都要自己搭底座。</p>\n<h3 class=\"rh\">学院派时间线：从框架到智能体</h3>\n<h3 class=\"rh\">清华基因的双刃剑</h3>\n<p>清华背景给智谱带来了三样其他创企难以复制的东西：顶级的学术积累、政府的深度信任、以及&quot;国家队&quot;般的融资便利。它的股东名单里出现了社保中关村基金、北京市人工智能产业投资基金、杭州城投、珠海华发、成都高新区等国资力量——这不是巧合。 [4]</p>\n<p>但这张名片也绑住了它的手脚。&quot;算法强、产品与工程弱&quot;——媒体曾如此概括智谱的人才结构，U型分布让它在C端产品力上明显落后于对手。 [8] 当MiniMax与月之暗面2024年疯狂投流做C端时，智谱几乎缺席了那场战役。 [9]</p>\n<p>从清华园走出的学霸，身上带着最硬的学术铠甲，和一件还没穿好的商业外套。</p>\n<h2 class=\"rh\">第二章 追问收入：7亿营收里，多少是生意，多少是&quot;国家队&quot;订单？</h2>\n<p>智谱的营收增长，放在任何行业都算亮眼。招股书显示，2022年至2024年收入分别为5740万元、1.245亿元、3.124亿元，年复合增长率超130%；2025年全年收入冲到7.24亿元，同比增长131.9%。 [1] [3] 连续三年翻番，这是一门正在长大的生意。</p>\n<p>但长大和&quot;长对&quot;是两回事。当一家公司的股东名单里站着社保中关村基金、北京市人工智能产业投资基金、杭州城投、珠海华发、成都高新区、浦东创投——几乎每一个都在其所在地有科技园区和企业采购资源——收入的&quot;含金量&quot;就多了一层需要追问的维度。 [4]</p>\n<h3 class=\"rh\">&quot;8000家机构客户&quot;是谁？</h3>\n<p>招股书披露，截至2025年6月30日，智谱已服务超8000家机构客户，涵盖金融、政务、教育、医疗等行业。 [1] 这个数字看上去很扎实。但在招股书的&quot;客户集中度&quot;章节中，智谱并未单独披露前五大客户的收入占比——这在已上市公司中是常见披露项，但在智谱的招股书中被省略了。 [1]</p>\n<p>为什么省略？一种可能是客户高度分散、前五大占比极低，披露无信息增量；另一种可能是因为存在关联方——如果前五大客户中有国资股东/关联方，按照港交所 18C章 的宽松披露要求，智谱可以选择不单独列示。究竟是哪一种，招股书没有说明。 [1]</p>\n<h3 class=\"rh\">产业资本的&quot;种子订单&quot;</h3>\n<p>股东名单中还有另一股不容忽视的力量：美团、蚂蚁、阿里、腾讯、小米。 [4] 这些产业资本不仅是财务投资者，同时是智谱的潜在客户——甚至是最直接的客户。阿里云和腾讯云在政企市场上本身就是MaaS服务的提供方，而美团和小米也有各自的大模型部署需求。</p>\n<p>当一家大模型公司的股东同时是它的客户，收入的&quot;市场公允性&quot;就成了灰色地带。公司可以在招股书中将其标注为&quot;正常商业条款下的公平交易&quot;，但外部投资者很难拆解&quot;战略合作订单&quot;与&quot;纯市场竞标订单&quot;之间的边界。 [1]</p>\n<h3 class=\"rh\">收入的含金量：合同负债与现金回收</h3>\n<p>招股书中还有一组值得关注的数据：截至2025年末，智谱的合同负债（客户预付但尚未确认的收入）约为——根据招股书附注，合同负债余额与其收入规模相当，意味着大部分收入并非一次性订单，而是有长期服务合同支撑。 [1]</p>\n<p>但经营现金流依然是负数。智谱尚未披露2025年全年经营活动现金流净额，但从2022-2024年的数据看，经营现金流持续为负，且缺口在扩大。 [1] 收入在增长、亏损在扩大、现金流在失血——三者叠加，指向一个基本判断：智谱的7亿营收，是在持续注血的前提下实现的。当融资节奏放缓、国资订单不再&quot;倾斜&quot;，收入质量才会真正被检验。</p>\n<p>&quot;8000家机构客户&quot;这个数字，在招股书中写得很显眼。但客户是谁、订单多大、复购率多高——这些决定收入质量的关键参数，藏在招股书没说的那部分里。</p>\n<h2 class=\"rh\">第三章 追问毛利：云端-0.4%，贴钱换规模的账算得平吗？</h2>\n<p>智谱的收入，来自两种部署方式。一种是本地化部署，把模型装进客户的机房，按项目一次性收费加年度服务费；另一种是云端MaaS（Model as a Service），按API调用量或订阅收费。 [5]</p>\n<p>两种模式的毛利率，画出了两条截然相反的曲线。</p>\n<h3 class=\"rh\">基本盘在缩水中</h3>\n<p>早期，高毛利率的本地化部署是智谱的基本盘——2022年占收入95.5%，毛利率稳定在60%左右。到2025年上半年，本地化部署毛利率仍维持在59.1%，但收入占比已从95.5%降至84.8%。 [5]</p>\n<p>基本盘在缩水，不是因为本地化卖不动，而是因为智谱自己想把重心转向云端——张鹏定下的目标是&quot;将API收入占比提升到一半&quot;。 [5]</p>\n<h3 class=\"rh\">云端毛利率：从挣钱到贴钱</h3>\n<p>真正的故事藏在毛利率里。云端部署的毛利率从2022年的76.1%，一路滑到2025年上半年的 -0.4% ——换句话说，每做100块钱的云端收入，智谱倒贴4毛钱。 [5]</p>\n<p>这个数字让&quot;贴钱换规模&quot;的说法变得具体。2025年全年整体毛利率已从2023年的64.6%降至41.0%，2026年一季度甚至走到更低——公司在业绩会上解释，主因是低毛利的云端部署收入占比持续上升，以及本地化部署毛利率的阶段性下降。 [3]</p>\n<h3 class=\"rh\">&quot;定价权&quot;叙事：上调83%，调用量涨400%</h3>\n<p>2026年3月的业绩会上，张鹏给出了一组被认为&quot;提振信心&quot;的数据：一季度API定价上调83%，但调用量反而增长了400%。他据此判断&quot;高质量token是当下的稀缺资源，谁掌握了智能上界，谁就掌握了定价权&quot;——这句话被多家财经媒体列为当季&quot;金句&quot;。 [12]</p>\n<p>单看这组数字，弹性确实惊人：价格涨了八成，用量翻了四倍。但这里有两个需要厘清的细节：一是提价83%的基数极低（云端原本就在贴钱），二是调用量的指数级增长是否可持续——当API价格继续上涨到盈亏平衡点时，客户是否还会留在这里？</p>\n<h3 class=\"rh\">算力成本：吃掉七成研发的&quot;算力税&quot;</h3>\n<p>毛利率压力背后，是算力成本这座大山。2024年研发费用21.95亿元，其中算力投入15.53亿元、占研发的70.7%；2025年上半年研发15.95亿元，算力11.45亿元、占71.8%。 [13] 每赚1块钱，要花7块在研发上——这还没算销售和管理费用。 [1]</p>\n<p>更麻烦的是，算力成本是刚性增长的。模型越大、训练越频繁、推理量越多，算力账单就越高。大模型这门生意的规模效应，不是&quot;收入增长→利润扩大&quot;的经典模型，而是&quot;收入增长→算力成本同步扩大&quot;的平行线——只有当涨价追上算力增长速度时，利润才会出现。智谱的模型涨价能否持续超过算力增速，将决定它能否走出&quot;贴钱赚吆喝&quot;的阶段。</p>\n<h2 class=\"rh\">第四章 追问开源：权重公开的模型，定价权还在谁手里？</h2>\n<p>智谱是中国最早开源大模型的公司之一。从2022年开源千亿模型GLM-130B，到2025年开源旗舰基座GLM-4.5（3550亿参数），它把核心能力摊在开源社区面前。 [7]</p>\n<p>效果立竿见影：据招股书披露，GLM在OpenRouter上的token消耗量稳居全球前十、中国前三，付费API收入超过所有国产模型之和；GLM-4.5发布48小时即登顶HuggingFace热门榜全球第一。 [7] 开源带来了生态与口碑——但也带来了一个根本性的矛盾。</p>\n<h3 class=\"rh\">权重公开了，客户为什么还要付费？</h3>\n<p>这是大模型开源最核心的悖论。当智谱把GLM-4.5的3550亿参数权重公开在HuggingFace上，任何人都可以下载、部署、微调——甚至用蒸馏技术提取一个小模型。竞争对手可以免费使用智谱的基石成果，潜在客户可以在本地部署一个智谱模型而不用支付任何API费用。 [6]</p>\n<p>智谱的逻辑是：开源是&quot;获客漏斗&quot;的顶部——免费用户试用模型后，如果对稳定性、延迟、安全合规有更高要求，就会转化成付费API客户。这个逻辑在开源软件（OSS）领域已经被反复验证过（RedHat、Elasticsearch等）。但在大模型领域，开源模型的性能已经接近甚至在某些任务上追平闭源模型——当开源版本&quot;足够好&quot;时，付费转化漏斗就会堵住。 [7]</p>\n<h3 class=\"rh\">智谱 vs DeepSeek：两个开源者的两套账本</h3>\n<p>与DeepSeek的对比，揭示了开源模型商业化的另一条路。DeepSeek同样大力拥抱开源——其DeepSeek-V3和DeepSeek-R1都开放了权重和论文，且以极低的训练成本著称（据估算V3仅用不到600万美元）。但DeepSeek走的是另一条路：它留在私募市场，不对外披露财务数据，把账本捂得严严实实。 [7]</p>\n<p>一个用&quot;不透明&quot;换灵活，一个用&quot;透明&quot;换资本通道。智谱选择走向IPO，把财报摊在阳光底下，也把开源商业化的&quot;账&quot;露给了所有人看。</p>\n<h3 class=\"rh\">小模型的&quot;降维打击&quot;</h3>\n<p>智谱不仅开源了大模型，还部署了从小到大的完整模型矩阵：1.5B、6B、72B、130B、1060B（GLM-4.5-Air）、3550B（GLM-4.5）。 [6] 小模型参数更少、推理成本更低、部署门槛更低——但它们也是开源的。</p>\n<p>当一家客户的场景只需要一个6B模型就能搞定时，他为什么要为一个3550B的云端API付费？智谱的策略是&quot;小模型引流、大模型变现&quot;——但这条漏斗的通畅程度，取决于客户从&quot;可用&quot;到&quot;必须付费&quot;之间有多少不可替代的需求。</p>\n<h2 class=\"rh\">第五章 四根失血的曲线：增长的另一面</h2>\n<p>把智谱的营收、亏损、研发投入、毛利率四条曲线放在同一张图里，会看到一个矛盾的画面：所有指标都在&quot;增长&quot;——但方向不对。</p>\n<p>营收在往上走，亏损在更快地往上走，研发在往上走，但毛利率在往下走。这是一幅&quot;规模越大、失血越快&quot;的图景。</p>\n<h3 class=\"rh\">营收↑：三年十倍，然后呢？</h3>\n<p>2022-2025年，智谱营收从5740万元跃升至7.24亿元，年复合增速超过130%。放在任何一级市场，这都是&quot;独角兽&quot;级别的增长曲线。 [1] [3]</p>\n<p>但问题是增长的&quot;质地&quot;。宇树科技在招股书里可以用&quot;数量×单价&quot;的公式讲清楚每笔收入来自哪台机器人、卖给了谁；周生生的收入可以拆成金价×克重×门店数的通式。但智谱的收入增长——被包装成&quot;API调用量×单价+本地化项目&quot;——既不透明，也难以预测。当客户是从政府采购、战略合作到中小企业API调用的大杂烩时，下个季度还有没有同样规模的订单，谁也说不准。</p>\n<h3 class=\"rh\">亏损↑：亏损跑得比收入快</h3>\n<p>收入涨了12倍，但亏损涨了33倍——从1.44亿到47.18亿元。 [1] [3] 这意味着每多赚1元，就要亏掉比1元更多的钱。这不是投资周期的&quot;先亏后赚&quot;，而是每笔增量订单的边际效益为负。</p>\n<p>招股书将亏损主因归结于研发投入与算力成本。但更细看：2025年经调整净亏损31.82亿元（剔除以股份为基础的薪酬等非现金项目后），仍然远超7.24亿元的营收。 [3] 即使把所有非现金项目加回，运营亏损的规模仍在翻倍扩大。</p>\n<h3 class=\"rh\">研发↑：高投入的B面</h3>\n<p>2022-2025年累计研发投入约60亿元，其中2025年单年31.80亿元——占营收的439%。 [13] 研发费用率高达703%（2024年），虽然随着基数扩大在下降，但绝对值仍在高速膨胀。 [1]</p>\n<p>其中一个数字特别值得注意：截至2025年6月30日，智谱研发人员只有657人。 [1] 以31.8亿元年研发投入计算，人均研发成本接近500万元——这个数字远高于行业水平，说明大量资金流向了算力（71.8%），而非人才的扩张。换句话说，智谱的研发投入主要是&quot;买卡&quot;而非&quot;招人&quot;。</p>\n<h3 class=\"rh\">毛利率↓：最危险的背离</h3>\n<p>四根曲线中，毛利率的下行是最危险的信号。它说明的不是&quot;亏损换规模&quot;（这可以被接受），而是&quot;卖得越多、越不赚钱&quot;——这是规模不经济的标志。 [5]</p>\n<p>从2023年的64.6%降到2025年的41.0%，毛利率的斜率在加速。当市场看到这个数字时，会问一个更本质的问题：大模型这门生意，真的存在规模效应吗？还是说，每多卖一个token，就需要多花一个token的算力成本——单位经济根本不存在&quot;边际递减&quot;？</p>\n<h2 class=\"rh\">第六章 追问资本：估值三年半30倍，73倍市销率买的是什么？</h2>\n<p>智谱的融资史，本身就是一部估值狂奔史。成立至今完成8轮融资、累计超83.6亿元，投资方囊括美团、蚂蚁、阿里、腾讯、小米等产业资本，君联、红杉、高瓴、启明等头部机构，以及社保中关村基金、北京市人工智能产业投资基金等国资力量。 [4]</p>\n<p>估值从A轮6.65亿元，一路抬到2025年5月B6轮后的243.77亿元——约三年半放大逾30倍。</p>\n<h3 class=\"rh\">73倍市销率：市场在赌什么？</h3>\n<p>2026年1月8日，<mark class=\"paraphrase\" data-hit=\"0\">智谱以116.2港元发行价登陆港股（依港交所18C章），</mark>全球发售3741.95万股、净筹资约41.73亿港元；11家基石投资者认购29.8亿港元、占发售股份近七成。首日收131.5港元、涨13.17%，市值约579亿港元。 [2]</p>\n<p>但对照2025年7.24亿元收入，这笔市值对应的市销率约73倍——这甚至超过了英伟达在AI泡沫顶峰时的PS倍数（约35-40倍）。市场买的不是今天的收入，而是对AGI与&quot;国产大模型第一股&quot;的预期。 [2]</p>\n<p>73倍市销率意味着什么？假设智谱能保持当前130%的年收入增速且毛利率回到50%以上（两个大前提），也需要大约4-5年时间才能把PS倍数压缩到&quot;正常&quot;的10-15倍区间。如果增速放缓，资本市场的耐心会率先掉头。</p>\n<h3 class=\"rh\">基石锁定期：第一道坎</h3>\n<p>11家基石投资者认购了29.8亿港元，占发售近七成——这个比例在港股中属于偏高水平。高比例基石通常被视为正面信号（代表机构认可），但也意味着解禁期一旦到来，流动性压力集中释放。 [2]</p>\n<p>按港股惯例，基石投资者通常有6个月锁定期。2026年7月，第一批基石解禁在即——届时这些机构的减持节奏，将成为智谱股价的第一次真正压力测试。</p>\n<h3 class=\"rh\">港股过山车：116→263→221</h3>\n<p>上市首日收131.5港元后，智谱股价一度在2月初冲到263港元、市值近980亿港元——翻了发行价一倍多。随后回落至220港元区间。 [2] [11]</p>\n<p>从&quot;首日AI第一股&quot;的狂欢，到回调期&quot;估值回归&quot;的冷静，智谱用半年时间走完了大多数新股3年的估值周期。截至2026年7月，股价在发行价上方约90%的位置——市场仍在给&quot;可能性&quot;定价，但&quot;确定性&quot;的折扣已经悄然展开。</p>\n<h3 class=\"rh\">A+H双线：两条腿走路，还是两条战线？</h3>\n<p>2026年1月，中金递交第三期A股上市辅导报告，智谱继续推进&quot;A+H&quot;两地上市。 [11] 港股给国际资本通道，A股给本土纵深——逻辑上说得通。但两地上市场也意味着&quot;双线披露&quot;：同一份财报，港股用国际会计准则是亏损47亿，A股用中国会计准则可能也是一样的数字——透明度加倍，压力也加倍。</p>\n<h2 class=\"rh\">第七章 追问竞争：六小虎里的&quot;学霸&quot;，打不赢大厂的饱和战？</h2>\n<p>智谱身处&quot;大模型六小虎&quot;之列。到2025年，基座模型创企已大幅收敛，除大厂外，独立玩家主要剩智谱、月之暗面、MiniMax三家。 [9]</p>\n<p>但三家走的是截然不同的路。</p>\n<h3 class=\"rh\">月活之困：600万 vs 2760万</h3>\n<p>智谱偏B端和G端落地，没有参加2024年的C端投流大战。 [9] 代价是其C端产品&quot;智谱清言&quot;的月活明显落后于对手。2025年3月数据，智谱清言月活约600万——仅为同为&quot;六小虎&quot;的KIMI约十分之一，也不及通义千问的900万。 [8]</p>\n<p>与之对照，同期闯关港交所的MiniMax走C端路线，2025年9月平均月活已达2760万，收入超七成来自C端。 [10] 当MiniMax用&quot;星野&quot;等社交产品获取C端用户和数据飞轮时，智谱几乎没有面向消费者的杀手级应用。媒体曾以&quot;成于清华，囿于清华&quot;概括它的困境：人才结构呈U型，算法强、产品与工程弱。 [8]</p>\n<h3 class=\"rh\">大厂的&quot;饱和战&quot;</h3>\n<p>真正的压力来自大厂。阿里宣布未来三年投入3800亿元，字节2025年也投入上千亿——这种饱和式军备竞赛，是任何创企都难长期匹敌的。 [9]</p>\n<p>大厂有云业务做&quot;现金牛&quot;、有应用生态做&quot;客户漏斗&quot;、有算力储备做&quot;弹药库&quot;——三样东西，独立创企一样都没有。智谱的唯一筹码是&quot;纯-play&quot;身份：当一家企业客户在选型时担心科技巨头既做模型又做业务（如阿里云既提供MaaS又在电商里嵌入AI），反而更愿选一个不碰下游的&quot;纯-play&quot;供应商。 [4]</p>\n<h3 class=\"rh\">&quot;纯-play&quot;能撑多久？</h3>\n<p>&quot;纯-play&quot;优势真实存在，但有天花板。据弗若斯特沙利文数据，2024年中国大模型市场约53亿元，预计2030年突破千亿元、年复合增速超60%——赛道足够大，当前没有一家能垄断。 [14]</p>\n<p>但问题的关键不是&quot;赛道多大&quot;，而是&quot;智谱能拿下多少&quot;。当大厂用千亿级资金砸市场、用云服务折扣捆绑客户时，智谱的&quot;纯-play&quot;溢价会随着AI市场的成熟而逐渐消失。赛道在变大，但赢家未必是今天的领跑者。</p>\n<h2 class=\"rh\">第八章 追问持续经营：-81亿股东权益，审计怎么看？</h2>\n<p>在智谱的招股书中，有一个数字被藏在正文最深处，却可能是整份财报里最关键的信息——截至2025年末，公司股东权益已降至 -81.11亿元 。 [3]</p>\n<p>股东权益为负，意味着公司的负债已经超过了资产。换句大白话说：如果把智谱今天卖掉，变卖所有资产还不够还债。这是一家&quot;资不抵债&quot;的公司——虽然对大模型创企来说并不罕见，但它在上市公司层面带来的影响，远比私募市场严重。</p>\n<h3 class=\"rh\">资不抵债：一个被低估的炸弹</h3>\n<p>资产=负债+所有者权益。当所有者权益为负，说明负债超过了资产——在会计意义上公司已经&quot;技术上资不抵债&quot;。对大模型创企来说这不是死刑（它们天生烧钱），但它触发了两个需要回答的问题：</p>\n<p>第一，审计意见里有&quot;持续经营重大不确定性&quot;段落吗？如果会计师在审计报告里加上一段关于Going Concern的强调事项段——&quot;存在可能导致本公司持续经营能力产生重大疑虑的事项或情况&quot;——这对上市公司是危险信号。港交所文件显示，智谱2025年度审计报告中并未出现该段落——但2025年亏损47.18亿后，2026年的审计意见值得密切关注。 [3]</p>\n<p>第二，-81亿权益意味着什么？这意味着智谱如果要&quot;破产清算&quot;，所有债权人的求偿权都要先于股东——而国资股东们作为财务投资者，在这个结构中处于最危险的序列。如果智谱持续融资能力下降，国资的&quot;退出通道&quot;将会变成舆论焦点。</p>\n<h3 class=\"rh\">现金22.59亿，Burn Rate 31.8亿</h3>\n<p>截至2025年末，智谱账上现金22.59亿元。 [3]</p>\n<p>年化研发投入31.80亿元——不考虑收入和其他支出，仅研发一项的&quot;烧钱速度&quot;就超过了现金储备。当然，收入（7.24亿元）和经营现金流在部分弥补消耗。但一个简单的算术：年净亏损47.18亿元，现金22.59亿元——即使考虑到IPO募资41.73亿港元（约合人民币38亿元），在手现金也不到两年亏损。2026年的融资决策，不是&quot;要不要&quot;，而是&quot;必须&quot;。 [2] [3]</p>\n<h3 class=\"rh\">经营现金流：账面上的&quot;失血速度&quot;</h3>\n<p>现金流是更灵敏的指标。2022-2024年经营现金流持续为负，且缺口逐年扩大。2025年全年数据尚未单独披露经营现金流，但从亏损规模的扩大趋势推断，经营现金流净流出不会低于30亿元水平。 [1]</p>\n<p>这意味着即使IPO筹到了41亿港元，扣除上市费用后净到手约38亿元——以每年30亿+的失血速度，这笔钱也只够烧一年多。2026年下半年，智谱大概率需要再次融资。届时市场情绪是否还站在&quot;AI第一股&quot;一边，将决定它的融资条件和稀释成本。</p>\n<h3 class=\"rh\">港交所18C章的&quot;豁免&quot;</h3>\n<p>智谱是按港交所 18C章 上市的特专科技公司。18C章的特色是降低了对收入和多期盈利的要求——允许&quot;未商业化&quot;的公司上市，但设置了更高的公众持股量和更严格的投资者准入。 [2]</p>\n<p>门槛低，意味着后续的&quot;持续上市资格&quot;监管也相对宽松。但市场给18C公司的估值折扣也在演变：从2023-2024年港股对&quot;AI概念股&quot;的无差别追捧，到2025-2026年投资者越来越关注&quot;利润路径是否清晰&quot;——对18C公司的估值方式正在向基本面回归。一旦市场转向，智谱的&quot;持续经营能力&quot;将不再是一个会计问题，而是一个真实的流动性问题。</p>\n<h2 class=\"rh\">第九章 粮草与紧箍咒：一场更贵的长跑</h2>\n<p>IPO给智谱补了关键弹药：净筹资约41.73亿港元，其中70%用于通用大模型研发。 [2] [11] 更关键的是，它没打算停——2026年1月，中金递交第三期A股上市辅导报告，智谱继续推进&quot;A+H&quot;两地上市。 [11]</p>\n<p>但账面上的紧迫感并没有因为上市而缓解。</p>\n<h3 class=\"rh\">&quot;A+H&quot;的双线长跑</h3>\n<p>选择A+H上市，意味着智谱同时面对两个市场的审视。港股市场对亏损科技公司的容忍度高于A股（尤其是科创板对未盈利公司的门槛），但A股给的是估值溢价和境内投资者的&quot;流动性底&quot;。 [11] 如果A股上市成功，智谱将获得一条更稳定的融资通道——但这需要它同时在两地披露财报、应对监管、管理投资者预期，管理成本翻倍。</p>\n<p>一个尚未被回答的问题是：A股IPO的定价锚，是港股（73倍市销率）的折价还是溢价？如果A股市场给予更高的估值倍数，会对港股产生&quot;拉动效应&quot;——但这种拉动能持续多久，取决于智谱是否能拿出匹配高估值的交付。</p>\n<h3 class=\"rh\">赛道在变大，赢家未必是今天的领跑者</h3>\n<p>据弗若斯特沙利文数据，2024年中国大语言模型市场约53亿元（机构客户47亿+个人用户6亿），预计2030年达1011亿元、年复合增长率63.5%。 [14] 智谱按2024年收入计，在中国独立通用大模型开发商中排名第一、含大厂在内所有通用开发商中排名第二，份额6.6%。 [1]</p>\n<p>6.6%的市场份额在一个快速膨胀的市场里，意味着既有增长空间也有竞争压力。当大厂用市场份额换收入（零定价）、用云服务绑客户时，独立创企的6.6%是需要主动&quot;咬住&quot;的——它会自然流失，不会自动扩大。</p>\n<h3 class=\"rh\">张鹏的&quot;Token量&quot;赌局</h3>\n<p>CEO张鹏把2026年的关键词定为&quot;token量&quot;，赌的是调用量的指数级增长能撑起定价权与规模效应。 [12] 这个赌局有两个支点：一是&quot;高质量token的稀缺性&quot;能否维持涨价逻辑；二是算力成本的增速能否被规模摊薄。</p>\n<p>两个支点目前都不牢固。涨价已在2026年Q1验证了需求弹性（上调83%、调用量涨400%），但-0.4%的云端毛利率说明价格还未覆盖成本 [12] 。算力成本随模型迭代持续走高，不存在&quot;越多人用越便宜&quot;的经典SaaS模型——每笔API调用的边际算力成本是刚性为正的。在这个前提下，&quot;Token量&quot;的指数级增长带来的不是利润弹性，而是亏损弹性的同步放大。</p>\n<p>智谱的难题，不是&quot;模型够不够强&quot;——它已经是国产基座模型的第一梯队。真正的考题是：当学术声望变成估值、估值变成财报压力，一门靠持续输血维持运转的生意，能不能在AGI这场昂贵的长跑里，比对手多撑一轮。</p>\n<h2 class=\"rh\">尾声 学霸还没写完的那份财报</h2>\n<p>2026年1月8日敲钟那天，清华计算机系教授、智谱首席科学家唐杰发了一封内部信，预告GLM-5与下一代学习范式。学霸依旧仰望AGI的星空。 [11]</p>\n<p>但市场已经把另一份考卷递到桌前。智谱用IPO换来了粮草，也戴上了一条透明的紧箍咒——此后每一个季度，它都得向所有人交代：模型是不是更强了，生意是不是更稳了。</p>\n<p>从收入看，7.24亿的体量在创企中不算差；从增速看，连续翻番是独角兽水平；从技术看，GLM-4.7双榜登顶。但从股东权益看，-81亿的窟窿在膨胀；从毛利率看，41%的下行趋势未止；从竞争看，大厂的千亿投入像悬在头顶的剑。</p>\n<p>智谱的故事，不是&quot;好公司&quot;与&quot;坏公司&quot;的二分叙事。它是一个更微妙的张力——一家从清华实验室走出来的创业公司，正在同时做三件事：追踪AGI的学术前沿、经营一门还在亏钱的生意、维持一个高估值上市公司的市场信心。三件事没有一件容易，三件事同时做，需要的就不只是决心，还包括一条看得见的盈利路径。</p>\n<p>&quot;学霸还没学会写赚钱的财报&quot;——这句pull-quote在导语中出现时，是一个判断。当作结尾重读时，它更像一个进度条：要花多少个季度，才能把-81亿的权益缺口填平？</p>\n<p>金价不会为它停，算力也不会；能陪它走到最后的，只有一门它还在学的生意。</p>", "hits": [{"type": "paraphrase", "src": "2026-07-21_智谱/原始资料/数据溯源说明.md", "core": "02513） | 发行价116.2港元、", "art": "智谱以116.2港元发行价登陆港股（依港交所18C章），", "srcc": "02513） | 发行价116.2港元、", "sim": 0.581, "len": 24}]}, {"key": "2026-07-22_五粮液", "title": "五粮液：半瓶酒的回响", "company": "五粮液", "date": "2026-07-22", "n_src": 2, "nosource": false, "rate": 0.0, "rate_direct": 0.0, "rate_partial": 0.0, "rate_paraphrase": 0.0, "src_files": ["2026-07-22_五粮液/原始资料/研报数据/competitor_comparison.json", "2026-07-22_五粮液/原始资料/研报数据/wuliangye_financial_data.json"], "src_hits": {}, "body_html": "<h1 class=\"rh\">五粮液：半瓶酒的回响</h1>\n<p>2024 年营收 892 亿，离&quot;千亿俱乐部&quot;只差一步；2025 年营收 405 亿，跌回五年前的水平。一年之内浓香之王的营收被腰斩，净利润少了七成。2026 年一季度 82% 的净利反弹，是复苏还是只半瓶酒的回响？本篇基于年报数据、雪球社区投资者分析及券商研报，拆解白酒第二的账本。</p>\n<p>2024 年，五粮液交出了建厂以来最好的一份成绩单：营收 891.75 亿元，净利润 318.53 亿元，距离千亿门槛只差 108 亿。 [1] 在市场眼中，它的定位清晰而稳固。浓香型白酒的老大，全国仅有的两家&quot;百亿利润&quot;酒企之一，A 股消费板块里的压舱石。</p>\n<p>仅仅一年之后，2025 年的年报让所有人倒吸一口凉气。营收 405.29 亿，同比下滑 54.55%；归母净利润 89.54 亿，同比下滑 71.89%。 [1] 一年之间，486 亿营收和 229 亿利润蒸发殆尽，相当于一整家泸州老窖的体量凭空消失。奇怪的是，毛利率没有出问题，反而从 77.05% 微升至 77.54%。酒还是那瓶酒，价还是那个价，只是卖出去的瓶数，塌了。</p>\n<p>截至 2026 年 7 月 22 日，五粮液收于 74.75 元，总市值 2,901 亿元，市盈率（TTM）23.03 倍，市净率 2.27 倍，股息率（TTM）6.90%。 [9] 同为高端白酒，贵州茅台的股息率约 2.5%，泸州老窖约 3.2%。五粮液看起来比两位老大哥都慷慨，但这并非因为它分红更积极，而是因为它的股价跌得更狠。从 52 周高点 124.50 元跌到 74.75 元，四成蒸发。股价是分母，分母塌了，比率自然就被撑了起来。</p>\n<h2 class=\"rh\">第一章 营收腰斩，最痛的是老二</h2>\n<p>2025 年的年报里，有几个数字让人细思极恐。毛利率 77.54%，比 2024 年的 77.05% 还高出 0.49 个百分点。这不是一个靠降价清货的&quot;割肉式&quot;下滑。出厂价没动，酒的成本没变，变的只是卖出去的数量，而且是断崖式地跌。 [1]</p>\n<p>看季度数据会更直观。2025 年一季度营收 170.86 亿，同比下降 50.95%；上半年 235.10 亿，下降 53.58%；前三季度 306.38 亿，下降 54.89%；全年 405.29 亿，下降 54.55%。 [1] 四个季度的降幅几乎纹丝不动。没有哪个季度跳出黑天鹅，是整条营收管线被一致地拧紧了。从开年到年尾，经销商每个季度都在少订货，全年没有一个季度出现过&quot;恢复&quot;的迹象。</p>\n<p>净利润端的坍塌还要更剧烈。2024 年 ROE 还有 23.35%，在 A 股消费板块里属顶尖水平；2025 年骤降至 6.89%，跌破了大多数机构投资者的资本成本线。每股收益从 8.21 元缩到 2.31 元。 [1] 六个季度前还是历史最好，六个季度后只略高于银行理财。这种坠落速度，在 A 股消费龙头里极为罕见。对照 2014 年那轮白酒低谷，当年五粮液营收只降了 15%，利润降了 26%。2025 年的跌幅是那一次的三到四倍。这已经不是简单的周期波动，而是一次结构性的断裂。</p>\n<h2 class=\"rh\">第二章 茅台没倒，为什么五粮液倒了</h2>\n<p>2025 年白酒行业整体下滑，但各家跌得相差悬殊。贵州茅台全年营收 1,720.54 亿，同比仅微降 1.20%；净利润 823.20 亿，降 4.53%。 [3] 山西汾酒逆势增长 7.52%，做到 387.18 亿。泸州老窖营收 257.31 亿，降 17.52%；洋河股份 192.11 亿，降 33.47%。五粮液降 54.55%，在五大头部酒企里跌幅最狠，是第二名洋河的两倍有余。</p>\n<p>差距的根源不在酒质。五粮液普五在盲评中从不逊于飞天茅台。真正的差距，在品牌势能的那道&quot;护城河&quot;有多宽。茅台的消费群体由&quot;自饮、送礼、收藏、投资&quot;四维驱动，飞天出厂价 1,169 元，市场批价常年维持在 2,200 元以上，一倍以上的终端价差给了渠道足够厚的利润垫，去消化库存波动。五粮液普五出厂价 969 元，2025 年批价却一度跌到 800 元附近。出厂价高于终端价 169 元，出现了刺眼的&quot;价格倒挂&quot;，经销商每卖一瓶亏损超过 15%。 [4]</p>\n<p>一位华东酒商在接受采访时说得很直白：&quot;茅台卖一瓶赚 500，五粮液卖一瓶亏 50，你愿意推哪一个？&quot; [4] 2025 年商务宴请和高端礼品市场大幅收缩，经销商的理性选择只剩一个：优先保茅台。五粮液作为&quot;不赚钱的第二品牌&quot;，自然成了砍单的首选。这与其说是产品竞争力的失败，不如说是渠道利润结构在极端环境下的马太效应：强者愈强，弱者愈弱。</p>\n<h2 class=\"rh\">第三章 消失的 486 亿</h2>\n<p>486 亿营收消失的背后，是五粮液渠道模式的脆弱性，或者更准确地说，是行业下行期被放大的结构性弱点。五粮液采用&quot;大商制&quot;，以省级大经销商为主力，辅以专卖店和团购渠道。这一模式在的上行期的优势是铺货极快，几家大商就能覆盖一整省的终端。但到了下行期，大商手上数亿到数十亿的库存，就变成了定时炸弹。 [5]</p>\n<p>2024 年末，五粮液合同负债（经销商已打款、公司尚未发货的预收款）约为 35 亿元。到 2025 年末，这个数字急剧缩水，具体数值虽未在公开披露中单独列示，但从集团财报&quot;预收款项&quot;科目的大幅下降可以验证。 [1] 合同负债是酒企的&quot;蓄水池&quot;，水位下降，意味着经销商打款的意愿枯竭。当经销商不再愿意预付货款，企业营收确认的节奏就完全取决于终端实际出货，而 2025 年的终端动销，恰恰是最惨的一年。</p>\n<p>雪球用户广泛讨论的一个细节是：五粮液普五八代在京东自营的到手价长期浮动在 780 到 800 元之间，低于出厂价 969 元将近 20%。 [9] 电商渠道的价格是最透明的终端信号。当消费者能以低于出厂价两成的价格买到产品，说明渠道里的库存堰塞湖已经严重到经销商愿意亏本清仓。</p>\n<p>经营现金流同样触目惊心。2024 年经营活动现金流净额尚有约 297 亿，2025 年骤降到不足百亿，降幅接近七成。 [1] 账上进来的现金在大幅减少，这比&quot;利润表上的数字下滑&quot;更真实。更何况 2025 年五粮液还要同时面对可观的资本开支（产能扩建、老窖池维护）和分红压力。现金流吃紧，是比利润表更危险的一道信号。</p>\n<h2 class=\"rh\">第四章 夹在茅台和国窖之间</h2>\n<p>五粮液的定价困境，从 2013 年行业深度调整期就开始了。&quot;上有茅台压价、下有老窖追尾&quot;的夹缝位置，不是今天才出现的。 [7]</p>\n<p>飞天茅台批价 2,200 到 2,500 元，五粮液普五批价 800 到 950 元，国窖 1573 批价 850 到 900 元。 [4] 五粮液卡在中间：往上，无法像茅台一样拉开价格带、拉升品牌势能；往下，又不愿降到国窖的价位卷价格战。2025 年之前，这个位置还能维持。&quot;老二&quot;虽然利润薄，但市场规模大。可 2025 年的行业调整，把这种&quot;中间位置&quot;的脆弱性推到了极致。</p>\n<p>2021 到 2024 年间，普五出厂价从 889 元一路提升到 1,019 元，后又因市场压力回调至 969 元。每一次提价，都在试图缩小与茅台的差距。但市场给出的回应是残酷的：提价后批价不涨反跌，终端成交价倒挂，渠道利润被进一步压缩。 [7] 症结在品牌溢价的天花板。在消费者的认知里，茅台是&quot;最好白酒&quot;的终极锚点，五粮液的任何提价，都被视为&quot;凭什么跟茅台一样贵&quot;，而不是&quot;五粮液值这个价&quot;。</p>\n<p>雪球社区一篇热门分析《泸州老窖会不会超过五粮液？》说得更直接：&quot;五粮液正在被泸州老窖追赶：真正丢掉的，不只是股价，而是信任。&quot; [9] 当老窖以更高的渠道利润（国窖批价稳定，经销商有合理空间）和更灵活的市场策略抢占部分宴席市场，五粮液的中间地带，正在被两头挤压。</p>\n<h2 class=\"rh\">第五章 82% 的反弹靠什么</h2>\n<p>2025 年的惨淡之后，2026 年一季度报来了个&quot;回马枪&quot;：营收 228.38 亿，同比增长 33.67%；净利润 80.63 亿，同比暴增 82.57%。 [1] 净利润率从 25.84%（2025Q1）跳升到 35.31%（2026Q1），一举回到 2024 年的盈利水平；毛利率从 79.07% 上升到 81.43%。在一地鸡毛的行业里，这份成绩单格外亮眼。</p>\n<p>但这场反弹，有两个必须正视的背景。</p>\n<p>一是低基数效应。 2025 年一季度营收 170.86 亿，几乎是全年最惨的水平，比 2024 年同期的 348.33 亿少了 51%。82.57% 的净利增长，很大程度上是因为比较对象太低。228.38 亿的季度营收，和 2024 年一季度的 348.33 亿比，仍差着 120 亿，少了三分之一。从绝对值看，五粮液并没有&quot;恢复&quot;，只是从坑底往上爬了半截。</p>\n<p>二是毛利率跳升的驱动因素。 81.43% 的毛利率在五粮液历史上算是很高的水平。背后是管理层主动推行的&quot;产品结构优化&quot;：不再靠普五放量冲规模，而是加大销售高毛利的系列酒（如五粮春、五粮醇）和年份酒。这部分产品毛利高于普五，2026 年一季度的终端动销也恢复得更快。 [8] 这是一个积极信号，说明五粮液有能力在不清算普五批价的前提下提升盈利。但局限同样明显：系列酒和年份酒的市场规模远小于普五，撑不起营收回到千亿。</p>\n<h2 class=\"rh\">第六章 价值与估值：6.9% 股息率的故事</h2>\n<p>截至 2026 年 7 月 22 日，五粮液的估值指标，反映了市场对它的复杂态度。市盈率（TTM）23.03 倍，处于历史中枢偏低水位。2019 到 2021 年白酒牛市期间，五粮液的 PE 中枢还在 35 到 50 倍之间。市净率 2.27 倍，每股净资产 32.98 元。 [9]</p>\n<p>6.90% 的股息率，是 A 股消费板块里最高的水平之一。贵州茅台约 2.5%，泸州老窖约 3.2%，洋河约 4.5%。但五粮液的高股息，不是因为分红比例高于同行（五粮液分红率约 70%，茅台约 80%），而是因为股价跌幅远超同行。74.75 元的股价，对应的是每股 5.16 元（含税）的年分红。高股息率若说是&quot;深度价值&quot;的标志，那么市场已经把五粮液当成一只消费股加高息股的混合体来定价了。 [9]</p>\n<p>但这个&quot;高股息叙事&quot;藏着一个逻辑漏洞。2025 年五粮液净利润 89.54 亿，而维持每股 5.16 元的分红需要约 200 亿现金，超过当年净利润两倍。实际上，2025 年的分红是基于 2024 年的利润和留存收益支付的。如果 2026 年净利润不能恢复到 200 亿以上，分红率必然下调。届时 6.9% 的&quot;高股息&quot;将被打破，依赖股息逻辑买入的资金，将直面&quot;股息率坍缩&quot;的风险。</p>\n<h2 class=\"rh\">第七章 老二的椅子还稳吗</h2>\n<p>2025 年之前，&quot;白酒老二&quot;是五粮液的铁帽子，营收规模是第三名泸州老窖的三倍以上。2025 年之后，这个排序变得模糊了。</p>\n<p>看营收，山西汾酒 387.18 亿，五粮液 405.29 亿，两者只差 18 亿，不到一个季度。 [3] 汾酒是 2025 年唯一正增长的白酒巨头（+7.52%），增长主要来自中端的青花 20/25/30 和玻汾系列的量价齐升。汾酒的&quot;清香型复兴&quot;是过去五年白酒行业最大的供给侧变量之一，正在从根本上改写&quot;浓酱两强&quot;的竞争格局。</p>\n<p>更刺眼的是净利润。泸州老窖 2025 年净利润 108.31 亿，比五粮液（89.54 亿）多了将近 19 亿。 [3] 扣非净利润五粮液 88.19 亿，同样低于泸州老窖的 107.52 亿。营收第二、利润第四，在一贯以高利润著称的高端白酒行业里，极其罕见。</p>\n<p>2025 年之前的格局是&quot;一茅二五三窖四汾五洋&quot;；2025 年之后，变成了&quot;一茅二五、汾窖洋混战&quot;。五粮液的&quot;老二&quot;头衔还挂着，但身位已不再安全。</p>\n<p>雪球用户&quot;向阳重生&quot;在 2026 年 7 月发表了一篇广泛传播的分析《泸州老窖会不会超过五粮液？》。文中梳理了两家公司在品牌力、渠道利润、管理层执行力几个维度上的对比，结论是五粮液&quot;正在被泸州老窖追赶：真正丢掉的，不只是股价，而是信任&quot;。 [9] 截至 7 月 22 日，五粮液市值约 2,901 亿，泸州老窖约 1,270 亿，差距仍超一倍。但 2024 到 2025 两年间，五粮液市值跌掉了约 1,900 亿，泸州老窖只跌掉约 600 亿。相对趋势，对五粮液不利。</p>\n<h2 class=\"rh\">第八章 百亿回购与谁的信心</h2>\n<p>2025 年底，五粮液董事会宣布了一项 80 到 100 亿元的股份回购计划，用于注销或股权激励，期限 12 个月。 [9] 这是五粮液历史上规模最大的市值管理动作。以 74.75 元计，100 亿元上限对应约 1.34 亿股，占流通股约 3.45%。</p>\n<p>截至 2026 年 7 月 14 日（最新分红公告日），实际回购金额仅约 2 亿元，进度不到 3%。 [9] 7 个月只回购了 2 亿。对一个年营收超 400 亿的公司来说，这个速度近乎象征性。</p>\n<p>回购执行缓慢，可能有几层原因。一是 2025 年现金流紧张，公司未必愿意在现金压力下大规模花钱回购。二是管理层对自身股价的判断可能仍在&quot;等等看&quot;：如果他们认为股价还有下跌空间，拖着再回购更&quot;划算&quot;。但无论哪种解读，都不指向&quot;管理层对公司未来充满信心&quot;。</p>\n<p>雪球社区里一篇广为流传的评论写道：&quot;现在回购效果绝对事半功倍，品牌信心直接扭转。就是不知道管理层都在干嘛？&quot; [9] 回购的速度本身已经成了一种信号，投资者把行动的快慢读作信心的浓度。在 PE 23 倍、股息率 6.9% 的位置，如果管理层真相信公司价值被低估，应该加速而非拖延。</p>\n<h2 class=\"rh\">尾声：装不满的，不止是瓶子</h2>\n<p>2024 年底，五粮液窖池群里新一轮的粮食正在发酵。从投料到出酒需要 70 到 120 天；从新酒到可售，至少 3 年陶坛陈酿。 [2] 今天酿下的酒，最早要到 2029 年才能上架。</p>\n<p>五粮液在半瓶酒的空隙里听到了回响。那是一个行业的自我拷问，也是&quot;白酒老二&quot;在谷底发出的声音。</p>", "hits": []}, {"key": "2026-07-22_希尔顿", "title": "希尔顿：卖钥匙的酒店帝国", "company": "希尔顿", "date": "2026-07-22", "n_src": 8, "nosource": false, "rate": 0.5, "rate_direct": 0.0, "rate_partial": 0.0, "rate_paraphrase": 0.5, "src_files": ["2026-07-22_希尔顿/原始资料/招股书年报/年报_accor_2024_annualreport.md", "2026-07-22_希尔顿/原始资料/招股书年报/年报_hilton_2024_10K.md", "2026-07-22_希尔顿/原始资料/招股书年报/年报_hilton_2025_10K.md", "2026-07-22_希尔顿/原始资料/招股书年报/年报_ihg_2024_annualreport.md", "2026-07-22_希尔顿/原始资料/招股书年报/年报_marriott_2024_10K.md", "2026-07-22_希尔顿/原始资料/招股书年报/年报_wyndham_2024_annualreport.md", "2026-07-22_希尔顿/原始资料/研报数据/研报_hilton_investor_presentations.md", "2026-07-22_希尔顿/原始资料/研报数据/研报_mkg_hotels325_2024.md"], "src_hits": {"2026-07-22_希尔顿/原始资料/招股书年报/年报_hilton_2024_10K.md": 1}, "body_html": "<h1 class=\"rh\">希尔顿：卖钥匙的酒店帝国</h1>\n<p>8,447 家酒店，1,268,206 间客房，<mark class=\"paraphrase\" data-hit=\"0\">覆盖 140 个国家和地区——全球第二大酒店集团希尔顿，</mark>几乎不拥有其中的任何一砖一瓦。50 间自有酒店不足总量的 0.6%；其余 99.4% 的钥匙——Hampton、DoubleTree、Waldorf Astoria 的门牌——被授权给第三方业主，希尔顿每年从中抽取客房收入的 5%-12%。这种&quot;卖钥匙&quot;的轻资产模式让它的 EBITDA 利润率超过 45%，超过大多数科技公司。但钥匙的生意也有背面：2.11 亿会员的忠诚度计划、50 万间在建客房的开发管道、以及一张必须不断扩张的增长曲线。本篇基于希尔顿 2024 年 SEC 10-K 年报数据，拆解这台&quot;钥匙印刷机&quot;的每一个齿轮。</p>\n<p>1919 年，得克萨斯人 Conrad Hilton 用 5,000 美元定金买下了人生的第一家酒店——Cisco 镇的 Mobley Hotel，一间 40 个房间的小旅馆。 [1] 100 年后，以他命名的公司在纽交所的市值超过 550 亿美元，8,447 块门牌挂在全球 140 个国家和地区。但公司与那个得克萨斯人最初的事业之间，有一个根本性的区别：Conrad 拥有的酒店，今天的希尔顿几乎不再拥有。</p>\n<p>2024 年，希尔顿的 SEC 10-K 年报披露了一组数据：全系统 8,447 家酒店中，希尔顿自有或租赁的仅 50 家；7,461 家是特许经营，831 家是委托管理。 [2] 99.4% 的物业，希尔顿不占有土地、不持有产权、不承担运营亏损。它做的事情只有一件：让业主上门来买钥匙。</p>\n<h2 class=\"rh\">第一章 8,447 把钥匙的分布</h2>\n<p>希尔顿不是一家酒店公司——它是一个品牌管理商、一个特许经营授权方、一个全球最大的&quot;卖名号&quot;机器之一。24 个品牌覆盖从奢华到经济型的全谱系，但真正的故事藏在每个品牌的门牌数量里。</p>\n<p>Hampton by Hilton 是希尔顿最大的品牌——342,737 间客房，占全系统 27%。这是希尔顿的核心印钞机：每间 Hampton 的平均房价约 120 美元、入住率 75%、年客房收入约 3.2 万美元/间。 [3] 希尔顿从中抽取约 6% 的特许经营费，再加上预订系统使用费、品牌营销费、忠诚度计划费——合计从一间 Hampton 每年抽取约 7,000-8,000 美元。34 万间客房，就是 25 亿美元的年化&quot;钥匙收入&quot;——几乎是纯利润。</p>\n<p>品牌矩阵的真正精妙之处在于&quot;价格带覆盖&quot;——从每晚 80 美元的 Tru by Hilton 到每晚 1,000 美元以上的 Waldorf Astoria，希尔顿在每个价格区间都有一把钥匙。 [2] 对业主来说，这意味着一个投资人可以同时用 Hampton（中端）、DoubleTree（中高端）和 Waldorf（奢华）来覆盖不同的市场，但只用同一条预订系统和同一个会员计划。这是希尔顿向业主销售的关键话术：&quot;您买的不只是一个品牌，是整个系统。&quot;</p>\n<h2 class=\"rh\">第二章 50 间自有酒店，藏着什么秘密</h2>\n<p>50——这是希尔顿 8,447 家酒店中自有的数量。占比 0.6%，客房数 17,138 间，约占总间夜容量的 1.4%。 [2] 这些酒店主要是旗舰物业，比如纽约 Midtown 的 Hilton New York（1,900 间房）、芝加哥华尔道夫、华盛顿康莱德。它们承担的不是盈利功能，而是品牌展示功能——让潜在的加盟商看到&quot;希尔顿的五星级挂在我的楼上是怎样的效果&quot;。</p>\n<p>但年报没有直接说的是：这 50 家自有酒店的利润率远远低于加盟和管理业务。2024 年，自有酒店业务占希尔顿总收入的 8-10%，但占 EBITDA 的比例估计不到 5%。 [4] 它们的存在更多是&quot;战略性亏损&quot;——希尔顿保留少量直营旗舰店以维持品牌标准，同时向加盟市发布信号：&quot;最高标准在这，跟上。&quot;</p>\n<p>这种&quot;自有仅 0.6%&quot;的结构，并不是天然如此。2007 年黑石收购希尔顿时，公司还持有着大量重资产。但随后的转型——向 REIT 出售资产并签回管理合同——彻底改变了风险分布。到 2024 年，98% 的酒店资产已经不在希尔顿的资产负债表上。 [4] 这意味着：即使全球酒店市场在 2026 年遭遇另一场类似 2020 年的危机，希尔顿的损失也不会来自物业跌价，只会来自管理费收入的暂时缩水——而这在疫情中得到过验证。</p>\n<h2 class=\"rh\">第三章 Hampton 卖了 34 万间房，希尔顿分走 8%</h2>\n<p>希尔顿的收费体系是一层叠加一层的&quot;抽水结构&quot;。以一间 150 间客房的 Hampton Inn 为例：</p>\n<p>第一层：特许经营费。 按客房收入的 5-8% 收取。假设 ADR 120 美元、入住率 75%，年客房收入约 493 万美元。6% 的特许经营费就是 29.6 万美元——希尔顿的边际成本接近于零。 [3]</p>\n<p>第二层：中央预订系统费。 通过 Hilton CRS 生成的每一笔订房，希尔顿收取约 12 美元的预订费。按 150 间房 75% 入住率、40% 通过 CRS 预订估算，年预订费约 8.2 万美元。</p>\n<p>第三层：品牌营销费。 客房收入的 2.5%，约 12.3 万美元。</p>\n<p>第四层：忠诚度计划积分费。 客房收入的 6%，约 29.6 万美元——相当于第二笔特许经营费。</p>\n<p>合计： 一间普通的 Hampton Inn 每年向希尔顿缴纳约 80 万美元的费用。其中很大一部分接近纯利润。而希尔顿为这家酒店投入的成本——品牌管理、系统维护、区域经理的工资——分摊到这间酒店上可能不到 15 万美元。 [3]</p>\n<h2 class=\"rh\">第四章 2.11 亿会员：比 8,447 家酒店更值钱</h2>\n<p>2024 年底，Hilton Honors 会员数达到 2.11 亿，同比增长 17%。 [2] Honors 会员贡献了希尔顿全系统超过 60% 的间夜预订。 [5] 但 Honors 的真正价值不在预订量——而在两件事。</p>\n<p>第一是积分销售。 希尔顿向美国运通等合作方出售 Honors 积分，合作方将其作为信用卡权益发放给持卡人。2024 年，这项收入是希尔顿&quot;其他收入&quot;（约 26 亿美元）的最大单一来源。 [4] 希尔顿收到运通的积分采购款后，在会员实际兑换积分时向加盟酒店支付一笔补偿金（通常远低于现金房价）。差值——积分售价减去兑换成本——就是 Honors 的直接利润。行业估算，这套积分经济学的毛利率可以超过 60%。</p>\n<p>第二是 breakage（积分过期）。 Honors 积分在账户 24 个月无活动后过期。据行业估算，酒店常旅客计划的 breakage 率通常在 15-25% 之间。 [5] 每卖出 100 美元的积分，最终有 15-25 美元永远不会被兑换——这成了一项近乎&quot;免费&quot;的收入。</p>\n<p>Honors 还有一个更微妙的作用：品牌切换壁垒。2.11 亿会员意味着每年数百万间夜通过 Honors 渠道预订——如果一家汉普顿的业主想换牌到万豪，这批客源会几乎一夜消失。2016 年以来，当部分业主因加盟费问题威胁退出希尔顿体系时，Honors 的会员密度成了他们留在体系内的最大理由。 [5]</p>\n<h2 class=\"rh\">第五章 黑石：从账面亏 70% 到赚 140 亿</h2>\n<p>今天希尔顿作为一台精密运转的&quot;钥匙印刷机&quot;，并非天然如此。它的形态是被一场剧烈的手术塑造的——那场手术的名字叫黑石。</p>\n<p>2007 年，黑石以约 260 亿美元（含债务）杠杆收购希尔顿，是全球史上最大的私募股权酒店收购之一。 [6] 2008 年金融危机接踵而至，希尔顿营收从 87 亿暴跌至 2009 年的 58 亿，资产负债率超过 90%，EBITDA 几乎全部被利息吞噬。黑石的股权价值在账面上一度亏掉超过 70%。 [6]</p>\n<p>黑石的翻身来自两个决定。第一，它没有放弃，而是注入了更多资本并重组了债务——在危机最深处，黑石说服银行团将 40 亿美元的到期债务展期，争取到了 4 年的喘息时间。 [6] 第二，它主导了希尔顿历史上最根本的业务转型：将自持的重资产酒店大量出售给 REITs 和主权基金，同时从买方手中签回长期管理或特许经营协议。希尔顿从一个&quot;持有并运营酒店的公司&quot;变成了&quot;管理酒店品牌的公司&quot;。</p>\n<p>2013 年，转型后的希尔顿以每股 20 美元重新上市，募资约 23.5 亿美元——当时是酒店业史上最大的 IPO。 [6] 到 2018 年黑石完全退出时，它在希尔顿身上赚了超过 140 亿美元——全球私募股权史上回报最丰厚的投资之一。但黑石留下了一个重要的遗产：一家不再持有酒店、只出售钥匙的希尔顿。</p>\n<h2 class=\"rh\">第六章 万豪 9,200 家 vs 希尔顿 8,447 家</h2>\n<p>全球酒店行业的&quot;轻资产三巨头&quot;——万豪、希尔顿、洲际——在卖同一种钥匙，但每把钥匙的定价和销量各不相同。</p>\n<p>万豪客房数比希尔顿多 30%，营收比希尔顿多 117%——但万豪营收高的部分原因是它拥有较重资产结构的遗留（分时度假、自营品牌）。在纯品牌授权业务上，希尔顿的单位经济效益更好：每间客房对 EBITDA 的贡献，希尔顿估计比万豪高 15-20%。 [7] 洲际在三家中规模最小，但有一个关键差异——它在中国市场的渗透最深（约 750 家酒店），IHG 在中端市场对中国本土品牌的了解远超万豪和希尔顿。 [8]</p>\n<p>三巨头之外的竞争者也在逼近。雅高（Accor）在欧洲和亚太拥有 5,500 家酒店；温德姆（Wyndham）以 9,100 家酒店在数量上全球第一——但它的客房均价和每间贡献的收入远低于三巨头。 [9] 竞争格局中一个正在浮现的变量是 Airbnb：当价格敏感型游客越来越多地从 Hampton 转向短租公寓时，希尔顿的&quot;量价齐升&quot;叙事会面临挑战。</p>\n<h2 class=\"rh\">第七章 中国 600 家，管道里还有 800 家</h2>\n<p>中国是希尔顿最重要的增量市场。截至 2025 年，希尔顿在中国运营超过 600 家酒店，另有近 800 家在筹备中。 [10] 没有哪个单一市场能提供这样的增速。</p>\n<p>希尔顿在中国的策略分三个梯队：华尔道夫和康莱德（奢华），覆盖一线和强二线；希尔顿和 DoubleTree（高端全服务），覆盖省会城市；以及汉普顿（Hampton by Hilton）和花园（Hilton Garden Inn）\\u2014\\u2014中端精选服务，以特许经营模式快速铺量。汉普顿在中国已落地约 400 家，目标是在 2030 年前突破 1,000 家。 [10]</p>\n<p>但竞争同样激烈。华住集团（全季、汉庭等）超过 10,000 家酒店；锦江国际超过 12,000 家。两家本土巨头在中端市场的渗透深度，外资品牌难以企及。更关键的是加盟费：华住旗下全季的加盟费约为收入的 4-5%，低于汉普顿的 6-8%。在利润率高度敏感的三四线市场，几个百分点的差距足以影响业主的选择。 [10]</p>\n<p>还有一层隐形成本：外资品牌必须通过合资或特许经营的本地化架构进入中国。希尔顿的做法是与本地开发商签订管理合同——业主出地出楼，希尔顿出品牌和运营标准。优势是零资本支出，劣势是品牌控制力远低于欧美。当一家汉普顿的业主为降低成本削减早餐品种时，希尔顿能做的要么妥协，要么撤牌——两种结果都不理想。</p>\n<h2 class=\"rh\">第八章 50 万间在建客房，与一座地产的冰山</h2>\n<p>希尔顿 2024 年末的开发管道中有 3,578 家酒店、498,600 间客房正在筹备——约占现有客房总数的 39%。 [2] 这些酒店将在未来 3-5 年陆续开业——届时希尔顿将成为全球第一个突破 200 万间客房的单一管理公司。</p>\n<p>但管道的质量比数量更重要。2024 年新增的 1,432 家管道酒店中，约 60% 是中端精选服务品牌（Tru、Spark、Home2 Suites）——建造成本低、开发周期短，但单位收入贡献也最低。 [2] 高端品牌（华尔道夫、康莱德、LXR）在管道中的占比不到 10%。这意味着未来 5 年新增的大部分客房对特许经营费收入的增量贡献有限——需要更多的&quot;量&quot;来维持相同的&quot;价&quot;。</p>\n<p>另一个变数来自利率环境。2025-2026 年美联储的高利率大幅推高了商业地产融资成本。酒店开发在商业地产中对利率的敏感度最高——当贷款利率超过 7-8%，许多中小开发商的项目 IRR 转负。 [11] 2025 年美国酒店新开工项目同比下降约 15%。管道中的&quot;搁置率&quot;——签约后因无法融资而推迟或取消的比例——在明显上升。希尔顿当前股价包含了年均 5-7% 的&quot;单位增长溢价&quot;——如果实际增速只有 2-3%，市盈率可能面临重估。</p>\n<p>还有一个被称为&quot;影子风险&quot;的因素：独立酒店的软品牌联盟正在崛起。全球范围内，一批精品独立酒店不再选择加入万豪或希尔顿体系，而是通过 Design Hotels、Preferred Hotels &amp; Resorts 等软品牌联盟维持独立身份——这对希尔顿最有利可图的开发区域（美国本土、中端精选服务）威胁最大。 [11] 当越来越多的业主问出&quot;为什么我非要挂希尔顿的牌子&quot;这个问题时，卖钥匙的生意就会面临结构性天花板。</p>\n<h2 class=\"rh\">尾声：钥匙生意最妙的地方</h2>\n<p>1919 年 Conrad Hilton 买下那间 40 间房的 Mobley Hotel 时，他大概不会想到自己的名字会变成一把钥匙。100 多年后，这把钥匙刻了 24 个品牌，开了 8,447 扇门，每年产生超过百亿美元的收入。</p>\n<p>希尔顿的 2024 年 10-K 在第 3 页上写了一句不起眼的话：&quot;我们相信希尔顿拥有行业中最大的开发管道。&quot; [2] 这句话背后是 3,578 家酒店、50 万间客房、以及一千亿美元的潜在开发价值——但所有这些新钥匙，都依赖于一个前提：利率别太高、业主别放弃、会员别流失、以及 Airbnb 别变得太像酒店。</p>\n<p>钥匙的生意最精妙的地方在于：钥匙越多，越多人想要钥匙。但最危险的地方也在这里——当钥匙不再稀缺时，它的价格就会下降。</p>", "hits": [{"type": "paraphrase", "src": "2026-07-22_希尔顿/原始资料/招股书年报/年报_hilton_2024_10K.md", "core": "206** | - 覆盖 **140 个国家和地区**。", "art": "覆盖 140 个国家和地区——全球第二大酒店集团希尔顿，", "srcc": "206** | - 覆盖 **140 个国家和地区**。", "sim": 0.576, "len": 23}]}, {"key": "2026-07-22_平安证券", "title": "平安证券：平安的棋子，与它自己的路", "company": "平安证券", "date": "2026-07-22", "n_src": 1, "nosource": false, "rate": 0.0, "rate_direct": 0.0, "rate_partial": 0.0, "rate_paraphrase": 0.0, "src_files": ["2026-07-22_平安证券/原始资料/研报数据/broker_comparison.json"], "src_hits": {}, "body_html": "<h1 class=\"rh\">平安证券：平安的棋子，与它自己的路</h1>\n<p>中国前十大券商中，平安证券是唯一没有独立股票代码的那一家——它被隐藏在中国平安超过 10,000 亿的财报里。2022 年它吞下破产清算的方正证券后营收翻倍至约 200 亿，挤进行业前十。但同时它也是唯一一家没有王牌业务的头部券商——没有业务进入行业前三。平安集团的生态给它养分，也给它天花板。本篇基于行业数据及公司年报，拆解这枚棋子的棋局。</p>\n<p>在中国券商的江湖里，没有股票代码是一件罕见的事。中信证券挂的是 600030，华泰是 601688，中金是 601995——你可以买入每一家头部券商，分析师可以为每一家做独立的估值模型。唯独平安证券没有。这家年营收超 200 亿的老牌券商，被深埋在中国平安逾 10,000 亿年营收的财报里，不过是“保险、银行、资管、科技”四大板块之外的一行小字。 [1]</p>\n<p>这枚棋子既是生态的宠儿，也是棋盘上最被动的一颗。平安证券享受中国最大综合金融集团的资源后盾，却从未真正拥有过独立的决策权。但棋局正在改变。2022 年拿下方正证券后，合并营收迈入 200 亿俱乐部，平安证券第一次跻身前十。然而，前十的路并不好走——面对中信证券 749 亿的庞大身影，面对方正与平安两套系统的艰难磨合，面对注册制对投行能力的重新定义，每一步都是险棋。</p>\n<h2 class=\"rh\">第一章 平安帝国里最小的一块版图</h2>\n<p>中国平安集团 2025 年总收入约 10,505 亿元，归母净利润约 1,348 亿元。 [1] 在这个庞大的数字里，平安证券的贡献不到 2%。集团的棋盘中，它的定位排在寿险、财险、银行、科技之后——连平安健康的体量都比它大。同样是金融版图的一部分，平安银行年营收超 1,300 亿，而证券只有银行的大约六分之一。</p>\n<p>平安证券的故事从 1991 年开始——那年平安保险公司成立了证券业务部。五年后正式注册为证券公司，但此后二十多年里排名始终在行业 15 到 20 名之间晃荡。说不上头部，也算不上小角色。对一家背靠中国最大保险集团的公司来说，这个位置多少有些“期望落差”。 [2] 经纪业务在 2024-2025 年勉力挤入前十；投行每年做 15 到 20 个项目；资管主动管理规模增长到约 2,000 亿。可每一项都差一口气——没有行业第一的板块，甚至很少进入前三。</p>\n<p>第二章 方正证券之战 改变棋局的那一步，落在 2022 年底。中国证监会批准了一笔特殊的交易：平安集团接手新方正集团 66.51% 股权——这家公司是北大方正集团破产重组的产物——从而获得了方正证券的控制权。 [3] 同一实控人持有两张券商牌照，监管上有一个严格的时间窗口——“一参一控”整改的最后期限是 2026 年 5 月。 [3]</p>\n<p>方正证券的 2025 年年报证实了这步棋的价值：营收 105.04 亿，同比增长 36.08%；净利润 39.70 亿，同比暴增 79.85%。 [4] 这家公司被破产的母公司拖累了多年——方正集团自 2019 年爆出债务危机，融资能力和人才吸引力都大打折扣。平安在这个节点入主，某种程度上是在“抄底”：以较低价格拿到了一个资产质量尚可的券商壳资源和完整的业务线。整合后的新平安证券将拥有 500 家以上营业部、近 3,000 万客户，合计营收约 200 到 250 亿、净利润 60 到 80 亿——挤进前十。不过，两家公司的文化差异、IT 系统融合、业务重叠导致的裁员——任何一条都够管理层头疼好几年。 [5]</p>\n<p>方正证券并非生来就是被拯救的角色。它的前身是1988年成立的浙江证券——中国最早的一批证券公司之一。2002年被方正集团收购后更名，随后二十年里经历了三轮命运转折：从区域小券商到全国玩家的扩张，到股东内斗引发的漫长衰退，再到最终被平安收入囊中。 [12]</p>\n<p>第一轮转折发生在2008至2009年：方正证券收购了泰阳证券，营业部从湖南省扩张至全国。第二轮转折更为关键——2014年，它以近130亿元的价格发行股份收购民族证券100%股权，资产规模翻倍。2015年A股牛市叠加并购红利，方正证券营收首次突码100亿元，归母净利润创下40.64亿元的历史纪录。那一年，它的经纪业务手续费收入就高达69亿元，占总收入超过63%。 [12]</p>\n<p>但收购带来的不只有规模，还有隐患。民族证券原大股东政泉控股以强迫交易手段骗取股权后进入方正证券股东行列，双方从董事会控制权到财务审计全面爆发冲突。民族证券20.5亿元资金被挪用，方正证券2014年报因此被出具非标审计意见。股东纠纷导致公司2016至2017年连续两年评级为C类，网点新设被暂停，融资成本居高不下——那七年，管理层称之为“背着历史包袂艰难前行的七年”。 [12]</p>\n<p>屋漏偏逢连夜雨。2018年行业股票质押风险集中爆发，方正证券营收跌至57.23亿元。2019年，控股股东方正集团一箔20亿元超短期融资券违约引爆债务危机。2020年2月，方正集团被北京市第一中级人民法院裁定破产重整——一家年营收近百亿的券商，被母公司的债务拖入了长达三年的停滞期。 [13]</p>\n<h2 class=\"rh\">第三章 券商江湖座次</h2>\n<p>中国券业的江湖座次，从来不靠和气分蛋糕。2025 年中信证券以 749 亿营收、301 亿净利润稳居第一——营收几乎是第十名的五倍。国泰君安 631 亿排第二，华泰 358 亿排第三。前十的门槛大约在 200 亿——这正是合并后平安证券即将踏入的位置。 [4]</p>\n<p>三个梯队泾渭分明：中信和国君独享 600 亿以上的第一梯队；华泰、广发、中金在 250 到 360 亿区间构成第二梯队；银河、招商、申万、海通以及即将进场的新平安，挤在 200 到 280 亿的第三梯队。但在座次表的背面，投资银行能力、研究深度和交易技术才是真正的竞争壁垒——这些不是靠“生态”就能快速补齐的。 [6]</p>\n<h2 class=\"rh\">第四章 平安生态的养分与代价</h2>\n<p>平安集团的客户池是一个让所有同业眼红的数字：超过 2.3 亿个人零售客户、超过 6,000 万企业客户。 [7] 理论上，平安证券可以从这个池子里零成本导流。这个逻辑在部分业务上确实成立——平安证券的零售客户中有相当比例来自平安银行的转化，代销基金中平安资管和平安基金的占比也明显高于同业。然而，交叉销售在券商业务上远不如保险那么顺手。目前平安证券对集团客户的渗透率只有 3% 到 5%，而且按行业经验，达到 8% 到 10% 之后获客成本就会急剧上升——生态的边际效应终将递减到零。 [7]</p>\n<p>生态还有暗面，叫利益冲突。当平安集团持有某些上市公司的股份，平安银行正在给某些企业放贷——这时候，平安证券的研究员还能给这些公司出“卖出”评级吗？2023 年的一次内部会议上，一位分析师当面问出了这个问题。没有得到正面回答。 [8] 任何关于“独立性”的疑虑，都会直接影响分仓佣金收入。而研究所，恰恰是平安证券与方正证券合并后最需要强化的部门之一。</p>\n<h2 class=\"rh\">第五章 投行还是经纪：两条腿走路</h2>\n<p>券商的业务大致分两条腿：一条是面向机构客户的投资银行——做 IPO、债券承销、并购；另一条是面向零售客户的经纪与财富管理——股票交易、基金代销、融资融券。</p>\n<p>平安证券的两条腿，走得不快不慢。投行方面，2024 到 2025 年完成了约 12 到 15 个 IPO 项目，承销金额排名 12 到 15 位。最大的短板是大型项目——在中信、中金、华泰主导的百亿级 IPO 市场中，平安证券几乎没有独立完成过大项目。这个短板和集团身份有微妙关系：平安集团本身就是许多拟上市公司的战略投资者，为了保持独立性，IPO 主承销商通常由独立券商担任——平安证券因此被排除在外。 [9]</p>\n<p>经纪业务是平安证券最强的一块。2025 年股票基金交易额约 10 到 12 万亿元，市占率约 3.5%，排名第 8 到 10 位。信用业务余额约 400 到 500 亿，同样排进前十。增速最快的是资管——主动管理规模约 2,000 亿，增长约 30%，利润率远高于经纪业务，是未来几年最有希望提排名的方向。 [9]</p>\n<h2 class=\"rh\">第六章 中国券业整合的终局</h2>\n<p>2020 到 2025 年，中国证券行业经历了一轮历史性的洗牌。中信吞下广州证券，国泰君安合并了上海证券，中国银河收购联昌证券，浙商拿下了国都证券…… [10] 监管的意图很明确：减少无序竞争，推动形成 1 到 2 家航母级券商、5 到 8 家特色化大型券商，外加若干中小券商的行业格局。平安与方正的整合是这轮潮中最特别的一起——涉及破产企业资产处置，而且是唯一一个由保险公司主导的券商并购。</p>\n<p>整合完成后，券商行业将只剩下中信一家“超级头部”（749 亿），其余 5 到 8 家大型券商形成一个“追赶者集团”（200 到 600 亿），再往下是 100 多家中小券商。 [10] 对平安证券而言，整合方正后的三年（2026 到 2029）将是决定性的。交易系统和 App 要合并，投行团队和研究所要扩充，承销能力要提升——每一项都是硬骨头。这些投入在平安集团的资产负债表上不算什么，但对平安证券自己来说，是成立以来最大的一次补课。</p>\n<h2 class=\"rh\">第七章 注册制时代的投行竞速</h2>\n<p>2023 年 A 股全面注册制落地。IPO 从监管部门审批变为交易所审核加证监会注册，上市周期从一到三年缩短到六到十二个月。注册制改变了投行的游戏规则：核心能力从“做材料等过会”变成了“定价加销售”，要求投行拥有强大的行业研究团队和机构销售网络。 [11]</p>\n<p>这对平安证券是一个结构性利好。平安集团的客群中天然包含大量机构买方——如果平安证券能打通内部协同，让平安资管成为其 IPO 项目的基石投资者，就能获得同业难以复制的优势。然而，这又回到了那个老问题：独立性。平安资管既是承销商的关联方又是报价买方时，合规审查格外严格。而且近年来头部券商投行收入的集中度持续上升——2020 年前五大券商投行收入占比约 40%，2025 年已升至约 55%。 [11] 注册制并没有普惠中小券商，反而因为大项目争夺加剧，强化了头部效应。平安证券必须在两到三个细分行业——比如消费、医疗、科技——建立不可替代的行业认知。这不是生态能解决的，需要真金白银砸出团队。</p>\n<p>第八章 没有自己的股票代码 回到那个最根本的标识：平安证券没有自己的股票代码。在中国前十大券商中，这是独一份。中信是 600030，华泰是 601688——投资者可以买入每一家头部券商的股票，直接分享它们的成长。但平安证券只能通过中国平安的股价来间接持有。而中国平安是一个包含保险、银行、资管、科技和证券的综合体——它的股价波动并不告诉你平安证券到底值多少钱。</p>\n<p>这种结构在牛市中让人踏实——证券的高弹性被集团的整体估值包住了；在熊市中却让人困惑——亏损也被集团的大数兜底了，真实的风险暴露看不清楚。2024 年券商股大涨，中信和华泰股价涨了超过 50%。但这轮行情里，“平安证券”的业绩贡献被淹在集团的大数字中，投资者看不到、也拆不出来。一个年营收将达 200 到 250 亿的证券公司没有自己的股票代码——这是它最独特的标识，既是获得集团全部养分的通道，也是它作为独立个体永远跨不过去的边界。</p>\n<h2 class=\"rh\">尾声：棋子的宿命</h2>\n<p>棋子的宿命是什么？不是不够强，而是永远不知道下一手会落在哪里。平安证券今天站在一个转折点上：刚吞下一个破产重组的对手，跻身前十；背靠中国最大的综合金融集团，坐拥 2.3 亿潜在客户；面对注册制带来的结构性机会。但所有这些变量，都改变不了一个底层事实——这家年营收 200 多亿的证券公司，没有自己的股票代码。在中国前十大券商里，它是唯一一家不能直接为投资者所拥有的公司。中信的代码是 600030，华泰是 601688——你可以买入它们的股份、分享它们的利润、甚至参与它们的治理。而平安证券的钥匙不在市场手里，在集团的棋盘上。棋子的好处是有人替你扛风险；棋子的代价是你不知道下一手在哪里——甚至不知道，下一局还有没有你。</p>", "hits": []}, {"key": "2026-07-23_基金灰色操作", "title": "接盘的逻辑：从建滔配售看公募基金的利益链", "company": "基金灰色操作", "date": "2026-07-23", "n_src": 7, "nosource": false, "rate": 0.9, "rate_direct": 0.5, "rate_partial": 0.0, "rate_paraphrase": 0.4, "src_files": ["2026-07-23_基金灰色操作/原始资料/招股书年报/年报_建滔集团_2026配售协议.md", "2026-07-23_基金灰色操作/原始资料/研报数据/监管_裁判文书网_老鼠仓判例.md", "2026-07-23_基金灰色操作/原始资料/研报数据/监管_证监会_新股发行体制改革2014.md", "2026-07-23_基金灰色操作/原始资料/研报数据/监管_证监会_运作管理办法.md", "2026-07-23_基金灰色操作/原始资料/研报数据/监管_香港证监会_操守准则.md", "2026-07-23_基金灰色操作/原始资料/研报数据/研报_花旗_建滔目标价.md", "2026-07-23_基金灰色操作/原始资料/研报数据/行情_建滔积层板_股价.md"], "src_hits": {"2026-07-23_基金灰色操作/原始资料/研报数据/监管_证监会_运作管理办法.md": 3, "2026-07-23_基金灰色操作/原始资料/研报数据/研报_花旗_建滔目标价.md": 1}, "body_html": "<h1 class=\"rh\">接盘的逻辑： 从建滔配售看公募基金的利益链</h1>\n<p>2026年3月，全市场仅有8家公募机构持有建滔积层板股份，涉及9只基金产品，合计持仓1627万股。 [1] 三个月后的二季度末，这个数字变成了50家机构、209只产品。持仓机构数量翻了6倍，产品数量翻了23倍——而同期建滔积层板的股价，从107港元的历史高点跌到了不到40港元。这也是一轮标准的&quot;接盘&quot;周期，周期里的每一环，都有它的逻辑。</p>\n<p>触发整个链条的，是建滔集团的一纸公告。6月17日，建滔集团宣布与花旗（Citigroup）及美林（Merrill Lynch）签订大宗交易协议，按76港元/股的价格对外配售1.55亿股建滔积层板，套现金额高达117.8亿港元。 [2] 大股东要在&quot;好十年&quot;中把股份换成现金，花旗和美林是中介，公募基金——被推销的那一方——则站在了产业链的末端。</p>\n<p>49家基金公司（汇添富除外）在二季度合计净增持1.77亿股。扣除误差，这个数字与1.55亿股的配售量惊人地接近。 [1] 中欧基金和大成基金是最大的接盘者，仅这两家就承接超过50亿港元。 [1] 而建滔积层板在配售后不久就从约92港元急跌至不足40港元， [3] 跌幅超过50%。接盘的基金们，在持有不到一个月的时间里，亏损已以数十亿计。承担这些亏损的，不是基金经理，是基民。</p>\n<h2 class=\"rh\">第一章 数字里的巧合</h2>\n<p>公募基金每个季度的持仓报告，把建滔配售的承接方暴露在市场眼前。一季度的数据是一个干净的起点：合计1627万股，其中汇添富基金一家就占了1151万股。 [1] 其余7家机构一共只持有不到500万股。建滔积层板在当时，是一支被公募冷落的股票。</p>\n<p>数据来源：各基金公司2026年一季报、二季报，由独立财经博主小明哥讲套利汇总整理。 [1]</p>\n<p>到了二季度末，持仓总量从1627万股暴增至约1.93亿股，增长超10倍。其中的变化几乎全发生在6月——因为建滔积层板的大宗配售交易在6月17日公告、6月22日执行。 [2] 在不到10天的时间里，几十家公募基金同时将这只此前几乎无人问津的港股列入了重仓名单。</p>\n<p>更关键的对比是：汇添富——一季度最大的建滔持有人——在二季度大幅减持了建滔。 [1] 它是49家基金公司中唯一净卖出的。换言之，在花旗推销配售股份的过程中，已有持仓者用撤退投票，而新入场者集体接了棒。</p>\n<p>将49家基金的净增持量（约1.77亿股）与大股东配售量（1.55亿股）并列，两组数字几乎完美对应。 [1] [2] 1.55亿股中，扣除承销商留存、少量国际配售部分，面向境内公募的分销量与1.77亿股高度吻合。调查团队未假定每一股配售都进了公募口袋，但从持仓数据出发，这一批公募基金至少接走了配售盘的大头。</p>\n<p>两种数据来源口径不完全一致（配售公告 vs 基金持仓报告），但总趋势高度吻合。 [1] [2]</p>\n<p>中欧基金和大成基金是最大的承接方。中欧旗下中欧信息科技A（代码023451）和大成旗下大成科技创新A（代码008988）是重仓建滔最集中的产品。 [1] 这两只基金的净值在随后的建滔暴跌中，跌幅甚至超过了最先被舆论关注到的鹏华160644。回头看，鹏华之所以成为焦点，不过是因为它的持仓比例突破了所谓的&quot;双十限制&quot;——即证监会《<mark class=\"direct\" data-hit=\"0\">公开募集证券投资基金运作管理办法》</mark>第三十二条规定的&quot;<mark class=\"direct\" data-hit=\"1\">一只基金持有一家公司发行的证券，其市值</mark><mark class=\"paraphrase\" data-hit=\"2\">不得超过基金资产净值的10%&quot;的红线。 [</mark>5] 而其他49家基金公司虽然参与了配售，持仓比例恰好被规则的自然限制保护了——它们可能也在红线上摇摆，但未像鹏华那样突破到20%的惊人水平。</p>\n<p>然而，双十限制真的锁得住这些基金吗？这里有一个关键的合规灰色地带：按规定，因市场波动导致被动超限的，基金公司可在10个交易日内调整。 [5] 鹏华的建滔仓位是通过配售主动建仓的——初始买入量就已摊在桌面上，不存在&quot;被动&quot;一说。但如果建仓时只买到9.9%，随后因净值下降或股价上涨&quot;被动&quot;突破红线，那就正好落在了合规缝隙里。更关键的是：即使确认违规，最可能的处理结果只是监管谈话、责令整改——罚款金额远低于配售操作带来的管理费和排名收益。 [5] 这个&quot;合规-违规&quot;之间的模糊地带，才是灰产得以长期存在的制度土壤。</p>\n<h2 class=\"rh\">第二章 花旗的角色：投行与推手</h2>\n<p>整件事中，花旗的角色最值得拆解。它身兼二职：既是配售的中介——建滔集团与它和美林签订大宗交易协议，由它们寻找买家；又是一家覆盖建滔的研究机构，在交易前后不断发布乐观的股价预测。 [3]</p>\n<p>配售价格定在76港元，相对于公告前一日市场价约92港元，折价约17%。这是一个对买方有诱惑力的折扣——按常理，17%的折价是安全垫。公募基金的管理人们，面对的数学是这样的：以76港元买入，92港元市价已经给了17%的安全垫，花旗的目标价是120港元，那意味着还有30%的上涨空间。 [3]</p>\n<p>更耐人寻味的操作在7月。建滔积层板从配售后的股价高点107.2港元急跌至73.85港元，跌幅超过30%。就在此时，花旗反其道而行，将建滔积层板的目标价上调至130港元。 [3] 研报称，AI算力需求将推动覆铜板行业进入&quot;超级周期&quot;。而在研报发布后的数周内，建滔股价继续暴跌，最低跌至不足40港元。 [3]</p>\n<p>投行同时扮演&quot;配售承销商&quot;和&quot;研究覆盖者&quot;两个角色，利益冲突是天然的。配售成功=承销费到手，之后股价涨跌与研究部门声誉之间的关联，远不如一笔数十亿港元的交易佣金来得直接。 [4] 花旗在香港受证监会（SFC）监管，SFC的《操守准则》要求分析师报告须保持客观，不允许投行部门干预研究结论。但一个目标价在股价跌30%后反而上调30%的分析报告——是否满足&quot;客观&quot;标准，自有公论。</p>\n<p>但一个更深层的问题被掩埋在这里： 为什么是花旗？其他基金经理为什么愿意听花旗的？</p>\n<p>先说花旗为什么能做成这件事。建滔积层板在2026年并非第一次由花旗操盘配售—— 3月，同样是花旗担任配售代理，以21港元/股配售1.3亿股，为建滔集团套现约27亿港元 。 [2] 那一次配售之后，建滔积层板股价从23港元涨至6月的90港元以上——早期接盘方赚了钱，花旗与建滔的信任关系也就此建立。6月的第二次配售（76港元配售1.55亿股），花旗已经是建滔的老搭档了。两次配售间隔不到三个月，累计套现近145亿港元，配售代理都是花旗。 [2]</p>\n<p>而7月初——当建滔股价已从107跌至73时——花旗逆势将目标价从120港元上调至130港元，理由是&quot;涨价函幅度超预期&quot;。 [3] 到了7月23日，建滔股价已跌破40港元，花旗仍发研报称&quot;股价跌幅过度，市盈率仅8至9倍，跌幅显然过度&quot;，<mark class=\"paraphrase\" data-hit=\"3\">维持买入评级和130港元目标价。 [</mark>3] 换句话说，花旗的研报从配售前的乐观、到配售后的逆势看多、再到股价暴跌后的坚持不变——三个阶段从未改变过方向。</p>\n<p>再说基金经理为什么愿意接盘。拆开来看，至少有三层压力在起作用。</p>\n<p>第一层是信息依赖。 建滔积层板是港股通标的，境内基金公司对其的研究覆盖非常有限。花旗作为覆盖建滔多年的外资投行，它的研报——无论是基本面分析还是目标价——是大多数基金公司获取这家公司信息的主要来源。当中介同时是信息提供者，买方就很难做出真正独立的判断。 [4]</p>\n<p>第二层是排名压力。 公募基金经理的考核以相对排名为核心指标。当花旗向几十家基金公司同时推销配售股份时，每个基金经理面对的局面都是一样的：如果接了，大家一起买，涨了皆大欢喜、跌了法不责众；如果不接，别人接了而股价涨了，自己的产品就跑输了。在集体行动的逻辑下，不接盘的风险比接盘更大。 [10]</p>\n<p>第三层是折价幻觉。 17%的配售折扣看起来是一道安全垫——用76港元买入市价92港元的股票，天然就有17%的浮盈。但安全垫只在可以立即卖出时才有意义：配售股份需要交割时间才能到基金账户，期间的股价波动只能承受。更致命的是：当50家基金同时持有了同一只股票，且大股东已经减持完毕，市场上不再有&quot;维护者&quot;时， 接盘的接盘，没有下一轮 。</p>\n<p>这层层叠在一起，就构成了花旗为何能做成、基金为何愿意接的完整拼图。它不是一个人为的阴谋，它是一个制度性的合谋：每一方都在自己的利益约束中做出了理性决策，但这些理性决策的总和，导向了一个非理性的结果。</p>\n<h2 class=\"rh\">第三章 亏损链条：从配售到崩盘</h2>\n<p>配售之后，建滔积层板的股价经历了三个阶段：先冲高至107港元——高出配售价40%——再急转直下，在数周内跌破配售价，最终触及40港元以下。 [3] 按照76港元的配售成本计算，到7月下旬，接盘公募基金的浮亏已超过47%。</p>\n<p>鹏华基金的产品160644是最先被舆论曝光的。原因在于，这只基金持有的建滔仓位占基金净值的比例接近20%， [1] 明显违反了&quot;双十限制&quot;。</p>\n<p>但鹏华只是冰山一角。中欧信息科技A和大成科技创新A的跌幅，按基金净值计算甚至更深。 [1] 这两只基金因为成立时间较短、规模中等，建滔持仓占其净值的比例也很高。</p>\n<p>股价数据来源：港交所公开行情，根据市场报道还原大致走势。 [3]</p>\n<p>由于2026年二季报是截至6月30日的数据，而建滔的暴跌发生在7月，因此二季报中完全看不到任何&quot;踩雷&quot;的痕迹。公募基金三季报要等到10月才披露——建滔积层板的亏损在这三个月里是一笔&quot;沉默的浮亏&quot;，只有基金的每日净值在忠实地记录它。普通基民看到的，只是自己持有的基金净值莫名其妙地下跌，却很少有人知道跌因是一只配售来的港股。 [1]</p>\n<p>而汇添富，一季度最大的建滔持有人，在二季度大幅减持——据市场分析，减持比例超过50%。 [1] 一位基民在社交平台上评论道：</p>\n<blockquote>&quot;汇添富在一季度是重仓，二季度减仓一半，神来之笔。关键是，只有他们一家是减仓的。&quot; [6]</blockquote>\n<p>这条评论之所以重要，不是因为它揭示了什么内幕——它揭示的是一个更朴素的道理：在一场50家基金集体捧场的接盘游戏中，唯一离场的恰好是持有最久、最了解这只股票的人。汇添富未必提前知道配售细节，但它在二季度的主动减仓，客观上表达了与花旗&quot;目标价130港元&quot;截然不同的判断。而这个判断，在三个月的持仓数据公布后才被公众看到——届时股价已从107跌至40以下。</p>\n<h2 class=\"rh\">第四章 这不是第一次：灰色接盘的历史</h2>\n<p>建滔配售事件的框架——大股东减持 → 投行承销 → 公募基金接盘 → 基民消化亏损——在中国资本市场并非孤例。它属于一种长期存在的灰色操作模式，业内称为&quot;接盘&quot;。</p>\n<p>时间： 2022年</p>\n<p>手法： FG基金通过旗下管理的多个产品账户，在二级市场承接某医药股大股东的减持股份。与建滔案如出一辙——大股东高位套现，基金以&quot;组合投资&quot;之名进场。</p>\n<p>结局： 股价随热门赛道退潮下跌，基民承担实质性损失。唯一区别：FG基金的操作发生在A股，标的是&quot;抗疫概念&quot;医药股，当时同样顶着热门赛道的光环。</p>\n<p>时间： 2020年至2023年</p>\n<p>手法： 部分基金公司在发行行业ETF时，将持有大股东拟减持股份的股票直接纳入ETF底层资产。由于ETF/指数基金不受&quot;双十限制&quot;约束（法规明确豁免），这个操作在法律上完全站得住脚。</p>\n<p>结局： 大股东完成减持、规避了减持新规的约束，ETF投资者被动接盘。因其体量庞大、涉及投资者众多，至今仍在灰色地带游走。</p>\n<p>再往前看，2009年至2014年间，数起&quot;老鼠仓&quot;案件暴露了基金行业内部人利益输送的问题。但需要说明的是，老鼠仓的实质是基金经理个人用基民的钱为自己的账户抬轿，与建滔配售案的系统性接盘有本质区别——前者是个人犯罪，后者是机构行为。</p>\n<p>从危害范围看，&quot;接盘&quot;涉及的资金量更大、受害者更多——当几十家基金公司同时参与配售接盘，波及的是数十万基民的资产，而老鼠仓的直接影响范围往往局限于单只基金的持有人。</p>\n<h2 class=\"rh\">第五章 基金灰产的谱系</h2>\n<p>接盘配售只是基金行业灰色操作的一种。如果把这二十年的基金灰产画一张图谱，它会覆盖从个人犯罪到系统性利益输送的完整光谱。</p>\n<h3 class=\"rh\">老鼠仓：个人层面</h3>\n<p>截至2025年底，中国证监会累计查处老鼠仓案件超过150起，涉及博时、华夏、南方、嘉实、长盛等几乎所有头部基金公司。 [7] 基金经理利用未公开信息先行买入、待基金资金入场拉高后再卖出的操作，本质上就是&quot;拿基民的钱给自己抬轿&quot;。这种操作让基金持有者承担了高买的风险，却让基金经理及其关系人独占了收益。2010年代中期的集中查处一度遏制了势头，但新形态的&quot;老鼠仓&quot;——利用高频交易通道、通过亲属账户交易等——仍在迭代。</p>\n<h3 class=\"rh\">IPO利益输送：机构层面</h3>\n<p>公募基金作为新股询价机构的核心参与者，在IPO过程中拥有天然的信息优势。部分基金公司以&quot;研究支持&quot;为名，实际接受的卻是一级市场利益。2014年&quot;新股发行体制改革&quot;前，新股上市普遍&quot;一字板&quot;涨停，谁拿到新股配售份额，谁就拿到确定性收益。在这种制度下，基金公司如何分配IPO认购额度、是否与承销商有利益往来，至今是监管盲区。 [9]</p>\n<h3 class=\"rh\">&quot;帮忙资金&quot;与规模游戏</h3>\n<p>基金公司为了冲规模、保排名，普遍存在&quot;帮忙资金&quot;运作。简单来说：季末年末，基金公司找银行或第三方资金&quot;帮忙&quot;申购旗下基金，拉高规模数字；季报披露后，帮忙资金撤出。这种操作不违法——除非帮忙资金的成本由基金公司以&quot;交易佣金&quot;或&quot;研究服务费&quot;的方式回馈出去。 [10] 2020年，监管层曾对部分基金公司涉嫌&quot;佣金换规模&quot;展开调查，但最终落地处罚的寥寥无几。</p>\n<h3 class=\"rh\">券商分仓佣金：隐性的利益链</h3>\n<p>公募基金每年向券商支付的交易佣金，规模在百亿级别。这笔佣金的分配，理论上基于券商的研究服务质量；实际操作中，佣金与&quot;基金帮忙接盘&quot;&quot;基金帮忙冲IPO首日&quot;&quot;券商帮忙销售基金产品&quot;之间，有一条模糊的换算关系。 [10] 2024年，监管层出台《关于加强公开募集证券投资基金证券交易费用管理的规定》，要求基金公司合理控制佣金费率——但佣金背后的利益绑定，远不是一纸规定可以切断的。</p>\n<p>综合中国证监会历年处罚公告、基金业协会纪律处分记录估算，不含未公开的行政监管措施。 [7] [8]</p>\n<h2 class=\"rh\">第六章 合规红线与监管困境</h2>\n<p>建滔配售案中，鹏华160644的持仓比例接近20%，是&quot;双十限制&quot;被突破最极端的例子。但更值得追问的不是鹏华突破了它——而是为什么突破之后，没有人需要承担实质性的后果。</p>\n<p>正如前文所述，持仓超限未必全是恶意。按规定，因市场波动导致被动超限的，基金公司应在10个交易日内调整到位。如果初始建仓时合规、随后因基金净值下降或股价上涨导致持仓占比被动&quot;超标&quot;，基金公司可以援引这条规定免责。但问题在于：鹏华的情况更像是初始建仓量就已经逼近红线——不是&quot;被动&quot;超限，而是主动设计的结果。 [5]</p>\n<p>更深层的问题是：建滔配售本身的合规性。大股东通过花旗和美林以大宗交易方式配售股份，这个行为本身是合法的。但當配售的下家高度集中于公募基金——且是通过花旗一方的&quot;推销&quot;和&quot;研究支持&quot;完成时——问题的性质就变了。关键点在于：基金公司做出买入决策的依据是什么？是投行的目标价，还是独立的内部研究？ [4]</p>\n<p>一位不愿具名的前公募基金经理向调查团队的朋友圈表示：</p>\n<blockquote>&quot;配售股份的推销通常很直接——投行给你打电话，说某某大股东要减持，折扣好，基本面有故事，问你接不接。决策时间很短，可能就是几小时。你如果没有自己的深度研究，就只能信投行的报告。问题是，你同时还要考虑——如果不接，别人接了，产品业绩跑不过同行怎么办？&quot; [10]</blockquote>\n<p>这段话点出了&quot;接盘&quot;行为的制度温床：公募基金行业的短期排名压力、基金经理的信息依赖、投行的双重身份，共同构成了一个系统性的利益输送通道。每一条单独看都不是重罪，但串在一起，就成了一个吞噬基民财富的机器。</p>\n<h2 class=\"rh\">第七章 制度的裂缝</h2>\n<p>建滔配售暴露的，不只是单个基金公司的风控瑕疵，而是一组制度的裂缝。这些裂缝长期存在于中国公募基金行业的管理结构之中，往往只在某次极端事件中才会被外界看见。</p>\n<p>第一道裂缝是激励扭曲。公募基金经理的收入与两个指标挂钩——管理规模和相对排名。规模越大、排名越靠前，收入越高。而这两项指标都与长期投资回报关系不大。在巨量资金追逐少数热门标的时，&quot;抱团&quot;成为基金经理的理性选择：同样的股票，别人买了你沒买，涨了你就跑输；别人没买你买了，跌了你就背锅。 [10] 建滔配售时50家基金公司同时杀入，正是一次典型的集体行动——每一次集体行动，都意味着没有人在独立思考。</p>\n<p>第二道裂缝是研究独立性的缺失。头部基金公司虽然有自己的研究团队，但在港股通标的上，外方投行的研究覆盖往往是信息的主要来源。当中介同时是推销员，分析师报告就成了销售材料——其客观性天然存疑。花旗能在建滔股价跌30%后反向调高目标价至130港元，这份报告在法理上属于研究产出，在实际效果上却是对配售接盘方的变相&quot;安抚&quot;。 [3] [4]</p>\n<p>第三道裂缝是披露的滞后性。公募基金季报在每个季度结束后15个工作日内披露。建滔积层板的配售6月22日执行，暴跌7月集中发生，而投资者在当季持仓报告（7月中下旬）中才能看到完整的配售建仓数据。 [1] 等到全社会知道发生了什么，亏损已经固化。投资者获取信息的权利，在信息披露的时间差中被消解了。</p>\n<p>第四道裂缝是违规成本过低。以老鼠仓为例，马乐案涉案金额超10亿元，最终量刑为有期徒刑3年缓刑5年——此后马乐并未实际服刑。 [8] 相比于一只基金动辄数十亿元的亏损规模，对基金经理个人的处罚力度远未形成有效威慑。对于机构层面的违规行为——如鹏华违反&quot;双十限制&quot;——最常见的处理方式是监管谈话、责令整改，罚款上限远低于违规操作的潜在收益。 [5]</p>\n<p>需要说明：花旗的承销费、49家基金公司的管理费收入本身是合法收入。把它们放在这里与处罚金额并列，目的是展示即使是最保守估计的制度性&quot;收益&quot;，也远远超过违规处罚的理论上限。三者之间的倍差，才是灰产滋生的根因。数据为市场估测范围，非精确值。 [5][8][10]</p>\n<h2 class=\"rh\">尾声：基民的钱去了哪里</h2>\n<p>读完这篇调查，你可能会问几个问题——它们也是我们在写作过程中不断追问自己的。</p>\n<h3 class=\"rh\">第一个问题：谁在赚钱？</h3>\n<p>把建滔配售案从头算一遍： 大股东套现117.8亿港元 ，花旗和美林赚了承销费（按惯例约2%-3%，即约2.4亿至3.5亿港元），49家基金公司则持续收取管理费——以中欧和大成两家合计承接超过68亿元规模的资产计算，每年产生的管理费就超过1亿元。而基民——买入这些基金的投资者——承担的是超过30%的净值回撤。一个简化的答案是： 每一方都在自己的逻辑里做出了理性决策——只有承担损失的那一方，根本不在决策桌上 。</p>\n<h3 class=\"rh\">第二个问题：基民能提前识破这种&quot;接盘&quot;吗？</h3>\n<p>很难。公募基金季报在每个季度结束后15个工作日才披露，而配售到暴跌之间的窗口期只有几周。当基民在7月中下旬看到二季报时，配售已于6月完成，股价已从107跌至70以下。 信息披露的滞后性，是基民保护自己的最大障碍 。但有一个信号值得留意：如果一只基金突然集中买入一支此前无人问津的股票、且仓位异常集中，即使季报没出，单日净值异动也可以作为预警。</p>\n<h3 class=\"rh\">第三个问题：监管为什么抓不住？</h3>\n<p>因为建滔配售案中的每一个环节——大股东配售、投行承销、公募接盘—— 在单独审视时几乎都是合法的 。配售是合法的融资方式，投行发研报是分内之事，基金经理决定买什么股票属于投资自主权。问题出在这些环节串在一起时产生的系统性效应：投行既是承销商又是分析师、基金公司决策依赖外部研报且考核短期化、信息披露滞后。每一道防线单独看都没破，但串在一起时就漏了。</p>\n<h3 class=\"rh\">第四个问题：它会继续发生吗？</h3>\n<p>只要公募基金的考核机制还在追逐相对排名，只要投行的&quot;研究&quot;与&quot;配售&quot;还可以同台演绎，只要基民获取持仓信息的窗口期永远是&quot;事后&quot;——这套模式就会继续运转。建滔案不是第一起，也不会是最后一起。</p>\n<p>基民唯一能做的，就是意识到一个事实：在基金公司赚钱的众多方式中，为你的资产增值只是其中之一，且未必是优先级最高的那个。</p>\n<p>本文所引数据均来自基金公司公开披露报告、港交所公告、社交平台公开信息及历史公开报道，详见文末注释。部分内容引用自独立财经自媒体&quot;小明哥讲套利&quot;的整理分析。投资有风险，本文不构成任何投资建议。</p>", "hits": [{"type": "direct", "src": "2026-07-23_基金灰色操作/原始资料/研报数据/监管_证监会_运作管理办法.md", "core": "公开募集证券投资基金运作管理办", "art": "中欧基金和大成基金是最大的承接方。中欧旗下中欧信息科技A（代码023451）和大成旗下大成科技创新A（代码008988）是重仓建滔最集中的产品。 [1] 这两只", "srcc": "抓取日期20260725原标题公开募集证券投资基金运作管理办法2014年7月7日证监会令第104号公布自201", "sim": 1.0, "len": 16}, {"type": "direct", "src": "2026-07-23_基金灰色操作/原始资料/研报数据/监管_证监会_运作管理办法.md", "core": "一只基金持有一家公司发行的证券", "art": "中欧基金和大成基金是最大的承接方。中欧旗下中欧信息科技A（代码023451）和大成旗下大成科技创新A（代码008988）是重仓建滔最集中的产品。 [1] 这两只", "srcc": "财产进行证券投资不得有的情形一一只基金持有一家公司发行的证券其市值超过基金资产净值的百分之十二同一基金管理人管", "sim": 1.0, "len": 18}, {"type": "paraphrase", "src": "2026-07-23_基金灰色操作/原始资料/研报数据/监管_证监会_运作管理办法.md", "core": "其市值超过基金资产净值的百分之十；", "art": "其市值不得超过基金资产净值的10%&quot;的红线。", "srcc": "其市值超过基金资产净值的百分之十；", "sim": 0.603, "len": 19}, {"type": "paraphrase", "src": "2026-07-23_基金灰色操作/原始资料/研报数据/研报_花旗_建滔目标价.md", "core": " - 评级与目标价：重申\"买入\"评级，目标价维持 130 港元。", "art": "维持买入评级和130港元目标价。", "srcc": " - 评级与目标价：重申&quot;买入&quot;评级，目标价维持 130 港元。", "sim": 0.891, "len": 15}]}, {"key": "2026-07-23_融通基金", "title": "\"老十三\"的二次创业：融通基金的央企转型账本", "company": "融通基金", "date": "2026-07-23", "n_src": 13, "nosource": false, "rate": 6.4, "rate_direct": 0.4, "rate_partial": 1.2, "rate_paraphrase": 4.8, "src_files": ["2026-07-23_融通基金/原始资料/监管_证监会_核准诚通成为实控人.md", "2026-07-23_融通基金/原始资料/招股书年报/年报_融通基金_2025业绩.md", "2026-07-23_融通基金/原始资料/研报数据/研报_基金业协会_公募管理人规模排名.md", "2026-07-23_融通基金/原始资料/研报数据/研报_天眼查_融通基金工商信息.md", "2026-07-23_融通基金/原始资料/研报数据/研报_银河证券_2025年度业绩排名.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_全景网_党建引领治理升级.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_天下财道_高层震荡规模掉队.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_机构之家_督察长财务负责人卸任.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_经济参考报_产品布局转型持续推进.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_腾讯新闻_诚通证券新舵手落定.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_财中社_万民远二季度亏3.18亿.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_财中社_邹曦清仓式卸任.md", "2026-07-23_融通基金/原始资料/舆情网页/舆情_财联社_新时代证券变身央企子公司.md"], "src_hits": {"2026-07-23_融通基金/原始资料/舆情网页/舆情_财中社_邹曦清仓式卸任.md": 1, "2026-07-23_融通基金/原始资料/舆情网页/舆情_机构之家_督察长财务负责人卸任.md": 5, "2026-07-23_融通基金/原始资料/舆情网页/舆情_全景网_党建引领治理升级.md": 6, "2026-07-23_融通基金/原始资料/舆情网页/舆情_财中社_万民远二季度亏3.18亿.md": 6, "2026-07-23_融通基金/原始资料/舆情网页/舆情_经济参考报_产品布局转型持续推进.md": 3, "2026-07-23_融通基金/原始资料/舆情网页/舆情_天下财道_高层震荡规模掉队.md": 2}, "body_html": "<h1 class=\"rh\">&quot;老十三&quot;的二次创业：融通基金的央企转型账本</h1>\n<p>2001年5月，深圳南山区，融通基金管理有限公司拿到了国内第13张公募基金牌照。同一年拿到批文的，还有一家名叫易方达的公司——彼时，谁也没想到24年后两家公司会走上截然不同的道路。</p>\n<p>截至2026年二季度末，融通基金公募管理规模约1,556亿元，行业排名第51位 [1] 。而易方达基金同期规模已突破2.5万亿元，排名行业第一。两家同年出生的基金公司，规模差距超过16倍。</p>\n<p>2022年，融通基金迎来了一次身份的根本性转变。其控股股东新时代证券在被接管两年后，被中国诚通控股集团以131.35亿元收购98.24%股权 [2] ，融通基金的实际控制人随之变更为国资委旗下的这家国有资本运营公司。从民营券商控股的基金公司，一夜之间成为&quot;央企系&quot;公募。</p>\n<p>&quot;<mark class=\"paraphrase\" data-hit=\"9\">双轮驱动&quot;——这是融通基金为这场&quot;二次创业&quot;定下的战略方向：一边服务国有资本运营，一边服务居民财富管理。</mark>三年过去，资产管理总规模确实突破了3,000亿元（含专户），但公募规模始终在1,500亿元上下徘徊 [3] 。与此同时，高管走马灯式更迭、基金经理批量出走、持有人三年累计亏损约50亿元——这些数字构成了&quot;央企转型&quot;另一面的真实图景。</p>\n<p>一家老牌基金公司拿到了&quot;央企&quot;这张新船票，却似乎仍在旧航道上颠簸。</p>\n<p>融通基金面临的并不是单一维度的挑战，而是规模、人才、产品、业绩四重压力的叠加。接下来的七章，调查团队将从规模和排名的变化讲起，逐一拆解这家&quot;老十三&quot;的转型困境。</p>\n<h2 class=\"rh\">第一章 从&quot;被接管&quot;到&quot;央企系&quot;</h2>\n<p>融通基金的故事，绕不开它的控股股东。</p>\n<p><mark class=\"paraphrase\" data-hit=\"10\">融通基金由新时代证券持股60%、日兴资产管理有限公司（后更名为奥明资产管理）持股40% [4] 。</mark>新时代证券是一家成立于2003年的民营券商，注册地北京，注册资本29.1亿元，在全国拥有63家营业部。</p>\n<p>2020年7月，因隐瞒实际控制人与持股比例、公司治理严重失衡，证监会对新时代证券实施接管，接管期一年，后延长至2022年7月 [5] 。被接管的两年间，新时代证券的业绩跌入谷底——2020年营业收入16.04亿元，同比下降17.89%，归母净利润为-1.01亿元 [6] 。</p>\n<p>2021年9月，新时代证券98.24%股权在北京产权交易所挂牌转让，底价131.35亿元。一场激烈的争夺战随之展开：西部证券、东兴证券先后抛出橄榄枝，却又先后退出。最终，中国诚通集团在2021年12月以131.35亿元的价格，拿下了新时代证券的控制权 [7] 。</p>\n<p><mark class=\"paraphrase\" data-hit=\"11\">2022年5月，融通基金宣布高峰因个人原因离任董事长，张威出任新董事长。</mark>张威来自中国诚通，曾任诚通集团金融管理部总经理，同时兼任诚通证券董事长 [8] 。&quot;张威时代&quot;就此开启。他在多个场合提出，融通基金要打造资本市场的&quot;常青树&quot;和&quot;百年老店&quot;。</p>\n<p>2024年3月，<mark class=\"paraphrase\" data-hit=\"12\">融通基金加入诚通集团后完成了公司章程的重大修订——</mark><mark class=\"partial\" data-hit=\"12\">新增及修订制度合计188项，</mark>将党的领导写入公司章程，构建起符合央企规范标准的内控管理体系 [9] 。</p>\n<p>身份变了，治理架构变了，但对于一家资产管理公司而言，市场和持有人的检验标准从未改变：业绩好不好？规模有没有增长？持有人赚到钱了吗？</p>\n<p>在融通基金的对外表述中，加入诚通集团被定义为&quot;二次创业&quot;的起点。董事长张威提出，公司要打造&quot;国有资本运营特色的一流公募机构&quot;，<mark class=\"paraphrase\" data-hit=\"13\">走&quot;双轮驱动&quot;之路——服务国有资本运营和服务居民财富管理。</mark></p>\n<p>从组织架构调整来看，融通基金确实拿出了动作：成立跨资产类别的大类资产配置投资委员会，整合各投研领域力量，建立以从业20年以上专家型基金经理为核心、以从业10年中生代基金经理为中坚力量的投研梯队 [9] 。公司还构建了&quot;指数研发—产品落地—市值提升—品牌输出&quot;的全业务链条，意图在央企主题产品上开辟差异化赛道。</p>\n<p>然而，治理架构的完善和战略方向的明确，并不等于市场业绩的立即改善。2024年，诚通证券（母公司的融通基金收入合并口径）年报显示，基金业务收入占诚通证券总营收的49.50%——融通基金是诚通证券最重要的收入来源 [10] 。这也意味着，融通基金的经营状况直接影响着诚通证券的&quot;造血能力&quot;。</p>\n<h2 class=\"rh\">第二章 规模掉队：24年没爬过的山</h2>\n<p>如果用一个指标来概括融通基金的困境，那就是管理规模。</p>\n<p>2020年三季度末，融通基金的 公募管理规模达到历史峰值约1,690亿元 [10] 。此后便一路下滑：2021年末约1,300亿元，2022年一季度一度跌破1,200亿元。即便在2022年并入诚通集团后，规模也长期在1,500亿元上下徘徊，从未回到2020年的高点。</p>\n<p>截至2026年7月，融通基金公募管理规模约1,556.63亿元 [1] 。这个数字放在全行业排名第51位——而在公司历史上的最好排名，是第39位 [11] 。</p>\n<p>与同年成立的易方达相比，差距更为触目。易方达2026年管理规模已突破2.5万亿元，行业排名第一 [12] 。两家公司相差16倍。如果把这个差距量化：融通基金每增长1元钱，易方达同期增长超过16元钱。</p>\n<p>当然，易方达是行业顶流，拿它做对标有些苛刻。但即便在同年成立的基金公司中，华夏基金规模超过1.7万亿元，南方基金超过1.2万亿元，博时基金超过1万亿元——融通基金是唯一一家管理规模仍在千亿级别徘徊的&quot;老牌&quot;公司 [13] 。</p>\n<p>更令人深思的是产品结构。截至2026年7月，融通基金旗下产品中， 货币型基金规模787.35亿元，占比高达50.5% [1] 。债券型基金319.05亿元，占比20.5%。而最能体现投研实力的权益类基金（股票型+混合型），合计仅约225亿元，占比不到15% [14] 。</p>\n<p>作为对比，行业头部基金公司的权益类占比通常在40%以上——易方达股票型和混合型合计超过1万亿元。融通基金的权益规模和它的公司规模一样，与头部公司不在一个量级。</p>\n<p>更值得关注的是趋势。融通基金的权益类管理规模在2020年之后持续缩水。2020年至2023年，其混合型基金管理规模从439.90亿元的高点一路跌至162.65亿元， 四年蒸发超过270亿元 ，降幅超过60% [15] 。股票型基金也从2020年的126.26亿元下滑至2023年的77.77亿元。虽然2025年有所回升，但远未恢复元气。</p>\n<p>这是什么原因造成的？一家基金公司的权益规模变化，通常由两个因素驱动：一是存量基金的净值变动（市场涨跌）；二是新发基金的规模和申赎行为。融通基金在这两个方面都面临挑战。</p>\n<p>在新发基金方面，融通基金近年来没有出现&quot;爆款&quot;。同花顺iFinD数据显示，融通基金2022年以来发行的主动权益类产品，首发规模多在2-10亿元之间，远低于行业&quot;日光基&quot;动辄数十亿甚至上百亿的水平 [16] 。在存量方面，<mark class=\"partial\" data-hit=\"3\">融通中国风1号灵活配置混合</mark>等产品的频繁大额赎回（2026年二季度A/B类净赎回8,057万份，赎回比例达15%），显示老产品的投资者也缺乏耐心 [22] 。</p>\n<p>这意味着，融通基金管理资产的&quot;大头&quot;是收益率较低、技术含量相对有限的货币基金。这部分规模受渠道和政策影响大，难以形成真正的竞争壁垒。一家以货币基金为&quot;主食&quot;的基金公司，其抵抗市场下行风险的能力往往较弱——货币基金的管理费率远低于权益基金，直接影响公司的收入结构。</p>\n<p>更深层的问题在于，权益投资能力是基金公司的&quot;招牌&quot;。一家不能为投资者创造超额收益的基金公司，很难在散户市场上建立起品牌认知。融通基金虽然有超过24年的历史，但品牌影响力与同年代成立的易方达、华夏、南方差距悬殊。</p>\n<h2 class=\"rh\"><mark class=\"paraphrase\" data-hit=\"14\">第三章 22亿管理费，50亿亏损</mark></h2>\n<p>管理规模增长乏力之外，另一个数字更加刺眼。</p>\n<p>据机构之家统计， 2022年至2024年的三个完整年度里，融通基金旗下公募产品为持有人造成的合计亏损约49.55亿元 。同期，融通基金收取的<mark class=\"partial\" data-hit=\"4\">管理费合计约21.93亿元 [</mark>15] 。</p>\n<p>这个&quot;剪刀差&quot;在公募行业并非融通基金独有——市场不好时，基金公司照收管理费，持有人却承担全部亏损。但2022-2024年间，全市场仍有65家、67家、147家基金公司实现了旗下产品的整体盈利 [11] 。融通基金连续三年未能入列。</p>\n<p>对此，融通基金方面的回应是：&quot;基金利润受大盘波动影响是无法逃脱的行业规律。2022-2024年上证指数分别下跌15.13%、下跌3.70%、上涨12.67%。&quot; [11] 公司同时指出，据Wind统计，2025年前三季度融通基金公募基金利润合计98亿元。</p>\n<p>2025年确实是融通基金的&quot;翻身年&quot;。据银河证券数据，融通产业趋势全年业绩114.61%，位列全市场股票型基金第1名；<mark class=\"partial\" data-hit=\"5\">融通新能源全年回报75.80%，</mark>位列新能源主题基金第1名；<mark class=\"paraphrase\" data-hit=\"15\">融通稳信增益全年回报39.79%，位列普通偏债型基金第1名 [16] 。</mark>三个&quot;第一&quot;的含金量不低。</p>\n<p>但投资者不禁要问：2025年的高光能否持续？进入2026年，答案似乎并不乐观。</p>\n<p>这个&quot;剪刀差&quot;折射出资管行业一个结构性的矛盾：在代客理财的商业模式中，无论市场涨跌，基金公司都按规模收取固定比例的管理费。牛市时利润丰厚的公司，在熊市中可能并未真正承担市场下跌的成本——而是由持有人承担。</p>\n<p>融通基金对此的回应指向了行业规律。但问题在于：同处一个市场，为什么2022-2024年间仍有那么多公司做到了整体盈利？融通基金的解释似乎回避了核心问题——在市场下行阶段，基金公司的主动管理能力、仓位控制能力、风险分散能力，究竟能为持有人提供多少保护？</p>\n<p>2025年的业绩反转证明融通基金旗下确实有优质基金经理和强大的爆发力。融通产业趋势全年114.61%的收益在历史上也属罕见。但2026年二季度的数据显示，这种爆发力的可持续性仍待检验。</p>\n<h2 class=\"rh\">第四章 走马灯式的高管更迭</h2>\n<p>业绩波动的背后，是融通基金持续不断的人事动荡。</p>\n<p>自2022年诚通集团入主以来，融通基金的核心管理层经历了密集变更 [17] ：</p>\n<p>同花顺iFinD数据显示， 2022年5月至今，<mark class=\"paraphrase\" data-hit=\"16\">融通基金累计有14名基金经理离职 ，</mark>而目前公司在职基金经理仅37位 [11] 。离职比例接近30%。在基金行业，正常的基金经理流动率通常在10%-15%之间，融通基金的数字远高于行业平均水平。</p>\n<p>2025年，融通基金经历了两起备受关注的明星基金经理离职事件。</p>\n<p>邹曦 是融通基金的元老级人物，自2001年公司成立便加入，从业超过20年。然而邹曦管理的基金规模从高点缩水超过70%后，于2025年以&quot;清仓式卸任&quot;的方式离去，将旗下多只产品转交中生代基金经理 [18] 。</p>\n<p>范琨 则是另一位百亿级基金经理。她曾在融通基金管理7只产品，管理规模一度逼近110亿元，代表作融通新区域新经济任职期回报达113.84%。2025年7月，范琨正式加盟海南思瑞私募基金，从公募转向私募 [19] 。</p>\n<p>高管和基金经理的批量流失，直接动摇了融通基金的投研根基。公司曾提出的&quot;打造资本市场常青树&quot;愿景，与持续不断的核心人才出走形成鲜明反差。</p>\n<p>2025年10月，诚通证券（融通基金母公司）发布了105人的大规模招聘计划，涵盖机构业务部、投资银行总部、权益投资部等多个核心部门 [20] 。但招聘是一回事，能否留住人、能否建立稳定的投研文化，是另一回事。</p>\n<h2 class=\"rh\">第五章 明星基金经理的滑铁卢</h2>\n<p><mark class=\"paraphrase\" data-hit=\"17\">2026年7月20日，融通基金披露了权益投资总监万民远在管6只产品的二季报。</mark>数据令人侧目： 6只产品当季合计亏损3.18亿元 [21] 。</p>\n<p>6只产品中，仅<mark class=\"partial\" data-hit=\"6\">融通远见价值一年持有期混合</mark>实现正收益。其余5只全线亏损，且全部大幅跑输业绩比较基准——融通价值成长混合的超额收益为-19.47个百分点，融通鑫新成长混合为-15.24个百分点。</p>\n<p>万民远的困境折射出融通基金权益投资的一个核心矛盾：投研团队的框架和判断，与市场极端风格的严重错位。</p>\n<p><mark class=\"paraphrase\" data-hit=\"18\">万民远在二季报中坦言：&quot;</mark><mark class=\"partial\" data-hit=\"18\">本基金二季度在牛市中下跌……&quot;——</mark><mark class=\"paraphrase\" data-hit=\"18\">上证指数二季度从3,</mark>090点涨至3,480点，涨幅超过12%，但融通旗下多只权益基金却逆势下跌。 持有人的&quot;体感痛苦&quot;并非夸张 。</p>\n<p>问题在于，这并非个别基金经理的偶发失误。融通产业趋势精选混合A类二季度净值增长率-2.91%，跑输基准9.1个百分点；<mark class=\"partial\" data-hit=\"8\">融通中国风1号灵活配置混合</mark>A类过去五年净值增长率为-26.08%，而基准收益率为3.69%，超额收益为-29.77个百分点 [22] 。</p>\n<p>这些数据表明，融通基金在权益投资领域的整体投研能力存在系统性问题——而非个别基金经理的一时失手。</p>\n<p>但融通基金并非没有意识到这个问题。自2022年以来，公司持续推进&quot;<mark class=\"direct\" data-hit=\"0\">平台型、团队制、一体化、多策略&quot;投研体系</mark>建设，成立了大类资产配置投资委员会，试图将个人能力沉淀为组织能力。然而，从近年来的业绩表现看，这套体系在面对风格极端的市场时，尚未展现出预期的稳定性。</p>\n<p>在中国公募基金行业，盛极必衰、周期轮动的案例并不少见。一家基金公司某年业绩冲顶后迅速滑落，或一只冠军基金次年垫底，几乎是行业常态。融通基金2025年的三个&quot;第一&quot;和2026年二季度的亏损，或许只是这一规律的又一次验证。但问题是：当一家公司的核心投研人才持续流失，它能否建立起足够深的人才池来平抑这种波动？</p>\n<h2 class=\"rh\">第六章 债券&quot;偏科&quot;的结构之困</h2>\n<p>权益投资疲软的背面，是融通基金对固定收益类产品的日益依赖。</p>\n<p>前文已述，截至2026年7月，融通基金管理资产中货币基金占比50.5%、债券基金占比20.5%，而权益类（含混合型）占比不到15%。这意味着，融通基金本质上是一家&quot;固收驱动&quot;的资产管理公司。</p>\n<p>但这种&quot;偏科&quot;并没有带来对应的专业优势。天天基金网数据显示，截至2025年三季度末， 融通旗下债券型基金<mark class=\"direct\" data-hit=\"1\">近一年平均收益率2.74%，低于同类</mark><mark class=\"paraphrase\" data-hit=\"19\">基金3.09%的平均水平 ；近三年平均收益率9.34%，同样低于同类9.98%的平均水平 [23] 。</mark></p>\n<p>从历史趋势看，融通基金权益类管理规模经历了持续萎缩。2020年至2023年，<mark class=\"paraphrase\" data-hit=\"21\">股票型基金管理规模分别为126.26亿元、</mark>92.90亿元、76.08亿元、77.77亿元，<mark class=\"paraphrase\" data-hit=\"22\">到2025年才回升至129.34亿元，</mark>基本回到2020年水平 [4] 。混合型基金的缩水更为显著：从2020年的439.90亿元锐减至2024年的162.65亿元，降幅超过60% [24] 。</p>\n<p>权益投资做不好→基民赎回→规模缩水→管理费收入减少→投研投入受限→业绩更难提升——这个负循环一旦形成，极难打破。</p>\n<p>另一个值得关注的信号是：早在2022年，融通基金便明确提出&quot;运用FOF形式实现对各类主题风格ETF投资的主动管理&quot;的布局思路。但三年过去，公司仍未推出相关FOF产品 [23] 。在FOF（基金中的基金）已成为各大基金公司竞相布局的热门赛道的背景下，这种滞后显得格外扎眼。</p>\n<p>&quot;偏科&quot;走向极致带来的风险是显而易见的。当货币市场利率大幅下行时，融通基金的管理规模可能受到直接冲击。2025年以来，国内货币政策持续宽松，货币基金收益率中枢从2.5%降至1.8%左右，货币基金对投资者的吸引力下降，融通基金最大的规模&quot;压舱石&quot;正在面临风化。</p>\n<p>而债券投资方面，融通基金的表现也不及同业。2022-2024年，融通增益债券分别上涨8.35%、4.28%、2.66%，而同期业绩比较基准分别为0.50%、2.05%、5.00%——2024年已经跑输基准。融通四季添利债券2024年收益2.92%，而基准为5.00%，跑输超过2个百分点 [24] 。在固收这个&quot;看家&quot;领域，近年来的表现也谈不上出色。</p>\n<h2 class=\"rh\">第七章 央企拼图，拼上了吗</h2>\n<p>融通基金并非没有在&quot;二次创业&quot;中做出努力。恰恰相反，公司试图利用央企优势，开辟一条差异化发展道路。</p>\n<p>自2022年并入中国诚通以来，融通基金将&quot;服务国有资本运营&quot;写入了公司的战略核心。具体动作包括 [9] ：</p>\n<p>其一，参与指数编制。融通基金支持中国诚通编制并发布了中证诚通央企红利指数、中证诚通央企ESG指数、中证诚通央企科技创新指数、中证诚通国企战略新兴产业指数等多条指数。</p>\n<p>其二，发行央企主题ETF产品。融通基金成功发行了中证诚通央企科技创新ETF、中证诚通央企红利ETF、中证诚通央企ESG ETF及对应的联接基金，初步构建起央企主题产品矩阵。</p>\n<p>其三，打造&quot;指数研发—产品落地—市值提升—品牌输出&quot;的全业务链条。这与诚通证券的投行业务形成协同，共同服务央企客户的资本运作需求。</p>\n<p>2025年，融通基金资产管理总规模（含专户）突破3,000亿元，创下历史新高 [25] 。其中，专户资产规模达1,855.9亿元，较2024年末增加541亿元——这一增长很大程度上得益于央企委外和专户业务的拉动。</p>\n<p>然而，央企主题产品的落地并未显著改变融通基金的公募规模困境。截至2026年7月，融通基金旗下ETF产品规模约84.6亿元 [1] ，在全市场ETF规模超过3.5万亿元的背景下，占比微乎其微。</p>\n<p>换言之，央企红利主要体现在专户和机构业务上，而公募端——尤其是散户投资者最关注的权益基金领域——改善有限。</p>\n<p>2026年4月，融通基金2025年公募产品全年为投资者创造利润103.46亿元的消息被广泛报道，公司称这一成绩&quot;位居行业前25%分位&quot; [26] 。这确实是诚通入主以来的一个亮点。但紧接着的二季度亏损，又让这个亮点蒙上了阴影。</p>\n<p>值得注意的是，融通基金的央企主题产品并非纯粹的市场化选择——它们与诚通集团的支持密不可分。公司协助中国诚通编制央企系列指数，这些指数被用于发行相应的ETF产品，而诚通集团作为国有资本运营公司，有动力通过旗下基金公司引导市场资金流入央企板块。这是一种&quot;自循环&quot;式的业务模式：集团出指数→基金公司发产品→市场资金流入央企→央企估值提升→认证诚通集团资本运营能力。</p>\n<p>这套模式能否独立于集团支持而持续运作，还有待观察。毕竟，基金产品的最终买单者是市场投资者，如果没有优异的超额收益，仅靠&quot;央企&quot;的标签难以长久吸引资本。从更宏观的视角看，诚通集团入主融通基金的更深层逻辑，是国有资本运营公司通过控股金融机构来增强资本市场的定价权和话语权。融通基金的成败，不仅关系一家公司的命运，也关系这一国有金融改革路径的可行性。</p>\n<p>融通基金董事长张威曾在采访中表示，公司谋求打造的是资本市场的&quot;常青树&quot;和&quot;百年老店&quot;。但诚通集团入主三年来的频繁人事变动和业绩波动，与&quot;常青树&quot;所需要的稳定性形成了某种张力。</p>\n<h2 class=\"rh\">尾声·二次创业，行至中途</h2>\n<p>2001年5月，融通基金在深圳成立时，它的英文名Rongtong Fund Management Co., Ltd.中的&quot;Rongtong&quot;尚是一个崭新的符号。24年后，这个符号承载着&quot;央企系&quot;的新标签，也背负着规模徘徊、人事动荡、持有人争议的旧包袱。</p>\n<p>诚通集团的入主，让融通基金拿到了注册资本之外的另一重资源——央企信用背书和机构客户网络。这在专户业务和指数产品上确实带来了增长。但要彻底扭转一家老牌基金公司的投研文化、产品结构和市场认知，三年时间显然不够。</p>\n<p>2025年的&quot;三个第一名&quot;证明了融通基金在特定市场环境下仍有爆发力。但2026年二季度的亏损，又暴露出投研框架面对极端市场风格时的脆弱性。一位公募研究人士向调查团队坦言：&quot;基金公司的投研体系成熟度，不是在牛市中检验的，而是在震荡市中检验的。&quot; [26]</p>\n<p>摆在融通基金面前的三个核心问题仍然没有答案：</p>\n<p>第一，如何在留住核心人才的同时，真正建立&quot;平台型、团队制&quot;的投研体系，摆脱对个别明星基金经理的过度依赖？</p>\n<p>第二，权益投资能力的系统性短板如何弥补？产品结构过度偏重固收的局面如何改变？</p>\n<p>第三，&quot;央企&quot;这张牌能否从专户和机构业务延伸到公募端，真正惠及散户投资者？</p>\n<p>答案，或许藏在下一份季报里。</p>\n<p>融通基金的故事，本质上是中国公募基金行业&quot;两级分化&quot;的一个缩影。头部公司凭借品牌、渠道、人才的马太效应，规模不断膨胀；而中小型公司即便拥有24年历史、央企背书，依然在生存线上挣扎。在这个行业，成立时间早晚不如品牌认知度重要，牌照数量不如投研能力重要，股东背景不如业绩持续性重要。</p>\n<p>截至本文发稿，融通基金仍在推进其2026年的各项战略部署——包括央企指数产品的持续扩充、投研平台化的深化以及海外业务的拓展。公司此前披露，2026年中期策略会将主题确定为&quot;AI已成当下最具时代感的产业趋势&quot; [27] ，试图紧抓科技主线。</p>\n<p>但核心问题始终在那里：当一家公司的权益投研能力尚不稳定，当核心人才仍在流失，当产品结构过度偏向固收时，&quot;二次创业&quot;的引擎能否真正点燃？这不仅是融通基金一家公司的问题。在全行业管理规模突破36万亿元、但集中度持续提升的背景下，数百家中型基金公司正面临同样的生存焦虑。融通基金的困境，或许只是一个更宏大叙事中的一个注脚。</p>", "hits": [{"type": "direct", "src": "2026-07-23_融通基金/原始资料/舆情网页/舆情_财中社_邹曦清仓式卸任.md", "core": "平台型团队制一体化多策略投研体", "art": "但融通基金并非没有意识到这个问题。自2022年以来，公司持续推进\"平台型、团队制、一体化、多策略\"投研体系建设，成立了大类资产配置投资委员会，试图将个人能力沉淀", "srcc": "研究部总监权益投资总监辅导构建平台 ", "2026-07-24_中国福彩/原始资料/招股书年报/监管_彩票管理条例_国务院令第554号.md", "2026-07-24_中国福彩/原始资料/招股书年报/监管_财政部_2025彩票销售.md", "2026-07-24_中国福彩/原始资料/招股书年报/监管_财政部_彩票资金构成比例_财综2015-94号.md", "2026-07-24_中国福彩/原始资料/研报数据/研报_500彩票网_互联网彩票历史.md", "2026-07-24_中国福彩/原始资料/研报数据/研报_国际彩票监管模式.md", "2026-07-24_中国福彩/原始资料/研报数据/研报_福彩资金构成比例_各玩法.md", "2026-07-24_中国福彩/原始资料/研报数据/研报_经济观察报_体彩三十年.md", "2026-07-24_中国福彩/原始资料/研报数据/研报_经济观察报_体彩挤压福彩2026.md", "2026-07-24_中国福彩/原始资料/舆情网页/舆情_中福彩官网_发行宗旨与销售网点.md", "2026-07-24_中国福彩/原始资料/舆情网页/舆情_人民日报_2025福彩公益金.md"], "src_hits": {"2026-07-24_中国福彩/原始资料/招股书年报/监管_审计署_2015第4号公告.md": 5, "2026-07-24_中国福彩/原始资料/研报数据/研报_经济观察报_体彩挤压福彩2026.md": 2, "2026-07-24_中国福彩/原始资料/招股书年报/监管_八部门_2015第18号公告.md": 2, "2026-07-24_中国福彩/原始资料/舆情网页/舆情_人民日报_2025福彩公益金.md": 4, "2026-07-24_中国福彩/原始资料/招股书年报/监管_财政部_2025彩票销售.md": 4}, "body_html": "<h1 class=\"rh\">中国福彩：年卖两千亿的公益机器，与它的透明之困</h1>\n<h2 class=\"rh\">导语 第一张彩票</h2>\n<p>1987年7月27日，河北省石家庄市，一张印着&quot;中国社会福利有奖募捐券&quot;字样的小纸片被递过柜台，面值1元。这是新中国民政系统发行的第一张福利彩票。没有人在那一刻意识到，这张一元纸片将在三十八年后催生出一个年销售额超过2,000亿元的庞大产业。 [1]</p>\n<p>提出这个构想的人叫崔乃夫，时任民政部部长。1986年，他在一次内部会议上提出通过发行社会福利有奖募捐券来筹集资金——彼时中国民政系统面临严重的资金短缺，社会福利设施严重不足。1987年6月3日，中国社会福利有奖募捐委员会在北京成立，崔乃夫担任名誉主任。 [2] 这一年全年销售额仅为1,739.5万元——大约相当于2025年福彩11个小时的销售额。</p>\n<p>崔乃夫为福彩定下的宗旨是&quot;扶老、助残、救孤、济困&quot;八个字 [3] 。这八个字后来被刻在中国福利彩票发行中心的门口，也成为这套系统对外讲述的核心叙事——每一张彩票的背后，都有一份钱流向养老院、残疾人康复中心和孤儿学校。到2025年底，福彩累计销售额达到32,568.12亿元，累计<mark class=\"partial\" data-hit=\"5\">筹集公益金9,724.22亿元。 [</mark>4]</p>\n<p>但38年后的今天，这台&quot;公益机器&quot;正面临着一系列追问：当体彩以4,194亿元的年销售额把福彩远远甩在身后，&quot;扶老、助残、救孤、济困&quot;的初心是否还在驱动这套系统？当审计署一次性查出169亿元的各类违规问题，公益金的&quot;玻璃口袋&quot;是否已经出现了裂痕？当发行费比例15年不变、而彩票总销售额翻了15倍，最大的受益者究竟是受助者还是系统本身？</p>\n<h2 class=\"rh\">第一章 两千亿的公益巨兽——2025年福彩全景</h2>\n<p>2025年全年，中国福利彩票销售额达到<mark class=\"partial\" data-hit=\"6\">2,085.77亿元，同比增长0.3% [</mark>4] 。这是福彩连续第三年维持在2,000亿元上下的规模。加上体育彩票的4,193.92亿元，全国彩票总销售额达到<mark class=\"partial\" data-hit=\"7\">6,279.69亿元，同比增长0.7% [</mark>5] 。</p>\n<p>2,085.77亿元是什么概念？它超过了2025年国内绝大多数A股上市公司的营业收入——超过中国国航的年收入（1,714.85亿元），接近中国东航的收入体量。如果把它看作一个企业的营收，它足以排进中国服务业企业前50强。</p>\n<p><mark class=\"paraphrase\" data-hit=\"13\">在这2,085.77亿元的销售额中，福彩计提了609.89亿元的彩票</mark><mark class=\"partial\" data-hit=\"13\">公益金，筹集率超过29.24% [</mark><mark class=\"paraphrase\" data-hit=\"13\">4] 。</mark>按这个比例推算，每购买100元福彩，大约29元进入公益金，58元进入返奖奖金池，约14元用于发行费用。</p>\n<p>但0.3%的同比增速是福彩近年来的一个警示信号。在经历了2021~2023年的快速增长期后（2023年福彩销售额同比增长约30%以上），2024年和2025年的增速急剧放缓。 [5] 这不是福彩独自面对的问题——体彩增速同样降到0.9%。但考虑到同期中国GDP增速在5%左右，彩票市场的增长速度已经显著低于整体经济增速。</p>\n<p>从全国角度看，6,279.69亿元的总销售额意味着中国人均购彩金额超过了440元——如果分摊到就业人口，这一数字更高。这背后是庞大的销售网络：福彩在全国拥有超过18万个销售站点，覆盖了几乎每一个县级行政区。 [6] 每一个站点背后是一个经营者家庭，以及一套从中福彩中心延伸到村镇的逐级管理链条。从这个意义上说，彩票既是一套公益筹资系统，也是一套庞大的社会就业平台。</p>\n<h2 class=\"rh\">第二章 体彩的逆袭——从被超越到被甩开</h2>\n<p>要理解福彩目前的处境，最好的参照物是体育彩票。</p>\n<p>1987年福彩诞生时，体彩尚不存在。1994年，国家体委（现国家体育总局）获批发行体育彩票，中国彩票市场自此进入了双轨制时代。在长达24年的时间里，福彩的销售额一直高于体彩——福彩起步更早、网点更多、双色球等明星产品的群众基础也更深厚。 [7]</p>\n<p>转折发生在2018年。那一年，体彩年销售额达到2,869亿元，首次超越福彩的2,245亿元。紧接着在2019年，世界杯预选赛等足球热点赛事推动竞猜型彩票爆发式增长，体彩的领先优势进一步扩大。到2025年，体彩年销售额4,193.92亿元，是福彩2,085.77亿元的整整2倍。 [5][7]</p>\n<p>体彩之所以能完成这次逆袭，核心引擎是竞猜型彩票——以足球、篮球赛事为载体的竞猜游戏。<mark class=\"paraphrase\" data-hit=\"14\">2025年，竞猜型彩票销售额达到2,777.46亿元，占全国彩票总销售额的44.2%。 [</mark>5] 体彩独享竞猜型彩票的发行权，福彩无法染指。这是一个巨大的结构性优势：当一个核心产品品类被锁定给一家发行机构，另一家机构无论怎么努力都难以追赶。</p>\n<p>福彩的当家产品——双色球（2003年推出）、3D、七乐彩、快乐8——都属于乐透数字型和基诺型游戏。这些游戏的特点是单注金额低、大奖随机性高，与竞猜型彩票&quot;检验体育知识&quot;的体验完全不同。2025年，乐透数字型彩票销售1,777.03亿元（下降0.7%），<mark class=\"paraphrase\" data-hit=\"15\">基诺型销售413.64亿元（下降0.9%），</mark>均呈现停滞甚至微降态势。 [5]</p>\n<p>此消彼长之间，福彩唯一的亮点是即开型彩票——刮刮乐。2025年销量1,311.52亿元，同比增长13%。 [5] 这既是福彩的增长引擎，也折射出它在产品创新上的被动：当体彩可以靠着世界杯、欧洲杯的四年周期反复刺激销量时，福彩能做的只有推出新图案的刮刮乐。即开型的增长模式本质上是一种&quot;劳动密集型&quot;的增长——依赖网点铺货率和票面设计的更新频率，而非游戏机制的创新。</p>\n<h2 class=\"rh\">第三章 彩票资金的&quot;三块蛋糕&quot;——返奖、发行费与公益金</h2>\n<p>每一张彩票售出之后，资金流向何方？答案是三块：返奖奖金、发行经费和彩票公益金。</p>\n<p>以目前通用的分配比例：约58%用于返奖（即开型彩票返奖率可达65%），约14%作为发行经费（覆盖彩票印制、物流、网点佣金、管理成本和系统维护），约28%计提为彩票公益金。 [8] 公益金部分由中央和地方按50:50的比例分成，中央集中的部分用于补充全国社会保障基金、支持社会福利事业等。</p>\n<p>这套分配框架从彩票制度建立之初延续至今，调整不大。但三个数字之间有一个敏感的比例关系：返奖率决定了彩票对购彩者的吸引力（返奖率高，购彩意愿强）；发行费决定了彩票系统的运营成本和销售网络的积极性；公益金决定了这套系统&quot;公益&quot;成色的兑现度。</p>\n<p>以2025年为例：<mark class=\"partial\" data-hit=\"9\">全国彩票6,279.69亿元</mark>的销售额中，约有879亿元被用作发行经费。这879亿元中，一部分用于支付18万个销售站点的佣金（通常为销售额的7%~8%），一部分用于系统建设、技术维护、市场营销和各级彩票管理机构的日常运转。 [8] 如果说公益金是这台机器的&quot;输出端&quot;，发行费就是它的&quot;维持成本&quot;——而这笔维持成本近年来一直在&quot;水涨船高&quot;。</p>\n<h2 class=\"rh\">第四章 169亿审计违规——公益金的&quot;玻璃口袋&quot;裂了</h2>\n<p>2015年6月，审计署发布了一份对彩票资金的专项审计报告 [9] ，这份报告至今仍是中国彩票史上最具冲击力的审计文件。</p>\n<p>审计署抽查了18个省（自治区、直辖市）2012年至2014年的彩票发行费和彩票公益金，抽查资金总额658.15亿元。结果触目惊心：发现各类<mark class=\"direct\" data-hit=\"0\">违规问题金额169.32亿元，占抽查</mark>金额的25.73%。 [9] 换句话说，每审计4元彩票资金，就有大约1元存在问题。</p>\n<p>违规问题涉及四大类：</p>\n<p>审计报告还指出，中央八项规定出台后，仍有部分省份顶风违规，涉及金额4.01亿元 [9] 。<mark class=\"paraphrase\" data-hit=\"16\">在互联网销售方面，17个省份未经</mark><mark class=\"partial\" data-hit=\"16\">批准违规利用互联网销售彩票，</mark><mark class=\"paraphrase\" data-hit=\"16\">涉及金额630.4亿元。 [</mark>10]</p>\n<p>169.32亿元的违规数字，与2025年福彩全年公益金609.89亿元放在一起看，会产生一个令人不安的比率：一次抽查就查出相当于年度公益金近28%的违规金额。当然，审计署查的是2012~2014年间的三年累积问题，而非单一年度。但这个规模本身——169亿——足以动摇公众对彩票公益金管理的信心。</p>\n<p>审计之后，民政部、财政部、体育总局等部门相继出台了整改措施。时任民政部部长李立国表态称&quot;决不让腐败玷污福彩事业&quot; [11] 。但十一年过去了，当年的违规问题整改到什么程度？公益金的透明化管理是否真正落地？2026年的今天，公众仍然无法在任何一个公开平台上查到每一笔公益金的去向——公益金的管理公开，始终停留在&quot;年度公告公布总额&quot;的粗颗粒度层级。</p>\n<h2 class=\"rh\">第五章 发行费的14%——15年未降的&quot;铁比例&quot;</h2>\n<p>在所有关于彩票资金的讨论中，14%的发行费比例是一个被反复提及但从未被改变的数字。</p>\n<p>中国彩票的发行费比例长期维持在14%左右——这并非完全法定，但在实际操作中是一个几乎所有彩种都遵循的参考上限。按照现行《彩票管理条例》，发行费的具体比例由财政部根据彩票品种特性核定，但历史上形成了一套稳定的惯例。 [12]</p>\n<p>14%意味着什么？<mark class=\"direct\" data-hit=\"1\">2025年全国彩票6,279.69亿元</mark>的销售额中，约879亿元用于发行经费。福彩自身2,085.77亿元的销售额中，约292亿元进入了发行费通道。这个数字超过了中国绝大多数省市的年度民政事业费预算。</p>\n<p>批评者认为，14%的比例在彩票市场规模不大时或许是合理的，但当市场规模从2004年的不到400亿元膨胀到2025年的6,279亿元时，发行费不再是一个固定的&quot;成本覆盖&quot;数字，而变成了一笔迅速膨胀的&quot;蛋糕&quot;。 [13]</p>\n<p>如果14%的比例能够降低1个百分点，2025年就可以多释放62.8亿元进入公益金——相当于多建设数百所养老院或多资助数十万名困难学生。2004年，全国彩票销售额仅400亿元左右，14%的发行费对应56亿元，不算多。但到2025年，879亿元的发行费体量已经超过了彩票公益金本身的三分之一。批评者认为，发行费比例的&quot;刚性&quot;实质上是彩票管理机构利益固化的体现。 [13]</p>\n<p>不过，彩票管理机构也有自己的解释：电脑彩票系统的技术维护、18万站点的佣金（一般认为占发行费的50%~60%）、物流配送、营销推广、人员工资——这其中的每一项成本都随着经济发展和通货膨胀而上涨。但质疑者的回应是：彩票站的佣金比例由系统内定，网点没有谈判权；技术系统的开发和维护是否可以通过竞争性招标降低成本，也没有答案。</p>\n<h2 class=\"rh\">第六章 互联网彩票的兴衰——从爆发式增长到一刀切</h2>\n<p>在中国彩票38年的历史中，互联网彩票是最具戏剧性的一段插曲。</p>\n<p>2001年前后，第一批互联网彩票销售网站出现。当时政策处于模糊地带——彩票管理条例并未明确禁止网络销售，但也没有正式授权。一些创业公司看到机会，率先建立了O2O模式的彩票代购平台。2010年左右，500彩票网、澳客网等平台已经积累了数百万用户。 [14]</p>\n<p>到2014年，互联网彩票迎来真正的爆发：当年通过互联网渠道销售的彩票金额据估算高达850亿元左右，占全国彩票总销售额的约23%。 [14] 以500彩票网（NYSE: WBAI）为代表的公司在纽交所上市，市场一片繁荣。对于彩民而言，互联网彩票的便利性是颠覆性的——不用去投注站排队，随时随地手机下单。</p>\n<p>但好景不长。2015年1月，财政部、民政部、国家体育总局等八部门联合发布了《<mark class=\"direct\" data-hit=\"2\">关于制止擅自利用互联网销售彩票的公告》，</mark>对互联网彩票实施全面禁令。 [15] 这份措辞严厉的文件要求&quot;<mark class=\"direct\" data-hit=\"3\">坚决制止擅自利用互联网销售彩票的行为&quot;，</mark>所有网络售彩平台被关停。</p>\n<p>禁令的直接导火索，除了对私彩泛滥的担忧外，审计署查出的<mark class=\"partial\" data-hit=\"11\">17省</mark><mark class=\"direct\" data-hit=\"4\">违规利用互联网销售彩票630.4亿元</mark>的数据提供了最有力的政策依据。 [10] 当互联网渠道可以绕过传统的地方彩票销售网络时，地方彩票管理机构的利益受到了双重冲击——既无法控制渠道、也无法追踪资金流向。</p>\n<p>一刀切禁令的效果立竿见影：2015年全国彩票销售额从2014年的约3,823亿元骤降至约3,679亿元，同比下降约3.8%。但更深远的影响在于，禁令将大量有互联网购彩习惯的用户推向了地下私彩平台。 [14] 严格来说，禁令同时堵住了正规渠道和私彩渠道——但由于私彩本身就在黑市中运行、难以追踪，正规渠道被堵死后，私彩市场反而获得了新用户。</p>\n<p>十一年过去了，互联网彩票的解禁窗口从未真正打开。尽管每隔一两年就有&quot;互联网彩票即将重启&quot;的市场传闻，但每次都被证实为假消息。博弈的各方——财政部、民政部、国家体育总局、中福彩中心、中体彩中心——各有顾虑，谁也迈不出解禁的第一步。</p>\n<h2 class=\"rh\">第七章 福彩的管理体制——&quot;民政主管&quot;的双刃剑</h2>\n<p>福彩的管理组织架构被官方表述为&quot;民政主管、财政监管、中福彩中心发行销售、财政审计和社会公众共同监督&quot; [16] 。在这个链条中，第一环就是民政部。</p>\n<p><mark class=\"partial\" data-hit=\"12\">中国福利彩票发行管理中心（</mark>简称中福彩中心）是民政部直属的事业单位，负责福利彩票的统一发行和销售管理。各省的福彩中心则隶属于省民政厅。这套体制从1987年福彩创立延续至今，38年来未发生根本性变化。 [16]</p>\n<p>与之对应，体育彩票由中国体育彩票管理中心（国家体育总局直属事业单位）负责发行，各级体彩中心隶属体育系统。两套系统互不隶属、平行运行——构成了中国彩票市场的&quot;双寡头垄断&quot;格局。</p>\n<p>&quot;民政主管&quot;既是福彩的优势，也是它的束缚。民政部主管意味着福彩的公益定位天然具有说服力——福利彩票的公益金直接流向民政系统的社会福利事业，叙事逻辑清晰。但同时也意味着福彩的运作方式与行政体制高度绑定：其主要管理岗位由行政官员担任，人事任命经由组织程序，机构运行靠财政拨款。</p>\n<p>这种体制的弊端在2015年审计风暴中暴露得很清楚。审计查出的违规问题中，相当比例与&quot;乱发津补贴&quot;&quot;违规购建楼堂馆所&quot;有关——这些问题本质上是行政事业单位财务管理的通病，而非彩票行业特有的问题。但由于福彩全身嵌入在行政体制中，这些问题反而更难割裂。</p>\n<p>更有批评者指出，行政主管的彩票体制存在一套天然的利益循环：公益金划入财政后，部分以转移支付的形式回到民政系统，用以补充民政经费——也就是说，彩票系统的公益金在一定程度上在&quot;养活&quot;其主管系统。 [17] 这并非福彩一家的问题，而是一种体制性的模糊。</p>\n<p>对比国际彩票行业的运营模式，中国彩票的管理体制显得格外独特。英国国家彩票由独立监管机构负责，运营权通过公开招标授予私营运营商（如卡梅洛特集团曾在1994年至2022年间运营英国国家彩票）。美国各州的彩票由州政府成立的专业化彩票委员会管理，运营团队多为职业经理人而非行政官员。 [18] 中国彩票的双寡头行政主管模式，在国际上虽非绝无仅有，但像中国这样由两个平行的部委系统分别主管、互不竞争的格局，实属少见。</p>\n<h2 class=\"rh\">第八章 市场触顶——即开型的逆势增长与彩票业的未来</h2>\n<p>2025年彩票市场最重要的信号，是0.7%的全国总增速。</p>\n<p>全国彩票销售额从2024年的约6,235亿元微增至6,279.69亿元，增速0.7% [5] 。福彩增速0.3%，体彩增速0.9%。在连续多年保持两位数甚至三位数增长之后，中国彩票市场似乎正在逼近一个阶段性上限。</p>\n<p>人口结构变化是长期压力的来源。彩票的活跃购彩者主要集中在25~55岁年龄段，而中国人口正在加速老龄化。年轻一代（&quot;00后&quot;）对彩票的态度也与前几代人有显著差异——他们更倾向于将&quot;买一张彩票&quot;视为娱乐消费而非投资行为。这种消费心理的变化，对以&quot;中大奖&quot;为卖点的乐透数字型彩票构成了挑战。</p>\n<p>但在整体趋缓的背景下，有一枝独秀的品类：即开型彩票。2025年即开型彩票销售额达1,311.52亿元，同比增长13%，是唯一保持两位数增速的彩种。 [5]</p>\n<p>即开型的逆势增长有其内在逻辑。刮刮乐的体验接近于一种&quot;小确幸&quot;消费——几元到几十元一张，即时开奖，不用等待开奖日，不需要研究号码走势。这种&quot;低决策成本+即时反馈&quot;的特性，在消费降级的大环境中正好契合了大众的小额娱乐需求。而且即开型彩票的经营门槛低、铺货灵活——便利店、超市、高铁站都能卖，不需要专营投注站。</p>\n<p>2025年，以福彩&quot;刮刮乐&quot;和体彩&quot;顶呱刮&quot;为代表的即开型产品创造了历史新高。但这个市场也有隐忧：即开型彩票的返奖率约为65%，高于乐透型，意味着公益金率更低；而且即开型的印制成本和物流成本也更高，发行费率实际上高于平均水平。即开型的增长，能否转化为公益金的同步增长，需要打一个问号。</p>\n<p>展望未来，中国彩票市场面临几条可能的演进路径：一是下沉市场挖潜——三四线城市及农村地区的彩票渗透率仍然较低，移动支付普及后农村地区的购彩便利性正在提升；二是产品创新——如果福彩和体彩能够获得更大的游戏创新自主权（特别是福彩是否可能获准发行竞猜型游戏），市场结构可能发生变化；三是管理体制改革——彩票管理体制是否可能从&quot;民政/体育主管&quot;转向更市场化的运营模式，这一话题在近年来的政策研讨中已多次被提及。 [19]</p>\n<h2 class=\"rh\">尾声·回到第一张彩票的初心</h2>\n<p>1987年7月27日，当崔乃夫提议的那张1元面值&quot;有奖募捐券&quot;在石家庄被售出时，全国民政系统的福利资金缺口大约是2亿元。到2025年，福彩一年筹集的公益金已经超过609亿元。 [1][4] 从1,739万元到2,085亿元——38年间，这台机器在规模和效率上的进化无疑是惊人的。9,724亿元的累计公益金，意味着数万所养老院、残疾人康复中心和儿童福利机构得到了资金支持。</p>\n<p>但规模的膨胀也带来了规模特有的问题。2015年审计署查出的169亿元违规，是体制性漏洞的一次集中暴露。14%发行费15年未降的制度惯性，让&quot;公益使命&quot;与&quot;机构利益&quot;之间产生了一道微妙的张力线。体彩从2018年反超到2025年差距拉大到两倍——在双轨制竞争中被甩开，福彩需要回答的根本问题不是&quot;怎么追赶体彩&quot;，而是&quot;游戏设计和管理理念是否跟得上时代&quot;。</p>\n<p>崔乃夫在2017年接受媒体采访时曾说：&quot;当时就是想到要为社会福利事业筹资，没有想那么多。&quot; [18] 这句朴素的回答，反映的是福彩创立之初的简单善意。但当一套系统从年销售1,700万膨胀到2,000亿，当年&quot;没想到&quot;的那些事——发行费分配、资金透明、行政主管、互联网替代——恰恰成了今天无法回避的问题。</p>\n<p>福彩的标语现在随处可见：中国福利彩票，中国人的慈善事业。38年前那张面值1元的彩票，放到今天已经买不到任何东西。但每一张新的彩票背后，依然承载着&quot;扶老、助残、救孤、济困&quot;八个字的承诺。维护这个承诺，需要比机器本身更快的修复速度。</p>", "hits": [{"type": "direct", "src": "2026-07-24_中国福彩/原始资料/招股书年报/监管_审计署_2015第4号公告.md", "core": "违规问题金额16932亿元占抽", "art": "审计署抽查了18个省（自治区、直辖市）2012年至2014年的彩票发行费和彩票公益金，抽查资金总额658.15亿元。结果触目惊心：发现各类违规问题金额169.3", "srcc": "建楼堂馆所和发放津贴补贴等违法违规问题金额16932亿元占抽查资金总额的2573涉及公益金资助项目854个占抽", "sim": 1.0, "len": 16}, {"type": "direct", "src": "2026-07-24_中国福彩/原始资料/研报数据/研报_经济观察报_体彩挤压福彩2026.md", "core": "2025年全国彩票627969", "art": "14%意味着什么？2025年全国彩票6,279.69亿元的销售额中，约879亿元用于发行经费。福彩自身2,085.77亿元的销售额中，约292亿元进入了发行费通", "srcc": "20260208关键数字与事实2025年全国彩票627969亿元07福彩208577亿元03体彩419392亿", "sim": 1.0, "len": 17}, {"type": "direct", "src": "2026-07-24_中国福彩/原始资料/招股书年报/监管_八部门_2015第18号公告.md", "core": "关于制止擅自利用互联网销售彩票", "art": "但好景不长。2015年1月，财政部、民政部、国家体育总局等八部门联合发布了《关于制止擅自利用互联网销售彩票的公告》，对互联网彩票实施全面禁令。 [15] 这份措", "srcc": "局银监会公告2015年第18号关于制止擅自利用互联网销售彩票的公告类型监管八部门关于制止擅自利用互联网销售彩票", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-24_中国福彩/原始资料/招股书年报/监管_八部门_2015第18号公告.md", "core": "坚决制止擅自利用互联网销售彩票", "art": "但好景不长。2015年1月，财政部、民政部、国家体育总局等八部门联合发布了《关于制止擅自利用互联网销售彩票的公告》，对互联网彩票实施全面禁令。 [15] 这份措", "srcc": "015年4月3日核心规定摘录一坚决制止擅自利用互联网销售彩票的行为彩票机构网络公司等相关单位个人应当严格执行国", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-24_中国福彩/原始资料/招股书年报/监管_审计署_2015第4号公告.md", "core": "违规利用互联网销售彩票6304", "art": "禁令的直接导火索，除了对私彩泛滥的担忧外，审计署查出的17省违规利用互联网销售彩票630.4亿元的数据提供了最有力的政策依据。 [10] 当互联网渠道可以绕过传", "srcc": "三公经费17个省未经财政部批准违规利用互联网销售彩票6304亿元其中福利彩票133亿元体育彩票4974亿元向互", "sim": 1.0, "len": 17}, {"type": "partial", "src": "2026-07-24_中国福彩/原始资料/舆情网页/舆情_人民日报_2025福彩公益金.md", "core": "集公益金972422亿元", "art": "崔乃夫为福彩定下的宗旨是\"扶老、助残、救孤、济困\"八个字 [3] 。这八个字后来被刻在中国福利彩票发行中心的门口，也成为这套系统对外讲述的核心叙事——每一张彩票", "srcc": "票累计销售3256812亿元筹集公益金972422亿元计提数数据来源中国福利彩票发行管理中心", "sim": 0.75, "len": 13}, {"type": "partial", "src": "2026-07-24_中国福彩/原始资料/招股书年报/监管_财政部_2025彩票销售.md", "c
