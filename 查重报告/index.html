const TEXTDATA = [{"key": "2026-07-17_宇树科技", "title": "会翻跟头的机器人，和它翻不过去的那道坎", "company": "宇树科技", "date": "2026-07-17", "n_src": 14, "nosource": false, "rate": 1.2, "rate_direct": 0.7, "rate_partial": 0.2, "rate_paraphrase": 0.4, "src_files": ["2026-07-17_宇树科技/原始资料/招股书年报/招股书_证券时报_20260706_宇树科技招股书关键数据.html", "2026-07-17_宇树科技/原始资料/招股书年报/招股书_财联社_20260525_宇树科技上会稿解读.html", "2026-07-17_宇树科技/原始资料/研报数据/研报_中金公司_20260707_2026H1机器人估值.html", "2026-07-17_宇树科技/原始资料/研报数据/研报_中金公司_20260717_机器人板块情绪修复.html", "2026-07-17_宇树科技/原始资料/研报数据/研报_高盛_20260222_人形机器人发展态势.html", "2026-07-17_宇树科技/原始资料/研报数据/研报_高盛_20260601_亚太机器人比美国便宜21%.html", "2026-07-17_宇树科技/原始资料/研报数据/研报_高盛_202606_具身智能产业格局中韩对比.html", "2026-07-17_宇树科技/原始资料/舆情网页/舆情_凤凰网_20260225_欧洲病夫叩响宇树科技的门.html", "2026-07-17_宇树科技/原始资料/舆情网页/舆情_凤凰网_20260609_美国1260H清单.html", "2026-07-17_宇树科技/原始资料/舆情网页/舆情_南方都市报_20250911_王兴兴外滩大会.html", "2026-07-17_宇树科技/原始资料/舆情网页/舆情_科创板日报_20260706_宇树科技IPO注册生效.html", "2026-07-17_宇树科技/原始资料/舆情网页/舆情_美国众议院_20250506_公开信.html", "2026-07-17_宇树科技/原始资料/舆情网页/舆情_虎嗅_20260207_具身智能订单饥渴.html", "2026-07-17_宇树科技/原始资料/舆情网页/舆情_证券时报_20260702_宇树科技IPO注册获批.html"], "src_hits": {"2026-07-17_宇树科技/原始资料/招股书年报/招股书_财联社_20260525_宇树科技上会稿解读.html": 6, "2026-07-17_宇树科技/原始资料/招股书年报/招股书_证券时报_20260706_宇树科技招股书关键数据.html": 2, "2026-07-17_宇树科技/原始资料/舆情网页/舆情_虎嗅_20260207_具身智能订单饥渴.html": 2, "2026-07-17_宇树科技/原始资料/研报数据/研报_高盛_202606_具身智能产业格局中韩对比.html": 1}, "body_html": "<h1 class=\"rh\">会翻跟头的机器人， 和它翻不过去的那道坎</h1>\n<p>招股书819页、三轮公开回复、美国国会调查、安全后门报告——宇树科技的十大核心问题，来自全球公开信息的最全面交叉验证。当一家公司的运动天赋举世无双，它的智力短板是否被420亿估值的聚光灯遮住了？</p>\n<p>杭州滨江，东流路88号。2016年8月的一个下午，26岁的王兴兴在一间50平方米的办公室里注册了一家公司。他刚从大疆离职，工龄两个月，试用期都没过。账上躺着一位天使投资人打来的200万元——对方甚至在打款时没让他签协议。公司起名&quot;宇树&quot;，取&quot;宇宙之树&quot;之意。团队三四个人，他一人身兼CEO与CTO。</p>\n<p>十年后的2026年7月2日，中国证监会的一纸批复，让这家公司距离420亿元的发行估值只剩最后一步。从上海证券交易所受理到注册生效，宇树科技只用了104天，创下科创板预先审阅机制落地以来的最快纪录。<mark class=\"paraphrase\" data-hit=\"8\">它即将成为A股&quot;人形机器人第一股&quot;。</mark></p>\n<p>这是一个近乎完美的中国硬科技创业故事：草根天才、极致降本、三上春晚、全球出货第一、顶级资本环伺。但当我们翻开那份厚达819页的招股书，以及全部公开回复文件，一个更复杂、也更值得追问的宇树浮现出来。</p>\n<p>它会后空翻，会跑酷，会在春晚舞台上打醉拳。二十余台机器人在2026年春晚完成集群武术表演《武BOT》，行云流水的翻桌跑酷和弹射空翻，让全球观众屏息。但在这场视觉盛宴的背后，一个更朴素的问题被压在了招股书几百页表格的脚注里：这些会翻跟头的机器人，在一个真正的工厂车间里——可能还不会干活。</p>\n<p>这篇报道试图回答三个问题：这家公司值不值得上市？它的研发成果有多少水分？它十年的成长与百天的上市，是否藏着不为人知的蹊跷？我们逐一翻阅了819页招股书注册稿、首轮11个问题的问询回复、第二轮3个问题的问询回复、<mark class=\"partial\" data-hit=\"6\">审核中心意见落实函的回复，</mark>并将它们与公司公开财报、同行上市公司年报、美国国会公开信、独立安全研究员的技术报告，以及可交叉验证的第三方数据放在一起对读。以下内容全部基于公开文件，出处见文末注释。</p>\n<h2 class=\"rh\">第一章 73天：一场&quot;考试&quot;在开考前就已结束</h2>\n<p>要理解宇树的上市速度有多快，需要一个参照系。2026年，科创板普通IPO项目从受理到过会平均需要约240天。预先审阅机制下的第一单长鑫科技用了148天，此前号称&quot;闪电过会&quot;的摩尔线程用了88天。而宇树，从3月20日受理到6月1日过会，只用了73天——几乎把纪录压缩了一半。 [1]</p>\n<p>更引人注目的是节奏。3月20日受理当天，宇树同步披露了两轮预先审阅问询的全部回复。也就是说，那份通常需要监管反复拉锯数月的&quot;考卷&quot;，在正式开考前就已经答完、改完、交卷了。首轮问询共11个问题，涵盖股权变动、核心技术、收入结构、客户构成、经销模式、存货管理等几乎所有维度；第二轮3个问题，聚焦收入分类、自研大模型应用和关联交易。两轮合计14个问题，全部在受理前闭环。</p>\n<p>4月1日，公司被随机抽中首发企业现场检查——这是中国IPO审核中最严苛的监管动作之一，由证监会统一组织，中介机构交叉检查，目的是核查财务真实性。被抽中现场检查的企业，有相当比例因发现问题而主动撤回申报。但这一动作丝毫没有拖慢宇树的进度。</p>\n<p>这种速度本身并不构成&quot;蹊跷&quot;。科创板的预先审阅机制正是为优质硬科技企业设立的快车道，其逻辑是把问询前置到受理之前——企业在正式申报前，先与交易所进行非公开的预沟通，把所有问题在台面下解决干净，等正式受理时，监管面对的是一份反复打磨过的成熟卷子，自然快。</p>\n<p>但速度的背面，是压力。</p>\n<p>一位熟悉IPO审核流程的投行人士向调查团队表示：&quot;预先审阅不等于放水，恰恰相反，它要求企业在受理前就把最尖锐的问题回答到位。宇树73天过会，说明它的财务底子和合规底子经得起看。但过会前5天下发的那份只有一个问题的落实函，才是真正的信号弹。&quot; [2]</p>\n<p>那份落实函，只有一个问题。但它的措辞，比前面所有问题加起来都更直接：结合行业趋势、竞争格局、研发投入、技术壁垒、专利成果，把业绩波动风险说透。这不是常规的补充问询——它是在过会前的最后关头，要求公司把所有软肋一次性摊开。</p>\n<p>宇树的回应是：在上会稿招股书中增加了一条特别风险提示，将它放在所有风险的最前面——&quot;增速放缓及经营业绩发生波动的风险&quot;。<mark class=\"paraphrase\" data-hit=\"9\">它还新增了&quot;</mark><mark class=\"direct\" data-hit=\"9\">研发投入方向及成效不及预期的风险&quot;——</mark><mark class=\"paraphrase\" data-hit=\"9\">等于承认，那笔20亿元的大模型投入，存在打水漂的可能。</mark></p>\n<p>落实函要求公司承认的，恰恰是所有参与者心知肚明、却需要白纸黑字写进招股书的事实：最大的风险不是它做错了什么，而是它还没做到什么。</p>\n<h2 class=\"rh\">第二章 追问收入：卖机器人，还是卖&quot;科研玩具&quot;？</h2>\n<p>宇树2025年的成绩单足够耀眼：营业收入17.08亿元，同比增长335%；扣非净利润5.91亿元，同比增长674%；主营业务毛利率60.13%。在一个绝大多数玩家还在烧钱的行业里，宇树不仅盈利，而且利润增速远快于收入增速。同期优必选净亏损7.90亿元，越疆科技净亏损0.84亿元，智元机器人尚未上市。 [3]</p>\n<p>这是招股书递上去时，让整个行业&quot;最出乎意料&quot;的部分。一家成立仅十年、员工数百人的机器人公司，在一个全球头部玩家普遍巨亏的赛道里，跑出了674%的利润增速。这个数字太好了，好到让人想追问一个最朴素的问题：钱，到底是谁掏的？</p>\n<p>但有人问到了这份亮眼数字的地基上：这些机器人，到底卖给了谁？</p>\n<h3 class=\"rh\">一张收入结构表</h3>\n<p>答案藏在公开文件的表格里，值得逐行阅读。宇树的人形机器人，2025年前三季度的收入结构是这样的： [4]</p>\n<p>超过七成的人形机器人收入，来自高校、科研院所和科技公司——他们买机器人是为了做算法研究、模型训练、教学实验。这不是一笔小生意：4.38亿元的前三季度收入，对应的是全球范围内具身智能研究热潮下，实验室对标准化机器人平台的旺盛需求。哈佛、MIT、斯坦福、伯克利的实验室里，都摆着宇树的机器狗——美团龙珠的合伙人王新宇2016年就认识王兴兴，但真正下注是在2023年底，他去美国转了一圈，发现&quot;全世界最优秀的机器人博士都在用你的产品&quot;，认定这是一个投资拐点。</p>\n<p>但科研教育市场的天花板是明确的。它的增长驱动来自高校采购预算和科研经费拨款，而非市场需求的自发扩张。当一所大学买了三台宇树G1做实验，它不会像工厂采购产线设备那样，第二年再买三十台。科研教育市场的特征是：客户多、单笔小、复购低、增长取决于外部资金而非产品本身的竞争力。</p>\n<h3 class=\"rh\">一条脚注：9%里还藏着什么</h3>\n<p>而这9%的&quot;行业应用&quot;，还需要再拆一层。有人进一步追问：&quot;企业导览&quot;在行业应用中占多少？企业回复：企业导览占了行业应用收入的50%到70%。 [5]</p>\n<p>所谓&quot;企业导览&quot;，按公司在同一份文件中的定义，是&quot;工业企业开发后在展厅进行业务展示介绍&quot;——即企业买一台人形机器人放在展厅里当迎宾、讲解、互动问答。这台机器人做的事，和商场里摆一台机器人做引导，功能相同——展示加问答。但在宇树的收入口径里，前者计入&quot;行业应用&quot;，后者计入&quot;商业消费&quot;。这一归类使&quot;行业应用&quot;的账面占比达到9.01%，听起来像工业4.0的入场券。</p>\n<p>把导览部分剔除，账就清楚了：9.01%的行业应用收入中，导览占50%至70%，剩下真正进入智能制造、智能巡检等明确工业场景的部分，全年只有1570.20万元。</p>\n<p>这就是问题的隐藏含义：宇树卖的到底是&quot;生产力工具&quot;，还是一台性能卓越的&quot;科研平台&quot;和&quot;展厅摆件&quot;？宇树用&quot;分类的艺术&quot;把一家科研设备商的底色，包装成了一家&quot;具身智能行业应用公司&quot;。当你顺着它的分类往下读一层，那个被光环笼罩的&quot;工业落地&quot;，薄得像一张纸。</p>\n<h3 class=\"rh\">同行在干什么：出货量第一 vs 工业场景第一</h3>\n<p>把镜头拉远一格。2025年，优必选交付全尺寸人形机器人1079台——不到宇树5500台的五分之一。但优必选的人形机器人收入8.21亿元中，超八成进入汽车制造、智慧物流、3C电子制造等工业场景，干的是搬运、分拣、质检三类工种，毛利率54.6%。Walker S系列已经批量进入比亚迪、吉利等汽车工厂。 [6]</p>\n<p>两组数据放在一起，讲的是两个完全不同的商业故事。宇树卖的是&quot;平台&quot;——一台性能卓越、价格诱人、适合做算法研究的标准化机器人。优必选卖的是&quot;生产力&quot;——一台能进工厂干活的工业设备。宇树的毛利率更高（62.42% vs 54.6%），因为科研设备不需要7×24小时稳定运行，也不需要针对每一个工厂场景做定制化部署。优必选的毛利率低，但它的收入来自真实的生产线需求，有复购、有续约、有规模化扩张的可能。</p>\n<h3 class=\"rh\">一个公司自己也不完全掌握的数字</h3>\n<p>还有一个容易被忽略的披露。当被问及代理商的下游客户构成时，公司答复：</p>\n<blockquote>&quot;由于公司与代理商的交易模式主要为买断经销模式，公司不完全掌握下级代理商的销售情况，未建立多层级的经销管理。&quot; [7]</blockquote>\n<p>公司同时说明，其业务模式&quot;客户下单频率较高，单笔订单规模相对较小&quot;。在手订单从2024年末的1.46亿元升至2025年9月末的2.29亿元、2025年12月末的2.82亿元，同比增长93.15%。这是真实的、好看的数字。</p>\n<p>但一家年收入17亿元的公司，有相当部分产品经买断式经销商流出后，最终用途不再逐笔追踪。这意味着什么？意味着当宇树说&quot;73.6%科研教育&quot;时，这个数字是公司直接销售给科研机构的收入占比，而不是最终用户用途的占比。那些经代理商卖出去的机器人，最终去了高校实验室还是企业展厅还是工厂产线——公司并不完全知道。这不构成违规。但在评估需求的真实性时，这是一个需要计入的模糊地带。</p>\n<h3 class=\"rh\">境内外：一个被忽略的维度</h3>\n<p>还有一个维度值得留意。2022至2024年，宇树的境外主营业务收入占比<mark class=\"direct\" data-hit=\"1\">均过半，分别为57.21%、55.63%、55.70%。</mark>也就是说，在2024年之前，宇树一半以上的收入来自海外。第一轮问询中，&quot;境外&quot;一词被提及282次，是审核重点关注的领域。但2025年随着人形机器人放量，境内收入占比大幅提升。境外收入结构的这一变化，与后文将要讨论的美国安全调查时间线，形成了一个值得注意的交叉点。</p>\n<h3 class=\"rh\">毛利率的两条曲线</h3>\n<p>招股书呈现的毛利率曲线是上行的：综合毛利率从2023年的44.22%升至2025年的60.13%，高于同行业上市公司约35%至41%的水平。这个故事很漂亮：成本在降，毛利在升，规模效应正在释放。 [8]</p>\n<p>但把人形机器人单独拆出来，是另一条曲线：</p>\n<p>两年半下降约25个百分点。原因并不复杂：走量的G1把起售价压至8.5万元，&quot;价格屠夫&quot;的刀，最终也砍向了自己的利润表。人形机器人单位成本从2023年的7.32万元降至2025年的6.22万元，降幅约15%——但售价降得更快。</p>\n<p>而上一代消费级产品Go1的结局，公司在存货问答中如此表述：</p>\n<blockquote>&quot;2025年1-9月，公司就Go1产品进行了较大幅度的折价去库存，区间综合毛利率为-32.18%。&quot; [9]</blockquote>\n<p>一款曾经的明星产品——Go1在2021年发布时是全球首款伴随仿生四足机器人，曾登上央视——以低于成本三成的价格清仓。这不是正常的产品迭代，是为了维持&quot;全球出货第一&quot;这条招股书里最高频的叙事，付出的财务代价。</p>\n<p>所以那个60.13%的&quot;高毛利&quot;，不是一块铁板，而是产品组合在特定时点堆出的水位。当最贵的人形机器人毛利从87%滑向62%，当上一代消费级产品以-32%清仓，所谓&quot;显著高于同行&quot;的毛利率，更像一道正在退潮的曲线，而非一道护城河。</p>\n<h2 class=\"rh\">第三章 追问技术：一个没有&quot;大脑&quot;的智能机器人</h2>\n<p>如果说收入结构是宇树的第一道裂缝，那么技术结构就是更深的一道。</p>\n<p>在机器人行业，人们习惯用人体做类比：&quot;本体&quot;是身躯，是机械结构、关节、电机、减速器；&quot;小脑&quot;是运动控制，让机器人能走能跑能翻跟头；&quot;大脑&quot;是具身大模型，让机器人能理解指令、感知环境、自主决策。三者的关系是递进的：本体是基础，小脑让机器人&quot;能动&quot;，大脑让机器人&quot;能干&quot;。一个会翻跟头的机器人，只是&quot;能动&quot;——它还不知道翻跟头是为了什么。</p>\n<h3 class=\"rh\">&quot;小脑&quot;：货真价实的世界冠军</h3>\n<p>宇树的&quot;本体&quot;和&quot;小脑&quot;，是世界级的。这一点没有争议。招股书里列着一长串纪录：</p>\n<p class=\"rli\">2024年：全球首次全尺寸电驱人形机器人原地后空翻；</p>\n<p class=\"rli\">2025年：人形机器人奔跑速度超5米/秒，刷新世界纪录；</p>\n<p class=\"rli\">2025年：首届世界机器人运动会，7金3银4铜（共14枚奖牌）；</p>\n<p class=\"rli\">2025年：G1实现原地侧空翻，成为CMG机甲格斗擂台赛唯一参赛机型；</p>\n<p class=\"rli\">2026年春晚：二十余台机器人完成集群武术表演《武BOT》，花式翻桌跑酷、弹射空翻同步完成。</p>\n<p>中信建投的研报称，宇树是&quot;全球唯一实现后空翻、侧空翻、弹射空翻等多项高难度动作的电动人形机器人，并具备全球唯一大规模集群能力&quot;。这些成就毋庸置疑。在运动控制这个维度上，全球没有任何一家公司——包括波士顿动力——能同时做到&quot;全尺寸电驱后空翻+5米/秒奔跑+二十余台集群协同&quot;。</p>\n<p>这些能力背后是真实的工程积累。宇树自2018年起在GitHub开源43个项目，关注超5400人，涵盖运动控制、Sim-to-Real（仿真到现实迁移）、SLAM（同步定位与建图）等核心技术。四足机器人单位成本从2022年的2.23万元降至2025年1-9月的1.21万元，降幅约46%——这是极致工程能力的体现。</p>\n<h3 class=\"rh\">&quot;大脑&quot;：一个尚未装机的承诺</h3>\n<p>但有一个问题，让所有溢美之词都显得苍白：你已经卖出去的机器人，到底装没装自研的大模型？</p>\n<p>宇树的回复，需要一字一句地读：</p>\n<blockquote>&quot;鉴于全球范围内具身大模型技术均处于研发测试阶段，公司报告期内尚未将自研的通用具身大模型规模化应用于机器人产品。&quot; [10]</blockquote>\n<p>目前卖出的产品里，集成的是宇树自研的运动控制模型（&quot;小脑&quot;）和第三方大语言模型（用于语音交互的&quot;笨笨&quot;功能）。换句话说：宇树卖出的那5500台人形机器人，它们的&quot;大脑&quot;——如果有的话——是别人的。自主决策能力，尚未商业化。</p>\n<p>这不是苛责。事实上，全球范围内没有任何一家公司实现了具身大模型的规模化应用——特斯拉Optimus还在小批量试产阶段，Figure的AI能力仍在实验室验证，波士顿动力的Atlas刚刚从液压切换到电动。但问题在于，宇树在这个决定未来的领域，起步得格外晚，投入得格外少。</p>\n<h3 class=\"rh\">公司自己点名的两道坎</h3>\n<p>在公开回复中，宇树用一段高度合规的文字，总结了大规模商业化前必须突破的关键技术：</p>\n<blockquote>&quot;面向工业与家庭场景大规模商业化应用尚待突破的关键技术主要包括&#x27;大脑&#x27;层面的具身大模型能力与&#x27;灵巧手&#x27;的精细耐用程度两方面难题，其中最主要的技术难题还是全球范围内具身大模型均处于早期发展阶段，泛化能力不足。&quot; [14]</blockquote>\n<p>请注意：公司亲口承认，卡住机器人走进工厂和家庭的两道坎，第一是&quot;大脑&quot;（具身大模型），第二是&quot;灵巧手&quot;。这是它自己的诊断。然后，在同一份回复里，它自己描述了&quot;大脑&quot;在真实工厂里会怎样失灵：</p>\n<blockquote>&quot;现有训练数据多源于实验室或单一定制场景，难以覆盖跨场景差异……面对生产线换型、突发障碍等动态变化易失灵。&quot; [14]</blockquote>\n<p>&quot;易失灵&quot;——三个字出自公司自己的文件。这比任何外部批评都更致命，因为它来自公司内部。</p>\n<h3 class=\"rh\">两道坎，恰好都在采购清单上</h3>\n<p>在零部件自研情况的问答中，公司列出了外购部组件清单：电池电芯、计算模组、存储模块、灵巧手、激光雷达、相机。 [13] 把两份文件并排放，真相就浮出来了：</p>\n<p class=\"rli\">公司说最难的是&quot;大脑&quot;——而&quot;大脑&quot;的硬件载体&quot;计算模组&quot;在 外购清单 里，软件层面已售产品搭载的是第三方大语言模型；</p>\n<p class=\"rli\">公司说第二难的是&quot;灵巧手&quot;——而&quot;灵巧手&quot;整件在 外购清单 里，主要供应商为因时机器人（被业内称&quot;灵巧手四小龙&quot;之一），2025年前三季度宇树向其采购1720万元；</p>\n<p class=\"rli\">人形机器人所用的激光雷达全部外购，2026年春晚登台的机器人搭载的是禾赛科技的激光雷达。</p>\n<p>公司同时披露，外购部件占总成本约14%至18%。这个比例不高——但这14%至18%买来的，恰恰是感知与智能的核心。90%的自研率，覆盖的是结构、关节、驱动，是&quot;身体&quot;。身体很强，脑子很弱。</p>\n<p>公司还主动说了一句值得停留的话：&quot;随着外部供应链体系的日益成熟，对于部分技术工艺成熟、外部成本较低的部组件，公司亦会考虑采取定制化采购的合作方式。&quot;——这等于在&quot;全栈自研&quot;的叙事旁，自己补了一句：未来我们会更依赖外部供应链。当供应链人人都能买，自研的成本优势便不再是壁垒——这正是PC与智能手机历史的重演。</p>\n<h3 class=\"rh\">研发投入：一张同业对比表</h3>\n<p>在公司自认最难的方向上，投入是多少？以下是与两家港股上市同行及行业均值的对照：</p>\n<p>数据是冰冷的。2023年至2025年，宇树的研发费用分别为4995万元、7002万元、1.45亿元。收入两年增长约10倍的同时，研发费率从2023年的31.39%断崖式降至8.53%——约为同业均值的三分之一。优必选的研发费用是宇树的3.5倍，越疆的研发费率是宇树的2.7倍——两家都在亏损。 [13]</p>\n<p>更具体地看同行怎么花钱：优必选2025年研发费用5.07亿元中，2.7亿元专门用于全尺寸人形机器人研发；越疆2025年研发费用1.15亿元中，4510万元投向具身智能、占比39.3%。而宇树呢？公司自己解释，前期研发侧重本体与运动控制，&quot;<mark class=\"partial\" data-hit=\"7\">自2024年起才逐步加强</mark>对具身大模型的研发投入&quot;。 [6]</p>\n<p>注册程序最后阶段的文件里还有一句更关键的话：</p>\n<blockquote>&quot;在全球技术路线与数据场景尚未明确的情况下，公司报告期内尚未大规模开展真实数据采集与工厂部署训练等工作。&quot; [11]</blockquote>\n<p>没有大规模真实数据采集，没有工厂部署训练——这与前文那句&quot;易失灵&quot;，在逻辑上互为因果。模型没在真实工况里练过，自然在真实工况里会失灵。</p>\n<h3 class=\"rh\">开源不等于壁垒</h3>\n<p>面对&quot;技术先进性&quot;的问询，宇树拿出一张漂亮的牌：自2018年起在GitHub开源43个项目，涵盖运动控制、Sim-to-Real、SLAM，以及两个具身模型——UnifoLM-WMA-0（运动控制，已商业化）和UnifoLM-VLA-0（视觉-语言-动作，即&quot;大脑&quot;候选）。2026年1月发布的UnifoLM-VLA-0在LIBERO基准测试中平均分98.7分，已公开测试结果的具身大模型中排名第一。2026年5月发布的WVLA2.0，可让G1在有人走动的复杂环境中自主完成会议室整理。</p>\n<p>这是真实的生态影响力。但&quot;开源&quot;是一把双刃刀：它证明了公司的工程能力，却也意味着这些技术没有排他性。任何人都能基于UnifoLM-VLA-0做二次开发。当被问到专利壁垒时，另一组数字露了怯。</p>\n<h3 class=\"rh\">创始人自己的评价</h3>\n<p>王兴兴对此并不讳言。2025年外滩大会上，他坦言：&quot;现阶段，机器人硬件完全足够用，用一两年都可以。最大的问题还是AI大模型本身能力不够用。&quot;据多家媒体报道，他曾私下评价自研的具身大模型UnifoLM-VLA-0&quot;水平未达GPT-1&quot;。 [12]</p>\n<p>GPT-1是OpenAI2018年发布的模型，在AI行业里几乎等同于&quot;入门级&quot;。一个估值420亿的公司，它的创始人自评核心AI能力&quot;未达GPT-1&quot;——这个对照，比任何外部分析师的报告都更有说服力。</p>\n<h2 class=\"rh\">第四章 追问壁垒：90%自研率背后的&quot;14%到18%&quot;</h2>\n<p>宇树最引以为傲的护城河，是&quot;全栈自研&quot;和&quot;极致降本&quot;。招股书宣称，公司对电机、减速器、编码器等核心零部件的自研自产率超过 90% ，成本仅为海外竞品的五分之一到十分之一。正是靠这个，宇树把消费级四足机器人打到万元以内（Go2 Air低至9997元），把中型人形机器人打到8.5万元起（G1），被业界称为&quot;价格屠夫&quot;。波士顿动力的Spot约50万元人民币，Figure 02约42万元——宇树用五分之一甚至十分之一的价格，卖出了同类产品。</p>\n<p>这是真的。四足机器人单位成本从2022年的2.23万元降至2025年1-9月的1.21万元，降幅约46%。人形机器人单位成本从2023年的7.32万元降至2025年的6.22万元，降幅约15%。这些数字背后是真实的工程能力和规模效应。</p>\n<p>但有一个追问，撬开了这个叙事的一角。</p>\n<h3 class=\"rh\">90%覆盖的是什么</h3>\n<p>公司承认：激光雷达、相机、灵巧手、计算模组、存储模块、电池电芯这些部件，宇树存在外购情况。除去选装高规格外购件的情形，外购部件成本占总成本的比例约为 14%到18% 。 [13]</p>\n<p>这14%到18%是什么概念？它意味着宇树自研的90%，覆盖的是结构件、关节模组、驱动系统——是&quot;身体&quot;。而外购的14%到18%，买来的是计算模组（&quot;大脑&quot;的硬件载体）、灵巧手（公司自己点名的两大瓶颈之一）、激光雷达（环境感知核心）、相机（视觉感知核心）——是&quot;感知与智能&quot;。</p>\n<p>换句话说：宇树自研了机器人的肌肉和骨骼，但它的眼睛、耳朵和大脑，是从别人那里买来的。当公司宣传&quot;全栈自研90%&quot;时，它没有说谎——它只是没有告诉你，那缺失的10%到18%，恰好是机器人这个行业里技术含量最高、也最难自研的部分。</p>\n<h3 class=\"rh\">当供应链成熟之后</h3>\n<p>下一个问题才是关键：当供应链日趋成熟，大家都能买到物美价廉的零部件时，你的自研优势还在吗？</p>\n<p>这是一个致命的问题。它类比的是PC和智能手机的历史：当年那些自研核心部件的先行者——IBM自研CPU、诺基亚自研芯片组——最终大多在成熟的供应链面前失去了成本优势，沦为&quot;组装厂&quot;。今天买一台PC，没有人会因为它用了自研的电容而多付钱。</p>\n<p>宇树的回答是：中短期内，通用机器人行业&quot;较难形成丰富、成熟的供应链体系&quot;，因为技术仍在快速迭代。即便供应链成熟，&quot;仍然会存在较高技术难度的核心关键部件&quot;。这个回答有道理，但它是一个关于未来的判断，而非一个既成的事实。它建立在&quot;行业不会那么快成熟&quot;的假设之上。而历史反复证明，技术成熟的速度，往往超出所有人的预期。</p>\n<h3 class=\"rh\">专利：20项发明专利</h3>\n<p>&quot;262项专利&quot;是宣传材料中的高频数字。但把这个数字拆开：</p>\n<p>实用新型与外观设计保护的是&quot;这个零件长什么样&quot;和&quot;这个外壳什么配色&quot;，不保护核心技术方案。一家以&quot;全栈自研&quot;为标签的硬科技公司，它的核心专利壁垒是靠20项发明专利来守卫的——这个数字甚至不如一家普通的消费电子公司。 [15]</p>\n<p>作为参照：越疆科技截至2025年底拥有已授权境内专利625项。两家都是&quot;全栈自研&quot;标签的机器人公司——一个是20项发明专利，一个是625项。 [6]</p>\n<p>更值得警惕的是，这20项发明专利高度集中于运动控制（&quot;小脑&quot;）领域——没有一项与具身大模型（&quot;大脑&quot;）直接相关。也就是说，宇树在一个它寄予厚望、并从中募资20亿元去研发的技术方向上，目前的专利储备是零。而竞争对手（特斯拉、Figure、智元）正在这个领域加速布局专利。</p>\n<p>专利池中被引证最多的，是2017年的一项名为&quot;一种电驱动四足机器人的腿部动力系统结构&quot;的专利，被引114次——这在整个专利池中是鹤立鸡群的存在。其余专利被引证次数多在20次以下。公司最有分量的技术资产，形成于九年前。</p>\n<p>这一点公司并不回避。它在注册阶段文件中写道：</p>\n<blockquote>&quot;较少的专利数量不利于公司充分维护自身核心技术合法权益，可能存在难以依托知识产权壁垒有效防范制止技术侵权、仿制抄袭的潜在法律风险。&quot; [11]</blockquote>\n<p>一位券商分析师对《南方都市报》的评价是：&quot;这说明宇树更多依赖技术改进而非根本性创新，技术壁垒不够深厚。&quot; [16]</p>\n<p>&quot;专利空心化&quot;是比&quot;研发费率低&quot;更根本的问题。研发费率低意味着今天投入少，专利空心化意味着过去也没真正投入。两个信号加在一起，指向一个无法回避的问题：宇树的护城河，到底是不可复制的技术能力，还是先发优势和规模效应？前者是壁垒，后者是窗口。而窗口会关闭。</p>\n<h2 class=\"rh\">第五章 追问资本：估值的斜率与门外的队伍</h2>\n<p>现在，让我们追踪资金。这是理解宇树最复杂、也最值得追问的一个维度——因为资本的流动，从来不只是数字的搬运。每一笔钱的进出，都携带着信息、权力和预期。</p>\n<h3 class=\"rh\">股东名单：中国资本的&quot;名人堂&quot;</h3>\n<p>宇树的股东名单堪称中国资本的&quot;名人堂&quot;： [17]</p>\n<p>此外还有腾讯、阿里、蚂蚁集团、中国移动、深创投、源码资本、祥峰投资、初心资本、德迅投资、容亿投资、吉利资本、卧龙电驱……几乎囊括了中国互联网与产业资本的全部头部力量。</p>\n<h3 class=\"rh\">融资史：从200万到420亿</h3>\n<p>这些资本的进场，是一部微缩的中国硬科技投资变迁史。 [18]</p>\n<p>这些故事很动人。草根天才遇到天使伯乐，红杉一周发TS，美团在哈佛实验室里找到了投资信心，大疆错失30亿——这是中国硬科技创业最好的叙事素材。但对二级市场的投资者而言，需要冷静看待的是另一个数字：估值曲线的斜率。</p>\n<h3 class=\"rh\">一周，58亿到120亿</h3>\n<p>公开文件披露了一个细节：申报前最近一次增资对应的投前估值为120亿元，而一周前一笔股权转让对应的估值为58亿元。有人质疑其&quot;原因及合理性&quot;。 [19]</p>\n<p>公司的回复：&quot;两批次股权变动存在估值差异，主要系由于交易洽谈时间与正式签约时间的间隔较长。&quot;即谈判在前、签约在后，其间市场热度上升。程序上没有瑕疵。</p>\n<p>但&quot;一周翻倍&quot;这四个字，无论如何包装，在资本市场里只有一个准确的解读：FOMO（Fear of Missing Out，害怕错过）。估值不是被&quot;算&quot;出来的，是被&quot;抢&quot;出来的。一大批中国最顶级的资本在同一个赛道上后脚踩前脚地挤进来——一级市场的投资人不是在为公司的基本面前景出价，而是在为&quot;别人都有而我没有&quot;的错失焦虑出价。</p>\n<p>把时间轴拉长看斜率：2024年初约31亿元 → 2024年9月约80亿元 → 2025年6月C轮127亿元 → 发行估值约420亿元。两年半，约13倍。有媒体测算，招股书披露后短短6天，账面估值就涨了74亿元，创始人王兴兴个人身家一度逼近140亿元。</p>\n<h3 class=\"rh\">需求端：To LP</h3>\n<p>需求端的独立数据没有同步。高盛2026年调研报告写道：</p>\n<blockquote>&quot;2026年机器人出厂规模将明显超出终端市场的真实消化能力，相当数量的产品正被投入数据工厂用于模型训练，尚未进入商业交付环节。&quot; [20]</blockquote>\n<p>虎嗅网2026年2月报道引述多位投资人指出，&quot;<mark class=\"direct\" data-hit=\"2\">大部分具身智能整机厂商正面临订单饥渴——在B、C两端，真实的市场需求</mark><mark class=\"paraphrase\" data-hit=\"10\">甚至不足以消化2025年产能。&quot;</mark>一位知名投资人的原话更简短：&quot;本质上是To LP。&quot;——意思是，行业里相当一部分订单的最终说服对象，是基金的出资人，而不是终端客户。 [21]</p>\n<p>&quot;To LP&quot;这三个字，是理解整个具身智能赛道的一把钥匙。它的意思是：行业里很大一部分&quot;需求&quot;，不是客户真的要买，而是资本在推着被投企业互相下单、互相验证营收。如果这个判断成立，那么宇树73.6%的科研教育收入，有多少是高校真实的采购需求，有多少是资本生态内部循环的产物——这个问题，连最详细的公开文件都无法完全回答。</p>\n<h3 class=\"rh\">42亿的去向</h3>\n<p>本次IPO拟募集42.02亿元，投向四个项目： [22]</p>\n<p>占比最高的一项，正是公司自认&quot;尚未规模化应用&quot;、发明专利为零、且&quot;尚未大规模开展工厂部署训练&quot;的具身大模型方向。20.22亿元，约为公司2022至2024年三年研发投入总和（约2.65亿元）的8倍。 [22]</p>\n<p>把第三章的分析与这张表并排放，会得到一组对照：公司在经营期内把研发费率维持在8.53%，利润率因此显著高于同行；上市之后，补齐&quot;大脑&quot;的资金主要来源是公众投资者。如果这项研发成功，在420亿元估值上持股的早期股东是最直接的受益方；如果不及预期——招股书的风险提示部分没有为这种情形提供量化分析。</p>\n<h3 class=\"rh\">71倍，和它的参照系</h3>\n<p>420亿元估值对应<mark class=\"direct\" data-hit=\"3\">2025年扣非净利润5.91亿元，</mark>静态市盈率约71倍。两家已在港股上市的同行提供了参照：优必选市值约538亿港元（2025年营收20.01亿元，净亏损7.90亿元），越疆科技约138亿港元（2025年营收4.92亿元，净亏损0.84亿元）——两家均长期未盈利，市场给出的本就是远期定价。 [23]</p>\n<p>把宇树放进2026年A股的整体水位里看：截至4月，年内新股平均募资仅9.48亿元。在已上市的48家公司中，募资超10亿的17家、5至10亿的10家、5亿以下的21家——也就是说，绝大多数公司上市时只拿到个位数的&quot;门票钱&quot;。 [39]</p>\n<h3 class=\"rh\">同处&quot;战略高端制造&quot;，它们融到了多少？</h3>\n<p>如果把宇树放进&quot;高端制造业&quot;这个更大的池子，画面就变了。以下公司同样身处中国战略鼓励的方向——商业航天、新材料、增材制造、工业母机、机器视觉——但市场给它们的定价，普遍只有宇树的四分之一到二分之一。 [39]</p>\n<p>泰金新能的阴极辊突破国外垄断、电科蓝天为神舟北斗供了数十年电源、煜鼎增材的金属构件用在舰载机与运载火箭上——同样&quot;卡脖子&quot;，估值却低得多。</p>\n<p>这些公司各有&quot;硬核&quot;故事：泰金新能的高性能铜箔设备突破国外垄断、填补空白，终端应用于航天军工与新能源；电科蓝天累计为700余颗卫星飞船提供宇航电源，是商业航天&quot;国家队&quot;；易思维是工业机器视觉的国产替代主力；煜鼎增材的金属增材构件用在了多型舰载机、大型运输机与新一代核能装备上。它们身处同样的战略赛道、面临同样的&quot;卡脖子&quot;命题，但资本市场给出的募资额，是宇树的四分之一到一半。</p>\n<h3 class=\"rh\">想融，却没融到</h3>\n<p>还有一批公司，连这点钱都没拿到。2026年上半年，沪深北三大交易所共有31家企业撤回IPO申请——在发行节奏收紧的背景下，仍有人倒在门前。它们中不少同样来自高端制造，有技术、有营收，却没能走完这最后一步。 [39]</p>\n<p>同批离场的还有亚电科技（半导体清洗设备，营收5.8亿）、沁恒微（&quot;全栈自研&quot;芯片，2026.1终止）等——它们大多营收已破亿、同样身处战略赛道，却在&quot;主动撤回&quot;后归零。</p>\n<p>东岳氢能已是&quot;三战三败&quot;，第三次申报拟募24.46亿元，却在2026年6月主动撤单；易加增材把拟募12.05亿元写进了招股书、已是金属3D打印国内第一梯队，撤回后被监管查出研发内控问题并出具警示函。它们与宇树面对的是同一扇门——有的推门而入带走了42亿，有的在门外停下了脚步。</p>\n<p>也有机构看多。中金公司研报认为，宇树、智元等头部企业登陆资本市场，将带动机器人板块情绪修复，吸引场外资金入场。 [25] 2026年7月初宇树IPO注册获批前后，机器人板块集体走强，超四十只个股封板，机器人ETF盘中触及上限，科技ETF成交额近7亿元创近6年新高，机器人指数净流入244.57亿元。半导体板块整体回调1.39%，资金呈现科技板块内部高低切换。</p>\n<p>这两种判断——&quot;To LP&quot;与&quot;情绪修复&quot;——描述的其实是同一件事的两面：这个板块的定价，目前更多由资金面而非订单面驱动。分歧只在于，资金面驱动的行情能持续多久。</p>\n<h3 class=\"rh\">104天，和门外的队伍</h3>\n<p>宇树的IPO从受理到注册生效用了104天。这个速度需要放进行业坐标系里看： [26]</p>\n<p>背景是2023年&quot;827新政&quot;后IPO节奏阶段性收紧，2024年A股IPO募资额较2022年近6000亿元的高点回落超过八成。在一个发行节奏受控的市场里，同一赛道的公司，有的去了港股，有的选择借壳，有的仍在排队——宇树用104天走完了全程，并带走了42亿元额度。</p>\n<p>为什么优必选、越疆去了香港？因为A股对盈利、对&quot;硬科技&quot;成色的审核门槛更高、排队更久。港股18C章为未盈利科技公司留了口子，融资确定性更强。它们不是不想要A股的高估值，是A股这扇门更窄、更挤。为什么智元要借壳？借壳的本质，是用钱买一个已有的上市地位，从而跳过IPO的排队和不确定性。当一家头部企业宁可付出借壳的高昂成本也不愿去排IPO的队，恰恰说明IPO这条正门有多拥挤。</p>\n<p>对此存在两种解读。一种认为，科创板的制度设计本就是把稀缺资源优先配置给硬科技龙头，而宇树是这批公司中唯一有规模利润的一家——快，是制度意图的体现。另一种解读来自排队者的视角：头部公司的420亿元估值锚一旦确立，后来者要么对标它发行，要么在对比中失色。两种解读都成立，它们只是回答了不同的问题——前者回答&quot;该不该给它&quot;，后者回答&quot;给了它之后，别人怎么办&quot;。</p>\n<h3 class=\"rh\">一个增长85倍的客户</h3>\n<p>在关联交易章节里，有一组数据值得停留。2023年至2025年前三季度，宇树向银河通用机器人——同为具身智能头部企业——的销售额分别为1.77万元、36.47万元、1514.38万元。两年增长逾850倍，放量窗口与宇树IPO申报期重合。银河通用自身也在2025年6月完成了一轮估值大幅提升的融资。 [27]</p>\n<p>有人质疑：同行业公司大额采购的背景，是否存在其他类似情形，关联销售的必要性、合理性及公允性。企业回复：采购用于银河通用自身研发与二次开发。</p>\n<p>目前没有公开证据表明该交易存在异常。但三个事实的交汇让人不得不多想一步：第一，红杉中国同时投资了宇树和银河通用，两家公司资本方高度重叠；第二，销售额暴增的时间窗口紧贴宇树IPO申报期；第三，银河通用作为同行业公司，既是客户又是潜在竞争者——这种双重身份加重了关联交易的敏感性。</p>\n<p>如果这种&quot;同行互买&quot;模式在行业内被放大——即多家企业在资本的撮合下互相采购以人为做大行业总量——那么整个具身智能赛道公开的收入数据，都可能存在系统性水分。这是一场关于赛道的信用博弈，而宇树正好站在了聚光灯下。</p>\n<h3 class=\"rh\">34.76%的股份，68.78%的表决权</h3>\n<p>钱进来之后，由谁决定怎么花——这是控制权结构回答的问题。</p>\n<p>王兴兴直接持股23.82%，加员工持股平台合计控制34.76%的股份；通过每股10倍表决权的AB股安排，控制68.78%的表决权。监管问答指出，若无此安排，其表决权约为31%。 [28]</p>\n<p>31%，是一个&quot;控股但不绝对&quot;的比例——大股东说了算，但重大事项仍需要看其他股东脸色。68.78%，则是一个可以单独决定股东会普通决议、并对特别决议起决定性作用的比例。特别表决权做的，就是把一个&quot;31%的相对控制&quot;，一键升级为&quot;近七成的绝对控制&quot;。</p>\n<p>两个细节值得审视。其一，该安排设立于2025年5月公司股改之时——上市申报前夜，彼时估值已在百亿量级、新股东密集进入，而非创业早期。这不是谷歌2004年上市时那种&quot;为保护长期愿景而设的创业初心&quot;，而是在资本已经涌入到不可逆的阶段，用一个&quot;临门一脚&quot;的制度设计锁死了航向。</p>\n<p>其二，公开文件披露了美团系（三家主体合计持股9.65%）、中信证券系、阿里/蚂蚁系股东之间的关系。企业的回复是：上述股东&quot;关系较为密切&quot;，但&quot;未被认定为一致行动人&quot;。这个措辞在技术上成立（一致行动人有明确认定标准），但在实质上留下了一个模糊地带——一群紧密关联、同进同退的大型资本，在法律上被切成了彼此独立的小股东。</p>\n<p>招股书风险提示第6条写道：</p>\n<blockquote>&quot;在特殊情况下，实际控制人的利益可能与公司其他股东不一致，存在损害其他股东，特别是中小股东利益的可能。&quot; [28]</blockquote>\n<p>这段话由公司自己写下。公众股东每一股的实际话语权，约为创始人所持每股的十分之一。而那笔20.22亿元的大模型投入如何使用、何时调整，将由68.78%的表决权决定。</p>\n<h2 class=\"rh\">第六章 追问业绩：四条同向运动的曲线</h2>\n<p>把存货翻倍、应收账款翻四倍、销量还在增长、毛利率还在下降——四条曲线在同一个方向上同时运动，这在财务分析里有一个经典名称：压货式增长。</p>\n<h3 class=\"rh\">四条同向运动的曲线</h3>\n<p>2024年末至2025年9月末，四组数据同向变化： [29]</p>\n<p class=\"rli\">存货 ：1.41亿元 → 2.78亿元，接近翻倍；</p>\n<p class=\"rli\">应收账款 ：2159万元 → 8345万元，增长近4倍，远超同期营收增速；</p>\n<p class=\"rli\">存货跌价准备 余额：2281万元；</p>\n<p class=\"rli\">Go1毛利率 ：79.78% → -32.18%。</p>\n<p>同期，据财闻报道，公司在全国招募代理商：年度销售任务不低于1000万元，首批提货额200万至300万元，季度未达标按比例扣除保证金。 [30]</p>\n<p>单独看，每一条都有合理解释——备货应对增长、账期支持渠道、老品正常迭代。合在一起看，存货上升、应收激增、渠道加杠杆、老产品负毛利出清，这四条曲线在财务分析中通常与一种增长模式相关：收入在发货时确认，消化则交给渠道。</p>\n<p>背后的商业逻辑并不难还原：公司先把货压进经销商仓库，在账面上确认收入和利润；经销商用自己的资金和保证金把货吃下来；但如果终端销售跟不上补货速度——渠道里的库存就会越堆越厚。应收账款快速增长，意味着经销商回款慢，或者公司放宽了账期来刺激进货。</p>\n<p>Go1赔本倾销的真相，是为了维持&quot;全球出货第一&quot;这条招股书里最高频的叙事。市场上有太多产品，真实需求却还不够大。这不止是宇树的问题，这是整个具身智能赛道正在经历的一场&quot;去泡沫&quot;运动。</p>\n<h3 class=\"rh\">检验时点：利润腰斩</h3>\n<p>检验的时点已经出现。2026年一季度，宇树实现营业收入4.23亿元，同比增长68.49%——对比2025年同期332.64%的增速，已是断崖式回落。更刺眼的是利润：扣非净利润从上年同期的8483.65万元，骤降至<mark class=\"direct\" data-hit=\"4\">4025.36万元，同比下降52.55%。 [</mark>31]</p>\n<p>短短三个月，利润腰斩。公司的解释是研发费用和销售费用的大幅增加——一季度为补&quot;大脑&quot;的课，研发费用同比净增3832.80万元；叠加央视春晚的品牌推广费用集中在一季度确认。公司预计，2026年上半年扣非净利润仍将同比下降6%到22%。</p>\n<p>这正是注册阶段最担心的场景：IPO后短期内业绩变脸。</p>\n<h3 class=\"rh\">主动拆雷</h3>\n<p>宇树在上会稿中把特别风险提示从6条增加到7条，将&quot;增速放缓及经营业绩发生波动的风险&quot;提到了所有风险的首位，首次披露了一季度利润腰斩的事实，并新增了&quot;<mark class=\"direct\" data-hit=\"5\">研发投入方向及成效不及预期的风险&quot;。</mark>它还在招股书里点名竞争对手，承认特斯拉Optimus Gen-3已启动小批量试产，弗里蒙特工厂年产能目标100万台。</p>\n<p>披露这些风险，是注册制下招股书的应有之义——它把判断权交还给市场。</p>\n<p>若渠道内的存货消化顺利，一季度的降速只是高基数后的正常回落。若不顺利，出口只有两个——退货冲减收入，或计提跌价损失。这两个动作中的任何一个，都会直接冲击已经在降速的利润表。下一份季报会给出答案。</p>\n<h2 class=\"rh\">第七章 三个没有答案的问题</h2>\n<p>回到最初的问题：宇树十年的成长与百天的上市，有没有蹊跷？我们逐一核查了几个被市场反复提及的疑点。结论是：没有发现造假、利益输送或重大违规的证据。但&quot;没有蹊跷&quot;不等于&quot;没有风险&quot;。真正的问题，是三个目前没有答案的问号。</p>\n<p>预先审阅机制是合规的快车道，宇树在受理前已完成全部问询闭环，现场检查也未拖慢进度。速度本身不构成违规。但73天——把前纪录压缩了一半——背后需要的制度配合力度，值得记录。</p>\n<p>2025年的335%增长踩中了春晚爆火、DeepSeek引发的AI浪潮、行业热度等多重风口。这些因素难以复制。2026年Q1增速已从332%降至68%，扣非净利润同比腰斩52.55%。增长引擎正在换挡——但换到什么速度，还不知道。</p>\n<p>如果&quot;大脑&quot;研发成功，在420亿估值上持股的早期股东是最直接的受益方。如果不及预期——他们有足够的浮盈空间。而买入股票的公众投资者，没有。招股书的风险提示部分，没有为这种情形提供量化分析。</p>\n<p>我们没有发现造假、利益输送或重大违规的证据。宇树的成长，是一个真实的、努力的、也充满运气的中国硬科技故事。2025年8月的专利诉讼——一家主营日化、与机器人毫无关联的杭州公司起诉宇树侵犯&quot;一种电子狗&quot;专利——2026年2月最高法院终审判决宇树胜诉。特别表决权——王兴兴直接持股仅23.82%，却通过AB股安排控制68.78%的表决权——科创板允许这种设计，但它意味着中小股东在重大决策上的话语权被极大压缩。</p>\n<h2 class=\"rh\">第八章 招股书之外：819页里写得最轻的一页</h2>\n<p>翻遍宇树819页的招股书和全部公开回复，有一个事件几乎找不到痕迹——唯一的相关字样是&quot;境外经营环境变化的风险&quot;，塞在常规风险提示里。真实的风险远不止&quot;经营环境变化&quot;。</p>\n<h3 class=\"rh\">安全后门时间线</h3>\n<h3 class=\"rh\">&quot;漏洞&quot;还是&quot;后门&quot;</h3>\n<p>宇树对这些指控的回应是&quot;漏洞已修复&quot;。但从&quot;漏洞&quot;到&quot;后门&quot;，在舆论和法律上有着天壤之别。&quot;漏洞&quot;是技术缺陷，可以修复；&quot;后门&quot;是有意设计，意味着信任的彻底崩塌。双方各执一词。</p>\n<p>更重要的是，美国国会调查信中列举的证据并非无根之木：宇树确实向北航、中北大学等军工院校供应过产品；在一次中柬联合军演中，宇树机器人被镜头捕捉到携带步枪。即便宇树声明&quot;不向解放军直接出售产品&quot;，这些信息已足以在西方监管机构那里形成一幅完整的&quot;军民两用&quot;画像。</p>\n<p>北美的禁令如果落地，影响的远不止宇树一家的美国市场收入。美国在出口管制和安全审查上的动作，历史上几乎必然会触发欧盟和其他盟友的跟进。而招股书里，没有一条风险提示可以告诉投资者：你要为这个地缘政治风险，在你的估值模型里打个折，打多少折。</p>\n<p>这道题，没有人能替投资者解答——因为它不在A股的审核框架之内。它只能由市场自己来消化。</p>\n<h3 class=\"rh\">六小龙的两副面孔</h3>\n<p>宇树位列&quot;杭州六小龙&quot;——与DeepSeek、游戏科学等并列，是这座城市递给世界的科技名片。这个头衔为它带来了春晚的C位、络绎不绝的媒体镜头，以及定向的政府资金与政策扶持。2025年2月，王兴兴以民营企业家代表身份出席高层座谈会并获前排座次。 [38]</p>\n<p>同一组事实，在两个市场里被读成了相反的东西。在国内，它是信用背书——春晚C位、媒体追捧、最快过会纪录。在华盛顿，美国国会的公开信将那个座次作为证据引用，并称杭州的政府基金曾向公司提供&quot;使其起死回生的关键紧急资金&quot;（critical emergency funding that &#x27;brought it back to life&#x27;）。</p>\n<p>&quot;杭州六小龙&quot;的品牌光环是不是双刃剑？在国内，它是光环和流量——它帮助宇树拿到了春晚的C位、获得了媒体的持续追捧。但在海外，&quot;六小龙&quot;正在变成危险的标签——它是中国&quot;举国体制&quot;培育硬科技的鲜活证据，是说服外国监管机构把宇树列入制裁名单的核心论据。</p>\n<p>对投资者而言更实际的问题是披露的颗粒度：政府补助在财务报表中按&quot;其他收益&quot;等科目列示，招股书亦纳入了相关表述，但其规模、以及与税收优惠合计占净利润的比例，均未集中、单独披露；三轮监管问答也未就此专门追问。政府的资金支持在多大程度上支撑了它的财务报表？宇树有没有可能因为政府的高度重视而获得一些市场化企业拿不到的资源？如果有，那么它的&quot;先发优势&quot;在多大程度上是自己赢的、在多大程度上是政策和流量送的——这个边界，投资者很难从公开材料中区分清楚。</p>\n<p>可以确定的只有一点：附着在政策上的那部分优势，其存续不取决于公司自身。政策的风向可以扶持一家公司，也可以在某一天转向。</p>\n<h2 class=\"rh\">尾声：翻不过去的那道坎</h2>\n<p>在王兴兴的办公室里，至今陈列着他大一时用200元零件做出的第一台机器人——步履蹒跚，勉强能走。从那台粗糙的样机，到春晚舞台上行云流水的《武BOT》，宇树用十年走完了从&quot;能动&quot;到&quot;能秀&quot;的全程。</p>\n<p>但从&quot;能秀&quot;到&quot;能干活&quot;，是另一道坎。</p>\n<p>全部数据已经陈列完毕。73.6%的收入来自科研教育，不足1%来自工业场景；研发费率8.53%，同业均值的三分之一；发明专利20项，越疆是625项；同行把机器人送进产线，宇树把机器人送进展厅。而募资额的48.1%——20.22亿元——将投向那个发明专利为零的方向。</p>\n<p>宇树不是骗子。它造出了真实的产品，全球出货量第一可以交叉验证；它拿到了真实的收入，17亿年报已审计；它实现了真实的利润，扣非5.91亿。它的运动控制是货真价实的世界级——后空翻、跑酷、集群编舞，全球没有任何一家公司能在这个维度上与之比肩。</p>\n<p>但它也不是投资者想象中的那只独角兽。90%以上的营收来自科研设备和展厅摆件；研发费用率不到行业平均的三分之一；88%的专利保护的是外观和结构而非核心技术；自研大脑尚未装进任何一台售出的机器人里——而它要从公众市场中募走20亿元，去补自己从来没有认真投入过的功课。</p>\n<p>宇树把42亿募资中的20亿押在了智能机器人模型研发上，试图用资本市场的弹药，补上这块最关键、也最昂贵的短板。这是一场豪赌。赌的是它能在特斯拉、智元、以及无数手握大模型的追赶者冲上来之前，让自己的机器人真正&quot;聪明&quot;起来。</p>\n<p>420亿的估值，不是对宇树今天能力的定价，而是对&quot;它有一天一定能把大脑补上&quot;这个故事的期权定价。换句话说，这不是一个确定性标的，而是一份高期望的彩票。</p>\n<p>彩票之所以是彩票，不是因为中奖概率为零——而是因为中奖和落空之间，隔着一道需要时间、技术、运气和运筹帷幄才能跨越的鸿沟。对宇树来说，这道鸿沟的名字是：从&quot;全世界最能翻跟头的机器人&quot;变成&quot;全世界最能干活的机器人&quot;。</p>\n<p>而在那之前，那些把它捧到420亿估值位置上的力量——赛道的情绪、春晚的流量、资本的FOMO、政府的背书、散户对&quot;打新赚钱&quot;的肌肉记忆——每一股力量，都有撤回的风险。</p>\n<p>上市不是终点，而是发令枪。真正的比赛——那场关于&quot;大脑&quot;的竞赛——才刚刚开始。</p>\n<p>而这一次，会不会翻跟头，已经不重要了。重要的是，它能不能想明白，翻这个跟头，是为了什么。</p>", "hits": [{"type": "direct", "src": "2026-07-17_宇树科技/原始资料/招股书年报/招股书_财联社_20260525_宇树科技上会稿解读.html", "core": "研发投入方向及成效不及预期的风", "art": "宇树的回应是：在上会稿招股书中增加了一条特别风险提示，将它放在所有风险的最前面——\"增速放缓及经营业绩发生波动的风险\"。它还新增了\"研发投入方向及成效不及预期的", "srcc": "作为重大事项提示3新增风险因素研发投入方向及成效不及预期的风险明确披露前期研发投入侧重本体与小脑自2024年起", "sim": 1.0, "len": 16}, {"type": "direct", "src": "2026-07-17_宇树科技/原始资料/招股书年报/招股书_证券时报_20260706_宇树科技招股书关键数据.html", "core": "均过半分别为572155635", "art": "还有一个维度值得留意。2022至2024年，宇树的境外主营业务收入占比均过半，分别为57.21%、55.63%、55.70%。也就是说，在2024年之前，宇树一", "srcc": "境外收入占比20222024年均过半分别为572155635570预先审阅机制宇树科技是继长鑫科技之后上交所科", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-17_宇树科技/原始资料/舆情网页/舆情_虎嗅_20260207_具身智能订单饥渴.html", "core": "大部分具身智能整机厂商正面临订", "art": "虎嗅网2026年2月报道引述多位投资人指出，\"大部分具身智能整机厂商正面临订单饥渴——在B、C两端，真实的市场需求甚至不足以消化2025年产能。\"一位知名投资人", "srcc": "人创业者在过去半年明确告诉虎嗅大部分具身智能整机厂商正面临订单饥渴在BC两端真实的市场需求或已经不足以消化20", "sim": 1.0, "len": 30}, {"type": "direct", "src": "2026-07-17_宇树科技/原始资料/研报数据/研报_高盛_202606_具身智能产业格局中韩对比.html", "core": "2025年扣非净利润591亿元", "art": "420亿元估值对应2025年扣非净利润5.91亿元，静态市盈率约71倍。两家已在港股上市的同行提供了参照：优必选市值约538亿港元（2025年营收20.01亿元", "srcc": "比突破51率先实现人形业务盈利2025年扣非净利润591亿元毛利率6013形成四足现金牛供养人形研发的成熟商业", "sim": 1.0, "len": 15}, {"type": "direct", "src": "2026-07-17_宇树科技/原始资料/招股书年报/招股书_证券时报_20260706_宇树科技招股书关键数据.html", "core": "402536万元同比下降525", "art": "检验的时点已经出现。2026年一季度，宇树实现营业收入4.23亿元，同比增长68.49%——对比2025年同期332 2026-07-18_建滔集团/原始资料/招股书年报/年报_建滔积层板_20250326_2024年业绩公布.html", "2026-07-18_建滔集团/原始资料/招股书年报/年报_建滔积层板_20260316_2025年营收204亿.html", "2026-07-18_建滔集团/原始资料/招股书年报/年报_建滔集团_20250324_2024年度业绩公布.html", "2026-07-18_建滔集团/原始资料/招股书年报/年报_建滔集团_20260318_配售27亿套现.html", "2026-07-18_建滔集团/原始资料/招股书年报/年报_建滔集团_20260617_出售套现117亿.html", "2026-07-18_建滔集团/原始资料/研报数据/研报_CCLA_20250628_全球刚性CCL市占率建滔14.7%.html", "2026-07-18_建滔集团/原始资料/研报数据/研报_中信证券_20260416_覆铜板涨价修复转景气.html", "2026-07-18_建滔集团/原始资料/研报数据/研报_兴业研究_20251118_覆铜板格局明晰AI驱动成长.html", "2026-07-18_建滔集团/原始资料/研报数据/研报_国金证券_20260624_AI服务器M8M9覆铜板涨价.html", "2026-07-18_建滔集团/原始资料/舆情网页/舆情_21经济网_20260528_四次提价累计超40%.html", "2026-07-18_建滔集团/原始资料/舆情网页/舆情_今日头条_20260316_建滔积层板营收204亿.html", "2026-07-18_建滔集团/原始资料/舆情网页/舆情_大公文匯_20250326_碧桂园富力拨备逾14亿.html", "2026-07-18_建滔集团/原始资料/舆情网页/舆情_大公文匯_20250828_连续20年全球销售第一.html"], "src_hits": {"2026-07-18_建滔集团/原始资料/研报数据/研报_CCLA_20250628_全球刚性CCL市占率建滔14.7%.html": 2, "2026-07-18_建滔集团/原始资料/研报数据/研报_国金证券_20260624_AI服务器M8M9覆铜板涨价.html": 2, "2026-07-18_建滔集团/原始资料/研报数据/研报_兴业研究_20251118_覆铜板格局明晰AI驱动成长.html": 1, "2026-07-18_建滔集团/原始资料/招股书年报/年报_建滔集团_20260617_出售套现117亿.html": 1}, "body_html": "<h1 class=\"rh\">建滔系：一纸涨价函背后的铜箔帝国， 与AI叙事的边界</h1>\n<p>清远，北江畔的厂区里，一卷卷 覆铜板 从压机里吐出。这东西看着朴素——玻璃纤维布浸了树脂、两面贴上铜箔、高温高压压成一张板——却是几乎所有电子产品里印刷电路板（ PCB ）的地基。全球每卖出五张覆铜板，就有一张多出自这里背后的建滔。2025年，它卖出约1.16亿张覆铜板，连续20年坐在全球销售额头把交椅上。 [8] [3]</p>\n<p>张国荣，建滔的创始人，深圳起步、香港发家，被人唤作&quot;铜箔大王&quot;。2026年，他治下的建滔系做出两件看似同向、实则相反的事：一边，积层板业务借着AI与铜价掀起一轮又一轮涨价，把&quot;全球第一&quot;讲成了&quot;AI算力核心标的&quot;；另一边，家族在不到半年内两次配售建滔积层板股份，合计套现 145亿港元 。</p>\n<p>这组数字摆在一起，构成一个值得拆开的问题：一家全球第一、又踩中AI叙事的龙头，为什么它的控股股东，偏偏选择在利润最丰、故事最动听的时刻，把股份换成现金？ [9]</p>\n<h2 class=\"rh\">第一章 从深圳农民到全球第一</h2>\n<p>建滔的护城河，是规模、 垂直一体化 与成本控制，而不是技术领先。1988年，张国荣在深圳办起第一间覆铜面板厂；1993年推动集团赴港上市；2006年再把核心的积层板业务分拆独立上市。 [9] 横向扩品类、纵向打通铜箔与玻纤布，建滔用二十年把自己垒成了全球最大的覆铜面板生产商。</p>\n<p>积层板是建滔系的&quot;现金牛&quot;；集团另有 PCB、化工与地产板块，地产在 2024 年拖累整体利润。</p>\n<p>父子两层控股：家族锁住集团、集团锁住积层板；积层板的利润经分红回流集团，再被地产与资本运作消耗或放大。</p>\n<p>根据 Prismark 数据，2024年全球积层板市场规模约151亿美元， [3] 建滔蝉联销售第一，且已连续20年居首。但&quot;第一&quot;的成色，要看它站在哪张桌子上。在用量最大的通用 FR-4 市场，建滔是当之无愧的霸主；可一旦走到 AI 服务器要用的高速高频板材（M8/M9）那张桌前，座位就被别人占了。</p>\n<p>这正是建滔式第一的微妙之处：它赢在把最普通的板子做到最便宜、最大，而不是把最尖的板子做到最好。规模与一体化是它的盔甲，却也框定了它的天花板——当一个行业被 AI 重新定价时，真正被溢价追逐的，往往是它还不擅长的高端。</p>\n<h2 class=\"rh\">第二章 追问收入：AI的蛋糕，建滔切到了几块？</h2>\n<p>建滔喊出的&quot;AI 故事&quot;，到底有几分是它自己吃到的肉？先看全局份额。按 <mark class=\"direct\" data-hit=\"0\">CCLA 数据，2025年建滔积层板全球刚性覆铜板销售额市占率</mark>约 14.7% ，全球第一，生益科技、台光电材紧随其后。 [4] 建滔确实是行业风向标，一提价全行业跟涨。</p>\n<p>建滔在&quot;总量&quot;第一；但高端 AI 板材的份额，不在它手里（见下一图）。</p>\n<p>可一旦把镜头切到 AI 服务器真正需要的那块—— 高速高频覆铜板（M系列） ，格局立刻反转。兴业研究统计，在高速覆铜板领域，台光电市占约33%、台耀17%、联茂16%、日本松下9%、生益科技约7%–10%，建滔并未进入前五。 [5] 换句话说，AI 算力浪潮里最肥的那块溢价蛋糕，主要被台系与生益分走；建滔吃到的，更多是上游材料（玻纤布、铜箔）的紧缺红利，以及通用板在缺货下的量价齐升。</p>\n<p>数据来源：兴业研究（2025-11）。AI 服务器用 M8/M9 高速板由台系与生益主导，建滔以通用 FR-4 见长。</p>\n<p>这并不否定建滔的受益。AI 服务器一台的价值量是传统服务器的6倍以上，带动整个覆铜板盘子变大；更关键的是，1单位高端 CCL 产能要挤占4至5单位普通产能， [7] 高端产线一扩，普通板反而更缺——建滔作为通用板老大，恰恰坐在&quot;被挤缺&quot;的受益端。只是这层受益，是周期与供需错配的副产品，不是它自己站上了 AI 的高端牌桌。</p>\n<h2 class=\"rh\">第三章 追问利润：涨价函就是印钞机？</h2>\n<p><mark class=\"paraphrase\" data-hit=\"1\">2026年以来，建滔积层板已四次发布涨价函，板料与半固化片累计涨幅超40%。 [</mark>6] 加上2025下半年的连续提价，整条产业链都在喊涨。问题是：这一轮利润，究竟来自&quot;定价权&quot;（结构性、能持续），还是来自&quot;周期&quot;（铜价与缺货，迟早反转）？</p>\n<p><mark class=\"paraphrase\" data-hit=\"2\">2025年净利约24.4亿港元（+84%，行业专题预估）；</mark>增长由涨价与稼动率回升驱动，仍高度关联周期。</p>\n<p>中信证券的判断是：2024至2025上半年的涨价，底层逻辑先是&quot;修复性&quot;——此前价格从2022年一路跌到2024，厂商长期亏损；到2025年二季度，头部厂商 净利率 才回到约10%。 [12] 也就是说，建滔眼下的暴利，有很大一部分是在填前几年的坑，而非凭空多出的 定价权 。</p>\n<p><mark class=\"paraphrase\" data-hit=\"3\">兴业研究：2025上半年大陆 CCL 厂商平均毛利率约12%，台湾约23%；</mark>建滔凭一体化略高于大陆均值，但仍低于台系高端厂。</p>\n<p>铜价是另一把双刃剑。铜箔占覆铜板成本约42%， [11] 铜价涨，成本就涨——但建滔自己产铜箔，且行业定价权强，能把成本转嫁出去，甚至&quot;超成本涨价&quot;。可一旦铜价回落、或高端产能释放让普通板不再紧缺，今天靠缺货撑起的利润弹性，也会随之收缩。涨价函能写一时，写不了一世。</p>\n<h2 class=\"rh\">第四章 追问技术：M9的牌桌，建滔坐上了吗？</h2>\n<p>AI 服务器的迭代，把覆铜板的技术门槛从 FR-4 直接抬到了 M8/M9：更低介电损耗、更高耐热、要用石英布与极低轮廓铜箔。建滔当然在追——清远首座低介电常数电子纱窑炉2025上半年投产，<mark class=\"paraphrase\" data-hit=\"4\">韶关电子纱/布基地2026下半年投产，</mark>高端铜箔（RTF/HVLP，对应 M4–M6）厂预计2027年中投产。 [13]</p>\n<p>覆铜板成本约90%来自三大原料；建滔自产铜箔、玻纤纱/布、环氧树脂，成本比同行低约10%–15%。</p>\n<p>但时间差就是差距。M9 级别的量产与终端认证，领先者（台光、联茂、生益）已批量供货英伟达 Rubin、谷歌 TPU 等新一代平台；建滔的高端铜箔厂要到2027年才投产， [13] 低介电电子纱也刚起步。以行业惯例，从窑炉点火到稳定供货、通过大客户认证，仍需数年。建滔的&quot;第二成长曲线&quot;画在了蓝图里，却还没坐进 M9 的那张牌桌。</p>\n<p>这恰好解释了前面的悖论：建滔被 AI 叙事重估，可 AI 真正溢价的那块它暂时分不到大头。它的股价与估值，有一部分提前透支了还没到手的高端地位——而真正吃下 M9 厚利的，是别人。</p>\n<h2 class=\"rh\">第五章 追问资本：家族在周期顶端套现</h2>\n<p><mark class=\"paraphrase\" data-hit=\"5\">2026年，张国荣家族做了两笔操作：3月，建滔集团配售1.3亿股积层板股份，套现约27.3亿港元；</mark>6月，再出售1.55亿股，套现约117.8亿港元。两次合计 145亿港元 。而就在同一次业绩会上，张国荣说：&quot;今年是我们的&#x27;好十年&#x27;，我们要抓住机遇，把产品推给更多的客户。&quot;</p>\n<p>一边讲&quot;好十年&quot;、一边在顶点减持，两种动作并不矛盾，却把话挑明了：大股东用真金白银，在利润与叙事最亮的时候，把股份换成了现金。 [9] 剩余17亿多股的控股权仍在家族手里，经营不会失控；可二级市场接下这些股份的投资者，买到的价格，锚定的恰恰是这轮周期与 AI 叙事的顶峰。</p>\n<p>配售不是罪，却是信号。当创始人家族选择在&quot;好十年&quot;的开端先落袋逾百亿， [9] 它至少说明：在内部人眼里，此刻的估值，值得卖。</p>\n<h2 class=\"rh\">第六章 追问风险：地产旧伤与周期退潮</h2>\n<p>建滔系并不只有覆铜板。集团还有一块地产：2024年租金收入超14亿港元，看似平稳，却背着内房的风险。2024年，集团为碧桂园、富力地产等作出逾14亿港元的信贷减值拨备——仅这一笔，就把覆铜板业务的利润光彩削去一大块，使集团全年账面净利反而同比下降21%。 [10] [1]</p>\n<p>集团2024营业额430.9亿(+9%)，但地产拨备令整体净利下滑；房地产库存约70亿，已连续6年未买新地。</p>\n<p>更深的旧伤是周期本身。覆铜板是强周期品：2022年价格崩过一轮，一路跌到2024，全行业亏损；今天的涨价，是从坑里爬出来的修复，叠加 AI 与铜价的顺风。可周期从不会只朝上走——一旦新增高端产能释放、或下游备货退潮，价格弹性就会反向。建滔2025上半年毛利率仍只有约12%–18%， [5] 远未回到真正景气的高度；它离&quot;穿越周期&quot;尚有距离。</p>\n<p>招股书式的风险提示建滔写得克制：铜价波动、下游需求、行业竞争、原材料供给，都可能让业绩波动。这些话，公司在景气最旺时亲笔写下，恰恰最该被此刻的暴利叙事记住。</p>\n<h2 class=\"rh\">第七章 招股书之外：原材料的咽喉</h2>\n<p>建滔最被称道的一体化，也有它的咽喉。覆铜板的上游，并不全都握在自已手里：高端环氧树脂长期依赖日本厂商，高纯聚苯醚（PPE）树脂的部分产地受地缘冲突影响曾一度停产，而高端电子玻纤布的关键织布机主要进口、交付周期长达一年半以上。 [7] 建滔自产铜箔与玻纤布，能挡住一部分成本冲击，却挡不住全行业的料源紧缺——而它自己，恰恰也是这轮&quot;玻纤布、铜箔一货难求&quot;的推手之一。</p>\n<p>这构成一个微妙的闭环：AI 催动高端板扩产，高端板挤占普通产能，普通板变缺，建滔作为通用板老大顺势涨价；可一旦上游某条料（树脂、织布机、玻纤纱）被卡，涨价逻辑会瞬间从&quot;需求旺&quot;翻转为&quot;供不上&quot;。垂直一体化是护城河，却不是不受地缘与供给瓶颈影响的孤岛。</p>\n<p>所幸，覆铜板终究不是光刻机。它的地缘敏感度远低于先进芯片，主战场在消费电子、汽车与数据中心，供应链以亚洲为主。建滔的隐患，更多是商业周期与原料波动，而非被&quot;断供&quot;的生死局。这让它比许多硬科技标的更耐打，也让它的周期属性更难被 AI 叙事彻底掩盖。</p>\n<h2 class=\"rh\">尾声：AI 叙事之外的真实引擎</h2>\n<p>张国荣从深圳的农民、工厂学徒，做到全球覆铜板之王，用了将近四十年。他把最普通的板子做到了最便宜、最大，把一家镇级工厂垒成连续20年的世界冠军。这份功夫，是硬的。</p>\n<p>但世界正在被 AI 重新定价，而重新定价青睐的，是站在 M9 牌桌上的那拨人。建滔被卷进了这场叙事，股价与估值跟着水涨；可它真正吃下的 AI 厚利，仍有限。它的盈利发动机，到今天主要还是铜价驱动的 FR-4 商品周期——一轮它自己参与推高的周期。家族在顶端套现145亿，把船票递给了二级市场。</p>\n<p>2026年，是建滔的&quot;好十年&quot;开端，还是一轮商品超级周期的顶端？答案，要等铜价回落、高端产能释放、AI 订单重新分配时，才会显形。建滔用二十年证明了自己能造覆铜板。它还要证明，自己能在 AI 的牌桌上，坐到散场。</p>\n<p>读没读这份业绩与招股材料，是每个买入者自己的事。本文所引数据均来自港交所公告、公司年报、Prismark/CCLA 行业数据及公开报道，详见文末注释。投资有风险，本文不构成任何投资建议。</p>", "hits": [{"type": "direct", "src": "2026-07-18_建滔集团/原始资料/研报数据/研报_CCLA_20250628_全球刚性CCL市占率建滔14.7%.html", "core": "CCLA数据2025年建滔积层", "art": "建滔喊出的\"AI 故事\"，到底有几分是它自己吃到的肉？先看全局份额。按 CCLA 数据，2025年建滔积层板全球刚性覆铜板销售额市占率约 14.7% ，全球第一", "srcc": "06280040产经洞察局根据CCLA数据2025年建滔积层板全球刚性覆铜板销售额市占率为147连续20年稳居", "sim": 1.0, "len": 29}, {"type": "paraphrase", "src": "2026-07-18_建滔集团/原始资料/研报数据/研报_CCLA_20250628_全球刚性CCL市占率建滔14.7%.html", "core": "公司2026年以来已四次发函提价、累计涨幅超40%；", "art": "2026年以来，建滔积层板已四次发布涨价函，板料与半固化片累计涨幅超40%。", "srcc": "公司2026年以来已四次发函提价、累计涨幅超40%；", "sim": 0.609, "len": 34}, {"type": "paraphrase", "src": "2026-07-18_建滔集团/原始资料/研报数据/研报_国金证券_20260624_AI服务器M8M9覆铜板涨价.html", "core": "归母净利24.4亿港元，同比增长84%。", "art": "2025年净利约24.4亿港元（+84%，行业专题预估）；", "srcc": "归母净利24.4亿港元，同比增长84%。", "sim": 0.569, "len": 22}, {"type": "paraphrase", "src": "2026-07-18_建滔集团/原始资料/研报数据/研报_兴业研究_20251118_覆铜板格局明晰AI驱动成长.html", "core": "2025年上半年，6家中国大陆覆铜板厂商平均毛利率为12%，明显低于中国台湾厂商", "art": "兴业研究：2025上半年大陆 CCL 厂商平均毛利率约12%，台湾约23%；", "srcc": "2025年上半年，6家中国大陆覆铜板厂商平均毛利率为12%，明显低于中国台湾厂商覆铜板厂商23%。", "sim": 0.562, "len": 31}, {"type": "paraphrase", "src": "2026-07-18_建滔集团/原始资料/研报数据/研报_国金证券_20260624_AI服务器M8M9覆铜板涨价.html", "core": "韶关新基地7万吨电子纱暨9,600万米电子布将于2026年下半年投产。", "art": "韶关电子纱/布基地2026下半年投产，", "srcc": "韶关新基地7万吨电子纱暨9,600万米电子布将于2026年下半年投产。", "sim": 0.596, "len": 17}, {"type": "paraphrase", "src": "2026-07-18_建滔集团/原始资料/招股书年报/年报_建滔集团_20260617_出售套现117亿.html", "core": "今年3月，建滔集团曾配售1.3亿股，套现约27.3亿港元。", "art": "2026年，张国荣家族做了两笔操作：3月，建滔集团配售1.3亿股积层板股份，套现约27.3亿港元；", "srcc": "今年3月，建滔集团曾配售1.3亿股，套现约27.3亿港元。", "sim": 0.663, "len": 42}]}, {"key": "2026-07-18_长鑫科技", "title": "长鑫科技：在存储涨价周期顶端，一家国产DRAM厂的账本与代差", "company": "长鑫科技", "date": "2026-07-18", "n_src": 10, "nosource": false, "rate": 7.0, "rate_direct": 1.6, "rate_partial": 0.3, "rate_paraphrase": 5.1, "src_files": ["2026-07-18_长鑫科技/原始资料/招股书年报/招股书_证券时报_2026-05-27_IPO过会详情.html", "2026-07-18_长鑫科技/原始资料/研报数据/研报_SemiAnalysis_2026-06-25_CXMT深度报告.html", "2026-07-18_长鑫科技/原始资料/研报数据/研报_国金证券_2025-12-01_存储扩产自主可控加速.html", "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_21世纪经济报道_2026-06-25_SemiAnalysis深度报告.html", "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_Omdia_2025Q4_长鑫DRAM份额7.67%.html", "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_中国新闻周刊_2026-01-19_阿里云61亿长鑫.html", "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_凤凰网_2026-07-08_毛利率固定资产折旧.html", "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_环球网_2026-06-29_苹果游说白宫长鑫.html", "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_证券时报_2026-05-27_长鑫科技IPO过会.html", "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_财联社_2026-07-15_长鑫科技下一战.html"], "src_hits": {"2026-07-18_长鑫科技/原始资料/舆情网页/舆情_证券时报_2026-05-27_长鑫科技IPO过会.html": 10, "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_21世纪经济报道_2026-06-25_SemiAnalysis深度报告.html": 3, "2026-07-18_长鑫科技/原始资料/招股书年报/招股书_证券时报_2026-05-27_IPO过会详情.html": 3, "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_财联社_2026-07-15_长鑫科技下一战.html": 4, "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_中国新闻周刊_2026-01-19_阿里云61亿长鑫.html": 3}, "body_html": "<h1 class=\"rh\">长鑫科技：在存储涨价周期顶端， 一家国产DRAM厂的账本与代差</h1>\n<p>合肥新桥机场工业园区，一座晶圆厂的洁净车间里，硅片在光刻、刻蚀、薄膜沉积之间往返。这里生产的不是逻辑芯片，而是另一种更古老、也更基础的 memory—— DRAM ，动态随机存取存储器，你手机、电脑、服务器里那颗&quot;记忆芯片&quot;。十年前，中国大陆的DRAM自给率接近于零；今天，这座园区和它在北京的兄弟工厂，让中国坐上了全球第四把交椅。</p>\n<p>2026年6月12日晚，中国证监会一纸批复，同意<mark class=\"partial\" data-hit=\"5\">长鑫科技集团股份有限公司</mark>首次公开发行股票并在科创板上市。<mark class=\"paraphrase\" data-hit=\"7\">从20</mark><mark class=\"partial\" data-hit=\"7\">25年12月30日获受理，</mark><mark class=\"paraphrase\" data-hit=\"7\">到注册生效，长鑫走了168天； [1] [2] 而从受理到过会，只用了148天——这是科创板&quot;预先审阅机制&quot;落地后的首单。</mark></p>\n<p><mark class=\"paraphrase\" data-hit=\"9\">它计划募资 295亿元 ，有望成为A股年内最大IPO。 [</mark>1] 按部分机构测算，若以2026年预计净利润乘以20倍市盈率，<mark class=\"paraphrase\" data-hit=\"10\">它的市值可能冲向2万亿至3万亿元区间。</mark></p>\n<p>这是一组相隔悬殊的数字：一边是创办至今累计未弥补亏损 366.50亿元 ；另一边是 [4] 2026年第一季度单季净利润 330.12亿元 。十年亏损，一个季度近乎填平。 [3] 但这个&quot;填平&quot;需要谨慎解读：366亿的累计亏损，并非简单的&quot;欠债&quot;可以还清，而是包含了重资产模式下十年折旧与研发投入的沉没成本，需要持续的盈利来覆盖这些历史负担。</p>\n<p>这篇报道试图回答三个问题：这家公司值不值得上市？它的技术成色有多少水分？它踩中的，究竟是自己的实力，还是一轮周期的顶峰？</p>\n<h2 class=\"rh\">第一章 148天：预先审阅的速度</h2>\n<p>要理解长鑫的上市速度，需要一个坐标系。在科创板，一家普通IPO从受理到过会，平均需要约240天。长鑫只用了148天——但它是&quot;预先审阅机制&quot;改革后的第一单，监管在受理前就已完成问询闭环，速度本身不意外。</p>\n<p>长鑫是预先审阅首单，速度在制度框架之内；真正值得追问的，不是快慢，而是它选择上市的时点。</p>\n<p>有人问：为什么是现在？一个直观的答案是业绩。2025年，长鑫营收617.99亿元，同比增长155.62%，首次实现扭亏为盈；2026年一季度，营收508亿元，净利润330.12亿元。 [3] 这样的数字，放在任何时点都是&quot;史上最佳&quot;。</p>\n<p>但时点的另一面，是估值。一家公司的发行估值，取决于它最近一期利润的成色。当最近一期利润恰好处于一轮史诗级涨价周期的顶点，估值便天然锚定在景气最旺的位置。这并非长鑫独有的精明——任何一家周期型企业，都希望在镜子最亮时拍照。只是存储行业的镜子，向来明暗交替得格外剧烈。真正该追问的，不是148天快不快，而是这家公司为什么选择在周期的顶端，按下上市快门。</p>\n<h2 class=\"rh\">第二章 追问收入：谁在买这些内存？</h2>\n<p>长鑫2025年的617.99亿元，来自哪里？ [3] 招股书披露，公司<mark class=\"direct\" data-hit=\"0\">的终端客户已包括阿里云、字节跳动、腾讯、联想、小米、传音、荣耀、OPPO、vivo等。 [</mark>6] 从应用看，它的产品分两条线：LPDDR系列主要供给手机、平板等移动设备；DDR系列主要供给服务器、个人电脑。真正该问的不是&quot;卖了谁&quot;，而是&quot;这些内存最终用在哪里，又由谁付钱&quot;——长鑫的市占率，究竟是它从三巨头手里抢来的，还是对手腾挪产能时让出来的？</p>\n<p>近七成收入来自移动设备用的LPDDR；服务器与PC用的DDR占三成。HBM（高带宽内存）对营收的贡献，招股书显示仍极小。</p>\n<p>这里出现一个值得注意的细节。招股书披露，2025年长鑫 境外收入占比约56.7% 。<mark class=\"paraphrase\" data-hit=\"11\">而其公开列名 [5] 的终端客户，几乎全是阿里、字节、腾讯、小米、联想这类中国公司。</mark>一个客户主要在中国、却有过半收入来自境外的结构，在存储器行业并不罕见——长鑫的颗粒经由模组厂、再经品牌厂流向全球，但这一口径差异本身，提示投资者：招股书里的&quot;客户&quot;，和真正付钱的那一方，中间隔着不止一层。</p>\n<p>有人进一步追问：这些内存，最终用在了哪里？招股书显示，LPDDR4X已切入小米、OPPO、vivo、传音、联想的供应链； [6] DDR5与LPDDR5X正向服务器与个人电脑渗透。而据媒体报道，<mark class=\"paraphrase\" data-hit=\"12\">在三大原厂将产能向HBM与高端企业级DRAM腾挪的空窗里，</mark>长鑫凭借17nm DDR5的性价比，进入了戴尔、惠普等国际品牌的供应体系。</p>\n<p>这句话需要数据来检验。按Omdia统计，2025年二季度长鑫全球DRAM份额为3.97%，到四季度升至7.67%——半年近乎翻倍。 [7] 但三巨头（三星、SK海力士、美光）合计仍超过90%。长鑫的份额跃升，与同期通用DRAM供给出现10至14个月空窗高度同步。也就是说，它的增长，相当一部分是&quot;对手让出来的&quot;，而非&quot;自己抢过来的&quot;——它吃下的是三巨头战略性转移留下的通用市场，而非在同一战场正面取胜。</p>\n<h2 class=\"rh\">第三章 追问利润：330亿是怎么赚到的？</h2>\n<p>2026年一季度，长鑫净利润330.12亿元，同比大增1268%。 [3] 市场将其归因于&quot;量价齐升&quot;。但拆开看，&quot;量&quot;与&quot;价&quot;的贡献极不对称——这一季的暴利，究竟是抢到了更多份额（量），还是仅仅赶上了涨价（价）？答案决定了长鑫的盈利是结构性的，还是周期性的。</p>\n<p>据SemiAnalysis模型测算，2026年一季度长鑫位元出货量环比仅+11%，而ASP环比+57%。利润井喷的主驱动是价格，不是份额。</p>\n<p>独立<mark class=\"direct\" data-hit=\"1\">半导体分析机构SemiAnalysis</mark>的测算指向同一结论：2026年一季度，长鑫 位元出货量 环比仅增长约11%，而 平均售价（ASP） 环比上涨了约57%。 [8] 换句话说，真正推高利润的，是DRAM合约价的史诗级暴涨，而非公司在全球终端市场抢到了显著更多的份额。</p>\n<p>毛利率的曲线，把这种&quot;周期属性&quot;画得更清楚。2022年，长鑫综合毛利率为-<mark class=\"direct\" data-hit=\"2\">3.13%；2023年-1.93%；2024年5.58%；2025年</mark>跃升至41.02%；2026年一季度，营业利润率约70%。</p>\n<p>毛利率从负值到41%，几乎完全由2025年下半年起的DRAM涨价驱动；2026年一季度营业利润率约70%，已接近三巨头水平。</p>\n<p>市场有不同解读。看多者认为，这是&quot;国产替代+AI算力&quot;双击下的结构性拐点，毛利率站上40%意味着长鑫已跨过盈亏平衡的门槛，护城河开始显形。看淡者则指出，2023年DRAM价格也曾暴跌40%以上，长鑫当年毛利率跌至-3%； [9] [20] 今天的暴利，是三巨头产能错配、通用DRAM供给短缺共振的结果，而非长鑫自身议价权的体现。</p>\n<p>两种解读，都能在招股书里找到依据。而招股书自己写得克制：公司提示，若行业进入下行周期、下游需求疲软或供给远大于需求，产品售价与经营业绩将面临不利影响并出现波动。这句话，公司亲笔写下。SemiAnalysis的测算给看淡者添了一笔注脚——位元环比仅+11%、ASP环比+57%，利润井喷的主驱动是价格不是份额； [8] 毛利率从负到41%，几乎全由2025下半年起的涨价驱动。</p>\n<h2 class=\"rh\">第四章 追问技术：17nm与10nm之间</h2>\n<p>长鑫的技术故事，始于一个破产的德国公司。2019年，长鑫通过专利变现公司Polaris，从英飞凌手中获得约7000项奇梦达（Qimonda）遗留DRAM专利的许可，并接手了约2.8TB的技术文档。 [12] 奇梦达的一项关键架构BWL（埋藏字线），成为长鑫切入DRAM主流技术路线的支点。但技术成色的真正试金石，不在通用的DDR5，而在HBM——那道分水岭上，长鑫到底站了多少分。</p>\n<p>有人质疑：靠继承的专利，能撑起一家全球第四吗？长鑫的回应是&quot;跳代研发&quot;——不做低端落后制程，2019年直接推出自主设计的8Gb DDR4，实现中国大陆DRAM&quot;从0到1&quot;；2024、2025年DDR5、LPDDR5X相继量产。从公开参数看，其DDR5最高速率8000Mbps、LPDDR5X最高10667Mbps，已能覆盖除顶级AI服务器以外的主流需求。 [10]</p>\n<p>但制程的代差，是绕不开的硬约束。多方行业人士指出，<mark class=\"paraphrase\" data-hit=\"13\">长鑫当前量产产品停留在 等效17nm级别（G3） ，</mark>更先进的G4等效16nm正在爬坡，G5等效15nm待量产；而三巨头主力量产已达12-13nm，并测试11-12nm，全程采用EUV光刻。因受出口管制，长鑫无法合法获得EUV，只能用DUV多重曝光迂回，整体落后1至2代。 [10]</p>\n<p>注：条形长度仅表示&quot;更大数字=更成熟制程&quot;的直观对照；长鑫无EUV，靠DUV多重曝光实现等效17nm。</p>\n<p>真正的分水岭在 HBM 。高带宽内存是AI服务器的&quot;刚需燃料&quot;，涉及3D堆叠、TSV硅通孔等尖端封装，是三巨头用专利与英伟达联合开发堆出的高墙。长鑫当前仅能量产低端HBM2，HBM3处于小批量/样品交付阶段、 90%，直接决定成本与利润。&quot;&gt;良率 约60%；而三巨头已量产HBM3E/HBM4，良率超90%。代差约2至3年。 [11] 这意味着，即便长鑫在通用DRAM市场取得成功，若无法突破HBM技术壁垒，其长期竞争地位仍将受制于三巨头——因为AI算力市场才是未来增长的核心战场。</p>\n<p>企业回复：公司正积极布局更新代际产品，并计划投入前瞻技术研发。<mark class=\"paraphrase\" data-hit=\"14\">但招股书亦坦言，产能距离前三家国际头部厂商仍有差距，且产能规模远低于国内庞大需求。</mark>技术来源的争议也未止息——2025年12月，首尔检方以涉嫌违反产业技术保护法，对5名三星前员工及长鑫研发团队5人提起诉讼，指控核心技术遭系统性泄露。 [23] 长鑫方面迄今未公开回应该项指控的具体指控内容。</p>\n<p>通用DDR5已是&quot;现在的饭碗&quot;，HBM才是&quot;未来的入场券&quot;。长鑫握住了饭碗——量产等效17nm、DDR5速率覆盖主流——却还没拿到入场券：HBM仅能量产HBM2、HBM3良率约60%，而三巨头已量产HBM3E/HBM4、良率超90%，代差约2至3年。但这&quot;2至3年&quot;的估算，忽略了一个关键变量：三巨头不会在原地等长鑫追赶。当长鑫HBM3良率勉强达标时，三巨头已经量产HBM4甚至更高端——这意味着追赶永远在追赶，差距不会自然消失。更残酷的是，HBM的良率爬坡本身就意味着巨额烧钱——每一片良率未达标的硅片，都是直接报废的成本。对于一家累计亏损366亿的公司来说，这笔账，它还能烧多久？</p>\n<h2 class=\"rh\">第五章 追问壁垒：研发33%背后的&quot;绕路&quot;</h2>\n<p>长鑫常被称道的一点，是研发投入强度极高。招股书显示，截至2025年6月，公司累计研发投入188.67亿元，占累计营业收入的33.11%；2022、2023年研发占比甚至超过50%。 [13] 但研发强度高，是否等于壁垒深？这笔钱有多少真正花在了前沿突破上，又有多少只是用来&quot;绕过买不到的设备&quot;？答案，藏在支出的结构里。</p>\n<p>长鑫研发强度是三巨头的3倍左右——但高强度部分用于&quot;绕过设备限制&quot;的工艺创新，而非纯前沿探索。</p>\n<p>有人问：研发强度高，是否等于壁垒深？答案没那么直接。长鑫累计申请专利超5500项（境内3116项、境外2473项）， [14] 数量可观。但专利的质量分布不均——在HBM与先进制程上的布局密度，仍显著少于三巨头数以万计、且相互交叉的核心专利池。三巨头靠专利组合形成严密的诉讼威慑；长鑫的专利墙，还在修筑中。</p>\n<p>更现实的约束在设备端。长鑫产线设备国产化率已提升至约40%，北方华创、拓荆科技、华海清科等国产厂商导入了刻蚀、薄膜沉积等环节；但核心光刻机仍依赖海外供应链，且在美国出口管制下获取受限。 [15] 这意味着，长鑫的研发投入中，有一部分必须用于&quot;绕开设备限制&quot;的工艺创新（如DUV多重曝光），而非纯粹的技术前沿探索。</p>\n<p>研发强度高，是事实；研发转化为高端产品的效率，受供应链硬约束——这也是事实。两者不矛盾，但投资者的账，要分开算。长鑫累计申请专利超5500项，数量可观，但在HBM与先进制程上的布局密度，仍显著少于三巨头数以万计、相互交叉的核心专利池；三巨头靠专利组合形成严密的诉讼威慑，长鑫的专利墙还在修筑中。33%的研发强度，有一部分必须用于DUV多重曝光这类&quot;绕路&quot;式的工艺创新，而非纯粹的前沿探索——强度高，不等于壁垒已深。</p>\n<h2 class=\"rh\">第六章 追问资本：295亿，以及它背后的&quot;耐心钱&quot;</h2>\n<p>295亿元募资，<mark class=\"paraphrase\" data-hit=\"15\">将投向三大方向：DRAM存储器技术升级130亿元、存储器晶圆制造量产线升级改造75</mark><mark class=\"direct\" data-hit=\"16\">亿元、动态随机存取存储器前瞻技术研</mark>发90亿元。 [1] 这是一笔创纪录的融资，但放在半导体版图里，需要参照系。更值得看的是这笔钱的承接结构——十年亏损由谁扛，周期顶端的利润与估值又由谁接。</p>\n<p><mark class=\"paraphrase\" data-hit=\"17\">长鑫295亿为2026年A股最大IPO；</mark>比它募资多的，仅中芯国际一家（且为多年前项目）。</p>\n<p>这笔钱的背后，是&quot;耐心资本&quot;的十年下注。长鑫无控股股东、无实际控制人；<mark class=\"paraphrase\" data-hit=\"18\">第一大股东清辉集电（合肥国资）持股21.67%，</mark>长鑫集成11.71%、安徽省投7.91%，国有资本合计持股超过30%。五大行旗下的金融资产投资公司（AIC）亦在列。<mark class=\"direct\" data-hit=\"4\">2016年启动的&quot;506&quot;项目首期180亿元中，合肥国资</mark>承担了约80%。</p>\n<p>有人评价：合肥的打法，是把晶圆厂当作&quot;十年为期的战略押注&quot;，而非短期基金回报工具。即便在长鑫近十年尚未盈利的阶段，国资也持续注资、从未折价退出。这种耐心，是长鑫能熬过366亿亏损、等到周期到来的前提。</p>\n<p><mark class=\"paraphrase\" data-hit=\"19\">另一笔关键钱，来自上市前最后一轮。2025年6月，阿里云出资61亿元认购3.85%股权，将长鑫上市前估值推向1500亿元以上。</mark>按部分机构&quot;2026年净利润超1500亿×20倍PE&quot;的测算，<mark class=\"paraphrase\" data-hit=\"21\">长鑫市值有望冲击2万亿至3万亿元—— [18] 这意味着，</mark>最后入场的产业资本，已在周期顶端锁定了可观的账面浮盈。</p>\n<p>国资合计持股超过30%、长鑫十年未盈利仍持续注资未曾折价退出；而阿里云61亿入局推高估值至1500亿以上，机构按20倍PE估出2至3万亿市值——早期资本在顶端锁定的浮盈，最终要由敲下申购键的人来定价。</p>\n<h2 class=\"rh\">第七章 追问风险：三道关</h2>\n<p>招股书用大量篇幅提示风险。其中最硬的，是三道关：亏损、折旧、周期。它们像三笔长期存在的&quot;固定税&quot;，在暴利当头的此刻容易被忽略，却会在周期退潮时重新显形。</p>\n<p>第一道关是历史亏损。截至2025年末，长鑫累计未弥补亏损366.50亿元。 [4] [19] 重资产模式下，固定资产高达1830亿元，占总资产54.34%；2023至2025年 折旧 从105.55亿元增至246.80亿元，三年翻倍，持续吞噬利润。即便盈利，折旧仍是长期存在的&quot;固定税&quot;。</p>\n<p>第二道关是周期。DRAM是典型的强周期品：涨价时利润井喷，跌价时毛利转负。三星前半导体业务总裁曾预警，随着2027-2028年全球新建产能集中释放，内存价格可能显著回落。 [20] 长鑫在招股书中也提示，若行业进入下行周期，经营业绩将出现波动。历史上，2023年DRAM价格曾暴跌40%以上——那一年长鑫毛利率为-1.93%。</p>\n<p>第三道关在门外。美国《MATCH法案》将长鑫等五家中国芯片制造企业列为&quot;受管制设施&quot;，拟全面禁止设备出口并切断维修服务；美国商务部&quot;实体清单&quot;对核心设备与技术的限制仍未松动。2025年1月，长鑫曾被列入美国国防部1260H涉军清单（后与长江存储一同被移出），但实体清单的风险始终悬顶。 [21] 企业回复：公司通过国产供应链协同降低依赖；但&quot;绕路&quot;能走多远，取决于设备管制的实际边界。</p>\n<p>三道关叠加起来是这样一组数字：固定资产1830亿、占总资产54%，年折旧246亿三年翻倍、长期吞噬利润；2023年DRAM价格曾暴跌40%、长鑫当年毛利转负；实体清单与MATCH法案悬顶。暴利之下，这些&quot;固定税&quot;和周期风险并没有消失，只是暂时被涨价盖住了。</p>\n<p>一个关键问题被暴利掩盖了：366亿累计亏损，到底要多久才能真正&quot;弥补&quot;？答案取决于我们用什么口径算。若乐观地假设长鑫能维持2026年一季度的330亿利润水平（年化1320亿），扣除246亿折旧后，每年净填补约1074亿—— [19] 一年即可清零。但这个假设本身就是陷阱：330亿利润中有227亿来自ASP环比+57%的涨价红利，这不是公司能复制的经营成果。若将利润拉回到不含涨价的常态水平（参照2025年全年71.44亿归母净利润）， [4] 扣除246亿折旧，长鑫实际上每年仍是现金净亏损约175亿。换句话说，即便不遭遇价格暴跌，仅靠自身经营产生的利润，长鑫根本无法覆盖折旧——366亿亏损不仅不会缩小，反而会继续扩大。</p>\n<p>这就是&quot;没那么快&quot;的真实含义：295亿IPO募资，按招股书规划投入130亿技术升级、75亿产线改造、90亿前瞻研发。即使全部花完，折旧基数将进一步提高，长鑫需要更高的营收才能维持盈利。它不是已经盈利了所以来融资，而是因为还没盈利所以才来融资——295亿， [1] 是它能否继续活到盈利的那个临界点。</p>\n<h2 class=\"rh\">第八章 招股书之外</h2>\n<p>招股书之外，长鑫面对的是一套更复杂的算术。它既是&quot;国产替代&quot;的标杆，也是地缘博弈的棋子。一个耐人寻味的反差，把这种复杂摆到了台面上：2025年，苹果公司曾游说美国政府，希望获准从长鑫采购内存芯片。分量 [22] ，并不等于安全。</p>\n<p>一个耐人寻味的反差：2025年，苹果公司曾游说美国政府，希望获准从长鑫采购内存芯片。直接动因 [22] 是DRAM价格暴涨三倍，苹果急需打破三巨头的供给垄断。法律上，苹果作为私企不受1260H清单约束；但业界真正忌惮的，是实体清单——一旦长鑫被列入，苹果新建的供应链将被立即卡死。一家美国科技巨头为一家中国存储厂游说，本身说明了长鑫在全球供给中的分量。</p>\n<p>但分量，不等于安全。全球DRAM市场三十年里，台湾瑞晶、德国奇梦达、日本尔必达都曾短暂挤入前列，最终无一例外出局。长鑫与它们的区别，在于它背后有一座城市的&quot;耐心&quot;，以及一轮AI算力带来的超预期需求。这两点能否转化为结构性地位，取决于2026-2027年这个窗口：它能否在巨头HBM新产能释放、通用DRAM供给回补之前，完成14nm制程与HBM3的量产卡位。</p>\n<p>技术来源的追问也未停息。长鑫从奇梦达遗产起步，又从美光、三星、SK海力士及中国台湾大量招募人才；2025年底韩国检方的起诉， [23] 把&quot;人才流动是否越界&quot;的问题摆上了台面。<mark class=\"paraphrase\" data-hit=\"22\">长鑫从一家破产德国公司获得关键技术， [</mark>12] 再用十年把它变成全球第四——这个故事里，既有自主创新的硬功夫，也有全球产业链遗产的馈赠。两者都是事实。</p>\n<p>苹果游说，说明长鑫在全球供给中确有分量。但分量能否转化为可持续的盈利能力，仍是疑问。分量能否转化为安全，要看2026-2027这个窗口：它能否在巨头HBM新产能释放、通用DRAM供给回补之前，完成14nm制程与HBM3的量产卡位。历史上挤入DRAM前列的尔必达、奇梦达、瑞晶，无一善终；长鑫与它们的区别，在于它背后有一座城市的&quot;耐心&quot;，以及一轮AI算力带来的超预期需求。这两点能撑多久，决定它是窗口期赢家，还是周期过客。更重要的是，即便在窗口期内取得成功，长鑫仍需证明其盈利模式不依赖于DRAM周期波动——因为当周期退潮时，能否依然站着，才是真正的考验。</p>\n<p>一个更具体的算术把&quot;没那么快&quot;摆在了台面上。从HBM2量产到HBM3E，三星用了约4年；SK海力士约3年。长鑫从HBM2量产到HBM3，如果一切顺利，也需要3至5年—— [11] 而在这段烧钱爬坡期，它需要持续的高额营收来支撑。2025年617亿营收是涨价的红利，不是常态；若价格回落，营收将同步下滑。当营收下滑与研发烧钱同时发生时，长鑫能撑几个季度？这个问题，招股书没有回答。市场给出的答案，却是2万亿至3万亿的估值。</p>\n<h2 class=\"rh\">尾声：周期退潮，才是真的开始</h2>\n<p>朱一明，长鑫科技的董事长，清华物理系出身，在硅谷做过芯片，2005年创办兆易创新，2016年又押上全部身家做DRAM。他曾在量产爬坡期立下军令状：项目盈利之前，不领一分薪酬或奖金。十年后，长鑫从一个破产德国公司的专利文档里，长出了全球第四的DRAM厂。</p>\n<p>但全球第四，不等于第一梯队。这道坎，不是一个季度的330亿利润就能翻过去的 [3] ——因为那330亿，本质上是DRAM合约价暴涨57%带来的 [8] &quot;纸面富贵&quot;，而非公司自己赚出来的。当合约价回归常态时，它会先消失。</p>\n<p>&quot;周期退潮时能否站着&quot;，不是抽象的问题，而是具体的算术。2023年DRAM价格曾暴跌40%以上，那一年长鑫毛利率为-1.93%——它重新回到了亏损的老路。 [20] [9] 如果下一次价格回落40%，今天的330亿季度利润会跌到约198亿；减去每年246亿的折旧， [19] 净利润只剩下52亿左右。而366亿的累计亏损，一年只能填平1/7，而不是&quot;一个季度就填平&quot;。</p>\n<p>更难的在后面。即便价格不跌，当三星、SK海力士从HBM产能腾出手来重新涌入通用DRAM市场——这预计在2027-2028年——长鑫凭17nm（而对手已是12-13nm）、无EUV、HBM良率仅60%，还能守住7.67%的份额吗？ [10][11][7] 历史上，尔必达2011年曾是DRAM全球第二，却在2012年被美光收购清算；奇梦达2006年还是全球第三，2008年申请破产。它们的共同命运，不是技术不够好，而是没有熬过周期下行的那段最难受的日子。</p>\n<p>读没读这份招股书，是每个打新者自己的事。本文所引数据均来自长鑫科技招股书、问询回复、公司公告及公开报道，详见文末注释。投资有风险，本文不构成任何投资建议。</p>", "hits": [{"type": "direct", "src": "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_证券时报_2026-05-27_长鑫科技IPO过会.html", "core": "的终端客户已包括阿里云字节跳动", "art": "长鑫2025年的617.99亿元，来自哪里？ [3] 招股书披露，公司的终端客户已包括阿里云、字节跳动、腾讯、联想、小米、传音、荣耀、OPPO、vivo等。 [", "srcc": "", "sim": 1.0, "len": 34}, {"type": "direct", "src": "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_21世纪经济报道_2026-06-25_SemiAnalysis深度报告.html", "core": "半导体分析机构SemiAnal", "art": "独立半导体分析机构SemiAnalysis的测算指向同一结论：2026年一季度，长鑫 位元出货量 环比仅增长约11%，而 平均售价（ASP） 环比上涨了约57%", "srcc": "月25日1558芯智讯美国知名半导体分析机构SemiAnalysis近日发布万字深度报告称中国DRAM龙头大厂", "sim": 1.0, "len": 19}, {"type": "direct", "src": "2026-07-18_长鑫科技/原始资料/招股书年报/招股书_证券时报_2026-05-27_IPO过会详情.html", "core": "3132023年1932024", "art": "毛利率的曲线，把这种\"周期属性\"画得更清楚。2022年，长鑫综合毛利率为-3.13%；2023年-1.93%；2024年5.58%；2025年跃升至41.02%", "srcc": "00570亿元毛利率2022年3132023年1932024年5582025年4102剔除存货跌价准备转销因素", "sim": 1.0, "len": 24}, {"type": "direct", "src": "2026-07-18_长鑫科技/原始资料/招股书年报/招股书_证券时报_2026-05-27_IPO过会详情.html", "core": "亿元动态随机存取存储器前瞻技术", "art": "295亿元募资，将投向三大方向：DRAM存储器技术升级130亿元、存储器晶圆制造量产线升级改造75亿元、动态随机存取存储器前瞻技术研发90亿元。 [1] 这是一", "srcc": "RAM存储器技术升级项目130亿元动态随机存取存储器前瞻技术研究与开发项目90亿元项目总投资额345亿元业绩数", "sim": 1.0, "len": 16}, {"type": "direct", "src": "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_21世纪经济报道_2026-06-25_SemiAnalysis深度报告.html", "core": "2016年启动的506项目首期", "art": "这笔钱的背后，是\"耐心资本\"的十年下注。长鑫无控股股东、无实际控制人；第一大股东清辉集电（合肥国资）持股21.67%，长鑫集成11.71%、安徽省投7.91%，", "srcc": "大量招募人才国家风险投资的耐心2016年启动的506项目首期180亿元中合肥国资便承担了约80即144亿元截至", "sim": 1.0, "len": 25}, {"type": "partial", "src": "2026-07-18_长鑫科技/原始资料/招股书年报/招股书_证券时报_2026-05-27_IPO过会详情.html", "core": "长鑫科技集团股份有限公司", "art": "2026年6月12日晚，中国证监会一纸批复，同意长鑫科技集团股份有限公司首次公开发行股票并在科创板上市。从2025年12月30日获受理，到注册生效，长鑫走了16", "srcc": "数据摘要IPO基本信息公司名称长鑫科技集团股份有限公司股票代码688825SH发行价格866元股发行估值", "sim": 0.75, "len": 12}, {"type": "partial", "src": "2026-07-18_长鑫科技/原始资料/舆情网页/舆情_证券时报_2026-05-27_长鑫科技IPO过会.html", "core": "25年12月30日获受理", "art": "2026年6月12日晚，中国证监 : "2026-07-20_周生生", "title": "周生生：金价跌了 25%，它反而暖了", "company": "周生生", "date": "2026-07-20", "n_src": 12, "nosource": false, "rate": 3.4, "rate_direct": 1.5, "rate_partial": 0.0, "rate_paraphrase": 1.8, "src_files": ["2026-07-20_周生生/原始资料/招股书年报/年报_周生生_20250325_2024年报营业额211亿港元.html", "2026-07-20_周生生/原始资料/招股书年报/年报_周生生_历史传承与里程碑.html", "2026-07-20_周生生/原始资料/招股书年报/年报_周生生官网_公司介绍与1973年上市.html", "2026-07-20_周生生/原始资料/研报数据/研报_上证报_20250507_金价高企黄金珠宝企业业绩承压行业分析.html", "2026-07-20_周生生/原始资料/研报数据/研报_南方日报_20250515_金店困境与突围周大福周生生老凤祥对比.html", "2026-07-20_周生生/原始资料/研报数据/黄金产业链价值分配.md", "2026-07-20_周生生/原始资料/舆情网页/舆情_中国经济网_20250124_中国黄金协会2024黄金首饰消费532吨.html", "2026-07-20_周生生/原始资料/舆情网页/舆情_中新经纬_20250325_周生生市值47亿缩水溢利降20%.html", "2026-07-20_周生生/原始资料/舆情网页/舆情_搜狐_20260205_周生生同店销售下降门店收缩与金价调涨.html", "2026-07-20_周生生/原始资料/舆情网页/舆情_新浪财经_20241126_周大福中期业绩营业额降20%至394亿.html", "2026-07-20_周生生/原始资料/舆情网页/舆情_新浪财经_20250430_老凤祥2024营收567亿降20%金饰卖不动.html", "2026-07-20_周生生/原始资料/舆情网页/舆情_证券时报_20240613_周大福2024财年营业额1087亿港元.html"], "src_hits": {"2026-07-20_周生生/原始资料/招股书年报/年报_周生生_历史传承与里程碑.html": 3, "2026-07-20_周生生/原始资料/招股书年报/年报_周生生_20250325_2024年报营业额211亿港元.html": 2, "2026-07-20_周生生/原始资料/研报数据/黄金产业链价值分配.md": 5, "2026-07-20_周生生/原始资料/研报数据/研报_上证报_20250507_金价高企黄金珠宝企业业绩承压行业分析.html": 2}, "body_html": "<h1 class=\"rh\">周生生：金价跌了 25%，它反而暖了</h1>\n<p>2026 年上半年，国际金价从 5594 美元/盎司的历史顶峰暴跌超过 25%，品牌足金饰品每克便宜了近 500 元。按常理，卖金子的该慌了。但周生生的 Q2 数据给出了相反的答案：零售销售同比增长 16%，大陆同店增长 17%，港澳更暴涨了 30%——股价较最低点反弹 60%。一家卖了 90 年金子的老铺，为什么在金价暴跌的时候反而更值钱了？答案藏在 2024 年的至暗时刻、2025 年的绝地反转、以及一条用 90 年铺就的&quot;脱钩之路&quot;里。</p>\n<p>2024 年，国际金价涨了超过 20%，创下历史高位；国内零售金价从每克 620 元爬到 750 元。那一年，周生生营收掉了 15%，利润掉了 20%，关了 74 家店。 [1] 市场给它贴上了标签：金价越涨，它越冷。</p>\n<p>但 2026 年上半年的数据讲了一个完全相反的故事。金价从 1 月 5594 美元/盎司的历史顶峰暴跌 25% 至 7 月的 4100 美元，品牌金饰每克便宜了近 500 元。 [31] 按两年前的逻辑，周生生该被带崩了。事实却是：Q2 零售销售值 +16%，大陆同店 +17%，港澳 +30%，股价从 2025 年低位回升了近 60%。 [37] [38]</p>\n<p>从&quot;金价越涨它越冷&quot;到&quot;金价暴跌它反暖&quot;，这三年里究竟发生了什么？答案藏在一条路径里：一家卖了 90 年金子的老铺，正学着不再靠金子赚钱。</p>\n<h2 class=\"rh\">市场格局 黄金珠宝行业 2026：一半火焰，一半海水</h2>\n<p>在展开周生生的故事之前，必须先看清它所处的战场。2026 年上半年的黄金市场，用&quot;过山车&quot;来形容毫不夸张。国际金价在 1 月底冲到 5594 美元/盎司的历史顶峰，随后掉头向下，到 7 月中旬已跌至 4100 美元附近，半年跌幅超过 25%。 [31] 国内品牌足金饰品价格从 1 月底的 1700 元/克一路滑到 7 月的 1230 元/克，每克便宜了近 500 元。 [32]</p>\n<p>金价的剧烈震荡，把行业撕成了两半。2026 年一季度，全国黄金消费量同比增 4.41% 至 303.3 吨——总量还在涨，但结构已经面目全非：黄金首饰消费 84.62 吨，同比暴跌 37.1%；金条及金币 202.06 吨，同比飙升 46.4%。 [33] 投资金消费量已是首饰金的 2.4 倍。金条和金币取代了项链和手镯，成为黄金消费的主角。</p>\n<p>品牌端的处境同样分化。天猫 618 第一波黄金类目成交榜单显示：周大福、老铺黄金、周生生分列前三。 [34] 从门店看，周大福以超 6000 家店铺居榜首，老铺黄金则以 46 家店逼近千亿市值，&quot;少而精&quot;模式正在挑战&quot;大而全&quot;的商业逻辑。周生生作为港资老牌，以全直营、中高端定位卡在第三位，品牌指数 91.1，稳居行业前三。 [35]</p>\n<p>从商业模式来看，行业裂变成了两条路：一条是以周大福、中国黄金为代表的&quot;规模主导型&quot;——靠加盟快速铺量，薄利多销，毛利率低至 4.5%-30.5%；另一条是以老铺黄金为代表的&quot;精品溢价型&quot;——全部一口价，毛利率超 40%，单店效过 2 亿元。 [36] 周生生恰恰走在这两条路的中间——全直营、兼做计重和一口价、毛利率 32.6%。不上不下的定位，既是护城河，也是天花板。</p>\n<p>与此同时，央行也在加仓。截至 2026 年 6 月末，中国人民银行黄金储备 7544 万盎司，环比增 48 万盎司——这已是央行连续第 20 个月增持黄金。 [31] 全球超 45% 的央行预计未来 12 个月继续增持。</p>\n<h2 class=\"rh\">第一章 广州的金铺，香港的牌子</h2>\n<p>1934 年，广州十八甫路，周芳谱开了一家金行，取名&quot;周生生&quot;。 [2] 四个字来自一句古语——&quot;周而复始，生生不息&quot;，既点出姓氏，也表达了对基业长青的祝福。彼时广州的金铺沿街林立，没人能想到，这个名号会在近一个世纪后，成为中国黄金珠宝行业里资历最老的一块牌子之一。</p>\n<p><mark class=\"direct\" data-hit=\"0\">1938 年广州沦陷，周芳谱举家迁往澳门。</mark>1941 年，他把店铺分给儿子们各自经营。偏房所出的周君令、周君廉、周君任三兄弟分得了澳门店——正是这三兄弟，真正把周生生做成了品牌。 [25] <mark class=\"direct\" data-hit=\"1\">1948 年，三兄弟在香港旺角上海街开</mark>了第一家分店，从此扎根香港。1957 年公司化，1973 年在港交所上市，成为首家登陆资本市场的黄金珠宝商。 [2]</p>\n<p>周君令三兄弟管治的年代，是周生生高速扩张的时期。1973 年上市后恰逢香港股灾，恒指从 1775 点暴跌至 150 点，周生生市值仅剩约 1000 万港元。 [25] 但三兄弟硬是扛了过来。1983 年，周生生首创足金宝猪摆件，开了卡通生肖金饰的先河；1990 年，它的贵金属化验所成为香港首家获政府认可的商营化验机构；<mark class=\"paraphrase\" data-hit=\"6\">1995 年，它率先登上互联网，成为香港第一家做电商的珠宝公司。 [</mark>2]</p>\n<p>第三代掌舵人周永成（周君廉之子）1966 年留学美国，学的是理工，曾在 IT 业工作两年，也在纽约做过房地产。1984 年，他放弃美国事业返港，在周生生引入电脑化管理——这在当时港岛同行里也是先行一步。 [25] 1999 年，周生生通过 ISO9002 国际品质认证，又是珠宝业首家。</p>\n<p>到了第四代，周嘉颖（周永成之女）2010 年加入集团，康奈尔大学双学士，GIA 应用珠宝家。2021 年出任执行董事，现任首席品牌长，负责品牌策划、全渠道发展、电子商务，主持子品牌 EMPHASIS、PROMESSA 的运营。 [22] 从周芳谱到周嘉颖，四代传承，周生生走过近一个世纪。而眼下，它正站在黄金史上最疯狂的一轮牛市面前。</p>\n<p>周生生有一条独特的原则：所有门店一律直营，不加盟。 [25] 与周大福靠加盟快速下沉不同，周生生一直以直营、中高端的形象示人。全直营意味着更慢的开店速度、更高的管理成本，但也意味着更统一的品控和更强的品牌溢价能力。到 2024 年底，周生生在全球有 958 家门店，约 9000 名员工，年营业额 211.76 亿港元。 [1] 一块 90 年的牌子，站在了黄金史上最疯狂的一轮牛市面前。</p>\n<h2 class=\"rh\">第二章 金价牛，它却在 2024 年过了个冬</h2>\n<p>2024 全年，<mark class=\"direct\" data-hit=\"2\">周生生营业额 211.76 亿港元，同比下降 15%；归母净利润 8.06 亿港元，</mark>同比下降 20%；<mark class=\"paraphrase\" data-hit=\"7\">若只看持续经营业务，净利润更跌了 27% 至 7.72 亿港元。 [</mark>1] 三组数字摆在一起，是一份&quot;营收、利润、主业利润&quot;三线齐降的年报。</p>\n<p>有意思的是毛利率——它不降反升，提高了 1.9 个百分点到 28.3%。 [1] 原因不复杂：金价上涨推高了存货价值，公司又优化了产品组合，多卖定价黄金、少卖计重黄金。换句话说，单件生意更&quot;值钱&quot;了，但卖出去的件数少了，总盘子还是塌了。这恰好是 2024 年高金价下黄金零售的典型困境：价是涨了，量是崩的。不过困境里也埋着转机——&quot;少计重、多定价&quot;这一退一步，后来成了周生生跳出&quot;金价魔咒&quot;的伏笔：等到 2025 年同店重新转正、毛利率爬到 32.6%，这条&quot;价涨量崩&quot;的曲线才第一次被掰弯。</p>\n<p>把时间拉长看，周生生的业绩像坐过山车。2021 年营收 219.88 亿、净利 6.43 亿；2022 年随消费疲软降至 205.57 亿、净利 4.52 亿；2023 年随金价与消费回暖冲到 250.13 亿、净利 10.13 亿；2024 年高金价反噬，跌回 211.76 亿、净利 8.06 亿；2025 年则借助金价再创新高与产品组合优化，净利猛增至 17.17 亿。 [4] 表面看仍是&quot;一年暴涨、一年回落&quot;，但 2025 年的跳升质地不同：它不是靠多卖金子，而是靠多卖&quot;更值钱的金子&quot;——定价黄金与品牌溢价撑起了利润。等到 2026 年金价暴跌 25%、同店却仍涨 17%，这条过山车才真正显出&quot;脱钩&quot;的弧度。</p>\n<p>2025 年 3 月，周生生股价报 6.93 港元，市值约 47 亿港元——较 2023 年初的 80 亿港元，缩水超过四成。 [5] 资本市场用脚投票，给这家 90 年老牌金铺贴上了&quot;周期股&quot;的标签。</p>\n<h2 class=\"rh\">第三章 关掉的 74 家店，和行业集体瘦身</h2>\n<p>2024 年，周生生在中国大陆新开 43 家店，关掉 112 家，净减少 74 家；到年底，全球门店 958 家。 [1] 关店集中在低线城市的独立门店——公司说，这是在把网络&quot;整合&quot;到高端商场和核心地段。但 2025 年关店还在加速——上半年又净减 62 家，到年中仅剩 709 家。 [9] 全年来看，2025 年内地新开 31 家、关闭 146 家，净减少 115 家。 [15]</p>\n<p>横向一比，这门生意的体量就显出来了。行业老大周大福，2024 财年末零售点 7640 家，是周生生的近 8 倍；哪怕只看内地，周大福也有 7400 多家。 [6] 周生生更像&quot;小而精&quot;的那一个——店更少、更集中、更依赖直营与中高端定位。</p>\n<p>但关店不是周生生一家的事。2024 到 2025，高金价下整个行业都在&quot;缩网络&quot;：老凤祥加盟店净减 166 家，六福半年净减 175 家，周大福内地零售点较巅峰期净减少近 1500 家，豫园珠宝（老庙/亚一）较上年同期减少 879 家。 [8] [20] 区别在于，周生生本就店少，关 74 家，占比比谁都显眼。</p>\n<p>行业为何集体关店？答案写在渠道红利的消退里。过去十年，黄金珠宝品牌靠&quot;省代&quot;模式加速下沉——周大福 2018 年启动&quot;新城镇计划&quot;开放加盟，三年内地净增超 2000 家店，提前达成 7000 店目标。 [26] 但 2024 年起，消费者对高金价产生抵触，到店客流骤降，低效门店成了负担。行业从&quot;跑马圈地&quot;转向&quot;存量优化&quot;，单店效取代开店数，成为品牌最关心的指标。周生生走的直营路线，虽然慢，但在这一轮关店潮中，反而不用为加盟商的亏损买单。</p>\n<h2 class=\"rh\">第四章 金价越高，消费者越冷</h2>\n<p>黄金对一家金店，是资产，也是绞索。2024 年金价创历史高位，按说卖金子的该笑；<mark class=\"paraphrase\" data-hit=\"8\">可中国黄金协会的数据泼了冷水——全国黄金首饰消费量 532.02 吨，同比下降近 25%。 [</mark>11] 价格越高，越没人买；越没人买，金店越要靠&quot;卖得更贵&quot;维持收入，可贵了更没人买。这是个悖论式的死循环。</p>\n<p>周生生的同店数据把这道循环画得很清楚：2024 年，内地黄金珠宝同店销售跌 13%、港澳跌 19%；更惨的是镶嵌——内地跌 38%、港澳跌 24%，钻石在年轻人那里彻底失了宠。 [12] 公司能做的，是在金价上涨趋势里&quot;优化组合&quot;：多推定价黄金、工艺金，少压库存裸金，把毛利率从 28.3% 往上顶。可量价终究是两张皮——价上去了，量掉得更狠。</p>\n<p>2025 年，情况进一步恶化——首饰金消费量 363.836 吨，同比下降 31.61%；而投资金（金条及金币）消费量 504.238 吨，同比增长 35.14%，历史上首次超过首饰金。 [17] 中国黄金协会的数据揭示了一个结构性转变：消费者买黄金不再是为了&quot;戴&quot;，而是为了&quot;存&quot;。2026 年一季度，投资金消费量继续同比增长 46% 至 202 吨。 [18] 金店卖首饰的生意，正在被金条和金币分流。</p>\n<p>一个被反复提及的悖论是：金店赚的，本质是品牌溢价与零售加价，不是金子本身的钱，也几乎不靠加工。金价越透明，按克计价的首饰越难虚高定价；一旦消费者转向水贝这类按克计价的渠道，品牌金的溢价空间就被进一步压缩。周生生想靠&quot;定价黄金&quot;&quot;工艺金&quot;把溢价做回来，可这恰恰要求它离&quot;卖金子&quot;越来越远，离&quot;卖设计、卖品牌&quot;越来越近。 [14]</p>\n<h2 class=\"rh\">第五章 一克黄金，从矿山到你手上</h2>\n<p>先厘清一个常被混淆的点：周生生是一家 品牌零售商 ，不是制造商。它不挖金，也不靠开工厂赚钱——无论首饰是自产还是外包，制造业在整个链条里都只分走极薄的利润。它赚的，是&quot;零售加价&quot;：在金价之上叠一层设计与品牌的溢价。这一章的目的，正是把周生生在产业链里的位置钉死在&quot;下游零售&quot;那一端，看清它的钱到底从哪来——而这直接决定了它对抗金价的唯一筹码是什么。 [26]</p>\n<p>一克黄金从矿山到你手上，要经过五个环节：金矿开采→冶炼精炼→首饰加工→品牌零售→消费者。周生生站在最后一个环节，每个环节的利润分配，天差地别。</p>\n<p>上游是寡头市场。<mark class=\"direct\" data-hit=\"3\">中国年产矿产金约 377 吨（2024 年），紫金矿业、山东黄金、中金黄金、招金矿业、赤峰黄金</mark><mark class=\"paraphrase\" data-hit=\"9\">前五强占了国内产量的 68%。 [</mark>26] 挖金子的利润率极高——上游开采企业的毛利率普遍在 45% 以上。2025 年，紫金矿业净利润同比大幅增长，赤峰黄金也交出亮眼成绩单，上游矿企&quot;量价齐升&quot;。 [20] 原因很简单：金价涨了，矿山的成本却相对固定，涨价部分几乎全部转化为利润。</p>\n<p>中游加工环节，正是黄金珠宝产业链里最不赚钱的一段——无论周生生把制造留在本厂还是外包给水贝，这一步都只分走约 7% 的利润。深圳罗湖水贝聚集了数千家珠宝加工厂，是典型的劳动密集型产业，代加工费大概 2 到 30 元/克，工艺复杂程度决定价格；但据梦金园招股书测算，单件黄金首饰的<mark class=\"direct\" data-hit=\"4\">加工利润仅约 11 元，占加工成本总额</mark>的 7%。 [26] <mark class=\"direct\" data-hit=\"5\">中游加价率极低，是产业链&quot;微笑曲线&quot;的底部——</mark>这也正是周生生刻意不做制造商的原因：制造端的利润薄得像纸，真正值钱的是它站在下游攥着的&quot;品牌 + 零售&quot;那一端。钱不在&quot;做&quot;，在&quot;卖&quot;。</p>\n<p>中信证券的研究为这条价值链提供了精确数字：消费者支付的每一块钱，三分之一给了矿企，三分之一给了品牌商，不到 3% 给了加工厂。 [19]</p>\n<p>但在零售环节内部，利润分配又因模式不同而天差地别。加盟模式占据行业主流——中国黄金 97% 门店是加盟店，周六福 98%，梦金园 98%，周大福约 76%。 [<mark class=\"paraphrase\" data-hit=\"10\">27] 加盟商的收入大头是&quot;贴牌费&quot;和管理服务费，这两项的毛利率接近 100%。 [</mark>27] 而直营模式则完全相反——周生生和老铺黄金是全直营的代表，掌控全链路利润，毛利率更高但扩张更慢。老铺黄金 46 家店，平均店效超 2 亿元，毛利率长期维持 41% 以上。 [28]</p>\n<p>2025 年的行业业绩，展示了这种模式差异的极端结果：全直营+高溢价的老铺黄金净利增 230%，周生生增 113%；加盟为主的梦金园跌 49%，中国黄金跌 55%-65%。 [20] 进入 2026 年，品牌分化进一步加剧——金价从 1 月高点暴跌 25% 后，消费者&quot;买涨不买跌&quot;心理蔓延，线下金店客流锐减，618 期间各大品牌纷纷打折促销。 [34]</p>\n<h2 class=\"rh\">第六章 周氏江湖，老二的位子</h2>\n<p>说到周生生，绕不开周大福。两家都姓周、都从粤港起家，却被规模拉开了巨大的距离。周大福 2024 财年（截至 2024 年 3 月）营收 1087 亿港元、净利 65 亿，零售点 7640 家；周生生 2024 日历年营收 212 亿、净利 8 亿、门店 958 家——营收约五分之一，门店约八分之一。 [1] [6] （注：两者财年口径不同，周大福为 3 月底截止，此处仅作量级对照。）</p>\n<p>但&quot;老二&quot;有自己的护城河：毛利。2024 年周生生毛利率 28.3%，高于周大福的 20.5%。 [1] [6] 差异来自模式——周大福靠加盟下沉、走量，黄金占比高、毛利被摊薄；周生生直营为主、定位中高端，单店产出与溢价能力更强。两家的共同点，是都逃不开金价的周期。周大福 2025 财年上半年营收掉 20%、净利掉 44%，同样被高金价卡住。 [7]</p>\n<p>但周氏江湖里，新玩家正在崛起。老铺黄金以 46 家直营店、平均店效超 2 亿元的业绩，证明了一条截然不同的路径：不做规模，做极致溢价。它的所有产品都采用&quot;一口价&quot;定价，彻底剥离了黄金的商品属性——手镯标价 18888 元而不是按克计算。这种策略有两个好处：金价波动对商品价格几乎毫无影响；品牌毛利率长期维持在 41% 高位。 [28] 老铺黄金 2025 年营收 273 亿元，同比增长 221%，即便门店数只有周生生的不到 6%，营收却已超过周生生。 [20]</p>\n<p>老铺黄金的崛起，对周生生意味着一道选择题：是继续在&quot;中高端大众&quot;的赛道里和规模更大的周大福竞争，还是往高端走、和老铺黄金抢同一批客群？周生生目前的策略，是两条腿走路——主品牌覆盖婚嫁、送礼、投资等传统需求，EMPHASIS 子品牌走时尚消费赛道，Charme 系列做入门级日常佩戴。但&quot;中高端&quot;这个定位，面临两面夹击的尴尬。</p>\n<h2 class=\"rh\">第七章 90 年，怎么让 25 岁的人进门</h2>\n<p>周生生的收入，六成以上压在内地：2024 年内地占营收 63.83%，港澳与台湾补足其余。 [1] 可内地恰恰是消费最疲软、年轻客群最易流失的市场。中国黄金协会的数据显示，2025 年黄金首饰消费量跌至 363.8 吨，较 2021 年的 700+ 吨几乎腰斩。 [17] 一块 90 年的牌子，怎么让 25 岁的人愿意进店？这是周生生绕不开的生存题。</p>\n<p>它的答案是两条线：产品年轻化，和渠道线上化。</p>\n<p>在产品端，周生生很早就在做年轻化。1995 年，它推出了哆啦A梦和美少女战士金饰；1997 年，它和 Hello Kitty 合作推出联名珠宝——比大多数年轻人知道的 IP 联名潮早了 20 多年。 [24] 后来，这个名单延伸到了三丽鸥、哈利波特、泡泡玛特、海贼王等，每一个都是年轻人追捧的 IP。它也是首家入驻香港迪士尼乐园的珠宝店。 [25]</p>\n<p>Charme 串珠系列是周生生年轻化战略的旗舰产品。每一颗珠子都有寓意，消费者可以自由 DIY 组合，像收集故事一样收集它们。弗若斯特沙利文的数据显示，模块化、可自主改造的黄金产品复购率是传统成套金饰的 3 倍。 [24] 2025 年，Charme 系列与 Hello Kitty 50 周年、哈利波特等 IP 联名，在社交媒体上引发了大量年轻人的自发分享。</p>\n<p>在渠道端，2025 年上半年周生生内地的线上销售同比增长 29%，直播时长近 14900 小时。 [9] 但它的直播策略和别的品牌不同——首席品牌长周嘉颖说，直播的重点不是&quot;砍价促销&quot;，而是&quot;把珠宝的工艺、材质、比例和佩戴效果讲清楚&quot;，让消费者感受到&quot;每件作品背后的美学与价值&quot;。 [22] 这种&quot;电子闺蜜&quot;式的直播，在年轻人当中获得了不错的口碑，有人形容&quot;六小时的直播就像上了一节免费的穿搭课&quot;。 [24]</p>\n<p>周生生甚至在跨界合作上尝试了更多场景。它在成都与潮流品牌 Randomevent 打造&quot;幸运唱片行&quot;快闪，在香港 ComplexCon 呈现&quot;心碎糖水铺&quot;，在广州庙前冰室酒吧推出跨界活动——让珠宝不再只是柜台里的等待，而成为年轻人生活现场的一部分。 [<mark class=\"paraphrase\" data-hit=\"11\">22] 2025 年，全渠道模式贡献了周生生内地市场 33% 的销售额，持续上升。 [</mark>9]</p>\n<h2 class=\"rh\">第八章 2025 大反转，金价红利能持续多久</h2>\n<p>2025 年，周生生的账本突然翻红：全年营收 224.46 亿港元，同比增长 6%；毛利率 32.6%，增加 4.3 个百分点；拥有人应占溢利 16.59 亿港元，创下历史新高，同比增长 115%。 [15] 每股股息从 51 港仙翻倍到 100 港仙，零售分部业绩更录得 141% 的大幅增长。</p>\n<p>反转来得很猛，原因也清楚。金价在 2025 年全年涨幅达 60%，创下历史最大年度涨幅。 [20] 周生生在财报中明确表示：&quot;金价上涨令过往以较低成本购入的存货在出售时录得较高利润。&quot; [15] 加上持续优化零售网络使成本下降，销售及分销费用以及行政费用合计下降 6%，毛利率改善与成本下降双管齐下，直接推高了利润。</p>\n<p>2025 年下半年，中国大陆和香港的同店销售均录得正增长——内地 +6%，港澳 +7%。 [15] 定价黄金在内地和港澳的总销售额中分别占比约 26% 和 14%，成了毛利率提升的重要支撑。</p>\n<p>可这恰恰暴露了另一层脆弱：利润的弹跳，几乎全系在金价这根弦上。2025 年金价涨了 60%，周生生净利翻了 1 倍多；但 2024 年金价涨了 20%，周生生净利却跌了 20%。原因是金价在 2024 年涨得太快，消费者来不及适应，量先崩了；到了 2025 年，消费者逐渐接受了&quot;金价不会跌&quot;的预期，开始恢复购买——但价格敏感度也提高了，更多人转向了投资金条而非首饰金。</p>\n<p>还有一个风险在积累：周生生的存货从 2024 年底的 127.85 亿港元飙升至 2025 年底的 175.04 亿港元，增幅 37%；资本负债率从 29.7% 升至 44.5%。 [4] 金价涨，库存是红利；金价一旦回落，高库存立刻变成减值风险。</p>\n<p>现实比预想来得更快。2026 年 1 月，国际金价冲至 5594 美元/盎司的历史顶峰，周生生足金饰品报价一度达到 1708 元/克。 [32] 随后，金价掉头向下，到 7 月中旬已跌至 4100 美元区间，半年跌幅超 25%，品牌金饰价也跌至 1230 元/克。 [31] [32] &quot;买涨不买跌&quot;的心理迅速蔓延，春节后线下金店客流锐减，618 大促期间各大品牌纷纷打折，但热潮难复。 [34]</p>\n<p>但周生生的 Q2 业绩却给出了一个出乎意料的数据。2026 年 7 月 17 日，周生生公告二季度运营数据：零售销售值同比增长 16%，内地同店 +17%，港澳同店 +30%。 [37] 即便金价暴跌，定价产品系列（YUYU、Noir、Charme）依然录得正面增长，受惠于新品推出及顾客互动提升。截至 2026 年 6 月末，周生生珠宝零售分店合计 776 家（内地 677 家 + 港澳 61 家），较 2024 年底的 958 家净减少 182 家。 [37]</p>\n<p>股价方面，截至 2026 年 7 月 20 日，周生生报收 11.03 港元，市值约 74 亿港元，市盈率仅 4.31 倍。 [38] 较 2025 年 3 月的 47 亿港元低位已反弹近 60%，但距离 2023 年初的 80 亿港元仍有距离。市场对这只&quot;周期股&quot;的估值，始终围绕着金价走向摆动。</p>\n<h2 class=\"rh\">第九章 与金价&quot;解绑&quot;的长跑</h2>\n<p>周生生自己也知道，靠金价吃饭不是长久之计。2025 年半年报中，它明确将&quot;宝石镶嵌黄金&quot;饰品定为增长重点，主打纯金镶嵌钻石及宝石产品，融合先进制造技术。 [14] 这本质上是在和金价做&quot;解绑&quot;——靠设计、工艺、IP 与体验构建壁垒，摆脱同质化的按克计价内卷。</p>\n<p>执行首席品牌长周嘉颖将策略概括为&quot;克重做减法、工艺做加法&quot;。 [23] 以 Charme 串珠为例，金价高企让入门级产品从千元级升至两千元级，但周生生在设计端推出了更轻巧的版本，同时坚持不能做得过薄以免影响品质。酷黑系列除了黑金工艺，还额外投入手工勾勒线条的工序，而不像其他品牌那样仅以简单喷砂处理。周嘉颖说：&quot;如果只是卖黄金，我们不需要做这些。&quot; [23]</p>\n<p>但转型的难度不容低估。黄金饰品从&quot;成本计价模式&quot;转型到&quot;价值计价模式&quot;，需要品牌通过独特的设计来承载文化与理念，构建差异化的竞争优势。同时，消费场景不能停留在婚庆、送礼等传统低频场景，要拓展到日常佩戴。这需要品牌完成从&quot;成本价值驱动&quot;到&quot;品牌价值驱动&quot;的跨越。 [21]</p>\n<p>行业同质化是另一个难题。周嘉颖在采访中坦言：&quot;现在我去逛铺的时候，常常觉得各家产品都很相似，这让我觉得有些可惜。因为在我看来，每一件珠宝都理应是独一无二的。&quot; [23] 老铺黄金的爆款&quot;八宝罗盘&quot;，周生生、周大福、潮宏基都有类似款，设计风格相似。 [21] 当中游加工厂能轻易复制工艺时，品牌溢价来自哪里？</p>\n<p>答案或许藏在周生生那句&quot;周而复始，生生不息&quot;里。品牌的本质不是短期利润，而是穿越周期的能力。周嘉颖说，她最大的变化是看事情&quot;会更长远，不会只为达成短期效果而轻易行动&quot;。 [23] 在黄金珠宝这个容错率极低的行业，这份审慎或许比任何营销创新都更珍贵。毕竟，黄金可以熔了重铸，但信任不能。</p>\n<h2 class=\"rh\">数据深挖 金价、同店与股价的季度密码</h2>\n<p>把周生生的季度同店数据摊开，一个被年度报表掩盖的规律浮现了出来： 金价对消费的冲击不是永久的，而是一个有明确时滞的&quot;适应曲线&quot; 。</p>\n<p>2025 年一季度，国内金价（AU9999 加权均价）同比暴涨 38% 至 671 元/克，消费者的本能反应是收缩——周生生大陆同店销售同比跌了 11%，港澳跌了 13%。 [39] 但到了二季度，金价继续上行但涨速趋缓，同店马上转正（大陆 +6%、港澳 +1%）。三季度金价虽更高但消费者已经&quot;习惯了高价&quot;，大陆同店跳到了 +15%，四季度甚至冲到 +24%。 [39]</p>\n<p>这个适应期大约是 一个季度 。金价每一次跳涨，消费者需要大约 3 个月来消化、接受、然后恢复购买。 [39]</p>\n<p>这张表揭示了三层逻辑。第一， 金价&quot;涨速&quot;才是真正的杀手，而不是&quot;价位&quot; 。25Q1 金价同比涨 38% 时，同店崩盘；到 25Q4 金价绝对水平更高，但涨速放缓，同店反而创下 +24% 的新高。消费者怕的不是金子贵，而是金子&quot;突然变贵了&quot;。 [39]</p>\n<p>第二， 港澳市场在 2026 年突然起飞 。26Q1 港澳同店暴增 46%、26Q2 继续 +30%，远超大陆同期的 +7% 和 +17%。这背后有两个推力：一是中国内地的黄金首饰增值税改革（2025 年 11 月起加征 7%），部分消费者转向港澳购买；二是港澳旅游业的持续复苏。 [39] [40] 周生生收入的 33% 来自港澳——这个结构，在当前的环境下反而成了避风港。</p>\n<p>第三， 定价黄金是穿越周期的秘密武器 。2025 上半年，大陆定价黄金饰品同店同比 +15%，港澳 +17%——即便在整体同店最惨的 25Q1，定价产品依然在增长。 [39] 定价产品的消费逻辑和计重产品完全不同：消费者买的是设计和工艺，不是克价。这正是周生生毛利率从 26.4% 一路爬到 32.6% 的底层支撑。</p>\n<h2 class=\"rh\">尾声 金价跌了 25%，它反而暖了</h2>\n<p>2026 年 7 月，伦敦金价在 4100 美元附近徘徊。半年前它还是 5594 美元的历史顶峰。周生生足金饰品从 1708 元/克跌到了 1230 元/克。 [32] 但它的 Q2 运营数据给出了一个出乎所有人预料的答案：零售销售 +16%，大陆同店 +17%，港澳 +30%。 [37]</p>\n<p>三年前，同样的金价波动能让它营收暴跌 15%。三年后，金价比当时贵了将近一倍，净利却翻了 2 倍多，毛利率从 28.3% 爬到了 32.6%。 [1] [4] 变化的核心线索，藏在每一张季度报表里：定价黄金贡献越来越大，直营门店越来越精，港澳业务的税改红利刚刚释放，而品牌和设计的溢价——Charme 的串珠故事、YUYU 的东方美学、Noir 的手工纹理——正在一次次 IP 联名和直播穿搭中被年轻人重新估值。</p>\n<p>当然，&quot;脱钩&quot;还远未完成。周生生收入的八成以上仍然来自黄金首饰，金价依然是它利润表上最粗的那根弦。存货 175 亿港元，资本负债率 44.5%，金价每跌 10%，账面利润就要被啃掉一大块。 [4] 但 2026 年上半年的这份答卷，至少说明了一件事：90 年了，它终于开始学会——卖品牌，而不只是卖金子。</p>\n<p>这块 90 年的牌子还在。它见过抗战时的金价、1980 年的黄金狂热、2011 年的高位、2024 年&quot;价涨量崩&quot;的悖论、2025 年的历史新高，如今又迎来金价半年暴跌 25% 的至暗时刻。但这一次，它第一次不用靠金价吃饭。而这，或许才是&quot;周而复始，生生不息&quot;八个字，经历了近一个世纪后，终于摸到的本意。</p>", "hits": [{"type": "direct", "src": "2026-07-20_周生生/原始资料/招股书年报/年报_周生生_历史传承与里程碑.html", "core": "1938年广州沦陷周芳谱举家迁", "art": "1938 年广州沦陷，周芳谱举家迁往澳门。1941 年，他把店铺分给儿子们各自经营。偏房所出的周君令、周君廉、周君任三兄弟分得了澳门店——正是这三兄弟，真正把周", "srcc": "福顾客更认为是好意头1938年1938年广州沦陷周芳谱举家迁往澳门并在该地经营生意1941年1941年周芳谱将", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-20_周生生/原始资料/招股书年报/年报_周生生_历史传承与里程碑.html", "core": "1948年三兄弟在香港旺角上海", "art": "1938 年广州沦陷，周芳谱举家迁往澳门。1941 年，他把店铺分给儿子们各自经营。偏房所出的周君令、周君廉、周君任三兄弟分得了澳门店——正是这三兄弟，真正把周", "srcc": "君任三兄弟领得澳门店1948年1948年三兄弟在香港旺角上海街开设分店1957年1957年三兄弟于香港成立周生", "sim": 1.0, "len": 17}, {"type": "direct", "src": "2026-07-20_周生生/原始资料/招股书年报/年报_周生生_20250325_2024年报营业额211亿港元.html", "core": "周生生营业额21176亿港元同", "art": "2024 全年，周生生营业额 211.76 亿港元，同比下降 15%；归母净利润 8.06 亿港元，同比下降 20%；若只看持续经营业务，净利润更跌了 27% ", "srcc": "", "sim": 1.0, "len": 31}, {"type": "direct", "src": "2026-07-20_周生生/原始资料/研报数据/黄金产业链价值分配.md", "core": "中国年产矿产金约377吨202", "art": "上游是寡头市场。中国年产矿产金约 377 吨（2024 年），紫金矿业、山东黄金、中金黄金、招金矿业、赤峰黄金前五强占了国内产量的 68%。 [26] 挖金子的", "srcc": "牌零售消费者上游金矿开采与冶炼中国年产矿产金约377吨2024年前五大矿企紫金矿业山东黄金中金黄金招金矿业赤峰", "sim": 1.0, "len": 37}, {"type": "direct", "src": "2026-07-20_周生生/原始资料/研报数据/黄金产业链价值分配.md", "core": "加工利润仅约11元占加工成本总", "art": "中游加工环节，正是黄金珠宝产业链里最不赚钱的一段——无论周生生把制造留在本厂还是外包给水贝，这一步都只分走约 7% 的利润。深圳罗湖水贝聚集了数千家珠宝加工厂，", "srcc": "元克工艺复杂程度影响加工费单件加工利润仅约11元占加工成本总额约7中游加价率极低是产业链微笑曲线的底部品牌商自", "sim": 1.0, " ，最想要的交易闭环始终没跑通——用户在这里种草，转身去别处拔草。当估值的想象力跑在上市时间表前面，为这座帝国定价的，究竟是它的信任，还是那道迟迟没能弥合的裂缝？</p>\n<p>故事得从一句口号说起。2013 年，两个刚从海外回来的年轻人在上海做了一个购物攻略社区，教人怎么在境外买到真货、买得不亏。他们给产品起了句 slogan——&quot;标记我的生活&quot;。十三年后，这个叫小红书的社区，月活跃用户 （MAU） 突破 4 亿，日搜索量达到 8 亿次，一批消费类上市公司在财报里把它列为最重要的营销阵地。 [1]</p>\n<p>但另一个数字，被压在这份光鲜之下：在小红书站内，用户从&quot;看到&quot;到&quot;下单&quot;的转化率，<mark class=\"paraphrase\" data-hit=\"17\">只有 0.7% 到 1.2%——而传统电商平台的平均水平是 3% 到 5%。 [</mark>3] 换句话说，这座每天被 8 亿次搜索、被无数消费决策路过的帝国，把绝大多数真正掏钱的动作，让给了淘宝、抖音、拼多多和京东。</p>\n<p>2026 年 6 月，小红书走到了港交所门口。据外媒报道，公司已聘请高盛、中金等投行，准备<mark class=\"partial\" data-hit=\"6\">以保密形式递交上市申请，估值</mark><mark class=\"paraphrase\" data-hit=\"18\">被二级市场推到约 500 亿美元。 [</mark>8] 这是它十三年里第三次走到上市的门口——前两次，都折返了。</p>\n<p>从&quot;找到国外的好东西&quot;到&quot;你的生活指南&quot;——这个标签的变化，折射出小红书如何从一个海淘攻略社区，一步步长成今天的国民级消费决策入口。而就在它第三次叩响港交所大门之际，一封前员工的实名举报信突然摆上了台面。原华南直销负责人陈浩向港交所及中国证监会递交投诉，指小红书在 VIE 架构的信息披露上存在前后矛盾——为规避期权赔偿，在劳动仲裁中主张境内外主体&quot;无控制无关联&quot;；为符合上市要求，在招股书里又需要强调控股权。 [5][6][7] 一桩 85 万元的劳动纠纷，卡住了一家 500 亿美元估值的 IPO。</p>\n<p>于是几个问题摆在了台面上：一个每天被 8 亿次搜索路过的&quot;种草帝国&quot;，为什么就是留不住交易？当资本用 500 亿美元给它定价，买的究竟是当下这台运转顺畅的广告机器，还是&quot;下一个万亿级消费决策入口&quot;的想象？而随着上市临近，越来越多的裂缝被摆上桌面——信任的消耗、举报信的指控。透过每一道裂缝，人们窥探着这座帝国的内在构造。裂缝越来越多，帝国还安全吗？</p>\n<h2 class=\"rh\">第一章 四亿人的&quot;决策入口&quot;</h2>\n<p>小红书是用十三年建立起来的，这个以真实分享为地基的种草帝国。</p>\n<p>按平台官网与第三方口径，截至 2026 年中，小红书月活跃用户约 4 亿，日活跃用户 （DAU） 超过 1.7 亿，用户日均使用时长约 74 分钟。 [1] [9] 更关键的是这群人的画像：女性占比接近 72%，95 后与 00 后合计约 85%，且高度集中在一二线高消费城市。 [10] 年轻、女性、高线、有钱、有明确消费意图——这正是全中国广告主最想触达的一群人。</p>\n<p>但真正把小红书和其他内容平台区别开的，不是规模，而是它的两个字：搜索。抖音、快手是&quot;刷&quot;出来的——算法把内容推到你面前；小红书越来越多是&quot;搜&quot;出来的——用户带着一个具体问题主动找答案：&quot;敏感肌防晒推荐&quot;&quot;三亚亲子酒店&quot;&quot;预算 5000 的相机&quot;。日均 8 亿次搜索，让它成了一个&quot;生活方式搜索引擎&quot;：人们在这里不是消磨时间，而是做决定。 [3]</p>\n<p>这种&quot;决策心智&quot;背后，是一套去中心化的内容生态。平台上 50 万粉丝以下的中小创作者占比高达 78.4%，一条素人笔记和一个大 V 的笔记，理论上站在同一条起跑线上。 [2] 正是这些看起来&quot;不像广告&quot;的真人分享——一次真实的踩坑、一份亲测的清单——构成了小红书最核心、也最难被复制的资产： 用户信任 。兴业证券在研报里把它称作&quot;社区信任资产&quot;，并认为这是小红书区别于一般内容平台的底层壁垒。 [2]</p>\n<p>一个建在&quot;信任&quot;上的帝国，就此立了起来。接下来的问题是：这份信任，如何变现？？</p>\n<h2 class=\"rh\">第二章 广告这台印钞机</h2>\n<p>答案首先写在广告里。</p>\n<p><mark class=\"direct\" data-hit=\"0\">2025 年，小红书全年营收约 420 亿元，</mark>同比增长约 40%。 [1] 其中广告收入约 320 亿元，占总营收的 76%。 [2] 换句话说，这家以&quot;分享生活&quot;起家的社区，每赚 4 块钱，就有 3 块多来自广告。它通过蒲公英、聚光、千帆、薯条等一整套产品，把品牌方和创作者连了起来：品牌出钱，创作者写笔记，平台按效果收费——一条&quot;看起来像分享&quot;的种草笔记，就是这台机器的最小单元。</p>\n<p>从盈利能力看，这台机器相当能打。<mark class=\"paraphrase\" data-hit=\"19\">小红书 2023 年首次实现盈利（约 5 亿美元），</mark>2024 年升至约 10 亿美元，2025 年预计达到约 30 亿美元——按人民币口径，2025 年净利润约 204 亿元。 [2] [10] 在一个用户规模&quot;中等&quot;的内容平台里，它跑出了远高于同类的单用户变现效率：兴业证券测算其 ARPU <mark class=\"direct\" data-hit=\"1\">高于微博、B 站、Snapchat 等平台，</mark>单用户市值也显著更高。 [2] 这正是资本愿意为它开出高价的理由之一。</p>\n<p>但同一个数字，从另一个角度看，是隐忧。广告占比并非一直这么高——它是一路抬升上来的：<mark class=\"direct\" data-hit=\"2\">2023 年约 65%，2024 年 72%，2025 年 76%。 [</mark>3]</p>\n<p>对一家即将上市的公司而言，收入结构越单一，故事越难讲。广告是好生意，但它的天花板清晰、且随宏观经济波动——品牌预算一收紧，最先砍的往往就是种草投放。更微妙的是，广告占比不降反升，恰恰说明本该成为&quot;第二增长曲线&quot;的电商，还没有真正接上力。 [3]</p>\n<h2 class=\"rh\">第三章 种草容易，拔草难</h2>\n<p>在小红书的黑话里，有两个词： &quot;种草&quot;和&quot;拔草&quot; 。前者是看到好东西、心动了；后者是真的下单、买了。小红书最擅长的是种草——它是全中国最强的&quot;种草机器&quot;；可它最大的软肋，恰恰是拔草。</p>\n<p>这个软肋，用一个数字就能看清：小红书站内的电商转化率仅为 0.7%–1.2%，只有头部综合电商平台的三分之一左右。 [3] [4] 用户在小红书刷到一支口红、一台洗衣机、一件大衣，被种了草——然后，截图、退出、打开淘宝去搜同款、下单。这笔最终成交，小红书一分钱都拿不到。钛媒体把这句话说得很直接：&quot;种草力强，拔草力弱，这是小红书长年卡在估值天花板的核心死穴。&quot; [4]</p>\n<p>不是没努力过。早年小红书试过自营电商，因供应链和履约短板，贡献几乎可以忽略，最终放弃； [3] 2023 年它提出 &quot;买手电商&quot; ，被视为最贴合社区调性的答案——董洁、章小蕙这样的买手在直播间靠内容和品味带货，章小蕙 2025 年双 11 单场 GMV 做到 1.8 亿元。 [2] 但头部买手的高光，掩盖不了大盘的落差。</p>\n<p><mark class=\"paraphrase\" data-hit=\"20\">GMV 这个数字，2024 年小红书约 4000 亿元，2025 年增至约 8500 亿元，增速不慢。 [3] 但把它放进行业坐标系里就露了怯：同期抖音电商 GMV 约 3.5 万亿元、快手约 1.39 万亿元。 [</mark>4] [9] 小红书的电商，仍只是它们的一个零头。这背后是一个结构性的尴尬——它把用户的&quot;购买意愿&quot;生产了出来，却没能力把&quot;意愿&quot;关在自己的院子里变成&quot;订单&quot;。</p>\n<p>于是从 2025 年起，小红书的策略出现了一个耐人寻味的转弯。它一边推&quot;红猫计划&quot;打通淘宝外链，一边把&quot;种草直达&quot;功能向全行业开放，支持一键跳转淘宝天猫、京东、拼多多。 [3] [4] 用它 CMO 的话说，&quot;不是非得把所有种草激发的购买需求全都收回来，能把数据收回来帮品牌做好度量和优化就好了。&quot; [3] ——这是一种务实，也是一种妥协：既然拦不住用户去别处拔草，那就干脆把这次&quot;出走&quot;的数据卖给品牌，证明&quot;草是我种的&quot;。</p>\n<p>务实解决了眼前的变现，却回避了那个根本问题：一个连自己用户的订单都留不住的平台，凭什么撑起&quot;下一个万亿电商&quot;的估值想象？</p>\n<h2 class=\"rh\">第四章 信任的裂缝</h2>\n<p>小红书所有的商业价值，最终都锚定在一个词上：真实。用户相信这里的分享是真人真心，才会照着&quot;抄作业&quot;，品牌才愿意为这份信任付费。可当商业化的马力越开越大，这份信任正在出现裂缝。</p>\n<p>最刺眼的一个数字来自用户自己：2025 年，在选择离开小红书的用户中，首要原因是&quot;虚假信息过多&quot;，占比达 63%。 [3] 信任是它的护城河，也是它最脆弱的东西——一旦用户开始怀疑&quot;这条笔记是不是广告&quot;&quot;这个测评是不是假的&quot;，这座帝国的地基就在松动。</p>\n<p>裂缝从何而来？一条成熟的 虚假种草 灰色产业链，藏在平台的毛细血管里。有媒体调查发现，在小红书的蒲公英平台上，一个六千粉的博主发一条种草笔记报价约 300 元；保健品这类品类佣金高达 30%，每卖一件博主就能抽成数十元。 [12] 更隐蔽的是&quot;通告平台&quot;——品牌方在这里批量招募写手，素人拿着钱或产品，照着话术模板生产&quot;亲测好评&quot;。 [13]</p>\n<p>小红书并非没有治理。<mark class=\"paraphrase\" data-hit=\"22\">2021 年底它启动&quot;虚假种草&quot;专项，</mark>一个半月内封禁 57 个品牌、24 家线下商家，处理违规笔记 17.26 万篇、账号 5.36 万个，还起诉了 4 家代写代发机构、索赔 1000 万元。 [13] 但治理的难点在于：违规内容会随平台规模的扩大而指数级增长，且花样不断翻新。2026 年，<mark class=\"partial\" data-hit=\"7\">全国首例 AI 代写&quot;种草笔记&quot;案</mark>宣判——输入商品名，AI 就能瞬间杜撰几百字&quot;真人亲测&quot;，成本趋近于零。 [<mark class=\"paraphrase\" data-hit=\"23\">14] 为此，中央网信办专门开展了为期四个月的&quot;</mark><mark class=\"partial\" data-hit=\"23\">清朗·整治 AI 应用乱象&quot;专项行动。 [</mark>14]</p>\n<p>监管的目光，也不止落在种草上。网信办曾通报小红书热搜中&quot;明星个人动态&quot;类词条占比接近一半，远超科普、社会新闻等优质内容； [2] 更早之前，2021 年&quot;滤镜景点&quot;事件让平台公开道歉，2021 年因广告涉及疾病治疗用语被行政处罚，2023 年上海市消保委就&quot;玻尿酸食品喝出水光肌&quot;连发四问。 [12] 这些事件单看是插曲，连起来却指向同一个命题：当&quot;真实&quot;可以被明码标价、可以被 AI 批量生产，社区赖以定价的那份信任，还能剩下多少？</p>\n<h2 class=\"rh\">第五章 估值的斜率</h2>\n<p>尽管有种种隐忧，资本市场给小红书的定价，却在过去 18 个月里画出了一条近乎垂直的上升曲线。</p>\n<p><mark class=\"paraphrase\" data-hit=\"24\">2024 年 7 月，一笔老股转让把小红书的估值定在约 170 亿美元（约 1200 亿元）。</mark>此后，随着 2025 年初的一波海外流量红利和商业化提速，它的估值一路狂奔：2025 年 3 月约 260 亿美元，9 月约 310 亿美元，到 2025 年底，<mark class=\"paraphrase\" data-hit=\"25\">一家头部美元基金以约 500 亿美元（约 3500 亿元）的估值卖出老股。 [</mark>1] [3] 18 个月，涨幅约 194%。</p>\n<p>这条斜率也传导到了内部。有报道称，小红书员工的期权行权价从 2025 年 4 月的约 11.5 美元，涨到 2026 年初的约 30 美元，一年翻了一倍多。 [5] 一批持有期权多年的早期员工与核心骨干，正等着一场真正意义上的&quot;上市造富&quot;。<mark class=\"direct\" data-hit=\"3\">小红书成立以来累计完成 7 轮融资，</mark>股东名单里囊括了真格、金沙江、腾讯、阿里、中信资本、红杉中国、高瓴——半个创投圈的顶级资本，都在等这一天。 [11]</p>\n<p>问题是，500 亿美元究竟贵不贵？按 2025 年约 30 亿美元的利润预测，二级市场估值对应的 市盈率（PE） 约为 10 倍； [8] 兴业证券以 500 亿美元对约 204 亿元净利测算，PE 约 17 倍。 [2] 单看这个倍数，在互联网公司里并不夸张。但它隐含了一个前提：市场买的不只是当下这台广告机器，而是相信小红书能把 4 亿人的&quot;决策心智&quot;、8 亿次搜索，终有一天变成一个留得住订单的交易闭环。</p>\n<p>换句话说，500 亿美元里，一部分是广告利润的现实，一部分是&quot;下一个万亿入口&quot;的想象。这两部分各占多少，只有等它真正把财务摊在招股书里、接受公开市场定价的那一天，才能见分晓。而这一天，恰恰是它十三年里最难迈过去的一步。</p>\n<h2 class=\"rh\">第六章 临门一脚的绊索</h2>\n<p>小红书和上市之间的故事，是一部&quot;三次走到门口&quot;的连续剧。</p>\n<p>2026 年的这一次，本被视为&quot;最佳时机&quot;：香港 IPO 市场回暖，上半年已募集约 200 亿美元，创六年新高；小红书手握世界杯转播权准备破圈，估值处在历史高点。 [9] [11] 一切看起来都对。然后，一封举报信来了。</p>\n<p>在举报信把期权与劳工纠纷摆上台面之前，这座帝国内部的员工处境，其实已经写在几个数字里。据财新报道 [16] ，公司入职满一年才配发工号，成立十三年，工号刚过一万——意味着在职满一年的员工累计只有约一万人；每年给满五年的员工送一枚 Tiffany 戒指，2025 年全公司仅八人拿到。人员流动率（离职率）之高，在中国互联网人才市场不是秘密：基层员工流动极快，合作商抱怨对接人员缺乏专业积累；项目因人员频繁更替难以沉淀做深，又反过来加剧流动，形成恶性循环。内部权责交叉，员工&quot;抢项目、抢机会&quot;，短期看不到效果就撤，动荡被进一步放大。直到 2025 年下半年才取消延续多年的&quot;大小周&quot;、转为双休，但高流动性并未明显缓解。一座连在职员工都留不住的帝国，期权与劳工纠纷迟早会从内部浮上来。</p>\n<p>2026 年 6 月底，一名自称原<mark class=\"partial\" data-hit=\"9\">小红书商业化华南直销负责人的</mark>前员工，实名<mark class=\"partial\" data-hit=\"10\">向港交所上市部、香港证监会提交&quot;</mark>上市合规投诉&quot;，并附上一审二审判决书、期权诉讼卷宗等材料。 [5] 他指向两处要害：其一，公司在境内劳动诉讼中主张&quot;境内外主体无关联&quot;，而在上市时又需按 VIE 架构 披露&quot;境内外同一控制&quot;——两种表述自相矛盾，可能触发监管对 VIE 架构合规性的重审； [7] 其二，他称自<mark class=\"partial\" data-hit=\"11\">公开维权以来已有近 50 名</mark>离职员工与其联系，反映在期权行权节点前&quot;被无理由辞退、期权作废&quot;，据其估算或构成大规模劳工赔偿的潜在风险。 [6]</p>\n<p>举报的实质影响，市场判断不一。<mark class=\"paraphrase\" data-hit=\"26\">有报道称港交所已暂停接收材料、年内上市无望，或延至 2027 年之后； [</mark>6] 也有观点指出，截至 2026 年 7 月 8 日，港交所&quot;披露易&quot;网站仍查不到正式招股书或递表文件，因此严格说尚不存在&quot;上市被终止&quot;，一切仍属市场传闻。 [7] 跨境资本市场律师则提醒，港股对 VIE 架构真实性和境内用工权责披露有强制要求，若查实刻意隐瞒，轻则要求补充整改材料、拉长问询周期，重则可暂停 IPO 受理。 [6]</p>\n<h2 class=\"rh\">第七章 破圈的三个赌注</h2>\n<p>面对增长的天花板和上市的压力，小红书几乎在同一时间，押下了三个赌注。每一个都在试探同一条边界：它能不能一边长大，一边守住自己的调性。</p>\n<h3 class=\"rh\">赌注一：世界杯与&quot;男人&quot;</h3>\n<p>第一个赌注是&quot;破圈&quot;。小红书斥资超 17 亿元拿下 2026 美加墨世界杯的转播权，试图用&quot;第一赛事&quot;的顶级流量，撬动它最缺的那部分用户——男性。 [3] 效果立竿见影：<mark class=\"partial\" data-hit=\"12\">开赛前三日，直播间男性用户占比</mark>一度超过 60%。但拉回到全平台，女性占比仍超 70%，性别结构的天平并未真正改变。 [9]</p>\n<p>赌注的另一面是风险：大型赛事拉来的新用户沉淀率低，赛事一结束，人可能就走了；而涌入的男性内容与球赛话题，又可能稀释原有核心女性用户的体验。破圈与守住调性，是一道极难平衡的题。</p>\n<h3 class=\"rh\">赌注二：被动出海</h3>\n<p>第二个赌注是出海，而它的起点带着几分戏剧性。2025 年 1 月，美国 TikTok 面临禁令，大批海外用户涌入小红书——1 月 14 日，它登上美区 App Store 免费应用下载榜第一，在 22 个国家和地区进入前十。 [15] <mark class=\"direct\" data-hit=\"4\">市场情报公司 SensorTower 的数据显示，</mark>其美国日活跃用户 1 月峰值达 130 万，到 3 月回落至约 80 万，<mark class=\"partial\" data-hit=\"13\">但仍比 2024 年 12 月增长 </mark>114%。 [1] 网友把这场意外称作小红书的&quot;被动出海&quot;。此后，平台低调铺开出海——上线 Redshop、推&quot;出海领航计划&quot;，首期覆盖美国、中国香港、中国澳门等市场。 [3] 红利真假，仍待时间检验：跑通了是一个新用户池，跑不通就只能回到国内存量市场里厮杀。</p>\n<h3 class=\"rh\">赌注三：AI 与一场&quot;抄作业&quot;</h3>\n<p>第三个赌注是 AI。2026 年 4 月底，小红书做了一次大规模组织架构调整，<mark class=\"partial\" data-hit=\"14\">整合社区、电商、商业化三大业务，</mark>并<mark class=\"partial\" data-hit=\"15\">成立 AI 一级部门 Dots </mark>和企业智能部，加码人工智能投入。 [4] 有分析把这次调整形容为&quot;用阿里的思维设组织，用字节的模式建 AI 团队&quot;。但对照之下，<mark class=\"paraphrase\" data-hit=\"27\">差距也很扎眼：字节 2025 年 AI 相关资本开支估算</mark><mark class=\"direct\" data-hit=\"27\">约 1600 亿元，而小红书全年营收</mark><mark class=\"paraphrase\" data-hit=\"28\">不过约 420 亿元——字节一年砸在 AI 上的钱，</mark>够小红书挣三四年。 [4]</p>\n<p>这决定了小红书的 AI 不可能是&quot;去外面抢用户、卖算力&quot;的路子，而只能是&quot;让种草更准、拔草更顺、广告更聪明&quot;的内部工具。它更早的尝试——2023 年的绘画产品 Trik、2024 年底的独立 AI 搜索&quot;点点&quot;——也都是小步快跑。 [4]</p>\n<p>但 AI 这把工具，也是把双刃剑。据财新报道，小红书陆续上线文生图、自动剪辑生成视频、语音笔记等轻量化 AI 工具，本意是降低普通人的表达门槛——目前超过一半的社区流量，分给了非头部创作者。 [17] 可当&quot;生成&quot;的边际成本趋近于零，<mark class=\"paraphrase\" data-hit=\"29\">真实种草与 AI 代写种草笔记的界线就被抹平了：</mark><mark class=\"partial\" data-hit=\"29\">全国首例 AI 代写&quot;种草笔记&quot;案</mark><mark class=\"paraphrase\" data-hit=\"29\">里，</mark>输入一个商品名，AI 就能瞬间杜撰几百字&quot;真人亲测&quot;，成本几乎为零。 [14] 这恰恰撞在小红书最脆弱的那道裂缝上——它的商业基础，是 4 亿人愿意相信&quot;这条笔记是真的&quot;：广告靠真实种草转化，电商靠真实决策参考。财新援引内部人士称，虚假软广&quot;首先直接影响用户体验，其次也影响了商业生态和收入&quot;；另一位受访者则指出，营销内容与真实内容同步变多，&quot;真正的问题是让用户决策门槛变得更高了&quot;。当 AI 再把创作量放大几个量级，甄别成本只会更贵，信任这道裂缝也只会撕得更开。</p>\n<h2 class=\"rh\">尾声 一个帝国，一道裂缝</h2>\n<p>回到最初那句口号——&quot;标记我的生活&quot;。十三年过去，这个始于海外购物攻略的社区，已经长成一个每天 4 亿人使用、8 亿次搜索的消费决策入口。</p>\n<p>种草强、拔草弱，让它把最肥的交易让给了别人；广告占比从 65% 一路抬到 76%，收入结构的高度单一让它扛着与生俱来的脆弱性；信任被商业化一点点消耗，让它最珍贵的资产出现裂缝；估值 18 个月涨了近两倍，上市却在临门一脚被一封举报信绊住。这些裂痕，每一道都还敞着口。</p>\n<p>登陆港交所，只是把这场&quot;信任能否扛住商业化、种草能否变成拔草&quot;的赛跑，从一级市场的掌声里，置于公开市场的持续审视之下。届时，小红书要向所有人证明的，不再是它有多少用户、多能种草，而是它能不能把这 4 亿人的信任，稳稳地接住、也守得住。</p>\n<p>答案不在这篇报道里，而在它的下一份财报、下一次递表，和无数用户下一次点开这个 App 时，心里那句话。</p>", "hits": [{"type": "direct", "src": "2026-07-20_小红书/原始资料/舆情网页/舆情_第一财经YiMagazine_20260619_估值突破500亿美元小红书IPO进入倒计时.html", "core": "2025年小红书全年营收约42", "art": "2025 年，小红书全年营收约 420 亿元，同比增长约 40%。 [1] 其中广告收入约 320 亿元，占总营收的 76%。 [2] 换句话说，这家以\"分享生", "srcc": "文件显示估值已升至310亿美元2025年小红书全年营收约420亿元人民币同比增长40其中广告收入320亿元人民", "sim": 1.0, "len": 18}, {"type": "direct", "src": "2026-07-20_小红书/原始资料/研报数据/研报_兴业证券_20260715_小红书社区信任资产驱动高变现.html", "core": "高于微博B站Snapchat等", "art": "从盈利能力看，这台机器相当能打。小红书 2023 年首次实现盈利（约 5 亿美元），2024 年升至约 10 亿美元，2025 年预计达到约 30 亿美元——按", "srcc": "年PE约为17x单用户市值显著高于微博B站Snapchat等平台风险提示用户泛化不及预期广告商业化推进不及预期", "sim": 1.0, "len": 17}, {"type": "direct", "src": "2026-07-20_小红书/原始资料/舆情网页/舆情_钛媒体_2026_阿里字节留的参考答案.html", "core": "2023年约652024年72", "art": "但同一个数字，从另一个角度看，是隐忧。广告占比并非一直这么高——它是一路抬升上来的：2023 年约 65%，2024 年 72%，2025 年 76%。 [3]", "srcc": "主要的收入来源广告占比逐年抬升2023年约652024年722025年76种草强拔草弱站内转化率仅0712约头", "sim": 1.0, "len": 22}, {"type": "direct", "src": "2026-07-20_小红书/原始资料/舆情网页/舆情_网易i黑马_20260616_小红书拟月底赴港上市或为近年最大互联网IPO.html", "core": "小红书成立以来累计完成7轮融资", "art": "这条斜率也传导到了内部。有报道称，小红书员工的期权行权价从 2025 年 4 月的约 11.5 美元，涨到 2026 年初的约 30 美元，一年翻了一倍多。 [", "srcc": "2025年全年利润约30亿美元小红书成立以来累计完成7轮融资投资者包括腾讯阿里巴巴红杉资本中国高瓴资本金沙江创", "sim": 1.0, "len": 15}, {"type": "direct", "src": "2026-07-20_小红书/原始资料/舆情网页/舆情_第一财经YiMagazine_20260619_估值突破500亿美元小红书IPO进入倒计时.html", "core": "市场情报公司SensorTow", "art": "第二个赌注是出海，而它的起点带着几分戏剧性。2025 年 1 月，美国 TikTok 面临禁令，大批海外用户涌入小红书——1 月 14 日，它登上美区 App ", "srcc": "ppStore美区排行榜第一名市场情报公司SensorTower的数据显示2025年3月小红书在美国的日活跃用", "sim": 1.0, "len": 22}, {"type": "direct", "src":
